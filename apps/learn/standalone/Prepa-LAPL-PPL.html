title":"Messages et cartes météo","icon":"📄","tips":"METAR : observation régulière d'aérodrome, toutes les 30 minutes ou toutes les heures. SPECI : observation spéciale émise entre deux METAR lors d'un changement significatif. Heures en UTC (heure légale = UTC + 1 en hiver, UTC + 2 en été).\n\nExemple : METAR LFBO 171030Z 27012G25KT 240V300 6000 -SHRA FEW015 BKN030CB 14/09 Q1008 TEMPO TSRA\n• LFBO : indicatif OACI ; 171030Z : le 17 à 10 h 30 UTC.\n• 27012G25KT : vent du 270° (nord vrai), 12 kt, rafales à 25 kt ; 240V300 : direction variable entre 240 et 300°.\n• 6000 : visibilité 6 000 m ; 9999 : 10 km ou plus.\n• -SHRA : faibles averses de pluie.\n• FEW015 BKN030CB : 1 à 2 octas à 1 500 ft, 5 à 7 octas de cumulonimbus à 3 000 ft (hauteurs au-dessus du terrain, en centaines de pieds).\n• 14/09 : température 14 °C, point de rosée 9 °C (M = négatif : M02 = −2 °C).\n• Q1008 : QNH 1008 hPa.\n• TEMPO TSRA : tendance pour les 2 heures suivantes ; NOSIG : pas de changement significatif prévu.\n\nNébulosité en octas : FEW 1 à 2, SCT 3 à 4, BKN 5 à 7, OVC 8. NSC : pas de nuage significatif ; VV : visibilité verticale (ciel invisible). Le plafond est la base de la plus basse couche couvrant plus de la moitié du ciel (BKN ou OVC) au-dessous de 20 000 ft.\n\nTemps présent : - faible, sans signe modéré, + fort, VC au voisinage ; SH averse, TS orage, FZ se congelant ; RA pluie, DZ bruine, SN neige, GR grêle, GS grésil, FG brouillard, BR brume, HZ brume sèche.\n\nCAVOK remplace visibilité, temps présent et nuages si, simultanément :\n• la visibilité est de 10 km ou plus ;\n• aucun nuage au-dessous de 5 000 ft (ou de l'altitude minimale de secteur la plus élevée si elle est supérieure), ni CB ni TCU ;\n• aucun phénomène significatif n'est observé.\n\nTAF : prévision d'aérodrome (TAF court de 9 h, TAF long de 24 ou 30 h). Ex. : 1706/1806 = du 17 à 06 h au 18 à 06 h UTC.\n• BECMG 1810/1812 : évolution durable survenant entre 10 et 12 UTC le 18.\n• TEMPO 1714/1718 : fluctuations temporaires de moins d'une heure chacune, couvrant au total moins de la moitié de la période.\n• FM171430 : à partir du 17 à 14 h 30 UTC, toutes les conditions précédentes sont remplacées.\n• PROB30, PROB40 : probabilité de 30 ou 40 %, éventuellement suivie de TEMPO.\n\nCartes et avertissements :\n• TEMSI France (de la surface au FL 150) : fronts, zones nuageuses (bases, sommets), phénomènes (orages, givrage, turbulence), isotherme 0 °C, pour une heure donnée.\n• WINTEM : vents et températures prévus à plusieurs niveaux ; barbule 10 kt, demi-barbule 5 kt, fanion 50 kt.\n• SIGMET : avertissement d'un centre de veille météorologique sur des phénomènes dangereux en route (orages, turbulence ou givrage forts, cendres volcaniques…).\nSource : Aéroweb, site aéronautique de Météo-France (aviation.meteo.fr).","vocab":[["METAR","Observation régulière d'aérodrome (toutes les 30 min ou 1 h)"],["SPECI","Observation spéciale émise lors d'un changement significatif"],["TAF","Prévision d'aérodrome (9 h, 24 h ou 30 h)"],["CAVOK","Visi ≥ 10 km, aucun nuage \u003c 5 000 ft, ni CB/TCU, ni temps significatif"],["BKN","Fragmenté : 5 à 7 octas de nuages"],["NOSIG","Pas de changement significatif prévu dans les 2 heures"],["TEMSI","Carte du temps significatif prévu (fronts, nuages, phénomènes)"],["SIGMET","Avertissement de phénomènes météo dangereux en route"]],"questions":[["u3s6q01","Dans le METAR « LFRN 171000Z 23015G27KT 4000 -RA BKN008 OVC015 10/09 Q1002 NOSIG », que signifie BKN008 ?",["1 à 2 octas à 800 ft au-dessus du terrain","5 à 7 octas à 8 000 ft au-dessus du terrain","5 à 7 octas à 800 ft au-dessus du terrain","5 à 7 octas à 800 ft au-dessus du niveau de la mer"],2,"BKN (broken, fragmenté) correspond à 5 à 7 octas ; la hauteur de la base est donnée en centaines de pieds au-dessus du terrain : 008 = 800 ft."],["u3s6q02","Que signifie le groupe « +TSRA » dans un METAR ?",["Pluie forte, avec un orage au voisinage de l'aérodrome","Orage avec pluie forte","Orage faible avec pluie","Averse de pluie modérée suivie d'un orage"],1,"« + » indique une intensité forte, TS un orage et RA de la pluie : orage avec pluie forte. Un orage au voisinage s'écrirait VCTS, et une intensité faible serait notée « - »."],["u3s6q03","Un METAR annonce CAVOK. Laquelle de ces conditions est forcément remplie ?",["La visibilité est d'au moins 10 km, sans cumulonimbus ni cumulus bourgeonnant","Il n'y a aucun nuage, à aucune altitude, et la visibilité dépasse 10 km","La visibilité est d'au moins 5 km et le plafond d'au moins 1 500 ft au-dessus du terrain","La visibilité est d'au moins 10 km et il n'y a aucun nuage au-dessous de 10 000 ft"],0,"CAVOK suppose une visibilité de 10 km ou plus, aucun nuage au-dessous de 5 000 ft (ou de l'altitude minimale de secteur la plus élevée si elle est supérieure), ni CB ni TCU, et aucun phénomène significatif. Des nuages peuvent donc exister plus haut."],["u3s6q04","Un METAR donne « FEW006 SCT012 BKN025 OVC080 ». Quelle est la hauteur du plafond ?",["600 ft","1 200 ft","8 000 ft","2 500 ft"],3,"Le plafond est la base de la plus basse couche couvrant plus de la moitié du ciel, c'est-à-dire BKN (5 à 7 octas) ou OVC (8 octas). FEW (1 à 2) et SCT (3 à 4) n'en font pas partie : plafond à 2 500 ft."],["u3s6q05","Que signifie « NOSIG » à la fin d'un METAR ?",["Aucun SIGMET n'est en vigueur dans la région d'information de vol","Aucun changement n'est intervenu depuis le METAR de l'heure précédente","Aucun changement significatif n'est prévu pendant toute la période de validité du TAF","Aucun changement significatif n'est prévu dans les 2 heures suivant l'observation"],3,"NOSIG (no significant change) est une prévision de tendance couvrant les 2 heures qui suivent l'heure de l'observation. Elle ne concerne ni les SIGMET ni la période de validité du TAF."],["u3s6q06","Qu'est-ce qu'un SPECI ?",["Une observation spéciale émise entre deux METAR lors d'un changement significatif","Une prévision spéciale d'aérodrome, établie pour les vols VFR de nuit","Un avertissement sur des phénomènes météorologiques dangereux en route","Un compte rendu des conditions rencontrées en vol, transmis à la radio par un pilote"],0,"Le SPECI a le même format qu'un METAR ; il est émis hors horaire dès qu'un élément (vent, visibilité, temps présent, nuages…) franchit un seuil significatif. Les phénomènes dangereux en route font l'objet de SIGMET."],["u3s6q07","Un TAF contient « 9999 SCT030 TEMPO 1714/1718 3000 SHRA BKN015 ». Comment interpréter le groupe TEMPO ?",["À partir de 14 h UTC le 17, la visibilité tombe durablement à 3 000 m sous averses, BKN à 1 500 ft","Il y a 30 % de probabilité d'averses et de 3 000 m de visibilité entre 14 h et 18 h UTC","Le 17 de 14 h à 18 h UTC, par épisodes de moins d'une heure : 3 000 m sous averses, BKN à 1 500 ft","Entre 14 h et 18 h, heure locale, une pluie continue avec 3 000 m de visibilité et BKN à 1 500 ft"],2,"TEMPO annonce des fluctuations temporaires, chacune de moins d'une heure et couvrant au total moins de la moitié de la période. Entre ces épisodes, les conditions principales (9999 SCT030) s'appliquent. Les heures sont en UTC."],["u3s6q08","Que signifie, dans un TAF, le groupe « BECMG 1810/1812 24015KT » ?",["Le vent sera temporairement du 240°/15 kt entre 10 h et 12 h UTC le 18, puis reviendra aux conditions précédentes","Le vent s'établira au 240°/15 kt à un moment entre 10 h et 12 h UTC le 18, puis s'y maintiendra","Le vent changera brusquement le 18 à 10 h UTC","Il y a 40 % de probabilité d'un vent du 240°/15 kt le 18"],1,"BECMG (becoming) annonce une évolution durable qui se produit au cours de la période indiquée, ici entre 10 h et 12 h UTC le 18. Après 12 h UTC, les nouvelles conditions remplacent les anciennes."],["u3s6q09","Dans un TAF, que signifie « FM171430 » ?",["Dès le 17 à 14 h 30 UTC, les conditions qui suivent remplacent toutes les précédentes","Les conditions qui suivent dureront 14 h 30 min à partir de l'émission du TAF","Les conditions qui suivent s'appliquent jusqu'au 17 à 14 h 30 UTC, puis cessent","Des fluctuations temporaires de moins d'une heure sont prévues dès le 17 à 14 h 30 UTC"],0,"FM (from) introduit un changement rapide à l'instant indiqué (jour, heure et minutes UTC). Toutes les conditions prévues avant ce groupe sont remplacées par celles qui le suivent."],["u3s6q10","Que signifie, dans un TAF, « PROB30 TEMPO 1715/1719 TSRA » ?",["Des orages avec pluie pendant 30 minutes au total entre 15 h et 19 h UTC le 17","Des orages couvrant 30 % de la zone de l'aérodrome entre 15 h et 19 h UTC le 17","Une probabilité de 30 % d'orages temporaires avec pluie de 15 h à 19 h UTC le 17","Des orages accompagnés de 30 mm de pluie au total entre 15 h et 19 h UTC le 17"],2,"PROB30 indique une probabilité de 30 % (seules les valeurs 30 et 40 sont utilisées). Suivi de TEMPO, il signifie qu'il y a 30 % de risque de fluctuations temporaires, ici des orages avec pluie, pendant la période."],["u3s6q11","Vous préparez un vol VFR. Quelle carte donne le vent et la température prévus à 5 000 ft, et laquelle situe les fronts et les zones de givrage et de turbulence ?",["La TEMSI pour le vent et la température, la WINTEM pour les fronts et les phénomènes","Le METAR pour les deux","Le TAF pour le vent, le SIGMET pour les fronts","La WINTEM pour le vent et la température, la TEMSI pour les fronts et les phénomènes"],3,"La WINTEM représente les vents (barbules) et les températures prévus à différents niveaux, utiles au calcul de dérive et de vitesse sol. La TEMSI est la carte du temps significatif : fronts, nuages, givrage, turbulence, orages, isotherme 0 °C."],["u3s6q12","Qu'est-ce qu'un SIGMET ?",["Une observation horaire d'aérodrome, complétée par une tendance à 2 heures","Un avertissement sur des phénomènes météo dangereux en route, observés ou prévus","Une carte des vents et des températures prévus aux différents niveaux de vol","Une prévision d'aérodrome valable 9 à 30 heures, établie par Météo-France"],1,"Le SIGMET est émis par un centre de veille météorologique pour signaler des phénomènes pouvant affecter la sécurité des vols : orages, turbulence ou givrage forts, ondes orographiques fortes, cendres volcaniques. Il se consulte avant et pendant le vol."]]}]},{"id":"u4","title":"Communications","description":"Les communications radio du pilote VFR : bases de la radiotéléphonie, phraséologie, urgence, détresse et panne radio, services et propagation VHF (examen : 8 questions, 12 min).","skills":[{"id":"u4s1","title":"Bases de la radiotéléphonie","icon":"🎙️","tips":"La radiotéléphonie suit les règles de l'OACI (annexe 10), reprises par SERA. On écoute avant d'émettre, on prépare son message, on appuie sur l'alternat avant de parler et on ne le relâche qu'à la fin : un micro bloqué paralyse la fréquence. On parle d'un ton égal, sans précipitation.\n\nAlphabet OACI : Alfa, Bravo, Charlie, Delta, Echo, Foxtrot, Golf, Hotel, India, Juliett, Kilo, Lima, Mike, November, Oscar, Papa, Quebec, Romeo, Sierra, Tango, Uniform, Victor, Whiskey, X-ray, Yankee, Zulu.\n\nChiffres en anglais : « tree » pour 3, « fife » pour 5, « niner » pour 9 ; la virgule se dit « decimal » (« décimale »).\n• Altitudes, hauteurs de nuages, visibilités : milliers et centaines ronds avec « thousand » et « hundred » (1 500 ft = « one thousand five hundred feet »).\n• Caps et calages : chiffre par chiffre (cap 090 = « zero niner zero » ; QNH 1009 = « one zero zero niner »).\n• Fréquences : chiffre par chiffre, en donnant les six chiffres, sauf si les deux derniers sont des zéros : 118,025 = « one one eight decimal zero two five » ; 119,700 = « one one niner decimal seven ».\n\nHeure : toujours en UTC. En métropole, l'heure légale vaut UTC + 1 en hiver et UTC + 2 en été. On donne normalement les minutes seules, et l'heure complète en cas de doute.\n\nÉchelle de lisibilité (réponse à « Comment me recevez-vous ? ») :\n• 1 : illisible\n• 2 : lisible par instants\n• 3 : lisible mais difficilement\n• 4 : lisible\n• 5 : parfaitement lisible\n\nIndicatifs : on nomme d'abord la station appelée, puis son propre indicatif (« Bordeaux Information, F-GJLM »). L'indicatif complet d'un avion léger est son immatriculation. L'indicatif abrégé garde le premier caractère et au moins les deux derniers (F-GJLM devient F-LM) ; on ne l'utilise qu'après que la station au sol l'a employé. Des abréviations usuelles comme QNH, QFE, VFR, ATIS ou CAVOK s'énoncent directement, sans alphabet phonétique.\n\nCollationnement (SERA.8015) : on répète, suivis de son indicatif, les éléments liés à la sécurité :\n• autorisations de route, notamment de transit ;\n• autorisations et instructions pour entrer sur une piste, y atterrir, en décoller, s'arrêter avant, la traverser, y rouler ou y remonter ;\n• piste en service, calages altimétriques, codes transpondeur, nouvelles fréquences ;\n• instructions de niveau, de cap et de vitesse ;\n• niveau de transition, qu'il soit donné par le contrôleur ou par l'ATIS.\nLe contrôleur écoute le collationnement et corrige toute erreur. « Reçu » (roger) ne remplace jamais un collationnement obligatoire ; une information de trafic ou de vent n'a pas à être collationnée.","vocab":[["Alphabet OACI","Mots codés d'Alfa à Zulu pour épeler sans ambiguïté"],["Alternat","Bouton d'émission : appuyé on parle, relâché on écoute"],["Collationnement","Répétition d'un message pour confirmer sa bonne réception"],["Indicatif abrégé","1er caractère + au moins les 2 derniers (F-GJLM → F-LM)"],["UTC","Temps universel coordonné, heure de référence en aviation"],["Lisibilité","Qualité de réception notée de 1 (illisible) à 5 (parfaite)"],["Decimal","Séparateur des fréquences (« décimale » en français)"],["Niner","Prononciation anglaise du chiffre 9 en radiotéléphonie"]],"questions":[["u4s1q01","Parmi ces séries de mots, laquelle appartient entièrement à l'alphabet phonétique OACI ?",["Queen – Romeo – Sugar – Tango","Quebec – Roger – Sierra – Tango","Quebec – Romeo – Sierra – Tango","Quebec – Romeo – Sierra – Tokyo"],2,"Les lettres Q, R, S et T se disent Quebec, Romeo, Sierra, Tango. « Queen », « Roger » et « Sugar » viennent d'un ancien alphabet abandonné, et « Tokyo » n'a jamais désigné le T : seul l'alphabet OACI est réglementaire."],["u4s1q02","Comment annoncez-vous en anglais la fréquence 118,025 MHz ?",["One one eight decimal zero two five","One one eight decimal zero two","One eighteen decimal zero two five","One one eight decimal two five"],0,"Chaque chiffre est énoncé séparément et l'on donne les six chiffres de la fréquence, sauf si les deux derniers sont des zéros. Ici, le 5 final doit être annoncé."],["u4s1q03","Comment annoncez-vous en anglais une altitude de 1 500 ft ?",["Fifteen hundred feet","One five zero zero feet","One point five thousand feet","One thousand five hundred feet"],3,"Pour une altitude, on énonce le chiffre des milliers suivi de « thousand », puis celui des centaines suivi de « hundred ». « Fifteen hundred » n'est pas conforme à la phraséologie OACI."],["u4s1q04","Le contrôleur vous transmet un QNH de 1009 hPa. Comment le collationnez-vous en anglais ?",["QNH ten zero nine","QNH one zero zero niner","QNH one thousand niner","QNH one double zero niner"],1,"Un calage altimétrique s'énonce chiffre par chiffre, le 9 se prononçant « niner ». « Thousand » est réservé aux altitudes, hauteurs et visibilités rondes, et « double » n'existe pas en phraséologie OACI."],["u4s1q05","En juillet, vous décollez de Toulouse à 15 h 40, heure légale française. À quelle heure UTC correspond ce décollage ?",["13 h 40 UTC","14 h 40 UTC","17 h 40 UTC","15 h 40 UTC"],0,"En été, l'heure légale en métropole vaut UTC + 2 : UTC = 15 h 40 − 2 h = 13 h 40. En hiver, on ne retrancherait qu'une heure."],["u4s1q06","En janvier, un NOTAM annonce l'activation d'une zone réglementée de 0930 à 1130 UTC. En heure légale française (métropole), la zone est active :",["de 8 h 30 à 10 h 30","de 9 h 30 à 11 h 30","de 10 h 30 à 12 h 30","de 11 h 30 à 13 h 30"],2,"En hiver, l'heure légale vaut UTC + 1 : 0930 UTC = 10 h 30 et 1130 UTC = 12 h 30. NOTAM, plans de vol et messages radio sont toujours exprimés en UTC."],["u4s1q07","En réponse à votre essai radio, le contrôleur vous annonce une lisibilité 3. Comment vous reçoit-il ?",["Parfaitement lisible","Lisible par instants seulement","Lisible, sans difficulté","Lisible mais difficilement"],3,"Échelle de lisibilité : 1 illisible, 2 lisible par instants, 3 lisible mais difficilement, 4 lisible, 5 parfaitement lisible."],["u4s1q08","Quel est l'indicatif abrégé de l'avion F-GJLM ?",["F-GJ","F-LM","GJLM","F-GM"],1,"L'indicatif abrégé reprend le premier caractère de l'immatriculation et au moins les deux derniers : F-GJLM devient F-LM."],["u4s1q09","Après votre premier appel « Bordeaux Information, F-GJLM », à partir de quand pouvez-vous utiliser l'indicatif abrégé F-LM ?",["Dès votre deuxième message, une fois le contact établi","À votre initiative, dès que la fréquence est chargée","Seulement après que la station au sol vous a appelé ainsi","Dès que vous avez annoncé votre position et vos intentions"],2,"Un aéronef n'emploie son indicatif abrégé qu'après que la station au sol l'a utilisé la première, une fois la communication établie et s'il n'y a pas de risque de confusion."],["u4s1q10","Le contrôleur vous dit : « F-LM, affichez 4521, QNH 1018 ». Quelle réponse est correcte ?",["Reçu, 4521, F-LM","Wilco, QNH 1018, F-LM","Affichons 4521, F-LM","4521, QNH 1018, F-LM"],3,"Le code transpondeur et le calage altimétrique font partie des éléments à collationner obligatoirement : on répète les deux valeurs, suivies de son indicatif. « Reçu », « wilco » ou « affichons » ne remplacent pas ce collationnement, et n'en répéter qu'une partie ne suffit pas."],["u4s1q11","Parmi ces éléments transmis par le contrôle, lequel n'est pas à collationner obligatoirement ?",["Une information de trafic","Un nouveau code transpondeur","Une nouvelle fréquence à contacter","Le calage altimétrique"],0,"SERA impose de collationner notamment autorisations, pistes, calages, codes transpondeur, fréquences, caps et niveaux. Une information de trafic s'acquitte simplement, en précisant si le trafic est en vue."],["u4s1q12","Quelle technique d'émission est correcte ?",["Commencer à parler, puis appuyer sur l'alternat pour ne pas perdre de temps","Appuyer sur l'alternat avant de parler et ne le relâcher qu'en fin de message","Relâcher l'alternat à chaque pause pour vérifier que la fréquence est restée libre","Parler plus vite qu'en conversation normale pour libérer la fréquence au plus tôt"],1,"L'alternat doit être enfoncé avant de parler, sinon le début du message (souvent l'indicatif) est perdu, et relâché seulement à la fin. On parle à débit régulier, sans précipitation, pour être compris du premier coup."]]},{"id":"u4s2","title":"Phraséologie VFR","icon":"🗣️","tips":"Un message radio répond toujours à quatre questions : qui j'appelle, qui je suis, où je suis, ce que je veux. Il doit être bref, préparé et conforme à la phraséologie.\n\nPremier contact : indicatif de la station, indicatif complet de l'avion, puis type d'avion, position, altitude, lettre ATIS reçue et demande. Sur une fréquence chargée, on peut se limiter d'abord à un appel court (« Toussus Tour, F-GJLM ») et attendre d'être invité à poursuivre.\n\nDépart :\n• demande de mise en route ou de roulage : position au parking, lettre ATIS, intentions (tours de piste, vol local, navigation vers…) ;\n• « roulez point d'arrêt A piste 24 » n'autorise jamais à entrer sur la piste : on s'arrête au point d'arrêt ;\n• au point d'arrêt, on se déclare « prêt au départ » (ready for departure) : le mot « décollage » est réservé à l'autorisation de décollage et à son annulation ;\n• « alignez-vous et attendez » (line up and wait) n'autorise pas à décoller.\nOn collationne mot pour mot « autorisé décollage piste 24 » et « autorisé atterrissage piste 24 ».\n\nArrivée : on rejoint les points d'entrée publiés sur la carte VAC, on s'intègre dans le circuit selon les instructions reçues (vent arrière, base, finale directe…) et on rappelle les positions demandées (« rappelez vent arrière »).\n\nCompte rendu de position (ordre OACI) : identification, position, heure, niveau ou altitude, puis prochaine position et heure estimée.\n\nTransit en espace contrôlé : en classes C et D, le vol VFR doit obtenir une clairance avant d'entrer et garder l'écoute permanente ; on collationne la route, l'altitude, le QNH et le code transpondeur. Sans clairance, on reste dehors.\n\nExpressions conventionnelles :\n• Roger (reçu) : j'ai reçu tout votre dernier message\n• Wilco : compris, je vais m'y conformer\n• Affirm (affirme) : oui\n• Negative (négatif) : non, permission refusée, ou ce n'est pas correct\n• Standby (attendez) : attendez, je vous rappelle ; ni accord ni refus\n• Say again (répétez) : répétez tout ou partie de votre message\n• Confirm (confirmez) : je demande la vérification de…\n• Correction : une erreur a été commise, la version correcte est…\n\nAuto-information : sur un aérodrome sans organisme ATS en service, chaque pilote annonce sur la fréquence publiée sa position et ses intentions aux points clés (arrivée, verticale, vent arrière, base, finale, piste dégagée ; roulage, alignement et décollage, sortie du circuit). Ces messages s'adressent à tous, n'appellent pas de réponse et ne dispensent jamais de la surveillance visuelle.","vocab":[["Roger","Reçu : j'ai reçu tout votre dernier message"],["Wilco","Compris, je vais m'y conformer (will comply)"],["Affirm","Affirme : oui"],["Negative","Négatif : non, permission refusée ou ce n'est pas correct"],["Standby","Attendez, je vous rappelle (ni accord ni refus)"],["Say again","Répétez tout ou partie de votre dernier message"],["Point d'arrêt","Point avant la piste à ne pas franchir sans autorisation"],["Auto-information","Annonces de position et d'intentions sans organisme ATS"]],"questions":[["u4s2q01","Vous appelez pour la première fois la tour de Toussus. Par quoi commence votre message ?",["Votre indicatif, puis celui de la station appelée","Votre indicatif seul, la station se reconnaissant à sa fréquence","La lettre ATIS, puis votre indicatif","L'indicatif de la station appelée, puis votre indicatif"],3,"Un appel commence par l'indicatif de la station appelée, suivi de celui de la station qui appelle : « Toussus Tour, F-GJLM ». Au premier contact, l'indicatif de l'avion est donné en entier."],["u4s2q02","La tour vous demande : « F-LM, rappelez en vue du terrain ». Vous répondez « Wilco, F-LM ». Que signifie votre réponse ?",["J'ai compris votre message et je m'y conformerai","J'ai reçu votre message, sans plus","Je ne peux pas me conformer à votre instruction","Répétez votre dernier message"],0,"« Wilco » (will comply) signifie que le message est compris et sera exécuté. « Roger » indique seulement la réception, « unable » une impossibilité et « say again » une demande de répétition."],["u4s2q03","Au point d'arrêt, la tour vous transmet : « F-LM, piste 24, alignez-vous et attendez ». Que faites-vous ?",["Vous vous alignez et décollez dès que la piste vous semble dégagée","Vous restez au point d'arrêt et attendez l'autorisation de décollage","Vous vous alignez sur la piste et attendez l'autorisation de décollage","Vous vous alignez et décollez si aucun avion n'est annoncé en finale"],2,"« Alignez-vous et attendez » (line up and wait) autorise seulement à entrer sur la piste et à s'y aligner : le décollage exige une autorisation explicite. Instruction d'entrer sur une piste, elle se collationne avec la piste et l'indicatif."],["u4s2q04","Vous communiquez en anglais. Le contrôleur demande : « F-LM, confirm you have information Charlie ». Vous n'avez écouté que l'information Bravo. Quelle réponse est correcte ?",["Affirm, information Charlie, F-LM","Negative, information Bravo, F-LM","Roger, information Bravo, F-LM","Wilco, information Bravo, F-LM"],1,"À une question fermée, on répond « affirm » (oui) ou « negative » (non), jamais « roger » ni « wilco ». Ici la réponse est non ; préciser la lettre détenue permet au contrôleur de vous donner les informations à jour."],["u4s2q05","Le contrôle vous dit : « F-LM, roulez point d'arrêt Alpha piste 24 ». Jusqu'où êtes-vous autorisé à rouler ?",["Jusqu'au point d'arrêt Alpha, sans entrer sur la piste","Jusqu'au seuil de piste 24, où vous vous alignez","Jusqu'au point d'arrêt, puis sur la piste si elle est libre","Jusqu'à la sortie de l'aire de trafic seulement"],0,"Une autorisation de roulage vers un point d'arrêt ne permet jamais d'entrer sur la piste : il faut une autorisation explicite d'alignement ou de décollage. L'instruction, qui contient la piste, se collationne."],["u4s2q06","Vous demandez un transit dans une CTR ; le contrôleur répond : « F-LM, standby ». Que faites-vous ?",["Vous entrez dans la CTR : « standby » vaut acceptation du transit","Vous répétez aussitôt votre demande, car elle n'a pas été comprise","Vous renoncez et contournez la CTR : le transit vous est refusé","Vous restez hors de la CTR jusqu'à ce que le contrôleur vous rappelle"],3,"« Standby » (attendez) signifie « attendez, je vous rappelle » : ce n'est ni un accord ni un refus. Sans clairance, on reste hors de l'espace contrôlé."],["u4s2q07","Vous n'avez pas compris la fréquence que vient de vous donner le contrôleur. Que lui dites-vous ?",["Read back frequency, F-LM","Disregard frequency, F-LM","Say again frequency, F-LM","Correction frequency, F-LM"],2,"« Say again » (répétez) demande de répéter tout ou partie du dernier message. « Read back » demande au correspondant de collationner, « disregard » signifie « ignorez » et « correction » signale une erreur dans son propre message."],["u4s2q08","Au point d'arrêt, prêt à partir, vous appelez la tour en anglais. Quelle formulation est correcte ?",["F-LM, ready for take-off","F-LM, ready for departure","F-LM, cleared for take-off","F-LM, request take-off now"],1,"Le mot « take-off » (décollage) est réservé à l'autorisation de décollage et à son annulation, pour éviter tout malentendu. Le pilote annonce « ready for departure » (prêt au départ)."],["u4s2q09","La tour vous transmet : « F-LM, vent 240 degrés 8 nœuds, piste 24 autorisé atterrissage ». Quel collationnement est correct ?",["Piste 24, autorisé atterrissage, F-LM","Reçu, autorisé atterrissage, F-LM","Vent 240 degrés, piste 24, F-LM","Autorisé atterrissage, wilco, F-LM"],0,"L'autorisation d'atterrissage et la piste font toutes deux partie des éléments à collationner obligatoirement ; « reçu » ou « wilco » n'en dispensent pas. Le vent, simple information, n'a pas à être collationné."],["u4s2q10","Selon la phraséologie OACI, dans quel ordre donne-t-on les éléments d'un compte rendu de position ?",["Position, identification, heure, niveau ou altitude, puis prochaine position et heure estimée","Identification, niveau ou altitude, position, heure, puis carburant restant et autonomie","Identification, heure, position, cap et vitesse, puis prochaine position et heure estimée","Identification, position, heure, niveau ou altitude, puis prochaine position et heure estimée"],3,"Un compte rendu de position comprend dans l'ordre : identification, position, heure, niveau ou altitude, puis prochaine position et heure estimée de passage."],["u4s2q11","Vous souhaitez traverser en VFR une CTR de classe D. Que devez-vous faire ?",["Annoncer votre entrée sur la fréquence en auto-information, sans attendre de réponse","Obtenir une clairance avant d'entrer et garder l'écoute permanente de la fréquence","Afficher 7000 et entrer : seuls les vols IFR ont besoin d'une clairance en classe D","Demander une clairance si la visibilité est inférieure à 5 km, sinon entrer librement"],1,"En classe D, les vols VFR sont soumis à clairance et doivent maintenir des communications air-sol permanentes. On collationne la clairance de transit : route, altitude, QNH et code transpondeur."],["u4s2q12","Vous arrivez sur un aérodrome sans organisme ATS en service. Quelle est la bonne pratique radio ?",["Attendre qu'un pilote présent au sol vous autorise à vous intégrer et à atterrir","Garder le silence radio pour ne pas encombrer la fréquence et surveiller visuellement","Annoncer vos positions et intentions sur la fréquence publiée, sans attendre de réponse","Annoncer votre arrivée sur 121,5 MHz, la fréquence veillée par tous les pilotes en vol"],2,"En auto-information, chaque pilote annonce sa position et ses intentions aux points clés du circuit sur la fréquence publiée (carte VAC). Ces messages ne sont pas des autorisations et ne dispensent pas de la surveillance visuelle."]]},{"id":"u4s3","title":"Urgence, détresse et panne radio","icon":"🆘","tips":"Détresse : l'aéronef est menacé d'un danger grave et/ou imminent et a besoin d'une assistance immédiate (arrêt moteur imposant un atterrissage forcé, feu, perte de contrôle). Signal : MAYDAY, de préférence trois fois.\nUrgence : la sécurité de l'aéronef, ou d'une personne à bord ou en vue, est en jeu, sans besoin d'assistance immédiate (vibrations moteur, passager malade). Signal : PAN PAN, de préférence trois fois.\n\nContenu du message, si possible dans cet ordre (même structure pour l'urgence) :\n• nom de la station appelée, si le temps le permet ;\n• indicatif de l'aéronef ;\n• nature de la détresse ;\n• intentions du commandant de bord ;\n• position, niveau ou altitude, et cap.\nOn ajoute si possible tout renseignement utile : personnes à bord, autonomie restante.\n\nFréquence : on émet d'abord sur la fréquence en usage, où l'on est déjà écouté ; sans réponse, sur 121,5 MHz, fréquence internationale d'urgence. Transpondeur : 7700 (détresse ou urgence), en particulier si aucun code ne vous a été attribué. Rappel : 7500 intervention illicite, 7600 panne radio.\n\nGestion de la fréquence :\n• l'aéronef en détresse ou la station qui dirige le trafic de détresse peut imposer le silence : « STOP TRANSMITTING – MAYDAY » ; les autres stations écoutent et n'émettent que pour aider ;\n• l'aéronef qui n'est plus en détresse annule son message ;\n• la station qui dirigeait les échanges annonce « DISTRESS TRAFFIC ENDED » (fin du trafic de détresse).\nPriorité des communications : détresse, urgence, radiogoniométrie, sécurité des vols, météorologie, régularité des vols.\n\nPanne radio :\n• vérifier volume, squelch, fréquence affichée, casque et prises, disjoncteur ; essayer une autre fréquence ;\n• afficher 7600 ;\n• émettre à l'aveugle (« transmitting blind ») chaque message deux fois, car seul le récepteur est peut-être en panne. Panne de récepteur avérée : « transmitting blind due to receiver failure », message répété et heure du prochain message ;\n• en VMC : poursuivre en VMC, atterrir sur l'aérodrome approprié le plus proche et signaler son arrivée à l'organisme ATS par le moyen le plus rapide.\n\nSignaux lumineux de la tour, en vol : vert fixe, autorisé à atterrir ; éclats verts, revenez pour atterrir ; rouge fixe, cédez le passage et continuez à tourner ; éclats rouges, aérodrome dangereux, n'atterrissez pas ; éclats blancs, atterrissez et gagnez l'aire de trafic.\nAccusé de réception : de jour, balancer les ailes en vol (sauf en base et en finale), manœuvrer ailerons ou gouverne de direction au sol ; de nuit, faire clignoter deux fois les phares ou les feux de navigation.","vocab":[["MAYDAY","Signal de détresse : danger grave et/ou imminent, aide immédiate"],["PAN PAN","Signal d'urgence : sécurité en jeu, sans aide immédiate"],["121,5 MHz","Fréquence internationale d'urgence aéronautique"],["7700","Code transpondeur de détresse ou d'urgence"],["7600","Code transpondeur de panne de radiocommunication"],["Transmitting blind","Émission à l'aveugle, chaque message répété deux fois"],["Distress traffic ended","Annonce de la fin du trafic de détresse"],["ELT","Balise de détresse d'aéronef, émettant sur 406 et 121,5 MHz"]],"questions":[["u4s3q01","Après « MAYDAY, MAYDAY, MAYDAY », dans quel ordre donne-t-on, si possible, les éléments d'un message de détresse ?",["Indicatif, position, nature de la détresse, station appelée, intentions","Station appelée, indicatif, position, niveau et cap, intentions, nature de la détresse","Station appelée, indicatif, nature de la détresse, intentions, position, niveau et cap","Nature de la détresse, indicatif, intentions, station appelée, position, niveau et cap"],2,"L'ordre OACI est : station appelée (si le temps le permet), indicatif, nature de la détresse, intentions du commandant de bord, puis position, niveau et cap. On peut y ajouter les personnes à bord et l'autonomie."],["u4s3q02","Dans laquelle de ces situations un message d'urgence (PAN PAN) est-il plus approprié qu'un message de détresse ?",["Le moteur vibre anormalement, mais l'avion tient son palier jusqu'à un terrain proche","Le moteur s'est arrêté et un atterrissage dans un champ est devenu inévitable","Un feu moteur s'est déclaré en vol et de la fumée commence à entrer dans la cabine","La gouverne de profondeur est bloquée et vous contrôlez difficilement l'assiette"],0,"L'urgence concerne la sécurité de l'avion ou d'une personne sans exiger d'assistance immédiate. Arrêt moteur avec atterrissage forcé, feu ou perte de contrôle sont des dangers graves et imminents : c'est la détresse (MAYDAY)."],["u4s3q03","Après avoir lancé un MAYDAY pour une panne moteur, vous parvenez à redémarrer et la situation redevient normale. Que devez-vous faire ?",["Rien : l'organisme comprendra en voyant que vous poursuivez votre route","Couper la radio quelques minutes pour laisser la fréquence libre aux secours","Afficher 7600 au transpondeur pour signaler la fin de la situation de détresse","Annoncer sur la fréquence que vous n'êtes plus en détresse et annuler le MAYDAY"],3,"Un aéronef qui n'est plus en détresse doit transmettre un message annulant la situation de détresse, afin que les secours ne soient pas engagés inutilement."],["u4s3q04","Vous êtes en contact avec Lyon Information quand votre moteur s'arrête. Où lancez-vous votre premier MAYDAY ?",["Directement sur 121,5 MHz","Sur la fréquence de Lyon Information, en cours d'utilisation","Sur 123,1 MHz, fréquence de recherche et sauvetage","Sur la fréquence de la tour de l'aérodrome le plus proche"],1,"Le premier message de détresse s'émet sur la fréquence air-sol en usage, où vous êtes déjà écouté et identifié. On passe sur 121,5 MHz si l'on n'obtient pas de réponse."],["u4s3q05","Vous n'êtes en contact avec aucun organisme et aucun code transpondeur ne vous a été attribué. Vous lancez un MAYDAY. Quel code affichez-vous ?",["7700","7600","7500","7000"],0,"7700 signale une situation de détresse ou d'urgence. 7600 indique une panne radio, 7500 une intervention illicite, et 7000 est le code VFR de base."],["u4s3q06","Pendant une détresse, des stations encombrent la fréquence. Qui peut leur imposer le silence ?",["Le centre de coordination de sauvetage (RCC) qui organise les recherches","N'importe quel aéronef ayant entendu l'appel de détresse sur la fréquence","L'aéronef en détresse ou la station qui dirige le trafic de détresse","Le contrôleur en fréquence, mais pas l'aéronef en détresse lui-même"],2,"L'aéronef en détresse ou la station qui dirige le trafic de détresse peut imposer le silence par « STOP TRANSMITTING – MAYDAY ». Les autres stations gardent l'écoute et n'émettent que pour aider."],["u4s3q07","En radiotéléphonie aéronautique, comment la station qui dirigeait les échanges annonce-t-elle que la situation de détresse est terminée ?",["« STOP TRANSMITTING – MAYDAY »","« PAN PAN », répété trois fois","« SILENCE FINI »","« DISTRESS TRAFFIC ENDED »"],3,"La fin du trafic de détresse est annoncée par « DISTRESS TRAFFIC ENDED ». « Stop transmitting – Mayday » impose au contraire le silence, et « silence fini » relève du vocabulaire maritime."],["u4s3q08","En difficulté, vous ne parvenez à joindre aucun organisme sur les fréquences habituelles. Quelle fréquence utilisez-vous ?",["123,45 MHz","121,5 MHz","406 MHz","108,0 MHz"],1,"121,5 MHz est la fréquence internationale d'urgence aéronautique, veillée par les centres de contrôle et de nombreux organismes ATS. 406 MHz sert aux balises de détresse, 123,45 MHz aux communications air-air et 108 MHz à la radionavigation."],["u4s3q09","En VFR et en VMC, votre radio tombe définitivement en panne. Quelle est la procédure générale prévue par SERA ?",["Afficher 7600, rester en VMC, se poser au plus proche aérodrome approprié et signaler l'arrivée","Afficher 7700, poursuivre jusqu'à la destination prévue et y atterrir selon le plan de vol","Afficher 7600, monter au-dessus de la couche et poursuivre en IFR vers la destination prévue","Afficher 7500, revenir à l'aérodrome de départ et signaler votre arrivée par téléphone"],0,"En VMC, l'avion en panne de radiocommunication affiche 7600, poursuit son vol en VMC, atterrit sur l'aérodrome approprié le plus proche et signale son arrivée par le moyen le plus rapide à l'organisme ATS concerné."],["u4s3q10","Vous ne recevez plus rien, mais votre émetteur semble fonctionner. Que faites-vous à la radio ?",["Vous cessez toute émission jusqu'à l'atterrissage pour ne pas brouiller la fréquence","Vous émettez une seule fois votre position sur 121,5 MHz, puis vous coupez la radio","Vous attendez d'être en vue de la tour pour l'appeler sur la fréquence de l'aérodrome","Vous émettez à l'aveugle chaque message deux fois, en signalant la panne du récepteur"],3,"En cas de panne de récepteur, on émet à l'aveugle sur la fréquence en usage : message précédé de « transmitting blind due to receiver failure », répété intégralement, avec l'heure du prochain message prévu."],["u4s3q11","En panne radio, vous êtes en vent arrière d'un aérodrome contrôlé. La tour vous adresse une série d'éclats verts. Que signifie ce signal ?",["Autorisé à atterrir","Cédez le passage et continuez à tourner","Revenez pour atterrir","Atterrissez et gagnez l'aire de trafic"],2,"En vol, des éclats verts signifient « revenez pour atterrir » ; l'autorisation d'atterrir suivra en temps utile. Le vert fixe autorise l'atterrissage, le rouge fixe demande de céder le passage et de continuer à tourner."],["u4s3q12","Vous venez d'atterrir en panne radio sur un aérodrome contrôlé. De jour, la tour vous adresse un signal lumineux. Comment en accusez-vous réception au sol ?",["En faisant clignoter deux fois vos phares d'atterrissage","En manœuvrant les ailerons ou la gouverne de direction","En balançant les ailes, comme on le fait en vol","En manœuvrant plusieurs fois la gouverne de profondeur"],1,"Au sol, de jour, on accuse réception en manœuvrant les ailerons ou la gouverne de direction (pas la profondeur) ; de nuit, en faisant clignoter deux fois les phares ou les feux de navigation. Le balancement des ailes est réservé au vol."]]},{"id":"u4s4","title":"Services, fréquences et propagation","icon":"📻","tips":"Bandes de fréquences :\n• communications VHF : 118,000 à 136,975 MHz, en modulation d'amplitude ; canaux espacés de 25 kHz ou de 8,33 kHz (trois canaux de 8,33 kHz dans 25 kHz) ;\n• 108 à 117,975 MHz : radionavigation (VOR, ILS) ;\n• HF (3 à 30 MHz) : liaisons à grande distance par réflexion sur l'ionosphère.\nLongueur d'onde : λ (m) = 300 / f (MHz). À 120 MHz, λ = 2,5 m : la VHF utilise des ondes métriques.\n\nPropagation VHF : en ligne droite, en portée optique. Le relief et la courbure de la Terre arrêtent le signal ; il n'y a ni onde de sol utile ni réflexion sur l'ionosphère. La portée croît avec la hauteur :\n• portée (NM) ≈ 1,23 × √h, h étant la hauteur de l'avion en ft ;\n• avec une antenne surélevée : portée ≈ 1,23 × (√h avion + √h antenne).\nExemple : à 2 500 ft au-dessus d'un terrain plat, 1,23 × 50 ≈ 62 NM. En montagne, une crête peut masquer une station proche.\n\nOrganismes et indicatifs :\n• contrôle : « Sol » (aire de manœuvre), « Tour » (aérodrome), « Approche » (arrivées et départs), « Contrôle » (contrôle régional, assuré en France par les CRNA). Ils délivrent des clairances ;\n• « Information » : service d'information de vol. Les SIV (secteurs d'information de vol) rendent l'information de vol et l'alerte, sans clairance ni séparation ; le contact y est en général facultatif mais vivement recommandé ;\n• AFIS : sur certains aérodromes non contrôlés, un agent rend l'information de vol et l'alerte ; il ne délivre aucune autorisation, le pilote annonce ses intentions ;\n• ATIS : message enregistré diffusé en continu (piste, vent, visibilité, nuages, températures, QNH, niveau de transition, travaux…), identifié par une lettre qui change à chaque mise à jour ; on annonce la lettre reçue au premier contact.\n\nFréquences de secours :\n• 121,5 MHz : fréquence internationale d'urgence, veillée par les centres de contrôle et de nombreux organismes ATS ;\n• 123,1 MHz : fréquence auxiliaire des opérations de recherche et de sauvetage ;\n• 406 MHz : balises de détresse (ELT, PLB), détectées par satellite. En Part-NCO, elles doivent pouvoir émettre simultanément sur 406 MHz et 121,5 MHz (NCO.IDE.A.170), le 121,5 MHz servant au radioralliement.\n\nLangues : selon SERA, les communications air-sol se font en anglais ou dans la langue de la station au sol, et les langues disponibles sur chaque station sont publiées dans l'AIP. En France, on utilise le français ou l'anglais, mais l'anglais n'est pas disponible partout. Pour parler anglais, le pilote doit détenir une mention de compétence linguistique en anglais (FCL.055).","vocab":[["VHF","Bande 30-300 MHz ; radiotéléphonie aéronautique de 118 à 137 MHz"],["Portée optique","Propagation en ligne droite, limitée par le relief et l'horizon"],["ATIS","Diffusion automatique et continue des informations d'aérodrome"],["SIV","Secteur d'information de vol : information et alerte, sans clairance"],["AFIS","Information de vol d'aérodrome, sans délivrance d'autorisation"],["8,33 kHz","Espacement réduit des canaux VHF : 3 canaux dans 25 kHz"],["CRNA","Centre en route de la navigation aérienne (contrôle régional)"],["FCL.055","Mention de compétence linguistique portée sur la licence"]],"questions":[["u4s4q01","Dans quelle bande de fréquences se trouvent les canaux de radiotéléphonie VHF aéronautique ?",["108 à 118 MHz","118 à 137 MHz","3 à 30 MHz","190 à 1 750 kHz"],1,"Les communications VHF utilisent les fréquences de 118,000 à 136,975 MHz. La bande 108-118 MHz sert à la radionavigation (VOR, ILS), la HF (3-30 MHz) aux liaisons lointaines et les kilohertz aux NDB."],["u4s4q02","Quelle est la longueur d'onde d'une émission sur 125 MHz ? (λ en m = 300 / f en MHz)",["0,24 m","24 m","240 m","2,4 m"],3,"λ = 300 / 125 = 2,4 m. Les ondes VHF (30 à 300 MHz) ont une longueur d'onde de 1 à 10 m : ce sont des ondes métriques."],["u4s4q03","Un avion vole à 3 600 ft au-dessus d'une région plate ; l'antenne de la station est au niveau du sol. Quelle est la portée VHF théorique ? (portée en NM ≈ 1,23 × √h, h en ft)",["Environ 7 NM","Environ 41 NM","Environ 74 NM","Environ 148 NM"],2,"√3 600 = 60 ; 1,23 × 60 = 73,8 NM, soit environ 74 NM. En VHF, la portée croît avec la racine carrée de la hauteur."],["u4s4q04","Un avion vole à 6 400 ft au-dessus d'un relief plat ; l'antenne de la station est à 400 ft au-dessus du sol. Quelle est la portée VHF théorique ? (portée en NM ≈ 1,23 × (√h avion + √h antenne), h en ft)",["Environ 123 NM","Environ 98 NM","Environ 25 NM","Environ 246 NM"],0,"√6 400 = 80 et √400 = 20 ; 1,23 × (80 + 20) = 1,23 × 100 = 123 NM. Oublier l'antenne donnerait seulement 1,23 × 80 ≈ 98 NM."],["u4s4q05","Une station VHF au sol se trouve à 49 NM de vous, en terrain plat. Quelle hauteur minimale devez-vous atteindre, environ, pour pouvoir la contacter ? (portée en NM ≈ 1,23 × √h, h en ft)",["400 ft","4 000 ft","2 500 ft","1 600 ft"],3,"√h ≈ 49 / 1,23 ≈ 40, donc h ≈ 40² = 1 600 ft. Vérification : 1,23 × √1 600 = 1,23 × 40 ≈ 49 NM."],["u4s4q06","Vous volez à 1 500 ft sol dans une vallée encaissée. Vous n'arrivez pas à joindre une station située à 20 NM derrière une crête, alors que la formule de portée donne environ 48 NM. Quelle est l'explication la plus probable ?",["Les ondes VHF sont absorbées par l'humidité de l'air dans la vallée","Le relief masque la station : la VHF se propage en ligne droite","La portée VHF diminue fortement le jour, à cause de l'ionosphère","Votre transpondeur brouille vos émissions VHF à basse hauteur"],1,"La VHF se propage en portée optique : un relief entre l'avion et la station arrête le signal, quelle que soit la portée théorique. Prendre de la hauteur rétablit souvent la liaison."],["u4s4q07","Laquelle de ces informations ne figure pas dans un message ATIS ?",["La clairance de transit dans la CTR","La ou les pistes en service","Le QNH et le niveau de transition","Le vent, la visibilité et la nébulosité"],0,"L'ATIS diffuse en continu les informations courantes d'un aérodrome (piste, vent, visibilité, nuages, températures, QNH…). Une clairance est toujours délivrée individuellement par le contrôleur, jamais par l'ATIS."],["u4s4q08","En VFR, vous contactez un SIV (secteur d'information de vol). Quel service en obtenez-vous ?",["Des clairances de transit et une séparation des autres vols","Un guidage radar obligatoire jusqu'à votre destination","L'information de vol et l'alerte, sans clairance ni séparation","Une diffusion automatique des informations météo, type ATIS"],2,"Un SIV rend le service d'information de vol (trafic connu, météo, activité des zones) et le service d'alerte. Il ne délivre pas de clairance et n'assure pas de séparation : le pilote reste responsable de l'anticollision."],["u4s4q09","Quel organisme désigne l'indicatif « Approche » (APPROACH) ?",["Le contrôle de la circulation au sol sur l'aire de manœuvre de l'aérodrome","Le service d'information de vol rendu aux vols VFR en route (SIV)","Le contrôle des vols en croisière, assuré par un centre en route (CRNA)","Le contrôle des arrivées et des départs d'un ou plusieurs aérodromes"],3,"« Approche » désigne le contrôle d'approche. « Sol » contrôle l'aire de manœuvre, « Information » rend l'information de vol et « Contrôle » désigne le contrôle régional (CRNA en France)."],["u4s4q10","Sur un aérodrome AFIS, l'agent vous annonce : « F-LM, piste 24, vent 230 degrés 10 nœuds, pas de trafic signalé ». Que représente ce message ?",["Une information : c'est vous qui décidez d'atterrir et annoncez vos intentions","Une autorisation d'atterrissage, à collationner mot pour mot avec la piste","Une clairance d'intégration dans le circuit, à suivre sans écart","Une instruction de vous mettre en attente jusqu'à nouvel avis"],0,"L'agent AFIS rend le service d'information de vol et d'alerte, mais ne délivre aucune autorisation. Le pilote décide de sa manœuvre et annonce ses intentions."],["u4s4q11","Où un pilote trouve-t-il les langues utilisables sur la fréquence d'une station au sol française ?",["Nulle part : l'anglais est utilisable sur toutes les fréquences","Dans l'AIP, qui publie les langues disponibles pour chaque station","Dans le manuel de vol de l'avion","Dans le message ATIS, qui change de langue chaque heure"],1,"Selon SERA, les communications se font en anglais ou dans la langue de la station au sol, et les langues disponibles sur chaque station sont publiées dans l'AIP. En France, l'anglais n'est pas disponible sur toutes les fréquences."],["u4s4q12","Combien de canaux espacés de 8,33 kHz tiennent dans un canal de 25 kHz ?",["2","4","3","8"],2,"25 / 8,33 ≈ 3 : l'espacement de 8,33 kHz triple le nombre de canaux disponibles dans la bande VHF aéronautique."]]}]},{"id":"u5","title":"Navigation","description":"Coordonnées et temps, cartes aéronautiques, magnétisme et compas, triangle des vitesses, calculs de navigation et de carburant, radionavigation et GNSS pour préparer et conduire une navigation VFR (examen : 20 questions, 50 min).","skills":[{"id":"u5s1","title":"La Terre, coordonnées et temps","icon":"🌍","tips":"La position d'un point se repère par ses coordonnées géographiques.\n• Latitude : angle compté depuis l'équateur, de 0 à 90° Nord ou Sud. Les points de même latitude forment un parallèle.\n• Longitude : angle compté depuis le méridien origine de Greenwich, de 0 à 180° Est ou Ouest. Les méridiens sont des demi-grands cercles qui joignent les pôles.\n• Notation en degrés et minutes (1° = 60′) : 48°43′N 002°23′E.\n\nLe mille nautique (NM) vaut 1 852 m : c'est la longueur d'une minute d'arc de méridien (et de tout grand cercle).\n• Le long d'un méridien : 1′ de latitude = 1 NM et 1° = 60 NM ≈ 111 km. Ex. : de 43°20′N à 44°50′N, 1°30′ = 90′ = 90 NM.\n• Le long de l'équateur, qui est un grand cercle : 1′ de longitude = 1 NM.\n• Le long d'un autre parallèle, les méridiens se rapprochent : 1′ de longitude vaut cos(latitude) NM. À 60° N, 1° de longitude ne vaut plus que 30 NM.\n• Deux longitudes de même nom (deux Est ou deux Ouest) : on soustrait ; de noms contraires : on additionne.\n\nOrthodromie et loxodromie :\n• Orthodromie : arc de grand cercle, plus court chemin entre deux points. Elle coupe les méridiens sous des angles qui varient (sauf le long d'un méridien ou de l'équateur).\n• Loxodromie : ligne qui coupe tous les méridiens sous le même angle, donc à route vraie constante. Elle est plus longue que l'orthodromie, mais l'écart est négligeable sur les distances d'un vol VFR.\n\nLe temps :\n• L'heure aéronautique est l'heure UTC, notée Z (0930Z). Plans de vol, METAR, TAF et NOTAM sont rédigés en UTC.\n• Heure légale en France métropolitaine : UTC+1 en hiver, UTC+2 en été. Ex. : 10 h 15 locale en août = 08:15 UTC.\n• La Terre tourne de 360° en 24 h : 15° de longitude = 1 heure, 1° = 4 min. Un lieu situé plus à l'est voit le soleil passer au méridien plus tôt : 5° d'écart de longitude = 20 min d'écart d'heure solaire.\n\nNuit aéronautique (SERA) : période comprise entre la fin du crépuscule civil du soir et le début du crépuscule civil du matin, le crépuscule civil prenant fin quand le centre du soleil est à 6° sous l'horizon. En France métropolitaine, on retient en pratique le coucher du soleil + 30 min et le lever du soleil − 30 min, heures données en UTC par les éphémérides.","vocab":[["Latitude","Angle compté depuis l'équateur, de 0 à 90° Nord ou Sud"],["Longitude","Angle compté depuis Greenwich, de 0 à 180° Est ou Ouest"],["Mille nautique (NM)","1 852 m, soit une minute d'arc de méridien"],["Orthodromie","Arc de grand cercle : plus court chemin entre deux points"],["Loxodromie","Ligne coupant tous les méridiens sous le même angle"],["UTC (Z)","Temps universel coordonné, heure de référence en aéronautique"],["Heure légale","Heure officielle en métropole : UTC+1 en hiver, UTC+2 en été"],["Nuit aéronautique","De la fin du crépuscule civil du soir au début de celui du matin"]],"questions":[["u5s1q01","Que représente la latitude d'un point ?",["L'angle entre le méridien de Greenwich et celui du point, de 0 à 180° Est ou Ouest","L'angle compté depuis l'équateur le long du méridien du point, de 0 à 90° Nord ou Sud","La distance en milles nautiques entre le point et le pôle le plus proche","L'angle entre le nord vrai et le nord magnétique au point considéré"],1,"La latitude se compte de 0° (équateur) à 90° (pôles), vers le Nord ou le Sud ; les points de même latitude forment un parallèle. L'angle compté depuis Greenwich est la longitude, celui entre nord vrai et nord magnétique la déclinaison."],["u5s1q02","Les points A (45°00′N 003°00′E) et B (47°30′N 003°00′E) sont sur le même méridien. Quelle est la distance AB ?",["278 NM","138 NM","250 NM","150 NM"],3,"Écart de latitude : 47°30′ − 45°00′ = 2°30′ = 150′. Le long d'un méridien, 1′ = 1 NM, donc AB = 150 NM (≈ 278 km : 278 NM confond les deux unités, 138 NM lit 2°30′ comme 2,30°)."],["u5s1q03","Quelle distance représente un écart de 1° de latitude le long d'un méridien ?",["Environ 111 km","Environ 60 km","Environ 185 km","Environ 100 km"],0,"1° = 60′ et 1′ de méridien = 1 NM = 1,852 km : 60 × 1,852 ≈ 111 km, soit 60 NM. Répondre 60 km revient à confondre NM et km."],["u5s1q04","À la latitude 60° N, quelle distance, mesurée le long du parallèle, sépare deux points dont les longitudes diffèrent de 2° ?",["120 NM","240 NM","60 NM","104 NM"],2,"Le long d'un parallèle, 1′ de longitude vaut cos(latitude) NM. À 60° N, cos 60° = 0,5 : 2° = 120′ × 0,5 = 60 NM. 120 NM serait la distance le long de l'équateur."],["u5s1q05","Deux points situés sur l'équateur ont pour longitudes 008°20′W et 006°50′W. Quelle distance les sépare ?",["150 NM","910 NM","90 NM","167 NM"],2,"Les deux longitudes sont Ouest : on soustrait, 8°20′ − 6°50′ = 1°30′ = 90′. Sur l'équateur, grand cercle, 1′ de longitude vaut 1 NM : 90 NM. Additionner (910 NM) n'est correct que de part et d'autre de Greenwich."],["u5s1q06","Quelle est la caractéristique de l'orthodromie ?",["C'est le plus court chemin, mais sa route vraie varie sauf sur un méridien ou l'équateur","Elle coupe tous les méridiens sous le même angle, ce qui en fait le plus court chemin","Elle suit le parallèle des deux points, plus court que l'arc de grand cercle","Elle est plus longue que la loxodromie, mais se suit au compas à cap constant"],0,"L'orthodromie est un arc de grand cercle : c'est la distance la plus courte, mais elle coupe les méridiens sous des angles variables (sauf le long d'un méridien ou de l'équateur). La ligne à angle constant est la loxodromie, plus longue ; un arc de parallèle (hors équateur) est lui aussi plus long que l'arc de grand cercle."],["u5s1q07","Un pilote conserve une route vraie constante de 060° pendant tout son vol. Quelle trajectoire suit-il ?",["Une orthodromie","Un parallèle","Un méridien","Une loxodromie"],3,"Une route vraie constante coupe tous les méridiens sous le même angle : c'est la définition de la loxodromie. Parallèle (route 090° ou 270°) et méridien (000° ou 180°) sont des cas particuliers qui ne correspondent pas à 060°."],["u5s1q08","En juillet, un pilote prévoit de décoller de Lyon à 16 h 30, heure légale. Quelle heure doit-il porter dans son plan de vol ?",["15:30 UTC","14:30 UTC","18:30 UTC","17:30 UTC"],1,"En été, l'heure légale française est UTC+2 : UTC = 16 h 30 − 2 h = 14:30. 15:30 correspondrait à l'heure d'hiver (UTC+1), et ajouter le décalage au lieu de le retrancher est l'erreur classique."],["u5s1q09","Un METAR d'un aérodrome français émis en janvier porte l'heure 0930Z. À quelle heure légale correspond-elle ?",["10 h 30","11 h 30","08 h 30","09 h 30"],0,"Z désigne l'heure UTC. En hiver, heure légale = UTC + 1 h : 09:30 + 1 h = 10 h 30. 11 h 30 serait la conversion en heure d'été."],["u5s1q10","Quel écart d'heure solaire locale existe-t-il entre deux lieux situés à 004°30′W et 007°30′E ?",["12 min","1 h 20 min","48 min","3 h"],2,"Les lieux sont de part et d'autre de Greenwich : Δλ = 4°30′ + 7°30′ = 12°. La Terre tourne de 15° par heure, soit 1° en 4 min : 12 × 4 = 48 min, le lieu le plus à l'est étant en avance. 12 min résulte d'une soustraction à tort."],["u5s1q11","Selon la définition européenne (SERA), la nuit correspond à la période :",["comprise entre le coucher et le lever du soleil, heures lues sur les éphémérides","comprise entre la fin du crépuscule nautique du soir et le début de celui du matin","comprise entre 30 min avant le coucher et 30 min après le lever du soleil","comprise entre la fin du crépuscule civil du soir et le début de celui du matin"],3,"SERA définit la nuit à partir du crépuscule civil, qui prend fin lorsque le centre du soleil est à 6° sous l'horizon. 12° correspond au crépuscule nautique ; au coucher du soleil, la nuit aéronautique n'a pas encore commencé. En France métropolitaine, la règle pratique est coucher + 30 min et lever − 30 min, et non l'inverse."],["u5s1q12","Un avion vole plein sud le long d'un méridien à une vitesse sol de 120 kt. Combien de temps met-il pour passer de 47°00′N à 46°00′N ?",["1 h","30 min","55 min","15 min"],1,"1° de latitude = 60 NM le long d'un méridien. À 120 kt, soit 2 NM/min, il faut 60 / 2 = 30 min. 55 min résulterait de 111 km pris pour des NM."]]},{"id":"u5s2","title":"Cartes aéronautiques","icon":"🗺️","tips":"En France, la carte de référence du pilote VFR est la carte OACI au 1/500 000, établie en projection conique conforme de Lambert.\n\nProjection de Lambert : un cône sécant au globe le long de deux parallèles de référence (automécoïques).\n• Conforme : les angles sont conservés, on mesure donc les routes directement au rapporteur.\n• Échelle quasi constante sur toute la carte, exacte sur les deux parallèles de référence.\n• Méridiens : droites convergeant vers le pôle ; parallèles : arcs de cercles concentriques.\n• Une ligne droite représente pratiquement une orthodromie.\n• Les méridiens n'étant pas parallèles, l'angle d'une droite avec eux varie le long du trajet : on mesure la route vraie au méridien situé au milieu du segment.\n\nÉchelle :\n• 1/500 000 : 1 cm sur la carte = 500 000 cm = 5 km. 20 cm = 100 km ; 100 NM ≈ 37 cm.\n• 1/1 000 000 : 1 cm = 10 km.\n• Mesurez les distances avec une règle graduée à l'échelle de la carte, ou au compas à pointes sèches sur l'échelle des latitudes (1′ = 1 NM), jamais sur celle des longitudes.\n\nLecture de la carte :\n• Les altitudes (points cotés, obstacles) sont en pieds. Un obstacle noté 1 280 (350) culmine à 1 280 ft d'altitude et à 350 ft au-dessus du sol.\n• Le relief est figuré par des teintes hypsométriques, de plus en plus soutenues avec l'altitude.\n• Aérodromes, balises, espaces aériens, zones réglementées (R), dangereuses (D) et interdites (P) sont représentés selon la légende : lisez-la et vérifiez que l'édition est en vigueur.\n• Les isogones relient les points d'égale déclinaison magnétique (ex. « 2°E ») ; la ligne agonique est celle de déclinaison nulle.\n\nChoix des points de report :\n• repères uniques, visibles de loin et sans ambiguïté : confluent, croisement autoroute–voie ferrée, lac à la forme caractéristique, grande ville ;\n• espacés d'environ 10 à 15 min de vol ;\n• à éviter : petit village parmi d'autres, route secondaire, lisière de forêt uniforme.\n\nPréparation du trait de route :\n• tracer les segments entre les points tournants ;\n• mesurer la route vraie (Rv) au méridien médian, puis la distance ;\n• relever de part et d'autre de la route le relief et les obstacles les plus hauts pour fixer une altitude de sécurité, ainsi que les espaces aériens traversés ;\n• graduer le trait (tous les 10 NM ou toutes les 5 min) et reporter le tout sur le log de navigation.","vocab":[["Projection de Lambert","Projection conique conforme, échelle quasi constante"],["Projection conforme","Projection qui conserve les angles (routes lues au rapporteur)"],["Échelle 1/500 000","1 cm sur la carte = 5 km sur le terrain"],["Isogone","Ligne reliant les points de même déclinaison magnétique"],["Ligne agonique","Isogone de déclinaison nulle"],["Point de report","Repère au sol unique et bien visible qui jalonne la navigation"],["Teintes hypsométriques","Couleurs figurant le relief selon l'altitude"],["Route vraie (Rv)","Angle entre le nord vrai et la trajectoire, mesuré sur la carte"]],"questions":[["u5s2q01","Quelle propriété de la projection conique conforme de Lambert permet de mesurer une route directement au rapporteur ?",["Les méridiens y sont des droites parallèles entre elles","Les surfaces y sont conservées","Les angles y sont conservés","Les loxodromies y sont des droites"],2,"Lambert est une projection conforme : les angles sont conservés, d'où la mesure directe des routes. Ses méridiens convergent, et c'est l'orthodromie, non la loxodromie, qui y est pratiquement une droite."],["u5s2q02","Sur une carte en projection de Lambert, comment sont représentés les méridiens et les parallèles ?",["Méridiens : droites convergeant vers le pôle ; parallèles : arcs de cercles concentriques","Méridiens : droites parallèles ; parallèles : droites perpendiculaires aux méridiens","Méridiens : arcs de cercles concentriques ; parallèles : droites convergentes","Méridiens : courbes concaves vers l'équateur ; parallèles : droites parallèles"],0,"Le cône développé donne des méridiens rectilignes qui convergent vers le pôle et des parallèles en arcs de cercles centrés sur ce point. Des méridiens parallèles caractérisent la projection de Mercator."],["u5s2q03","Sur la carte OACI au 1/500 000, vous mesurez 18,5 cm entre deux points tournants. Quelle distance cela représente-t-il ?",["≈ 92 NM","≈ 25 NM","≈ 171 NM","≈ 50 NM"],3,"18,5 cm × 5 km/cm = 92,5 km, et 92,5 / 1,852 ≈ 50 NM. 92 NM oublie la conversion km → NM, 171 NM multiplie par 1,852 au lieu de diviser, 25 NM correspond au 1/250 000."],["u5s2q04","Votre segment de route traverse une grande partie de la carte d'ouest en est. Où mesurez-vous la route vraie au rapporteur ?",["Sur le méridien du point de départ","Sur le méridien situé au milieu du segment","Sur le méridien du point d'arrivée","Sur la rose d'un VOR proche du segment"],1,"Les méridiens convergeant vers le pôle, l'angle entre la droite tracée et les méridiens varie le long du segment. La mesure au méridien médian donne la route moyenne à suivre. Une rose VOR, orientée sur le nord magnétique, ne donne pas une route vraie."],["u5s2q05","Au compas à pointes sèches, sur quelle échelle reporter une distance pour la lire en NM sur une carte dépourvue de réglette en NM ?",["Sur l'échelle des longitudes graduée sur un parallèle, 1′ = 1 NM","Sur l'échelle des latitudes graduée le long d'un méridien, 1′ = 1 NM","Sur l'échelle des longitudes, 1° = 60 km","Sur l'échelle des latitudes, 1° = 100 NM"],1,"Une minute de latitude vaut 1 NM partout : on lit donc les distances sur l'échelle des latitudes, à hauteur du trajet. Une minute de longitude ne vaut 1 NM qu'à l'équateur."],["u5s2q06","Sur la carte OACI au 1/500 000, un obstacle porte l'indication 1 150 (420). Que signifie-t-elle ?",["Hauteur de 1 150 ft au-dessus du sol, terrain à 420 ft","Altitude du sommet 1 150 m, hauteur au-dessus du sol 420 m","Altitude minimale de survol 1 150 ft, obstacle de 420 ft","Altitude du sommet 1 150 ft, hauteur au-dessus du sol 420 ft"],3,"Le premier nombre est l'altitude du sommet, le nombre entre parenthèses sa hauteur au-dessus du sol, tous deux en pieds. Le sol au pied de l'obstacle est donc à environ 730 ft d'altitude."],["u5s2q07","Quel est le meilleur choix de point de report pour une navigation VFR ?",["Le croisement d'une autoroute et d'une voie ferrée, près d'un lac","Un petit village parmi d'autres villages semblables de la plaine","La lisière d'une grande forêt homogène, visible de très loin","Une longue route départementale rectiligne à travers la plaine"],0,"Un bon point de report est unique, visible de loin et identifiable sans ambiguïté, idéalement confirmé par plusieurs éléments. Villages semblables, lisières uniformes et petites routes se confondent facilement."],["u5s2q08","Que représentent les isogones tracées sur la carte OACI ?",["Les lignes d'égale altitude du relief","Les lignes reliant les points de même déviation du compas","Les lignes reliant les points de même déclinaison magnétique","Les limites latérales des espaces aériens contrôlés"],2,"Une isogone relie les points où la déclinaison magnétique est identique ; celle de déclinaison nulle est la ligne agonique. La déviation dépend de l'avion et non du lieu : elle ne figure pas sur la carte."],["u5s2q09","Un point coté du relief indique 3 280 sur la carte OACI au 1/500 000. Quelle est l'altitude de ce sommet en mètres ?",["≈ 3 280 m","≈ 10 760 m","≈ 1 640 m","≈ 1 000 m"],3,"Les altitudes de la carte OACI sont en pieds : 3 280 ft × 0,3048 ≈ 1 000 m. Multiplier par 3,28 (10 760 m) revient à convertir dans le mauvais sens."],["u5s2q10","Sur la carte, vous mesurez l'angle entre un méridien et votre trait de route. Quelle grandeur obtenez-vous ?",["La route vraie (Rv)","La route magnétique (Rm)","Le cap vrai (Cv)","Le cap compas (Cc)"],0,"Les méridiens de la carte indiquent le nord vrai : l'angle mesuré est la route vraie. On en déduit la route magnétique avec la déclinaison, puis le cap avec la dérive et la déviation."],["u5s2q11","Que peut-on dire de l'échelle d'une carte en projection de Lambert utilisée en VFR ?",["Elle n'est exacte que le long de l'équateur et se dégrade vers les pôles","Elle augmente fortement vers le nord de la carte, comme sur une Mercator","Elle est pratiquement constante, exacte sur les deux parallèles de référence","Elle est exacte le long des méridiens, mais fausse le long des parallèles"],2,"Le cône est sécant au globe le long de deux parallèles de référence (automécoïques) où l'échelle est exacte ; ailleurs l'écart reste très faible sur l'étendue d'une carte. Une seule règle graduée suffit donc."],["u5s2q12","Lors de la préparation, pourquoi graduer le trait de route, par exemple tous les 10 NM ?",["Pour reporter la déclinaison magnétique à appliquer en chaque point de la route","Pour situer l'avion d'un coup d'œil et comparer l'heure réelle à l'estimée","Pour respecter l'obligation VFR de compte rendu de position tous les 10 NM","Pour y lire l'altitude minimale de sécurité de chaque tronçon de la route"],1,"Les graduations permettent de situer l'avion le long de la route d'un coup d'œil et de comparer l'heure de passage réelle à l'estimée, pour corriger les heures suivantes. Aucun compte rendu tous les 10 NM n'est imposé en VFR."]]},{"id":"u5s3","title":"Magnétisme et compas","icon":"🧭","tips":"Trois nords :\n• Nord vrai (Nv) : direction du pôle Nord géographique, donnée par les méridiens de la carte.\n• Nord magnétique (Nm) : direction que prend une aiguille aimantée soumise au seul champ terrestre.\n• Nord compas (Nc) : direction indiquée par le compas de l'avion, perturbé par les masses métalliques et les circuits électriques de bord.\n\nDéclinaison magnétique (Dm) : angle entre le nord vrai et le nord magnétique. Elle est Est (positive) si le nord magnétique est à l'est du nord vrai, Ouest (négative) sinon. Elle dépend du lieu (isogones de la carte), évolue lentement avec les années et reste faible en France métropolitaine.\n• Rv = Rm + Dm, donc Rm = Rv − Dm ; de même Cv = Cm + Dm.\n• Ex. : Rv 245°, Dm 1°E → Rm 244°. Rv 010°, Dm 3°W (−3°) → Rm 013°.\n• Mémo : déclinaison Est, le magnétique est plus petit que le vrai ; Ouest, il est plus grand.\n\nDéviation (d) : angle entre le nord magnétique et le nord compas. Propre à chaque avion, elle varie avec le cap. Après compensation, la déviation résiduelle figure sur la carte de déviation placée près du compas (« pour Cm 180, afficher 178 »), établie moteur tournant et équipements électriques en marche.\n• Cm = Cc + d (d Est positive), d'où Cv = Cc + d + Dm.\n• Un objet métallique ou électrique (téléphone, casque, tablette) posé près du compas ajoute une déviation inconnue.\n\nErreurs du compas : le champ terrestre est fortement incliné sur l'horizontale en France (inclinaison magnétique). La suspension du compas compense cet effet en vol rectiligne stabilisé, mais pas en virage ni en accélération. Dans l'hémisphère nord :\n• Virages : erreurs maximales vers les caps nord et sud, nulles vers l'est et l'ouest. En virage vers le nord, le compas est en retard : on sort du virage avant qu'il n'indique le cap voulu. Vers le sud, il est en avance : on sort après (« au nord avant, au sud après »).\n• Accélérations : erreurs maximales aux caps est et ouest, nulles aux caps nord et sud. Une accélération fait indiquer un virage vers le nord, une décélération un virage vers le sud (mémo ANDS : Accélération Nord, Décélération Sud).\n• On ne lit donc le compas qu'en vol rectiligne, ailes horizontales, à vitesse constante.\n\nConservateur de cap : gyroscope sans référence magnétique, stable et exempt d'erreurs de virage, mais qui dérive avec le temps. On l'aligne sur le compas avant le décollage, puis toutes les 10 à 15 min environ, en vol rectiligne stabilisé.","vocab":[["Nord vrai (Nv)","Direction du pôle Nord géographique, donnée par les méridiens"],["Nord magnétique (Nm)","Direction prise par une aiguille aimantée hors perturbations"],["Nord compas (Nc)","Direction indiquée par le compas de bord, perturbé par l'avion"],["Déclinaison (Dm)","Angle entre Nv et Nm, Est positive : Rv = Rm + Dm"],["Déviation (d)","Angle entre Nm et Nc, dû à l'avion et variable avec le cap"],["Carte de déviation","Tableau près du compas : cap compas à afficher pour chaque Cm"],["Inclinaison magnétique","Angle du champ terrestre avec l'horizontale, source d'erreurs"],["Conservateur de cap","Gyroscope de cap sans erreur de virage, à recaler sur le compas"]],"questions":[["u5s3q01","Qu'appelle-t-on déclinaison magnétique ?",["L'angle entre le nord magnétique et le nord compas","L'angle entre le champ magnétique et l'horizontale","L'angle entre le cap vrai et la route vraie","L'angle entre le nord vrai et le nord magnétique local"],3,"La déclinaison est l'angle Nv–Nm, propre au lieu et à l'époque. L'angle Nm–Nc est la déviation, l'angle avec l'horizontale l'inclinaison, et l'angle cap–route la dérive."],["u5s3q02","Vous mesurez sur la carte une route vraie de 135°. La déclinaison est de 2° Est. Quelle est la route magnétique ?",["137°","133°","315°","135°"],1,"Rv = Rm + Dm, donc Rm = Rv − Dm = 135 − 2 = 133°. Avec une déclinaison Est, le magnétique est plus petit que le vrai."],["u5s3q03","La route magnétique est de 270° et la déclinaison de 3° Ouest. Quelle est la route vraie ?",["267°","273°","087°","264°"],0,"Une déclinaison Ouest est négative : Rv = Rm + Dm = 270 + (−3) = 267°. Vérification : avec une déclinaison Ouest, le magnétique (270°) est plus grand que le vrai (267°)."],["u5s3q04","Rv 092°, déclinaison 2° Est, vent nul. La carte de déviation indique « pour Cm 090, afficher 093 ». Quel cap compas affichez-vous ?",["090°","092°","093°","087°"],2,"Sans vent, Cv = Rv = 092°. Cm = Cv − Dm = 092 − 2 = 090°. La carte de déviation donne directement le cap à afficher : Cc 093° (déviation de −3°)."],["u5s3q05","Pour un avion donné, de quoi dépend principalement la déviation du compas ?",["Du cap de l'avion","De la position géographique, selon les isogones","De rien : elle est constante une fois le compas compensé","De l'altitude de vol"],0,"La déviation provient des masses métalliques et des circuits électriques de l'avion, dont l'effet sur l'aimant change avec l'orientation de l'avion : elle varie donc avec le cap. C'est la déclinaison qui varie avec le lieu."],["u5s3q06","Un passager pose son téléphone et un objet métallique sur la planche de bord, juste à côté du compas. Quelle est la conséquence ?",["Aucune, à condition que le téléphone soit éteint ou en mode avion","Une erreur de déclinaison, à corriger avec la valeur lue sur les isogones","Le conservateur de cap dérive plus vite et doit être recalé plus souvent","Une déviation supplémentaire, que la carte de déviation ne corrige pas"],3,"Tout objet magnétique ou électrique placé près du compas crée une déviation qui s'ajoute à celle mesurée lors de la compensation : il faut l'éloigner. Même éteint ou en mode avion, un téléphone contient des aimants et des pièces métalliques. La déclinaison est une propriété du lieu, et le conservateur de cap n'est pas magnétique."],["u5s3q07","Dans l'hémisphère nord, vous virez par la droite du cap 270° vers le cap 360° en vous servant du compas magnétique. Quand faut-il sortir du virage ?",["Lorsque le compas indique exactement 360°","Après que le compas a dépassé 360°","Avant que le compas n'indique 360°","À n'importe quel moment, le compas n'a pas d'erreur vers le nord"],2,"En virage vers le nord, l'erreur due à l'inclinaison magnétique fait retarder le compas : il faut anticiper la sortie de virage (« au nord avant »). Vers le sud, le compas est en avance et l'on sort après."],["u5s3q08","Dans l'hémisphère nord, sur un cap 090°, le pilote accélère franchement en palier. Que montre le compas magnétique ?",["Un virage apparent vers le sud","Un virage apparent vers le nord","Rien, les accélérations ne faussent le compas qu'aux caps nord et sud","Un blocage de la rose sur le cap 090°"],1,"Dans l'hémisphère nord, une accélération sur un cap est ou ouest fait indiquer un virage vers le nord, une décélération un virage vers le sud (mémo ANDS). L'erreur est nulle aux caps nord et sud."],["u5s3q09","Quelle est l'origine des erreurs du compas magnétique en virage et en accélération ?",["La déviation due aux masses métalliques de l'avion","La déclinaison magnétique, qui varie selon le lieu survolé","La précession du gyroscope qui stabilise la rose du compas","L'inclinaison du champ magnétique terrestre sur l'horizontale"],3,"Le champ terrestre est fortement incliné en France ; la suspension du compas compense cette composante verticale en vol stabilisé, mais pas en virage ou en accélération. Le compas magnétique ne contient pas de gyroscope."],["u5s3q10","Dans quelles conditions les erreurs de virage du compas magnétique sont-elles les plus importantes ?",["En virage au voisinage des caps nord et sud","En virage au voisinage des caps est et ouest","En vol rectiligne à vitesse constante","À basse latitude, près de l'équateur magnétique"],0,"Les erreurs de virage sont maximales près des caps nord et sud et nulles près des caps est et ouest ; les erreurs d'accélération suivent la répartition inverse. Elles croissent avec la latitude et disparaissent près de l'équateur magnétique."],["u5s3q11","Comment recaler correctement le conservateur de cap en vol ?",["Régulièrement, en virage à inclinaison constante, sur le compas magnétique","Régulièrement, en vol rectiligne à vitesse constante, sur le compas magnétique","Avant la mise en route seulement, sa dérive étant négligeable en vol","En montée initiale, sur la route vraie mesurée au rapporteur sur la carte"],1,"Le conservateur de cap dérive avec le temps ; on le recale avant le décollage puis toutes les 10 à 15 min environ, quand le compas est fiable : ailes horizontales, vitesse constante. Il se cale sur le compas, jamais sur une route vraie."],["u5s3q12","Cap vrai 200°, déclinaison 1° Ouest, déviation de +2° (Est) pour ce cap. Quel cap compas faut-il afficher ?",["203°","197°","199°","201°"],2,"Cm = Cv − Dm = 200 − (−1) = 201°, puis Cc = Cm − d = 201 − 2 = 199°. Vérification : Cv = Cc + d + Dm = 199 + 2 − 1 = 200°."]]},{"id":"u5s4","title":"Triangle des vitesses","icon":"📐","tips":"Le triangle des vitesses traduit l'égalité vectorielle : vitesse propre + vent = vitesse sol.\n• Vitesse propre (Vp, TAS) : vitesse de l'avion par rapport à l'air, portée par le cap (Cv).\n• Vent (Vw) : direction d'où il vient et force en kt. Les messages et cartes météo (METAR, TAF, WINTEM) le donnent par rapport au nord vrai ; la tour et l'ATIS le donnent par rapport au nord magnétique.\n• Vitesse sol (Vs, GS) : vitesse par rapport au sol, portée par la route (Rv).\n• Dérive (X) : angle entre le cap et la route. Le vent pousse l'avion du côté opposé à celui d'où il vient : vent de gauche, dérive droite. On corrige en prenant un cap décalé du côté du vent : Cv = Rv − X (X positif pour une dérive droite).\n\nMéthode de calcul mental :\n• Facteur de base : Fb = 60 / Vp (Vp en kt), temps en minutes pour parcourir 1 NM sans vent. Vp 120 kt → 0,5 ; 100 kt → 0,6 ; 90 kt → 0,67 ; 80 kt → 0,75.\n• Dérive maximale, par vent de travers pur : Xmax = Vw × Fb, en degrés. Ex. : vent 15 kt, Vp 90 kt → Xmax = 15 × 0,67 = 10°.\n• Angle au vent (α) : angle entre la route et la direction d'où vient le vent.\n• Dérive : X = Xmax × sin α.\n• Vent traversier = Vw × sin α ; vent effectif (de face ou arrière) = Vw × cos α.\n• À retenir : sin 30° = 0,5 ; sin 45° ≈ 0,7 ; sin 60° ≈ 0,9 ; sin 90° = 1. Et cos 30° ≈ 0,9 ; cos 45° ≈ 0,7 ; cos 60° = 0,5.\n• Vitesse sol ≈ Vp − vent effectif de face, ou Vp + vent effectif arrière.\n\nExemple : Rv 270°, vent 300°/30 kt, Vp 100 kt.\n• Fb = 0,6 et Xmax = 30 × 0,6 = 18°. Le vent vient de 30° à droite de la route.\n• X = 18 × 0,5 = 9°, dérive gauche : on corrige à droite, Cv = 279°.\n• Vent effectif de face ≈ 30 × 0,9 = 27 kt, donc Vs ≈ 73 kt.\n\nPoints clés :\n• La dérive est maximale vent de travers et nulle vent de face ou arrière, qui ne modifient que la vitesse sol.\n• Sur un aller-retour, le vent allonge toujours la durée totale : on passe plus de temps face au vent qu'avec le vent arrière.\n• En vol, on constate la dérive en comparant la route réellement suivie (repères au sol) au cap tenu, et l'on recalcule la vitesse sol entre deux repères.","vocab":[["Vitesse propre (Vp)","Vitesse par rapport à l'air (TAS), portée par le cap"],["Vitesse sol (Vs)","Vitesse par rapport au sol (GS), portée par la route"],["Dérive (X)","Angle entre le cap et la route, dû au vent traversier"],["Facteur de base (Fb)","60 / Vp : minutes pour parcourir 1 NM sans vent"],["Xmax","Dérive maximale, par vent de travers : Xmax = Vw × Fb"],["Angle au vent (α)","Angle entre la route et la direction d'où vient le vent"],["Vent effectif","Composante de face ou arrière du vent : Vw × cos α"],["Vent traversier","Composante du vent perpendiculaire à la route : Vw × sin α"]],"questions":[["u5s4q01","Dans le triangle des vitesses, quels vecteurs sont portés respectivement par le cap et par la route ?",["Cap : vitesse propre ; route : vitesse sol","Cap : vitesse sol ; route : vitesse propre","Cap : vitesse propre ; route : vent","Cap : vent ; route : vitesse sol"],0,"L'avion avance dans l'air selon son cap, à la vitesse propre ; le vent s'y ajoute et la résultante, la vitesse sol, est portée par la route réellement suivie : Vp + Vw = Vs."],["u5s4q02","Quel est le facteur de base d'un avion volant à une vitesse propre de 75 kt ?",["1,25","0,75","0,8","0,67"],2,"Fb = 60 / Vp = 60 / 75 = 0,8 : l'avion met 0,8 min (48 s) pour parcourir 1 NM sans vent. 1,25 résulte de la formule inversée (Vp / 60) ; 0,75 et 0,67 correspondent à 80 et 90 kt."],["u5s4q03","Vp 120 kt, vent de 20 kt. Quelle est la dérive maximale possible ?",["20°","10°","40°","5°"],1,"Fb = 60 / 120 = 0,5 et Xmax = Vw × Fb = 20 × 0,5 = 10°. Cette dérive n'est atteinte que par vent de travers pur ; 40° correspond à une division par Fb au lieu d'une multiplication."],["u5s4q04","Rv 090°, vent 120°/20 kt, Vp 120 kt. Quel cap vrai faut-il prendre ?",["085°","100°","090°","095°"],3,"Fb = 0,5, Xmax = 20 × 0,5 = 10°. Angle au vent 30° : X = 10 × 0,5 = 5°. Le vent vient de la droite et pousse l'avion à gauche : on corrige du côté du vent, Cv = 090 + 5 = 095°."],["u5s4q05","Rv 360°, vent 315°/20 kt, Vp 120 kt. Quelle est la dérive et quel cap vrai faut-il prendre ?",["Dérive gauche de 7°, Cv 007°","Dérive droite de 10°, Cv 350°","Dérive droite de 5°, Cv 355°","Dérive droite de 7°, Cv 353°"],3,"Xmax = 20 × 0,5 = 10° et angle au vent 45° : X = 10 × 0,7 = 7°. Le vent de 315° vient de la gauche et pousse l'avion vers la droite : on prend un cap à gauche de la route, Cv = 360 − 7 = 353°."],["u5s4q06","Rv 180°, vent 240°/20 kt, Vp 100 kt. Quelle vitesse sol peut-on estimer ?",["≈ 82 kt","≈ 90 kt","≈ 110 kt","≈ 100 kt"],1,"Angle au vent : 240 − 180 = 60°, vent venant de l'avant. Vent effectif de face = 20 × cos 60° = 10 kt, donc Vs ≈ 100 − 10 = 90 kt. Prendre sin 60° (18 kt) confondrait vent effectif et vent traversier."],["u5s4q07","Le vent de 30 kt fait un angle de 60° avec la route. Quelle est la composante de vent traversier ?",["≈ 26 kt","15 kt","≈ 21 kt","30 kt"],0,"Vent traversier = Vw × sin α = 30 × sin 60° ≈ 30 × 0,87 ≈ 26 kt (27 kt avec l'approximation sin 60° ≈ 0,9). 15 kt est la composante effective (Vw × cos 60°) et 21 kt correspondrait à un angle de 45°."],["u5s4q08","Dans un METAR, un TAF ou une carte de vents en altitude, comment la direction du vent est-elle exprimée ?",["Par rapport au nord magnétique, direction vers laquelle souffle le vent","Par rapport au nord magnétique, direction d'où vient le vent","Par rapport au nord vrai, direction d'où vient le vent","Par rapport au nord vrai, direction vers laquelle souffle le vent"],2,"Les vents des messages et cartes météo sont donnés par rapport au nord vrai, en indiquant la direction d'où ils viennent : ils se combinent directement avec la route vraie. Le vent communiqué par la tour ou l'ATIS est
