, lui, magnétique."],["u5s4q09","En suivant votre route, vous constatez à l'aide des repères au sol que l'avion dérive vers la gauche. Que pouvez-vous en déduire ?",["Le vent vient de la gauche : il faut corriger le cap vers la droite","Le vent vient de la droite : il faut corriger le cap vers la droite","Le vent vient de la droite : il faut corriger le cap vers la gauche","Le vent est exactement arrière : aucune correction n'est nécessaire"],1,"Le vent pousse l'avion du côté opposé à celui d'où il vient : une dérive gauche révèle un vent venant de la droite. On corrige en décalant le cap vers le vent, donc vers la droite."],["u5s4q10","Vp 100 kt, vent arrière de 15 kt dans l'axe de la route. Combien de temps faut-il pour parcourir 46 NM ?",["28 min","32 min","20 min","24 min"],3,"Vs = 100 + 15 = 115 kt. Temps = 46 / 115 = 0,4 h = 24 min. 28 min correspond au vol sans vent et 32 min à un vent de face de 15 kt."],["u5s4q11","À vitesse propre et force du vent identiques, dans quelle situation la dérive est-elle la plus forte ?",["Vent de face, dans l'axe de la route","Vent à 30° de l'axe de la route","Vent perpendiculaire à l'axe de la route","Vent arrière, dans l'axe de la route"],2,"La dérive vaut Xmax × sin α : elle est maximale pour α = 90° (vent de travers) et nulle par vent de face ou arrière, qui ne modifient que la vitesse sol."],["u5s4q12","Un avion fait un aller-retour de 100 NM dans chaque sens à Vp 100 kt, avec un vent de 20 kt dans l'axe de la route. Par rapport au même vol sans vent, la durée totale :",["est plus longue d'environ 5 min","est identique, le gain à l'aller compense la perte au retour","est plus courte d'environ 5 min","est plus longue d'environ 25 min"],0,"Vent de face : 100 / 80 = 1 h 15 min ; vent arrière : 100 / 120 = 50 min ; total 2 h 05 min contre 2 h sans vent. On reste plus longtemps exposé au vent de face : le vent ne se compense jamais sur un aller-retour."]]},{"id":"u5s5","title":"Calculs de navigation et carburant","icon":"⛽","tips":"Temps et distance :\n• Temps (h) = distance (NM) / vitesse sol (kt) ; en minutes, T = D × 60 / Vs.\n• Raisonnez en NM par minute : 60 kt = 1 NM/min ; 90 kt = 1,5 NM/min ; 120 kt = 2 NM/min.\n• Ex. : 75 NM à 90 kt → 75 × 60 / 90 = 50 min.\n\nConversions :\n• 1 NM = 1,852 km, donc 1 kt = 1,852 km/h (100 kt ≈ 185 km/h ; 150 km/h ≈ 81 kt).\n• 1 ft = 0,3048 m (1 000 ft ≈ 305 m ; 1 000 m ≈ 3 280 ft).\n• 1 USG (gallon américain) ≈ 3,785 l.\n• Densité de l'AVGAS ≈ 0,72, soit 0,72 kg par litre : 100 l ≈ 72 kg. Masse = volume × 0,72 ; volume = masse / 0,72.\n• Températures : °C = (°F − 32) × 5/9 et °F = °C × 9/5 + 32. Ex. : 59 °F = 15 °C ; 68 °F = 20 °C.\n\nCarburant :\n• Carburant d'étape = consommation horaire × temps de vol, calculé avec la vitesse sol.\n• Réserve minimale (Part-NCO, avion, VFR de jour) : de quoi rejoindre l'aérodrome de destination en conservant une réserve finale d'au moins 30 min de vol en vitesse d'attente à 1 500 ft au-dessus de la destination (AMC1 NCO.OP.125(b)). De nuit : 45 min.\n• Ajoutez le roulage, un éventuel dégagement et une marge personnelle ; le carburant inutilisable ne compte jamais.\n• Autonomie = carburant utilisable / consommation horaire. Ex. : 100 l à 25 l/h = 4 h, dont 30 min de réserve : 3 h 30 disponibles pour le trajet.\n• Ex. : 90 NM à Vs 100 kt = 0,9 h = 54 min ; à 25 l/h → 22,5 l ; + 12,5 l de réserve = 35 l au minimum, hors roulage. Attention aux conversions : 1 h 12 min = 1,2 h et non 1,12 h.\n\nRègle du 1 sur 60 : à 60 NM, un écart latéral de 1 NM correspond à 1°.\n• Erreur de route (°) = écart (NM) × 60 / distance parcourue (NM).\n• Angle de convergence vers la destination (°) = écart × 60 / distance restante.\n• Ex. : 3 NM à droite après 30 NM, 30 NM restants : erreur 6°, convergence 6°, correction totale 12° à gauche.\n\nDescente :\n• Une pente de 5 % (≈ 3°) correspond à environ 300 ft par NM.\n• Taux de descente (ft/min) ≈ Vs (kt) × 5. Ex. : Vs 90 kt → 450 ft/min ; Vs 120 kt → 600 ft/min.\n• Distance de début de descente (NM) = hauteur à perdre (ft) / 300. Ex. : 2 400 ft à perdre → 8 NM.","vocab":[["Nœud (kt)","Un NM par heure, soit 1,852 km/h"],["USG","Gallon américain : environ 3,785 litres"],["AVGAS","Essence aviation, densité ≈ 0,72 (0,72 kg par litre)"],["Consommation horaire","Carburant consommé par heure de vol (l/h ou USG/h)"],["Autonomie","Durée de vol possible avec le carburant utilisable à bord"],["Réserve VFR de jour","30 min en vitesse d'attente à 1 500 ft au-dessus de la destination"],["Règle du 1 sur 60","À 60 NM, un écart latéral de 1 NM correspond à 1°"],["Pente de 5 %","Environ 300 ft par NM ; taux ≈ Vs (kt) × 5 en ft/min"]],"questions":[["u5s5q01","Distance 60 NM, vitesse sol 80 kt. Quel est le temps de vol ?",["1 h 20 min","40 min","45 min","48 min"],2,"T = D × 60 / Vs = 60 × 60 / 80 = 45 min. 1 h 20 min résulte de la division inverse (Vs / D)."],["u5s5q02","Une vitesse de 180 km/h correspond à environ :",["333 kt","112 kt","90 kt","97 kt"],3,"1 kt = 1,852 km/h, donc 180 / 1,852 ≈ 97 kt. 333 kt multiplie au lieu de diviser, 112 kt utilise le mille terrestre de 1,609 km."],["u5s5q03","Un sommet est coté 1 500 m sur une carte topographique. Quelle est son altitude en pieds ?",["≈ 4 920 ft","≈ 457 ft","≈ 4 500 ft","≈ 2 780 ft"],0,"1 m = 1 / 0,3048 ≈ 3,28 ft : 1 500 × 3,28 ≈ 4 920 ft. 457 ft multiplie par 0,3048 au lieu de diviser, 4 500 ft vient de l'approximation trop grossière 1 m ≈ 3 ft et 2 780 ft du facteur 1,852 des milles nautiques."],["u5s5q04","Les réservoirs d'un avion contiennent 20 USG. Quel volume cela représente-t-il en litres ?",["≈ 91 l","≈ 76 l","≈ 5,3 l","≈ 60 l"],1,"1 USG ≈ 3,785 l : 20 × 3,785 ≈ 76 l. 91 l correspondrait au gallon impérial (≈ 4,55 l) et 5,3 l à une division au lieu d'une multiplication."],["u5s5q05","Quelle est la masse de 150 l d'AVGAS ?",["≈ 208 kg","150 kg","≈ 120 kg","≈ 108 kg"],3,"Masse = volume × 0,72 = 150 × 0,72 = 108 kg. Diviser par 0,72 (208 kg) est l'erreur classique ; 0,8 kg/l est l'ordre de grandeur du kérosène, pas de l'AVGAS."],["u5s5q06","Une performance du manuel de vol est donnée pour une température de 86 °F. À combien de °C cela correspond-il ?",["≈ 48 °C","54 °C","30 °C","43 °C"],2,"°C = (°F − 32) × 5/9 = (86 − 32) × 5/9 = 54 × 5/9 = 30 °C. Oublier de retrancher 32 donne 48 °C ; oublier le facteur 5/9 donne 54 °C."],["u5s5q07","Étape de 120 NM, vitesse sol 100 kt, consommation constante de 30 l/h, vol VFR de jour. Quel carburant minimal faut-il au départ, hors roulage, pour respecter la réserve Part-NCO ?",["36 l","51 l","≈ 49 l","66 l"],1,"Temps = 120 / 100 = 1,2 h (1 h 12 min), soit 1,2 × 30 = 36 l. Réserve de 30 min = 15 l. Total : 51 l. Prendre 1 h 12 min pour 1,12 h donne 48,6 l, erreur d'unité classique."],["u5s5q08","Un avion emporte 90 l de carburant utilisable et consomme 30 l/h. En conservant la réserve de 30 min exigée en VFR de jour, de quelle durée de vol dispose-t-on pour le trajet ?",["2 h 30 min","3 h","2 h","3 h 30 min"],0,"Autonomie totale = 90 / 30 = 3 h. On en retire la réserve de 30 min : 2 h 30 min pour l'étape, et moins encore si l'on compte le roulage et une marge personnelle."],["u5s5q09","En vol, vous passez un premier repère à 10:12 puis un second, situé 18 NM plus loin sur la route, à 10:21. Quelle est votre vitesse sol ?",["108 kt","135 kt","120 kt","200 kt"],2,"Temps entre les repères : 10:21 − 10:12 = 9 min. Vs = 18 × 60 / 9 = 120 kt, soit 2 NM/min. 200 kt vient de 9 min prises pour 0,09 h ; 108 et 135 kt d'une erreur d'une minute sur le temps (10 ou 8 min)."],["u5s5q10","Après 40 NM de vol, vous constatez que vous êtes 4 NM à droite de la route prévue. Quelle est l'erreur de route ?",["4°","10°","3°","6°"],3,"Règle du 1 sur 60 : erreur = écart × 60 / distance parcourue = 4 × 60 / 40 = 6°. À 40 NM de distance, chaque NM d'écart vaut 1,5°."],["u5s5q11","Après 20 NM de vol, vous êtes 2 NM à gauche de la route prévue et il reste 30 NM jusqu'à la destination. Comment modifier le cap pour rejoindre directement la destination ?",["10° à droite","6° à droite","4° à droite","10° à gauche"],0,"On annule l'erreur de route, 2 × 60 / 20 = 6°, puis on converge vers la destination de 2 × 60 / 30 = 4°. Correction totale : 6 + 4 = 10°, vers la droite puisque l'avion est à gauche de la route."],["u5s5q12","Vous êtes à 4 500 ft QNH et devez rejoindre 1 500 ft QNH sur une pente de 5 %, à une vitesse sol de 100 kt. À quelle distance commencer la descente et avec quel taux ?",["15 NM et 300 ft/min","10 NM et 500 ft/min","10 NM et 300 ft/min","6 NM et 500 ft/min"],1,"Hauteur à perdre : 4 500 − 1 500 = 3 000 ft ; à 300 ft/NM, il faut 10 NM. Taux ≈ Vs × 5 = 100 × 5 = 500 ft/min, soit 6 min de descente qui couvrent bien 10 NM à 100 kt."]]},{"id":"u5s6","title":"Radionavigation et GNSS","icon":"📡","tips":"VOR : balise VHF (108,00 à 117,95 MHz) à portée optique, qui croît avec l'altitude. Elle définit 360 radiales.\n• Radiale = QDR : route magnétique qui s'éloigne de la station. QDM = route magnétique pour rejoindre la station = QDR ± 180°. Ex. : sur la radiale 130, QDM 310.\n• On affiche une route à l'OBS ; l'aiguille du CDI indique de quel côté se trouve cette route. En volant un cap voisin de la route affichée, aiguille à droite = route à droite. Sur un CDI à 5 points, chaque point vaut environ 2°.\n• L'indicateur TO/FROM précise si la route affichée rapproche (TO) ou éloigne (FROM) de la station. OBS 180, FROM, aiguille centrée : l'avion est sur la radiale 180, au sud de la station.\n• Les indications dépendent de la position de l'avion, jamais de son cap.\n• Identifiez toujours la station par son indicatif morse.\n\nADF / NDB : la balise NDB émet en LF/MF (environ 190 à 1 750 kHz) et l'aiguille de l'ADF pointe vers elle.\n• Gisement (G) : angle entre l'axe de l'avion et la direction de la balise, compté de 0 à 360° dans le sens horaire depuis le nez.\n• Relèvement magnétique de la balise : QDM = Cm + G (moins 360 si nécessaire) ; QDR = QDM ± 180°.\n• Ex. : Cm 120°, G 300° → QDM 060°, QDR 240°.\n• Le NDB est sensible aux orages, à l'effet de nuit et au relief.\n\nDME : mesure en UHF, par le temps d'aller-retour d'une impulsion, la distance oblique avion–station en NM. À la verticale, il affiche la hauteur au-dessus de la station (1 NM ≈ 6 076 ft) : environ 2 NM à 12 000 ft. Loin de la station, l'écart avec la distance au sol est négligeable.\n\nRadar secondaire (SSR) : la station sol interroge le transpondeur de bord, qui répond. Mode A : code à 4 chiffres ; mode C : en plus, l'altitude-pression (référence 1013,25 hPa, quel que soit le calage de l'altimètre) ; mode S : adresse propre à l'avion et données supplémentaires. Codes particuliers : 7700 détresse, 7600 panne radio, 7500 intervention illicite.\n\nGNSS (GPS, Galileo…) : le récepteur calcule sa position à partir des distances à plusieurs satellites ; il en faut au moins 4 pour une position en trois dimensions.\n• RAIM : contrôle autonome de l'intégrité par le récepteur, grâce à des satellites supplémentaires ; il alerte si la position n'est plus fiable.\n• Limites : brouillage, masquage, base de données périmée, erreur de saisie, regard trop longtemps fixé sur l'écran. L'altitude GNSS est géométrique : elle ne sert pas à respecter les limites verticales des espaces aériens.\n• Le GNSS reste une aide : la navigation VFR s'appuie sur la carte et l'observation du sol, et le pilote doit pouvoir la poursuivre sans lui.","vocab":[["Radiale (QDR)","Route magnétique qui s'éloigne d'une station VOR"],["QDM","Route magnétique pour rejoindre la station (QDR ± 180°)"],["OBS / CDI","Sélecteur de route / aiguille d'écart à la route affichée"],["Gisement","Angle entre l'axe de l'avion et la balise, sens horaire"],["DME","Équipement mesurant la distance oblique avion–station en NM"],["Transpondeur","Répondeur de bord interrogé par le radar secondaire"],["GNSS","Positionnement par satellites (GPS, Galileo…)"],["RAIM","Contrôle par le récepteur de l'intégrité de la position GNSS"]],"questions":[["u5s6q01","Dans quelle bande de fréquences émettent les VOR ?",["LF/MF, de 190 à 1 750 kHz","VHF, de 108,00 à 117,95 MHz","VHF, de 118 à 137 MHz","UHF, de 962 à 1 213 MHz"],1,"Les VOR utilisent la bande VHF 108,00–117,95 MHz, juste sous la bande des communications (118–137 MHz). La bande LF/MF est celle des NDB et la bande UHF celle des DME."],["u5s6q02","Vous êtes sur la radiale 240 d'un VOR. Quel QDM devez-vous suivre pour rejoindre la station ?",["240°","150°","330°","060°"],3,"La radiale (QDR) est la route magnétique qui s'éloigne de la station. Pour revenir, on suit la route opposée : QDM = 240 − 180 = 060°."],["u5s6q03","Pour rejoindre une station VOR en suivant le QDM 045, que doit-on obtenir sur l'indicateur ?",["OBS 045, indication TO, aiguille centrée","OBS 225, indication TO, aiguille centrée","OBS 045, indication FROM, aiguille centrée","OBS 135, indication TO, aiguille centrée"],0,"On affiche à l'OBS la route à suivre, 045°, et l'indicateur doit montrer TO puisque cette route rapproche de la station. L'aiguille centrée confirme que l'avion est sur cette route ; volant un cap voisin de 045°, l'aiguille se lit dans le bon sens."],["u5s6q04","OBS affiché sur 090, indication FROM, aiguille centrée. Où se trouve l'avion ?",["À l'ouest de la station, sur la radiale 270","Au nord de la station, sur la radiale 360","À l'est de la station, sur la radiale 090","À l'est de la station, sur le QDM 090"],2,"FROM avec OBS 090 et aiguille centrée signifie que la route 090° éloigne de la station : l'avion est sur la radiale 090, donc à l'est. Son QDM est 270°."],["u5s6q05","Aiguille centrée et indication TO, le pilote effectue un virage de 180° sans toucher à l'OBS. Que deviennent les indications du VOR ?",["L'indicateur passe sur FROM, car l'avion s'éloigne désormais de la station","L'indicateur passe sur FROM et l'aiguille part en butée du côté opposé","L'indicateur reste sur TO, mais l'aiguille part en butée d'un côté","Elles ne changent pas : elles dépendent de la position de l'avion, pas du cap"],3,"Le VOR situe l'avion par rapport à la route affichée, indépendamment du cap. Seule la lecture change : en volant à l'opposé de la route affichée, l'aiguille s'interprète à l'envers."],["u5s6q06","En cap magnétique 060°, l'aiguille de l'ADF indique un gisement de 330°. Quel est le QDM de la balise ?",["270°","030°","210°","120°"],1,"Le gisement se compte depuis le nez de l'avion dans le sens horaire : QDM = Cm + G = 060 + 330 = 390°, soit 030° après retrait de 360. Le QDR, route qui s'éloigne de la balise, vaut 210°."],["u5s6q07","En navigation VFR, la position affichée par le GNSS ne correspond pas aux repères au sol que vous avez identifiés sans ambiguïté sur la carte. Quelle est la bonne attitude ?",["Suivre le GNSS, plus précis que l'œil, et recaler sa position sur la carte d'après lui","Éteindre le GNSS et poursuivre à l'estime au cap compas, sans chercher d'autres repères","Se fier aux repères visuels recoupés, puis vérifier la saisie et la base de données GNSS","Monter pour améliorer la réception et attendre que les deux positions concordent"],2,"Le GNSS n'est qu'une aide : erreur de saisie, base de données périmée ou brouillage peuvent fausser l'affichage. En VFR, la carte et l'observation du sol restent la référence ; on recoupe plusieurs repères avant de corriger."],["u5s6q08","Un avion passe à la verticale d'une station DME, 6 000 ft au-dessus d'elle. Qu'affiche le DME ?",["Environ 1 NM","0 NM","Environ 6 NM","Rien, le DME ne fonctionne pas à la verticale"],0,"Le DME mesure la distance oblique. À la verticale, elle est égale à la hauteur : 6 000 ft ≈ 1 NM (1 NM ≈ 6 076 ft). Cet écart avec la distance au sol devient négligeable loin de la station."],["u5s6q09","Que transmet un transpondeur en mode C, en plus du code affiché ?",["L'altitude lue sur l'altimètre, avec le QNH que le pilote a affiché","La vitesse sol et la route de l'avion, calculées par son GNSS","L'immatriculation et le type de l'avion, saisis avant le vol","L'altitude-pression (réf. 1013,25 hPa), quel que soit le calage affiché"],3,"Le mode C transmet l'altitude-pression (référence 1013,25 hPa) ; c'est le système sol qui la convertit au besoin avec le QNH. L'adresse individuelle et l'identification de vol relèvent du mode S."],["u5s6q10","Combien de satellites un récepteur GNSS doit-il recevoir au minimum pour déterminer une position en trois dimensions ?",["2","4","3","6"],1,"Chaque satellite fournit une distance ; les trois coordonnées plus le décalage de l'horloge du récepteur font quatre inconnues, d'où 4 satellites au minimum. Des satellites supplémentaires permettent le contrôle d'intégrité (RAIM)."],["u5s6q11","Que désigne le RAIM sur un récepteur GNSS ?",["Un contrôle autonome de l'intégrité de la position grâce aux satellites en surnombre","Un réseau de satellites géostationnaires qui transmet des corrections GPS","La mise à jour automatique, par le récepteur, de sa base de données aéronautique","Un mode de secours où le récepteur calcule la position à partir des balises VOR"],0,"RAIM (Receiver Autonomous Integrity Monitoring) : le récepteur compare les mesures redondantes de plusieurs satellites et alerte si la position n'est plus fiable. Les satellites géostationnaires de correction relèvent du SBAS (EGNOS en Europe)."],["u5s6q12","Pourquoi ne faut-il pas utiliser l'altitude GNSS pour respecter le plancher d'un espace aérien ?",["Parce que le GNSS ne fournit qu'une position horizontale, sans information verticale","Parce que l'altitude GNSS est une hauteur au-dessus du sol, et non une altitude","Parce qu'elle est géométrique, alors que les limites se réfèrent au calage QNH ou 1013","Parce que l'altitude GNSS n'est affichée qu'en mètres, sans conversion possible"],2,"L'altitude GNSS est géométrique et s'écarte de l'altitude barométrique selon la température et la pression. Les limites d'espaces et l'espacement vertical reposent sur l'altimètre calé (QNH ou 1013) : c'est lui qui fait foi. L'altitude GNSS n'est pas pour autant une hauteur au-dessus du sol."]]}]},{"id":"u6","title":"Principes du vol","description":"Les bases de l'aérodynamique et de la mécanique du vol : écoulement et profil, portance et traînée, décrochage et vrille, virage et facteur de charge, stabilité et commandes (examen : 12 questions, 18 min).","skills":[{"id":"u6s1","title":"Écoulement de l'air et profil","icon":"💨","tips":"Dans un écoulement subsonique lent (air considéré comme incompressible), le théorème de Bernoulli s'écrit, le long d'une ligne de courant :\n• Ps + ½ρV² = Pt = constante\nPs est la pression statique (celle de l'air au repos, qui s'exerce dans toutes les directions), ½ρV² la pression dynamique q (due à la vitesse) et Pt la pression totale. Conséquence : quand l'air accélère, sa pression statique diminue. C'est l'effet Venturi : au col d'un tube rétréci, la vitesse augmente et la pression statique baisse.\n\nLa pression dynamique est proportionnelle à la masse volumique ρ (1,225 kg/m³ au niveau de la mer en atmosphère standard) et au carré de la vitesse : doubler la vitesse multiplie q par 4. Le tube de Pitot, ouvert face au vent, mesure la pression totale ; la prise statique mesure Ps. L'anémomètre affiche une vitesse déduite de la différence Pt − Ps = q.\n\nCouche limite : fine couche d'air au contact de la surface, dans laquelle la vitesse passe de zéro (contre la paroi) à celle de l'écoulement extérieur. D'abord laminaire près du bord d'attaque, elle devient turbulente après la transition : plus épaisse, elle crée plus de frottement mais résiste mieux au décollement. Quand elle décolle de l'extrados, la portance s'effondre : c'est le décrochage.\n\nLe profil (coupe de l'aile) :\n• bord d'attaque à l'avant, bord de fuite à l'arrière ;\n• extrados (face supérieure), intrados (face inférieure) ;\n• corde : segment joignant le bord d'attaque au bord de fuite ;\n• ligne moyenne : ligne à égale distance de l'extrados et de l'intrados ;\n• cambrure : écart maximal entre ligne moyenne et corde ; un profil symétrique a une cambrure nulle et une portance nulle à incidence nulle ;\n• épaisseur relative : épaisseur maximale divisée par la corde.\nEn vol, l'air accélère sur l'extrados (dépression, qui fournit la plus grande part de la portance) et ralentit sous l'intrados (légère surpression).\n\nTrois angles à ne pas confondre :\n• incidence α : entre la corde et le vent relatif ;\n• assiette θ : entre l'axe longitudinal de l'avion et l'horizontale ;\n• pente γ : entre la trajectoire et l'horizontale.\nEn négligeant le calage de l'aile (angle fixe entre corde et axe longitudinal) : θ = α + γ. En palier, assiette et incidence sont égales ; en montée, l'assiette est forte mais l'incidence reste modérée.\n\nAllongement λ = b²/S (envergure au carré divisée par la surface alaire), soit envergure / corde pour une aile rectangulaire : environ 5 à 8 pour un avion léger, de 15 à plus de 30 pour un planeur. Un grand allongement réduit la traînée induite.","vocab":[["Pression statique (Ps)","Pression de l'air au repos, exercée dans toutes les directions"],["Pression dynamique (q)","q = ½ρV², pression due à la vitesse de l'écoulement"],["Pression totale (Pt)","Ps + q, mesurée par le tube de Pitot"],["Couche limite","Fine couche d'air freinée au contact de la paroi"],["Corde","Segment joignant le bord d'attaque au bord de fuite"],["Cambrure","Écart maximal entre la ligne moyenne et la corde"],["Incidence (α)","Angle entre la corde du profil et le vent relatif"],["Allongement (λ)","Envergure au carré divisée par la surface : λ = b²/S"]],"questions":[["u6s1q01","D'après le théorème de Bernoulli, que se passe-t-il lorsque l'air accélère le long d'une ligne de courant, en écoulement subsonique ?",["Sa pression statique augmente","Sa pression totale diminue","Sa pression statique diminue","Sa pression dynamique diminue"],2,"Le long d'une ligne de courant, Ps + ½ρV² = Pt reste constante. Si la vitesse augmente, la pression dynamique augmente et la pression statique diminue d'autant : c'est l'effet Venturi."],["u6s1q02","À masse volumique constante, la vitesse d'un avion passe de 100 kt à 200 kt. Sa pression dynamique est :",["multipliée par 1,41","multipliée par 4","multipliée par 2","multipliée par 8"],1,"q = ½ρV² varie comme le carré de la vitesse : (200 / 100)² = 2² = 4."],["u6s1q03","Quelle est la pression dynamique d'un écoulement d'air de masse volumique 1,2 kg/m³ à la vitesse de 50 m/s ?",["1 500 Pa","3 000 Pa","60 Pa","30 Pa"],0,"q = ½ρV² = 0,5 × 1,2 × 50² = 0,6 × 2 500 = 1 500 Pa. Oublier le ½ donne 3 000 Pa ; oublier le carré de la vitesse donne 30 Pa."],["u6s1q04","Que mesure la prise du tube de Pitot, ouverte face à l'écoulement ?",["La pression statique de l'air ambiant","La pression dynamique seule, due à la vitesse","La différence de pression entre l'extrados et l'intrados","La pression totale, celle de l'air arrêté dans le tube"],3,"L'air s'arrête à l'entrée du tube de Pitot : on y mesure la pression totale Pt = Ps + ½ρV². L'anémomètre en retranche la pression statique pour obtenir la pression dynamique, donc la vitesse."],["u6s1q05","Qu'appelle-t-on la couche limite ?",["Le sillage tourbillonnaire qui se forme derrière le bord de fuite","La fine couche d'air freinée par frottement au contact de la paroi","La couche d'air en surpression qui se forme sous l'intrados","L'altitude maximale à laquelle l'aile peut encore porter l'avion"],1,"La couche limite est la mince couche d'air au contact de la surface : la vitesse y passe de zéro (contre la paroi) à la vitesse de l'écoulement extérieur. Son décollement sur l'extrados provoque le décrochage."],["u6s1q06","Comparée à une couche limite laminaire, une couche limite turbulente :",["est plus mince et crée moins de frottement","crée moins de frottement mais décolle plus facilement","n'existe qu'au voisinage immédiat du bord d'attaque","crée plus de frottement mais résiste mieux au décollement"],3,"La couche limite turbulente est plus épaisse et freine davantage (traînée de frottement plus forte), mais l'air y est plus énergique près de la paroi : elle reste collée plus longtemps. Elle apparaît en aval de la zone laminaire, après la transition."],["u6s1q07","Sur un profil d'aile, comment est définie la corde ?",["Le segment de droite qui joint le bord d'attaque au bord de fuite","La ligne située à égale distance de l'extrados et de l'intrados","La distance qui sépare les deux extrémités de l'aile","L'épaisseur maximale mesurée entre l'extrados et l'intrados"],0,"La corde relie le bord d'attaque au bord de fuite. La ligne à égale distance des deux faces est la ligne moyenne ; la distance d'un saumon à l'autre est l'envergure."],["u6s1q08","Un profil symétrique se caractérise par :",["un extrados plus bombé que l'intrados","une portance positive à incidence nulle","une ligne moyenne confondue avec la corde","une épaisseur constante sur la corde"],2,"Les deux faces d'un profil symétrique sont identiques : la ligne moyenne est confondue avec la corde, la cambrure est nulle et la portance est nulle à incidence nulle. Un extrados plus bombé caractérise un profil cambré."],["u6s1q09","En montée stabilisée, un avion a une assiette de +10° et une pente de trajectoire de +6°. En négligeant le calage de l'aile, quelle est son incidence ?",["16°","10°","6°","4°"],3,"Assiette = incidence + pente (calage négligé), donc incidence = 10° − 6° = 4°. Une assiette élevée ne signifie pas une incidence élevée."],["u6s1q10","L'angle d'incidence d'une aile est l'angle formé par :",["l'axe longitudinal de l'avion et l'horizontale","la corde du profil et la direction du vent relatif","la trajectoire de l'avion et l'horizontale","la corde du profil et l'axe longitudinal de l'avion"],1,"L'incidence se mesure entre la corde et le vent relatif. Les autres propositions définissent respectivement l'assiette, la pente et le calage de l'aile."],["u6s1q11","Une aile a une envergure de 10 m et une surface de 12,5 m². Quel est son allongement ?",["0,8","1,25","8","125"],2,"λ = b² / S = 10² / 12,5 = 100 / 12,5 = 8, valeur typique d'un avion léger."],["u6s1q12","Pourquoi les planeurs ont-ils des ailes de très grand allongement ?",["Pour réduire la traînée induite et améliorer la finesse","Pour augmenter l'incidence critique et retarder le décrochage","Pour améliorer la maniabilité et le taux de roulis","Pour réduire la traînée de frottement de la couche limite"],0,"Un grand allongement limite l'effet des tourbillons marginaux, donc la traînée induite, ce qui améliore la finesse. Une grande envergure rend au contraire l'avion moins vif en roulis."]]},{"id":"u6s2","title":"Portance et traînée","icon":"🛫","tips":"La résultante aérodynamique se décompose en deux forces :\n• la portance Fz, perpendiculaire au vent relatif ;\n• la traînée Fx, parallèle au vent relatif et opposée au déplacement.\n\nFormules à connaître :\n• Fz = ½ ρ S V² Cz\n• Fx = ½ ρ S V² Cx\nρ : masse volumique de l'air (kg/m³) ; S : surface alaire (m²) ; V : vitesse (m/s) ; Cz et Cx : coefficients sans dimension qui dépendent de la forme du profil et surtout de l'incidence.\n• À incidence constante, la portance varie comme V² : vitesse × 2 → portance × 4.\n• Quand ρ diminue (altitude, chaleur), il faut plus de vitesse vraie pour la même portance ; la vitesse indiquée nécessaire, elle, reste la même.\n• Cz croît à peu près linéairement avec l'incidence, puis plafonne au Cz max, atteint à l'incidence critique, avant de chuter : c'est le décrochage.\nEn palier, portance = poids : pour voler plus lentement, il faut augmenter l'incidence.\n\nTraînée :\n• traînée parasite (frottement, forme, interférence, éléments extérieurs) : elle croît comme V² ;\n• traînée induite : liée à la portance. En bout d'aile, l'air de l'intrados (surpression) contourne le saumon vers l'extrados (dépression) et forme des tourbillons marginaux qui dévient l'écoulement vers le bas. Elle est forte à basse vitesse et grande incidence, décroît comme 1/V² en palier et diminue avec l'allongement (et les winglets).\nLa traînée totale est minimale quand traînées induite et parasite sont égales.\n\nFinesse f = Fz / Fx = Cz / Cx. En plané sans vent, f = distance parcourue / hauteur perdue : avec f = 10, 300 m de hauteur donnent 3 km. La finesse maximale est obtenue à une incidence donnée ; sa valeur ne dépend pas de la masse, mais la vitesse de finesse maximale augmente avec la masse (comme √m).\n\nPolaire : courbe Cz en fonction de Cx. On y lit le Cz max (décrochage), le Cx minimal et la finesse maximale, au point de contact de la tangente menée depuis l'origine.\n\nDispositifs hypersustentateurs :\n• volets de bord de fuite (de courbure, à fente, Fowler) : ils augmentent la cambrure (et la surface pour le Fowler), donc le Cz max. La vitesse de décrochage baisse, mais la traînée augmente, la finesse diminue et l'incidence critique baisse légèrement. En approche, ils permettent une pente plus forte avec une assiette plus basse ;\n• becs et fentes de bord d'attaque : ils réénergisent la couche limite d'extrados, retardent le décollement et augmentent l'incidence critique.","vocab":[["Portance (Fz)","Force perpendiculaire au vent relatif : Fz = ½ρSV²Cz"],["Traînée (Fx)","Force parallèle au vent relatif, opposée au déplacement"],["Cz","Coefficient de portance, fonction surtout de l'incidence"],["Traînée induite","Traînée liée à la portance, due aux tourbillons marginaux"],["Traînée parasite","Frottement, forme et interférence ; croît comme V²"],["Finesse (f)","Fz/Fx = Cz/Cx ; distance/hauteur en plané sans vent"],["Polaire","Courbe Cz en fonction de Cx d'une aile ou d'un avion"],["Hypersustentateurs","Volets et becs qui augmentent le Cz max"]],"questions":[["u6s2q01","À incidence et masse volumique constantes, la vitesse passe de 80 kt à 120 kt. La portance est multipliée par :",["1,5","2,25","3","1,22"],1,"Fz = ½ρSV²Cz varie comme le carré de la vitesse : (120 / 80)² = 1,5² = 2,25."],["u6s2q02","À même masse et même incidence de rotation, comment évolue la vitesse de décollage sur un terrain élevé par forte chaleur, par rapport au niveau de la mer en atmosphère standard ?",["Vitesse indiquée inchangée, vitesse vraie plus élevée","Vitesse indiquée plus élevée, vitesse vraie inchangée","Vitesse indiquée et vitesse vraie plus faibles","Vitesse indiquée et vitesse vraie inchangées"],0,"La portance dépend de ½ρV², que mesure l'anémomètre : à masse et incidence égales, la vitesse indiquée est la même. Comme ρ est plus faible, il faut une vitesse vraie plus grande pour obtenir ce même ½ρV², d'où une distance de décollage plus longue."],["u6s2q03","Quelle est l'origine de la traînée induite ?",["Le frottement de l'air sur l'ensemble du revêtement de l'avion","Les éléments extérieurs non profilés, comme le train et les antennes","Les tourbillons marginaux, l'air passant de l'intrados à l'extrados","Le souffle hélicoïdal de l'hélice qui frappe la dérive et l'empennage"],2,"En bout d'aile, l'air en surpression sous l'intrados contourne le saumon vers l'extrados en dépression et forme des tourbillons marginaux. Ils dévient l'écoulement vers le bas, ce qui incline la portance vers l'arrière : c'est la traînée induite, inséparable de la production de portance."],["u6s2q04","En palier, à masse constante, dans quelle condition de vol la traînée induite est-elle la plus forte ?",["À grande vitesse et faible incidence","À la vitesse de finesse maximale","À toutes les vitesses : elle ne dépend que de la masse","À basse vitesse et grande incidence"],3,"À basse vitesse, il faut un grand Cz, donc une grande incidence, pour porter le poids : les tourbillons marginaux sont intenses. En palier, la traînée induite diminue comme 1/V² quand la vitesse augmente."],["u6s2q05","Laquelle de ces traînées n'appartient pas à la traînée parasite ?",["La traînée de frottement","La traînée de forme","La traînée d'interférence","La traînée induite"],3,"La traînée parasite regroupe le frottement, la forme et l'interférence entre éléments ; elle croît comme V². La traînée induite est due à la production de portance et décroît quand la vitesse augmente."],["u6s2q06","Un avion léger a une finesse maximale de 10. Moteur en panne à 2 000 ft sol (environ 600 m), sans vent, quelle distance peut-il parcourir au mieux ?",["3 km","6 km","12 km","20 km"],1,"Sans vent, distance = finesse × hauteur = 10 × 600 m = 6 000 m, soit environ 6 km (un peu plus de 3 NM), à condition de voler à la vitesse de finesse maximale."],["u6s2q07","Un planeur embarque du lest d'eau qui augmente sa masse. Que deviennent sa finesse maximale et sa vitesse de finesse maximale ?",["Finesse max plus élevée, vitesse de finesse max inchangée","Finesse max plus faible, vitesse de finesse max plus faible","Finesse max inchangée, vitesse de finesse max plus élevée","Finesse max et vitesse de finesse max inchangées"],2,"La finesse max dépend de l'aérodynamique (Cz/Cx à une incidence donnée), pas de la masse. Pour porter un poids plus grand à la même incidence, il faut voler plus vite : la vitesse de finesse max augmente, comme la racine carrée de la masse."],["u6s2q08","La finesse d'un avion est égale au rapport :",["portance / traînée","traînée / portance","poids / surface alaire","envergure² / surface alaire"],0,"f = Fz / Fx = Cz / Cx. En plané sans vent, elle est aussi égale au rapport distance parcourue / hauteur perdue. Poids / surface est la charge alaire, envergure² / surface l'allongement."],["u6s2q09","Sur la polaire Cz = f(Cx) d'un avion, où lit-on la finesse maximale ?",["Au sommet de la courbe, là où le Cz est maximal","Au point le plus à gauche, là où le Cx est minimal","Au point où la polaire coupe l'axe des Cx, à portance nulle","Au point de contact de la tangente issue de l'origine"],3,"Pour chaque point de la polaire, Cz/Cx est la pente de la droite qui le relie à l'origine. Cette pente est maximale pour la droite tangente à la courbe. Le sommet correspond au Cz max, donc au décrochage."],["u6s2q10","Quel est l'effet principal de la sortie des volets de bord de fuite ?",["Augmenter le Cz max, ce qui abaisse la vitesse de décrochage","Augmenter l'incidence critique de l'aile pour retarder le décrochage","Diminuer la traînée pour allonger le plané en approche","Augmenter la finesse de l'avion en descente"],0,"Les volets augmentent la cambrure (et parfois la surface) de l'aile : le Cz max augmente et la vitesse de décrochage diminue. En contrepartie, la traînée augmente, la finesse baisse et l'incidence critique diminue légèrement."],["u6s2q11","Quel est le rôle des becs de bord d'attaque ?",["Augmenter la vitesse maximale en réduisant la traînée de forme","Réduire la traînée induite en atténuant les tourbillons marginaux","Retarder le décollement des filets et augmenter l'incidence critique","Diminuer la cambrure pour réduire la portance à l'atterrissage"],2,"Le bec ménage une fente qui envoie de l'air rapide sur l'extrados : la couche limite est réénergisée et décolle plus tard. L'aile peut voler à une incidence plus élevée, avec un Cz max plus grand."],["u6s2q12","En palier, à masse constante, vous réduisez la vitesse de 120 kt à 90 kt en maintenant l'altitude. Que devez-vous faire de l'incidence ?",["La diminuer, pour s'éloigner du décrochage","L'augmenter, pour compenser la baisse de pression dynamique","La garder constante, la portance ne dépendant que de la masse","La garder constante et augmenter la puissance"],1,"En palier, la portance doit rester égale au poids. Si V diminue, ½ρV² diminue : il faut augmenter Cz, donc l'incidence (manche vers l'arrière). Ici (120 / 90)² ≈ 1,78 : le Cz doit augmenter d'environ 78 %."]]},{"id":"u6s3","title":"Décrochage et vrille","icon":"⚠️","tips":"Le décrochage survient quand l'incidence dépasse l'incidence critique (de l'ordre de 15 à 18° pour un profil classique) : les filets d'air décollent de l'extrados, le Cz chute brutalement et la traînée augmente.\n• Il dépend de l'incidence, pas de la vitesse : on peut décrocher à n'importe quelle vitesse et à n'importe quelle assiette (ressource brutale, virage serré).\n• La vitesse de décrochage Vs n'en est qu'une conséquence : c'est la vitesse à laquelle il faut l'incidence critique pour porter l'avion, pour une masse, une configuration et un facteur de charge donnés.\n\nÉvolution de Vs (d'après Fz = ½ρSV²Cz max = n × m × g) :\n• comme la racine carrée de la masse : masse × 0,81 → Vs × 0,9 ;\n• comme la racine carrée du facteur de charge : Vs(n) = Vs × √n ; sous 2 g, Vs est multipliée par 1,41 ;\n• en vitesse indiquée, Vs ne varie pratiquement pas avec l'altitude.\n\nConfiguration et état de l'aile :\n• volets sortis : Cz max plus grand, Vs plus faible. VS0 (configuration atterrissage) marque le début de l'arc blanc, VS1 (en général lisse) le début de l'arc vert ;\n• givre, neige ou même insectes sur le bord d'attaque : Cz max et incidence critique réduits, Vs nettement plus élevée ; on décolle toujours avec des surfaces propres ;\n• centrage avant : Vs légèrement plus élevée.\n\nSignes avant-coureurs : vitesse faible et décroissante, commandes molles et peu efficaces, avertisseur de décrochage, vibrations (buffeting), assiette inhabituellement cabrée, bruit aérodynamique qui diminue. Au décrochage : abattée, parfois départ en roulis.\n\nSortie de décrochage :\n• diminuer l'incidence, manche vers l'avant : action prioritaire ;\n• ajuster la puissance, remettre les ailes à plat une fois l'incidence réduite, garder la symétrie au palonnier ;\n• ressource douce, sans redécrocher.\n\nAutorotation et vrille : si une aile décroche plus que l'autre (souvent à cause d'un lacet au moment du décrochage), elle porte moins et traîne plus. L'avion part en roulis et en lacet de ce côté ; l'aile descendante voit son incidence augmenter encore : le mouvement s'entretient seul, c'est l'autorotation. La vrille est une descente hélicoïdale, avion décroché, en autorotation. À ne pas confondre avec la spirale engagée : avion non décroché, vitesse croissante.\n\nSortie générique PARE (la procédure du manuel de vol prime toujours) :\n• P : puissance réduite ;\n• A : ailerons au neutre ;\n• R : palonnier (rudder) à fond du côté opposé à la rotation ;\n• E : profondeur (elevator) vers l'avant jusqu'à l'arrêt de la rotation ; puis palonnier au neutre et ressource douce.","vocab":[["Incidence critique","Incidence du Cz max, au-delà de laquelle l'aile décroche"],["Vs","Vitesse de décrochage ; croît avec la masse et comme √n"],["VS0","Décrochage en configuration atterrissage : début de l'arc blanc"],["VS1","Décrochage en configuration donnée (lisse) : début de l'arc vert"],["Buffeting","Vibrations dues aux filets décollés, signe d'un décrochage proche"],["Abattée","Chute du nez de l'avion au moment du décrochage"],["Autorotation","Rotation auto-entretenue due au décrochage inégal des ailes"],["PARE","Vrille : réduire, ailerons neutres, pied opposé, manche avant"]],"questions":[["u6s3q01","À quelle condition une aile décroche-t-elle ?",["Quand sa vitesse devient inférieure à la vitesse de décrochage du manuel","Quand son incidence dépasse l'incidence critique","Quand l'assiette de l'avion dépasse environ 15°","Quand la puissance du moteur est réduite"],1,"Le décrochage est lié à l'incidence : au-delà de l'incidence critique, les filets d'air décollent de l'extrados et le Cz chute. La vitesse de décrochage publiée n'est valable que pour une masse, une configuration et un facteur de charge donnés (en général 1 g)."],["u6s3q02","En vol à 90 kt, alors que la VS1 de l'avion vaut 50 kt, un pilote tire brutalement sur le manche. Un décrochage est-il possible ?",["Non, le décrochage n'est possible qu'en dessous de VS1","Non, sauf si les volets sont sortis","Oui, mais seulement si l'assiette dépasse 30°","Oui, si l'incidence critique est dépassée"],3,"On décroche à n'importe quelle vitesse et à n'importe quelle assiette dès que l'incidence critique est dépassée. Une ressource brutale augmente l'incidence et le facteur de charge, donc la vitesse de décrochage Vs × √n : ici, (90 / 50)² = 1,8² ≈ 3,2 g suffisent pour décrocher à 90 kt."],["u6s3q03","Un avion décroche à 50 kt à la masse maximale. Quelle est approximativement sa vitesse de décrochage lorsque sa masse ne représente plus que 81 % de la masse maximale ?",["40,5 kt","45 kt","50 kt","55 kt"],1,"Vs varie comme la racine carrée de la masse : 50 × √0,81 = 50 × 0,9 = 45 kt. La relation n'est pas proportionnelle : 40,5 kt serait faux."],["u6s3q04","Un avion décroche à 60 kt en palier ailes horizontales. Lors d'une ressource sous un facteur de charge de 2,25, sa vitesse de décrochage vaut :",["60 kt","90 kt","120 kt","135 kt"],1,"Vs(n) = Vs × √n = 60 × √2,25 = 60 × 1,5 = 90 kt. Multiplier par n au lieu de √n donnerait 135 kt."],["u6s3q05","Sur l'anémomètre, à quelle vitesse correspond le début (côté basses vitesses) de l'arc blanc ?",["À VS1, vitesse de décrochage en configuration lisse (croisière)","À VFE, vitesse maximale autorisée volets sortis","À VS0, vitesse de décrochage en configuration atterrissage","À VNO, vitesse maximale de croisière en air turbulent"],2,"L'arc blanc (plage d'utilisation des volets) va de VS0, décrochage en configuration atterrissage à la masse maximale, jusqu'à VFE. L'arc vert commence à VS1 et l'arc jaune à VNO."],["u6s3q06","Avant le vol, vous constatez une fine couche de givre sur le bord d'attaque et l'extrados. Quel est l'effet sur le décrochage ?",["L'incidence critique diminue et la vitesse de décrochage augmente","L'incidence critique augmente et la vitesse de décrochage diminue","Aucun effet notable tant que la couche reste fine","La traînée augmente mais la vitesse de décrochage est inchangée"],0,"Même fin, le givre rend l'extrados rugueux et déforme le profil : les filets décollent plus tôt, le Cz max et l'incidence critique diminuent, et Vs augmente. L'avertisseur de décrochage peut ne plus prévenir à temps : on décolle toujours avec des surfaces propres."],["u6s3q07","Lequel de ces signes annonce l'approche du décrochage ?",["Des commandes de plus en plus dures et plus efficaces","Une vitesse qui augmente alors que l'assiette est stable","Un bruit aérodynamique de plus en plus fort (sifflement)","Des vibrations de la cellule et des gouvernes (buffeting)"],3,"Près du décrochage, les filets décollés de l'aile provoquent des vibrations (buffeting). S'y ajoutent une vitesse faible, des commandes molles et peu efficaces, l'avertisseur de décrochage et une assiette souvent élevée ; le bruit aérodynamique, lui, diminue."],["u6s3q08","Quelle est l'action prioritaire pour sortir d'un décrochage ?",["Diminuer l'incidence en rendant la main (manche vers l'avant)","Tirer sur le manche pour relever le nez et freiner la chute","Remettre d'abord les ailes à plat en braquant les ailerons","Sortir les volets en grand sans toucher au manche"],0,"Le décrochage étant dû à une incidence excessive, on la réduit d'abord en poussant sur le manche. On ajuste ensuite la puissance, on remet les ailes à plat une fois l'incidence réduite, puis on effectue une ressource douce."],["u6s3q09","Qu'est-ce qu'une vrille ?",["Une spirale engagée, avion non décroché, à vitesse croissante","Un virage serré à très grande inclinaison, stabilisé en palier","Une autorotation, avion décroché, en descente hélicoïdale","Une abattée symétrique, sans rotation, après un décrochage"],2,"La vrille associe décrochage et autorotation : l'avion descend en tournant autour d'un axe vertical, à vitesse faible et à grande incidence. La spirale engagée se fait avion non décroché, avec une vitesse et un facteur de charge qui augmentent."],["u6s3q10","Au cours d'une vrille à gauche, que peut-on dire de l'aile gauche (aile descendante) ?",["Son incidence est plus faible et elle porte davantage","Elle n'est pas décrochée, seule l'aile droite l'est","Elle porte autant que l'aile droite, seule sa traînée diffère","Son incidence est plus grande, elle porte moins et traîne plus"],3,"L'aile qui descend voit son incidence augmenter : plus profondément décrochée, elle porte moins et traîne davantage que l'aile montante. Cette dissymétrie entretient le roulis et le lacet : c'est l'autorotation."],["u6s3q11","Dans la méthode générique de sortie de vrille PARE, que signifie le « R » ?",["Palonnier à fond du côté opposé à la rotation","Palonnier à fond du côté de la rotation","Remise de la pleine puissance","Manche à fond du côté opposé à la rotation"],0,"PARE : Puissance réduite, Ailerons au neutre, palonnier (Rudder) à fond du côté opposé à la Rotation, profondeur (Elevator) vers l'avant. La procédure du manuel de vol de l'avion reste prioritaire."],["u6s3q12","Un élève réalise un décrochage moteur réduit et appuie fortement sur le palonnier droit au moment où l'avion décroche. Quel est le risque principal ?",["Un départ en vrille à gauche","Une simple abattée symétrique, sans rotation","Un départ en vrille à droite","Une sortie de décrochage facilitée par le lacet"],2,"Le lacet à droite ralentit l'aile droite, qui porte moins, s'enfonce et voit son incidence augmenter encore, tandis que l'aile gauche accélère et porte plus : l'avion part en autorotation à droite. Au décrochage, on garde la bille au centre."]]},{"id":"u6s4","title":"Virage et facteur de charge","icon":"↪️","tips":"En virage, l'avion est incliné d'un angle φ. La portance, perpendiculaire aux ailes, se décompose en :\n• une composante verticale Fz × cos φ, qui équilibre le poids ;\n• une composante horizontale Fz × sin φ, force centripète qui courbe la trajectoire.\nPour tenir le palier, la portance doit donc augmenter : Fz = P / cos φ. On augmente l'incidence (manche vers l'arrière) et on ajoute de la puissance, car la traînée induite augmente.\n\nFacteur de charge : n = portance / poids, exprimé en g. En virage en palier symétrique, n = 1 / cos φ :\n• 30° → n ≈ 1,15\n• 45° → n ≈ 1,41\n• 60° → n = 2\n• 70° → n ≈ 2,9\nIl ne dépend que de l'inclinaison, ni de la vitesse ni du type d'avion. Le pilote le ressent comme une augmentation de son poids apparent.\n\nVitesse de décrochage en virage : Vs(φ) = Vs × √n.\n• 30° : Vs × 1,07 ; 45° : Vs × 1,19 ; 60° : Vs × 1,41.\nUne forte inclinaison à basse vitesse, en particulier dans le dernier virage, peut donc provoquer un décrochage.\n\nRayon et taux de virage :\n• rayon R = V² / (g × tan φ) : il varie comme le carré de la vitesse vraie et diminue quand l'inclinaison augmente ;\n• taux de virage (en °/s), proportionnel à tan φ / V : il augmente avec l'inclinaison et diminue quand la vitesse augmente.\nVirage au taux standard (taux 1) : 3°/s, soit 360° en 2 minutes ; l'inclinaison nécessaire augmente avec la vitesse (environ 15° à 100 kt).\n\nSymétrie et bille : en vol symétrique, la bille est au centre. Règle : « le pied chasse la bille », on appuie sur le palonnier du côté où se trouve la bille.\n• Glissade : bille à l'intérieur du virage (inclinaison trop forte pour le taux de virage).\n• Dérapage : bille à l'extérieur du virage (excès de pied intérieur).\nUn virage dérapé près du décrochage favorise le départ en vrille.\n\nLimites de facteur de charge : chaque avion est certifié dans une catégorie qui fixe le facteur de charge limite à ne pas dépasser (au-delà, risque de déformation permanente). Valeurs positives usuelles pour les avions légers :\n• normale : +3,8 g (virages jusqu'à 60°, pas de voltige) ;\n• utilitaire : +4,4 g (voltige limitée, vrilles si elles sont approuvées) ;\n• acrobatique : +6 g.\nLa structure est calculée pour 1,5 fois le facteur limite (facteur extrême). Un avion peut être certifié dans deux catégories, chacune avec ses limites de masse et de centrage. En air agité, on reste sous la VNO (début de l'arc jaune).","vocab":[["Facteur de charge (n)","Rapport portance / poids, exprimé en g"],["n en virage","n = 1/cos φ : 1,15 à 30°, 1,41 à 45°, 2 à 60°"],["Vs en virage","Vs × √n : × 1,19 à 45°, × 1,41 à 60°"],["Force centripète","Composante horizontale de la portance qui courbe la trajectoire"],["Taux standard","Taux 1 : 3°/s, soit un tour complet en 2 minutes"],["Glissade","Vol dissymétrique, bille à l'intérieur du virage"],["Dérapage","Vol dissymétrique, bille à l'extérieur du virage"],["Facteur de charge limite","+3,8 g en catégorie normale, +4,4 g en utilitaire"]],"questions":[["u6s4q01","Comment définit-on le facteur de charge ?",["Le rapport de la portance au poids","Le rapport du poids à la portance","Le rapport de la masse à la surface alaire","Le rapport de la traînée à la portance"],0,"n = Fz / P. En palier rectiligne n = 1 ; en virage en palier il vaut 1 / cos φ. La masse rapportée à la surface alaire est la charge alaire."],["u6s4q02","Quel est le facteur de charge en virage en palier à 60° d'inclinaison ?",["1,15","1,41","2","4"],2,"n = 1 / cos φ = 1 / cos 60° = 1 / 0,5 = 2. À retenir : 30° → 1,15 ; 45° → 1,41 ; 60° → 2."],["u6s4q03","Un pilote pèse 80 daN. En virage en palier à 45° d'inclinaison, quelle force exerce-t-il environ sur son siège ?",["57 daN","80 daN","92 daN","113 daN"],3,"À 45°, n = 1 / cos 45° ≈ 1,41. La force exercée sur le siège vaut n × poids = 1,41 × 80 ≈ 113 daN."],["u6s4q04","Un avion décroche à 64 kt en palier ailes horizontales. Quelle est sa vitesse de décrochage en virage en palier à 45° d'inclinaison ?",["76 kt","90 kt","64 kt","128 kt"],0,"Vs(φ) = Vs × √n, avec n ≈ 1,41 à 45°, donc √1,41 ≈ 1,19 : 64 × 1,19 ≈ 76 kt. Multiplier par n au lieu de √n donnerait 90 kt."],["u6s4q05","Un biplace à 90 kt et un avion de voyage à 160 kt virent tous deux en palier à 30° d'inclinaison. Lequel subit le facteur de charge le plus élevé ?",["L'avion de voyage, car il est le plus rapide","Le biplace, car il est le plus lent","Les deux subissent le même, environ 1,15 g","Le plus lourd des deux, quelle que soit sa vitesse"],2,"En virage en palier symétrique, n = 1 / cos φ ne dépend que de l'inclinaison : 1 / cos 30° ≈ 1,15 pour les deux avions. La vitesse influe sur le rayon et le taux de virage, pas sur le facteur de charge."],["u6s4q06","En virage en palier à inclinaison constante, la vitesse vraie double. Le rayon de virage est :",["multiplié par 2","multiplié par 4","divisé par 2","inchangé"],1,"R = V² / (g × tan φ) : à inclinaison constante, le rayon varie comme le carré de la vitesse vraie, soit 2² = 4."],["u6s4q07","Pour virer en palier avec un rayon plus petit et un taux de virage plus élevé, le pilote doit :",["diminuer l'inclinaison et augmenter la vitesse","augmenter l'inclinaison et la vitesse","garder l'inclinaison et augmenter la vitesse","augmenter l'inclinaison et réduire la vitesse"],3,"Le rayon R = V² / (g × tan φ) diminue et le taux de virage (proportionnel à tan φ / V) augmente quand l'inclinaison augmente et que la vitesse diminue, en restant bien au-dessus de la vitesse de décrochage en virage."],["u6s4q08","Un virage au taux standard (taux 1) permet d'effectuer un tour complet en :",["1 minute","2 minutes","3 minutes","4 minutes"],1,"Le taux 1 correspond à 3° par seconde : 360° / 3 = 120 s, soit 2 minutes. Le taux 2 (6°/s) donne un tour en 1 minute."],["u6s4q09","En virage à gauche, la bille est décalée vers la droite, à l'extérieur du virage. Le vol est :",["glissé ; on le corrige au palonnier gauche","dérapé ; on le corrige au palonnier droit","glissé ; on le corrige au palonnier droit","dérapé ; on le corrige au palonnier gauche"],1,"Bille à l'extérieur du virage : l'avion dérape (excès de pied intérieur ou inclinaison insuffisante). « Le pied chasse la bille » : on appuie à droite, du côté de la bille, ce qui revient à relâcher le pied gauche."],["u6s4q10","Quel est le facteur de charge limite positif habituel d'un avion léger certifié en catégorie normale ?",["+2","+6","+3,8","+4,4"],2,"Catégorie normale : +3,8 g ; utilitaire : +4,4 g ; acrobatique : +6 g. Ce sont des facteurs limites : la structure est calculée pour résister à 1,5 fois ces valeurs (facteurs extrêmes)."],["u6s4q11","En palier stabilisé, vous inclinez l'avion à 30° aux seuls ailerons, sans toucher à la profondeur ni à la puissance. Que se passe-t-il ?",["Il descend : la composante verticale de la portance est inférieure au poids","Il monte : l'inclinaison augmente le facteur de charge et donc la portance","Il garde son altitude : la portance totale reste la même qu'en palier","Il garde son altitude, mais sa vitesse diminue peu à peu"],0,"Incliné de φ, l'avion ne dispose plus que de Fz × cos φ pour équilibrer le poids : à 30°, cos φ ≈ 0,87, soit environ 13 % de moins, et il descend. Pour tenir le palier, il faut augmenter l'incidence (manche vers l'arrière) jusqu'à Fz = P / cos φ et ajouter de la puissance."],["u6s4q12","Pourquoi faut-il augmenter la puissance pour garder la vitesse en virage en palier à grande inclinaison ?",["Parce que la composante horizontale de la portance freine l'avion","Parce que le facteur de charge diminue en virage","Parce que l'hélice perd son rendement quand l'avion est incliné","Parce que la portance accrue augmente la traînée induite"],3,"En virage en palier, la portance doit valoir P / cos φ. On l'obtient en augmentant l'incidence, ce qui augmente la traînée induite : sans puissance supplémentaire, la vitesse diminue."]]},{"id":"u6s5","title":"Stabilité, commandes et effets","icon":"⚖️","tips":"Les trois axes passent par le centre de gravité (CG) :\n• tangage, autour de l'axe transversal : gouverne de profondeur, manche en avant ou en arrière ;\n• roulis, autour de l'axe longitudinal : ailerons, braqués en sens inverse, manche à gauche ou à droite ;\n• lacet, autour de l'axe vertical : gouverne de direction, palonniers.\n\nStabilité statique : tendance d'un avion écarté de son équilibre à y revenir seul (sinon il est neutre ou instable).\n\nFoyer : point où s'appliquent les variations de portance quand l'incidence change ; le moment par rapport au foyer ne varie pas avec l'incidence (vers 25 % de la corde pour un profil). À ne pas confondre avec le centre de poussée, point d'application de la résultante aérodynamique, qui se déplace avec l'incidence.\n\nStabilité longitudinale : le CG doit être en avant du foyer de l'avion. Une rafale qui augmente l'incidence crée alors un surcroît de portance en arrière du CG, qui fait piquer et ramène l'incidence.\n• Centrage avant : avion très stable mais lourd à la profondeur, Vs un peu plus élevée, risque de manquer de profondeur à l'arrondi.\n• Centrage arrière : avion moins stable, commandes légères et sensibles, sortie de vrille plus difficile. CG derrière le foyer : avion instable.\nIl faut donc respecter les limites de centrage du manuel de vol.\n\nCompensateur (trim) : le plus souvent une petite surface (tab) au bord de fuite de la gouverne, réglée depuis le poste, qui annule l'effort au manche pour une vitesse donnée. Il se braque en sens inverse de la gouverne : tab vers le bas pour tenir la profondeur vers le haut.\n\nLacet inverse : en roulis, l'aileron baissé (aile qui monte) augmente la portance et la traînée induite de cette aile ; le nez part du côté opposé au virage. On le contre au palonnier du côté du virage ; les ailerons différentiels (l'aileron levé braque plus que l'aileron baissé) le réduisent.\n\nEffets moteur, pour une hélice tournant dans le sens horaire vue du poste (cas des moteurs Lycoming et Continental) :\n• couple de renversement : réaction au couple de l'hélice, il incline l'avion à gauche ;\n• souffle hélicoïdal : il s'enroule autour du fuselage et frappe la dérive par la gauche : lacet à gauche ;\n• facteur P : à grande incidence, la pale descendante (à droite) tire plus que la pale montante : lacet à gauche ;\n• effet gyroscopique : quand on lève la queue d'un train classique, lacet à gauche.\nLe lacet à gauche qui en résulte, maximal à forte puissance et basse vitesse, se contre au pied droit ; le roulis dû au couple se contre aux ailerons.\n\nEffet de sol : à moins d'une envergure du sol environ, et surtout sous une demi-envergure, le sol gêne les tourbillons marginaux et la traînée induite diminue. Un avion trop rapide flotte à l'arrondi ; au décollage, il peut quitter le sol à une vitesse trop faible pour monter hors de l'effet de sol.","vocab":[["Tangage / roulis / lacet","Rotations autour des axes transversal, longitudinal et vertical"],["Stabilité statique","Tendance de l'avion à revenir seul à son équilibre"],["Foyer","Point d'application des variations de portance"],["Centrage","Position du CG, à garder dans les limites du manuel de vol"],["Compensateur (trim)","Surface réglable qui annule l'effort au manche"],["Lacet inverse","Lacet opposé au virage, dû à la traînée de l'aileron baissé"],["Facteur P","Traction plus forte de la pale descendante à grande incidence"],["Effet de sol","Baisse de la traînée induite près du sol (moins d'une envergure)"]],"questions":[["u6s5q01","Quelle association entre gouverne et mouvement est correcte ?",["Profondeur : lacet, autour de l'axe vertical","Direction : tangage, autour de l'axe transversal","Ailerons : tangage, autour de l'axe transversal","Ailerons : roulis, autour de l'axe longitudinal"],3,"Les ailerons commandent le roulis (axe longitudinal), la profondeur le tangage (axe transversal) et la direction le lacet (axe vertical). Les trois axes passent par le centre de gravité."],["u6s5q02","Un avion est statiquement stable en tangage si, après une rafale qui augmente son incidence :",["il tend de lui-même à revenir à son incidence initiale","il conserve sa nouvelle incidence sans revenir en arrière","il continue de lui-même à cabrer de plus en plus","il part en roulis du côté de l'aile la plus basse"],0,"La stabilité statique est la tendance à revenir vers l'équilibre après une perturbation, sans action du pilote. Conserver la nouvelle position correspond à une stabilité neutre ; s'en écarter davantage, à de l'instabilité."],["u6s5q03","Quelle condition assure la stabilité longitudinale statique d'un avion ?",["Le centre de gravité doit être situé en arrière du foyer","Le centre de gravité doit être situé en avant du foyer","Le centre de gravité doit être confondu avec le foyer","Le foyer doit être situé au bord d'attaque de l'aile"],1,"Si le CG est en avant du foyer, une augmentation d'incidence crée un surcroît de portance appliqué en arrière du CG : l'avion pique et l'incidence revient. CG confondu avec le foyer : stabilité neutre ; CG en arrière : instabilité."],["u6s5q04","Par rapport à un centrage avant, un centrage arrière (dans les limites du manuel) rend l'avion :",["plus stable et plus lourd à la profondeur","plus stable, avec une vitesse de décrochage plus élevée","moins stable, avec des efforts à la profondeur plus faibles","insensible aux actions sur la profondeur"],2,"En reculant, le CG se rapproche du foyer : la marge de stabilité diminue, l'avion devient plus sensible et les efforts au manche plus faibles. Au-delà de la limite arrière, l'avion peut devenir instable et la sortie de vrille difficile."],["u6s5q05","Votre avion est chargé avec un centrage proche de la limite avant. À quoi devez-vous vous attendre ?",["Une profondeur lourde à l'arrondi et une Vs un peu plus élevée","Un avion instable en tangage, avec des efforts au manche très faibles","Une tendance plus marquée au départ en vrille, difficile à arrêter","Une vitesse de décrochage plus faible et une meilleure maniabilité"],0,"Un CG avant rend l'avion très stable : il faut plus de déportance à l'empennage, donc plus d'effort et de braquage de profondeur, qui peuvent manquer à l'arrondi. Cette déportance oblige l'aile à porter davantage : Vs augmente légèrement."],["u6s5q06","À quoi sert le compensateur de profondeur ?",["À augmenter le braquage maximal de la gouverne de profondeur","À déplacer le centre de gravité pour corriger un centrage arrière","À contrer le lacet inverse lors de la mise en virage aux ailerons","À annuler l'effort au manche à une assiette et une vitesse données"],3,"Le compensateur (trim) permet de voler sans effort au manche dans une situation stabilisée. Il ne déplace pas le centre de gravité ; on le règle après chaque changement de vitesse, de puissance ou de configuration."],["u6s5q07","Le compensateur est réglé pour maintenir sans effort la gouverne de profondeur braquée vers le haut (à cabrer). Dans quel sens est braqué le tab situé au bord de fuite de la gouverne ?",["Vers le haut, dans le même sens que la gouverne","Vers le bas, en sens inverse de la gouverne","Vers le haut, puis il revient au neutre une fois la vitesse stabilisée","Vers le bas, puis il revient au neutre une fois la vitesse stabilisée"],1,"La force aérodynamique sur le tab braqué vers le bas pousse le bord de fuite de la gouverne vers le haut et la maintient à cabrer. Le tab se braque toujours en sens inverse de la gouverne qu'il compense et reste braqué tant que le réglage n'est pas modifié."],["u6s5q08","Vous inclinez l'avion à droite aux seuls ailerons et le nez part d'abord vers la gauche. Quelle en est la cause ?",["La traînée de forme accrue de l'aile droite, aileron levé","Le souffle hélicoïdal qui frappe la dérive par la droite","La traînée induite accrue de l'aile gauche, aileron baissé","Le couple de renversement dû à la rotation de l'hélice"],2,"C'est le lacet inverse : l'aileron baissé de l'aile qui monte augmente sa portance, donc sa traînée induite, et retient cette aile. On le contre au palonnier du côté du virage ; les ailerons différentiels le réduisent."],["u6s5q09","Qu'appelle-t-on le foyer d'un profil ou d'un avion ?",["Le point d'application du poids de l'avion","Le point où s'appliquent les variations de portance, fixe quand l'incidence varie","Le point d'application de la résultante aérodynamique, qui se déplace avec l'incidence","Le point du profil où l'épaisseur est maximale"],1,"Au foyer s'appliquent les variations de portance : le moment par rapport à ce point ne change pas avec l'incidence. Il se situe vers 25 % de la corde pour un profil. Le centre de poussée, lui, se déplace avec l'incidence ; le poids s'applique au centre de gravité."],["u6s5q10","Au décollage, un avion dont l'hélice tourne dans le sens horaire vue du poste de pilotage tend à partir à gauche. Laquelle de ces causes contribue à ce lacet ?",["Le souffle hélicoïdal, qui frappe la dérive par la gauche","Le souffle hélicoïdal, qui frappe la dérive par la droite","Le lacet inverse dû aux ailerons","L'effet de sol, qui freine l'aile gauche"],0,"Le souffle de l'hélice s'enroule autour du fuselage et frappe la dérive par la gauche : la queue est poussée vers la droite, le nez part à gauche. Le facteur P et l'effet gyroscopique (train classique) s'y ajoutent ; on contre au palonnier droit."],["u6s5q11","Dans quelle situation le facteur P (dissymétrie de traction de l'hélice) est-il le plus marqué ?",["En croisière rapide, à faible incidence","En descente, moteur réduit, à vitesse élevée","En montée à basse vitesse et pleine puissance","En palier à la vitesse maximale, plein gaz"],2,"À grande incidence, la pale descendante attaque l'air avec une incidence plus forte que la pale montante et tire davantage. L'effet est maximal à forte puissance et grande incidence : montée lente, roulage au décollage d'un train classique queue basse."],["u6s5q12","En courte finale, à une hauteur inférieure à une demi-envergure environ, quel est l'effet du sol sur l'avion ?",["Il augmente la traînée induite et fait chuter brutalement l'avion","Il ne concerne que les avions à aile haute","Il n'agit qu'au décollage, pas pendant l'atterrissage","Il réduit la traînée induite : l'avion peut flotter à l'arrondi"],3,"Près du sol, les tourbillons marginaux et la déviation de l'écoulement vers le bas sont gênés : la traînée induite diminue. Un avion trop rapide flotte à l'arrondi ; au décollage, il peut quitter le sol avant de pouvoir monter hors de l'effet de sol."]]}]},{"id":"u7","title":"Procédures opérationnelles","description":"Procédures normales et d'urgence, phénomènes dangereux en vol, sécurité, survie, sauvetage et réserves de carburant réglementaires pour conduire un vol VFR en sécurité (examen : 12 questions, 18 min).","skills":[{"id":"u7s1","title":"Procédures normales","icon":"✅","tips":"Les check-lists évitent les oublis, quelle que soit la charge de travail. La référence reste le manuel de vol (AFM/POH) de l'avion.\n• Au sol, on lit chaque item puis on l'exécute (« lire-faire ») ; en vol, on enchaîne souvent les actions de mémoire puis on vérifie avec la liste (« faire-vérifier »).\n• En urgence, les actions réflexes sont faites de mémoire, puis vérifiées avec la check-list.\n\nBriefing passagers (Part-NCO) : le commandant de bord s'assure qu'avant le vol, ou pendant si nécessaire, les passagers sont informés des procédures d'urgence et de l'utilisation des équipements de secours. En pratique : ceintures, ouverture des portes, position de sécurité, extincteur, gilets s'ils sont emportés, sans oublier de ne pas toucher aux commandes.\n\nTour de piste : sauf indication contraire (carte VAC, ATC), tous les virages se font à gauche (SERA). Branches : montée initiale, vent traversier, vent arrière (parallèle à la piste, en sens inverse de l'atterrissage), étape de base, finale. La hauteur du circuit figure sur la carte VAC.\n\nVent de travers : composante traversière = vent × sin(angle vent/piste).\n• 30° → 0,5 ; 45° → 0,7 ; 60° → 0,9 ; 90° → 1.\n• Respecter la composante maximale démontrée du manuel de vol.\n• Décollage : ailerons braqués côté vent, braquage réduit quand la vitesse augmente ; axe tenu aux palonniers.\n• Atterrissage : approche en crabe puis décrabage avant le toucher, ou aile basse côté vent avec pied opposé.\n\nTurbulence de sillage : les tourbillons marginaux, issus de la portance, sont les plus forts derrière un avion lourd, lent et en configuration lisse. Ils descendent derrière lui et, près du sol, s'écartent latéralement ; un vent traversier faible peut en maintenir un sur la piste.\n• Catégories OACI (masse maximale au décollage) : L jusqu'à 7 000 kg ; M de plus de 7 000 kg à moins de 136 000 kg ; H à partir de 136 000 kg ; J (super) : A380.\n• Minimums OACI au départ : 2 min pour un L ou un M derrière un H, ou un L derrière un M ; 3 min en décollant d'une intersection.\n• Rester au-dessus de la trajectoire de l'avion lourd : décoller avant son point de rotation, se poser au-delà de son point de toucher.\n\nPistes contaminées (eau stagnante, neige fondante, neige, glace) : au décollage, le contaminant freine l'accélération et allonge la distance ; à l'atterrissage, le freinage est dégradé. Hydroplanage dynamique possible au-delà de V ≈ 9 √P (V en kt, P pression des pneus en psi).\n\nRemise de gaz : décision précoce dès que l'approche n'est pas stabilisée. Pleine puissance (réchauffage carburateur coupé selon le manuel), assiette de montée en contrant la tendance à cabrer et le lacet, volets rentrés par étapes selon le manuel (jamais tous d'un coup près du sol), puis annonce radio.","vocab":[["Check-list","Liste d'actions et de vérifications propre à chaque phase du vol"],["Actions réflexes","Premières actions d'urgence faites de mémoire, puis vérifiées"],["Vent arrière","Branche du circuit parallèle à la piste, sens inverse d'atterrissage"],["Composante traversière","Part du vent perpendiculaire à la piste : vent × sin(angle)"],["Turbulence de sillage","Tourbillons marginaux laissés par un avion, surtout lourd et lent"],["Hydroplanage","Pneu soulevé par un film d'eau : freinage et guidage quasi nuls"],["Approche stabilisée","Trajectoire, vitesse et configuration établies et stables en finale"],["Remise de gaz","Approche interrompue : pleine puissance, montée, nouveau circuit"]],"questions":[["u7s1q01","Une urgence survient en vol. Comment utilise-t-on la check-list d'urgence ?",["On lit d'abord toute la check-list avant d'entreprendre la moindre action","On effectue de mémoire les actions réflexes, puis on les vérifie avec la check-list","On applique la check-list normale en sautant les items qui ne s'appliquent pas","On ne s'en sert pas en vol : elle sert à analyser l'incident une fois au sol"],1,"Les premières actions vitales sont apprises par cœur, car le temps manque. La check-list du manuel de vol sert ensuite à vérifier qu'aucune action n'a été oubliée et à compléter la procédure."],["u7s1q02","Selon le Part-NCO, qui doit s'assurer que les passagers reçoivent un briefing sur les procédures et les équipements de secours ?",["L'exploitant de l'aérodrome de départ","Chaque passager, en lisant la notice placée à bord","Le service d'information de vol, lors du dépôt du plan de vol","Le commandant de bord, avant le vol ou pendant si nécessaire"],3,"Le Part-NCO charge le commandant de bord de veiller à ce que, avant le vol ou, si nécessaire, pendant le vol, les passagers soient informés des procédures d'urgence et de l'utilisation des équipements de secours (ceintures, portes, extincteur, gilets…)."],["u7s1q03","Sauf indication contraire de la carte VAC ou instruction du contrôle, dans quel sens s'effectue le tour de piste ?",["Main gauche : tous les virages se font à gauche","Main droite : tous les virages se font à droite","Du côté opposé au vent dominant de l'aérodrome","Du côté de la piste où se trouvent les installations"],0,"Les règles de l'air (SERA) prévoient que, sauf indication contraire ou instruction ATC, tous les virages se font à gauche à l'approche et après le décollage. Les circuits main droite sont publiés sur la carte VAC."],["u7s1q04","Vous effectuez un tour de piste main gauche pour la piste 27, vent calme. Quel est le cap approximatif en vent arrière ?",["270°","180°","090°","360°"],2,"La branche vent arrière est parallèle à la piste, en sens inverse de l'atterrissage : 270° − 180° = 090°. Le cap 180° correspond à la branche vent traversier de ce circuit main gauche."],["u7s1q05","Piste 27, la tour annonce un vent du 300° pour 16 kt. Quelle est la composante de vent traversier ?",["16 kt","8 kt","14 kt","11 kt"],1,"Écart vent/piste : 300° − 270° = 30°. Composante traversière = 16 × sin 30° = 16 × 0,5 = 8 kt (la composante de face vaut 16 × cos 30° ≈ 14 kt)."],["u7s1q06","Au début du roulement au décollage, le vent de travers vient de la gauche. Comment positionner le manche en roulis ?",["Braqué à gauche, côté vent, puis réduit à mesure que la vitesse augmente","Braqué à droite, à l'opposé du vent, pour soulager l'aile gauche au vent","Au neutre : au sol, le palonnier suffit à corriger l'effet du vent de travers","Braqué à gauche, en augmentant le braquage à mesure que la vitesse augmente"],0,"Ailerons braqués côté vent, l'aile au vent ne peut pas être soulevée. Leur efficacité croissant avec la vitesse, on réduit le braquage pendant l'accélération (l'augmenter ferait au contraire incliner l'avion) ; l'axe est tenu aux palonniers."],["u7s1q07","Dans quelle situation un avion génère-t-il la turbulence de sillage la plus forte ?",["Lourd, rapide, volets sortis","Léger, lent, volets sortis","Léger, rapide, configuration lisse","Lourd, lent, configuration lisse"],3,"Les tourbillons marginaux naissent de la portance : ils sont d'autant plus intenses que l'avion est lourd et vole lentement, donc à grande incidence. La configuration lisse donne les tourbillons les plus concentrés (« heavy, clean, slow »)."],["u7s1q08","Selon la classification OACI de turbulence de sillage, à quelle catégorie appartient un avion de ligne dont la masse maximale au décollage est de 78 000 kg ?",["L (léger)","H (lourd)","M (moyen)","J (super)"],2,"Catégories OACI : L jusqu'à 7 000 kg ; M de plus de 7 000 kg à moins de 136 000 kg ; H à partir de 136 000 kg ; J pour l'A380. Un avion de 78 t est donc de catégorie M."],["u7s1q09","Vous êtes en finale derrière un avion lourd qui vient de se poser sur la même piste. Comment éviter sa turbulence de sillage ?",["Viser un point d'aboutissement avant son point de toucher, pour garder plus de piste","Rester au-dessus de sa trajectoire et se poser au-delà de son point de toucher","Se placer sous sa trajectoire, où l'air a été stabilisé par son passage","Se poser exactement à son point de toucher, où les tourbillons ont été détruits"],1,"Les tourbillons, produits tant que l'avion porte, descendent sous sa trajectoire et cessent au toucher. En restant au-dessus et en se posant plus loin (si la longueur de piste le permet), on les évite. Au départ, on décolle avant son point de rotation."],["u7s1q10","Quel est l'effet d'une couche de neige fondante sur la piste au décollage ?",["La distance de décollage augmente, car le contaminant freine l'accélération","La distance de décollage diminue, car les roues frottent moins sur la piste","Elle n'affecte que l'atterrissage, en dégradant le freinage","Elle impose une vitesse de rotation plus faible pour quitter le sol plus tôt"],0,"Eau stagnante et neige fondante freinent les roues (résistance du contaminant, projections) : l'accélération diminue et la distance de décollage s'allonge. À l'atterrissage, c'est le freinage qui est dégradé."],["u7s1q11","D'après la formule approchée V ≈ 9 √P (V en kt, P en psi), à partir de quelle vitesse un avion dont les pneus sont gonflés à 36 psi risque-t-il l'hydroplanage dynamique ?",["36 kt","60 kt","45 kt","54 kt"],3,"√36 = 6, donc V ≈ 9 × 6 = 54 kt. Au-delà, sur une piste couverte d'eau, le pneu peut se soulever sur un film d'eau : freinage et contrôle directionnel deviennent presque nuls."],["u7s1q12","En courte finale, volets complètement sortis, vous décidez de remettre les gaz. Quelle séquence est correcte ?",["Rentrer d'abord tous les volets, puis afficher la pleine puissance","Afficher la pleine puissance et laisser l'avion cabrer sous l'effet du compensateur","Pleine puissance, assiette de montée tenue, puis volets rentrés par étapes","Garder la puissance d'approche et rentrer les volets pour accélérer avant de monter"],2,"La puissance d'abord, en tenant l'assiette : compensé pour l'approche, l'avion tend à cabrer fortement, et le lacet doit être contré. Rentrer tous les volets d'un coup près du sol ferait perdre de la portance : on les rentre par étapes, selon le manuel de vol, en surveillant la vitesse."]]},{"id":"u7s2","title":"Procédures d'urgence","icon":"🔥","tips":"Règle d'or : piloter, naviguer, communiquer. On tient d'abord l'avion et sa vitesse, puis on applique les actions réflexes et la check-list du manuel de vol, seule référence pour un avion donné.\n\nPanne moteur au décollage :\n• Rendre la main immédiatement : en montée, la vitesse chute en quelques secondes. Afficher la vitesse de plané.\n• À basse hauteur, se poser à peu près droit devant, en ne s'écartant que modérément de l'axe pour éviter les obstacles.\n• Ne pas faire demi-tour : en virage, le facteur de charge augmente la vitesse de décrochage et le taux de chute ; il faut bien plus de 180° pour rejoindre l'axe et l'on arriverait vent arrière. Risque de décrochage-vrille.\n• S'il reste du temps : carburant, magnétos et contact général coupés selon le manuel, portes déverrouillées, MAYDAY.\n\nPanne moteur en vol, atterrissage forcé :\n• Vitesse de plané, avion compensé, choix d'un terrain atteignable : face au vent, assez long, plat ou en légère montée, surface ferme, sans obstacle en approche (lignes électriques). Champ labouré : se poser le long des sillons.\n• Si la hauteur le permet, rechercher la cause : réchauffage carburateur, sélecteur de réservoir, pompe électrique, mélange, magnétos.\n• Distance de plané en air calme = hauteur × finesse (1 000 m × 8 = 8 km). Le vent de face la réduit, le vent arrière l'augmente.\n\nFeu moteur en vol : couper l'arrivée de carburant (robinet fermé, mélange sur étouffoir), fermer le chauffage cabine (son air est réchauffé autour de l'échappement), couper l'électricité selon le manuel et effectuer un atterrissage forcé. Ne jamais redémarrer un moteur qui a pris feu.\n\nFeu électrique, fumée : odeur d'isolant brûlé. Couper le contact général, fermer le chauffage, utiliser l'extincteur si nécessaire puis aérer, se poser dès que possible. Ne pas réarmer un disjoncteur qui a sauté pendant un feu.\n\nMonoxyde de carbone (fuite d'échappement dans le chauffage) : maux de tête, somnolence. Fermer le chauffage, ouvrir les aérations, se poser.\n\nPanne d'alternateur : voyant allumé, ampèremètre en décharge. Vérifier interrupteur et disjoncteur (un seul réarmement), délester les équipements non essentiels et écourter le vol : la batterie seule ne tient qu'un temps limité. Le moteur continue de tourner, car les magnétos sont indépendantes du circuit électrique.\n\nOuverture de porte en vol : bruyante mais rarement dangereuse. Piloter d'abord, réduire la vitesse, ne pas tenter de refermer si le manuel ne le prévoit pas, revenir se poser.\n\nDétresse : MAYDAY sur la fréquence en cours ou sur 121,5 MHz, transpondeur 7700.","vocab":[["Finesse","Rapport distance parcourue / hauteur perdue en vol plané"],["Vitesse de finesse max","Vitesse donnant la plus grande distance de plané en air calme"],["Atterrissage forcé","Atterrissage imposé par une panne, souvent hors aérodrome"],["Étouffoir","Position du mélange qui coupe l'essence et arrête le moteur"],["Contact général","Interrupteur qui coupe batterie et alternateur du circuit de bord"],["Magnéto","Générateur autonome du courant d'allumage, entraîné par le moteur"],["Délestage","Coupure des équipements électriques non essentiels"],["MAYDAY","Message de détresse : danger grave et imminent, aide immédiate"]],"questions":[["u7s2q01","Le moteur s'arrête en montée initiale, à 300 ft au-dessus de la piste. Quelle est la toute première action ?",["Virer de 180° pour revenir se poser sur la piste","Actionner le démarreur pour tenter de relancer le moteur","Rendre la main pour conserver la vitesse de plané","Lancer un message MAYDAY avant toute autre action"],2,"En montée, l'assiette est forte : sans traction, la vitesse chute en quelques secondes. Il faut d'abord baisser le nez pour garder la vitesse de plané et éviter le décrochage ; le choix du terrain, les actions moteur et le message viennent ensuite."],["u7s2q02","Pourquoi ne faut-il pas tenter de revenir vers la piste après une panne moteur à basse hauteur ?",["Le virage accroît le taux de chute et la vitesse de décrochage ; on arriverait vent arrière","La réglementation interdit tout virage à moins de 500 ft au-dessus de la piste","Sans moteur, les ailerons perdent leur efficacité et l'avion ne peut plus virer","Le virage réduit la vitesse de décrochage, ce qui incite à voler beaucoup trop lentement"],0,"Ce n'est pas une interdiction réglementaire : en virage, le facteur de charge augmente (et non réduit) la vitesse de décrochage et la perte de hauteur ; rejoindre l'axe demande bien plus de 180° et l'on se poserait vent arrière. Se poser à peu près droit devant est la solution la plus sûre."],["u7s2q03","La finesse de votre avion est de 10. Le moteur s'arrête à 900 m au-dessus du sol, en air calme. Quelle distance maximale pouvez-vous parcourir en plané ?",["4,5 km","18 km","9 km","0,9 km"],2,"Distance de plané = hauteur × finesse = 900 m × 10 = 9 000 m, soit 9 km en air calme, à la vitesse de finesse max. Le vent de face la réduit, le vent arrière l'augmente."],["u7s2q04","Pour un atterrissage forcé, vous hésitez entre plusieurs champs atteignables et assez longs. Lequel choisir ?",["Un champ en pente descendante dans le sens de l'atterrissage, face au vent","Un champ moissonné, plat, abordable face au vent, sans obstacle en approche","Un champ de maïs haut et plat, abordable vent arrière","Une prairie plate, abordable vent de travers, avec une ligne électrique en finale"],1,"On recherche un terrain plat ou légèrement montant, à surface ferme et dégagée, abordable face au vent (vitesse sol et distance d'arrêt réduites) et sans obstacle sur la trajectoire d'approche."],["u7s2q05","Lors d'un feu moteur en vol, pourquoi ferme-t-on le chauffage cabine ?",["Pour réserver toute l'énergie électrique à la radio et au transpondeur","Son circuit renvoie de l'air chaud vers le moteur, ce qui attiserait le feu","Pour éviter le givrage du carburateur pendant la descente vers le terrain choisi","Son air, réchauffé autour de l'échappement, amènerait fumées et flammes en ca
