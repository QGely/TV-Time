bine"],3,"Sur la plupart des avions légers, l'air de chauffage est réchauffé par un échangeur autour du pot d'échappement, dans le compartiment moteur. En cas de feu, il ferait entrer fumées et gaz toxiques dans la cabine."],["u7s2q06","Un feu moteur se déclare en croisière. Quel est le principe général de la procédure, à appliquer selon le manuel de vol ?",["Couper le carburant, fermer le chauffage, préparer un atterrissage forcé sans redémarrer","Enrichir le mélange et augmenter la puissance pour chasser les flammes vers l'arrière","Couper puis rallumer les magnétos pour relancer le moteur une fois le feu éteint","Ouvrir le chauffage cabine pour évacuer la fumée du compartiment moteur"],0,"On prive le feu de carburant (robinet fermé, mélange sur étouffoir), on protège la cabine et on se pose au plus vite. On ne redémarre jamais un moteur qui a pris feu."],["u7s2q07","Une odeur d'isolant brûlé et de la fumée apparaissent derrière le tableau de bord. Quelle est la première mesure générale ?",["Ouvrir le chauffage cabine pour dissiper la fumée","Couper le contact général (batterie et alternateur)","Couper les magnétos pour arrêter le moteur","Réarmer les disjoncteurs qui ont sauté"],1,"L'odeur d'isolant signe un feu électrique : couper l'alimentation supprime la source d'échauffement. On utilise l'extincteur si nécessaire, on aère une fois le feu éteint et on se pose dès que possible. Un disjoncteur sauté lors d'un feu ne se réarme pas."],["u7s2q08","En hiver, chauffage cabine ouvert, vous ressentez maux de tête et somnolence. Que suspecter et que faire ?",["Le mal des transports : fixer l'horizon et poursuivre le vol","Un givrage carburateur : tirer le réchauffage et poursuivre","Une simple fatigue : augmenter le chauffage pour rester éveillé","Du monoxyde de carbone : fermer le chauffage, aérer et se poser"],3,"Une fuite de l'échappement dans l'échangeur du chauffage peut introduire du monoxyde de carbone, gaz incolore et inodore. On ferme le chauffage, on ventile à l'air frais et on se pose au plus vite ; un détecteur de CO aide à le repérer."],["u7s2q09","Sur un avion léger classique à moteur à pistons, l'alternateur tombe en panne. Pourquoi le moteur continue-t-il de tourner ?",["Parce que la batterie prend le relais et alimente directement les bougies","Parce qu'un alternateur de secours, entraîné par l'hélice, prend le relais","Parce que l'allumage vient des magnétos, indépendantes du circuit électrique","Parce que le moteur ne s'arrêtera qu'une fois la batterie entièrement déchargée"],2,"Les magnétos, entraînées par le moteur, produisent elles-mêmes le courant d'allumage. La panne d'alternateur prive seulement l'avion de recharge : la batterie alimente les équipements électriques pour un temps limité."],["u7s2q10","La panne d'alternateur est confirmée, le réarmement du disjoncteur est resté sans effet. Quelle est la conduite à tenir ?",["Délester les équipements non essentiels et écourter le vol","Poursuivre le vol prévu sans changement, la batterie suffisant","Allumer tous les équipements pour vérifier lesquels fonctionnent encore","Réarmer le disjoncteur à intervalles réguliers jusqu'à l'arrivée"],0,"La batterie seule ne tient qu'un temps limité. On garde l'indispensable (radio, transpondeur), on anticipe la perte des équipements électriques (volets, jauges, éclairage) et on se pose dès que possible, selon le manuel de vol."],["u7s2q11","Juste après le décollage, la porte passager s'entrouvre. Quelle est la conduite à tenir ?",["Lâcher les commandes un instant pour la claquer à deux mains, puis poursuivre","Accélérer au maximum pour que le flux d'air plaque la porte contre le fuselage","Couper le moteur et se poser droit devant, dans le premier champ venu","Piloter d'abord, faire un tour de piste et se poser pour la refermer au sol"],3,"Une porte ouverte est surtout bruyante : l'avion reste pilotable. Le vrai danger est la distraction ; on pilote d'abord, on réduit la vitesse selon le manuel et on revient se poser pour la refermer au sol."],["u7s2q12","En croisière, le régime baisse puis le moteur devient irrégulier. Quelles vérifications font partie des actions habituelles avant d'envisager un atterrissage forcé ?",["Couper la pompe électrique et appauvrir le mélange au maximum","Réchauffage carburateur, sélecteur de réservoir, mélange et magnétos","Réduire au ralenti, puis couper le contact général et les magnétos","Ouvrir le chauffage cabine, sortir les volets et réduire les gaz"],1,"Les causes les plus fréquentes sont le givrage carburateur et un problème d'alimentation (réservoir vide, sélecteur mal placé, mélange). La check-list du manuel prévoit typiquement : réchauffage, changement de réservoir, pompe électrique, mélange, essai des magnétos."]]},{"id":"u7s3","title":"Phénomènes et risques en vol","icon":"🌩️","tips":"Cisaillement de vent : variation brutale du vent en force ou en direction sur une courte distance (orage, front, relief, obstacles près de la piste). Par inertie, l'avion garde d'abord sa vitesse sol :\n• perte de vent de face : la vitesse indiquée chute, l'avion s'enfonce sous le plan ;\n• hausse du vent de face : la vitesse indiquée augmente, l'avion passe au-dessus du plan.\nUne microrafale (courant descendant sous un orage) donne successivement vent de face, descendance puis vent arrière. Réaction : pleine puissance et remise de gaz.\n\nGivrage cellule : en nuage ou dans les précipitations à température négative (eau surfondue), la pluie verglaçante étant la plus dangereuse. Le givre augmente masse et traînée, déforme le profil et élève la vitesse de décrochage. Un avion non certifié pour le givrage doit quitter ces conditions sans attendre (demi-tour, changement d'altitude).\n\nGivrage carburateur : la détente dans le venturi et l'évaporation de l'essence peuvent refroidir l'air de 30 °C environ. Risque par air humide, d'environ −10 °C à +30 °C, maximal à puissance réduite.\n• Symptômes (hélice à pas fixe) : baisse de régime, puis moteur irrégulier.\n• Réchauffage : tout ou rien. Le régime baisse (air chaud moins dense), puis remonte s'il y avait de la glace.\n• L'appliquer avant de réduire pour une descente prolongée. Air chaud non filtré : l'éviter au roulage sur sol poussiéreux.\n\nOrages : turbulence, grêle, foudre, givrage, cisaillement. Les contourner très largement, ne passer ni sous la base (rafales descendantes) ni sous l'enclume (grêle). Ne pas décoller ni atterrir à l'approche d'un orage (front de rafales).\n\nPerte de références visuelles : la désorientation spatiale s'installe vite. Passer sur les instruments, ailes à plat, puis demi-tour au taux standard (3°/s, soit 1 min pour 180°) à inclinaison modérée vers la zone VMC quittée. Ne pas descendre sous l'altitude de sécurité ; demander l'aide de l'ATC.\n\nVol au-dessus de l'eau : voler haut pour rester en distance de plané d'une côte, choisir la traversée la plus courte, emporter les gilets. L'horizon peut disparaître dans la brume et la hauteur est difficile à estimer au-dessus d'une mer calme.\n\nVol en montagne (notions) : franchir les crêtes avec une marge de hauteur et sous 45° environ, pour pouvoir s'en écarter ; se méfier du côté sous le vent (descendances, rotors) ; voler sur un côté de la vallée pour garder la place d'un demi-tour ; performances réduites par l'altitude-densité.\n\nOiseaux : collisions surtout à basse hauteur, près des aérodromes, à l'aube, au crépuscule et en période de migration. L'énergie de l'impact est proportionnelle au carré de la vitesse : à vitesse double, énergie × 4. Consulter les NOTAM et déclarer toute collision.","vocab":[["Cisaillement de vent","Variation brutale du vent en force ou direction sur peu de distance"],["Microrafale","Violent courant descendant sous un orage, qui diverge près du sol"],["Eau surfondue","Eau restée liquide sous 0 °C, qui gèle au contact de l'avion"],["Pluie verglaçante","Pluie surfondue qui gèle à l'impact : givrage très rapide"],["Réchauffage carburateur","Air chauffé par l'échappement admis au carburateur contre la glace"],["Taux standard","Virage à 3°/s : 180° en 1 min, 360° en 2 min"],["Désorientation spatiale","Perception fausse de l'attitude de l'avion sans références"],["Côté sous le vent","Versant abrité du vent, siège de descendances et de rotors"]],"questions":[["u7s3q01","En finale, le vent de face diminue brusquement. Quel est l'effet immédiat sur l'avion ?",["La vitesse indiquée augmente et l'avion passe au-dessus du plan","La vitesse indiquée reste constante, seule la vitesse sol varie","La vitesse sol diminue aussitôt, sans effet sur la vitesse indiquée","La vitesse indiquée diminue et l'avion s'enfonce sous le plan"],3,"Par inertie, l'avion conserve d'abord sa vitesse sol : si le vent de face diminue, sa vitesse par rapport à l'air chute, la portance baisse et il passe sous le plan. Il faut ajouter de la puissance, voire remettre les gaz."],["u7s3q02","En approche, vous traversez une microrafale sous un cumulonimbus. Dans quel ordre en subissez-vous les effets ?",["Vent arrière, puis courant descendant, puis vent de face","Courant ascendant, puis vent de face, puis vent arrière","Vent de face, puis courant descendant, puis vent arrière","Courant descendant seul, sans variation du vent horizontal"],2,"L'air descendant s'étale au sol en divergeant : un vent de face améliore d'abord les performances et peut tromper le pilote, puis viennent la descendance et un vent arrière qui fait chuter la vitesse près du sol. Si l'on est pris, remise de gaz immédiate à pleine puissance."],["u7s3q03","Dans quelles conditions le risque de givrage carburateur est-il le plus élevé ?",["Air sec à −20 °C, pleine puissance en montée","Air humide à +15 °C, puissance réduite en descente","Air sec à +30 °C, puissance de croisière","Air sec à −5 °C, pleine puissance au décollage"],1,"La détente dans le venturi et l'évaporation de l'essence peuvent refroidir l'air d'environ 30 °C : la glace se forme par air humide, même par température extérieure positive, surtout papillon presque fermé."],["u7s3q04","Hélice à pas fixe, en croisière : vous tirez le réchauffage carburateur. Le régime baisse, puis remonte progressivement. Qu'en concluez-vous ?",["De la glace s'était formée et elle est en train de fondre","Il n'y avait pas de glace : seule la densité de l'air a changé","Le réchauffage est défectueux et doit être repoussé aussitôt","Le mélange était trop riche et le réchauffage l'a appauvri"],0,"L'air chaud, moins dense, enrichit le mélange et fait baisser le régime. Si celui-ci remonte ensuite, c'est que la glace fond et libère le passage ; sans glace, le régime baisse puis reste stable."],["u7s3q05","Sauf indication contraire du manuel de vol, comment utilise-t-on le réchauffage carburateur ?",["En position intermédiaire, en permanence pendant tout le vol","Uniquement au sol, lors des essais moteur","À fond, et avant de réduire la puissance pour une descente prolongée","Seulement après l'arrêt du moteur, pour faciliter son redémarrage"],2,"Un réchauffage partiel peut amener l'air dans la plage la plus givrante : on l'utilise à fond. Le risque étant maximal à faible puissance, on l'applique avant la réduction, quand le moteur fournit encore assez de chaleur."],["u7s3q06","Pourquoi le givrage de la cellule est-il dangereux pour un avion léger ?",["Il épaissit le profil, ce qui augmente la portance mais aussi la traînée","Il alourdit l'avion, mais la vitesse de décrochage reste celle du manuel de vol","Il réduit surtout la traction de l'hélice, la portance de l'aile restant intacte","Il alourdit l'avion, augmente la traînée et élève la vitesse de décrochage"],3,"Quelques millimètres de givre déforment le profil et dégradent fortement la portance, alors que masse et traînée augmentent : la vitesse de décrochage s'élève au-dessus des valeurs du manuel de vol. Un avion non certifié pour le givrage doit quitter ces conditions sans attendre."],["u7s3q07","Vous devez traverser un bras de mer à bord d'un monomoteur. Quelle mesure améliore le plus votre sécurité ?",["Voler bas pour mieux surveiller la surface de l'eau","Voler plus haut pour réduire la portion du trajet hors de plané d'une côte","Suivre la route directe, même si elle allonge le trajet au-dessus de l'eau","Réduire la puissance au minimum pour économiser le carburant"],1,"La hauteur, c'est de la distance de plané : plus on vole haut, plus courte est la portion de trajet hors de portée d'une côte. On choisit aussi la traversée la plus courte et on emporte gilets et moyens de signalisation."],["u7s3q08","Comment un pilote VFR doit-il éviter un cumulonimbus isolé ?",["En le contournant très largement, sans passer sous sa base ni sous son enclume","En passant sous sa base, où la visibilité reste souvent bonne hors averses","En passant sous l'enclume, à l'écart des précipitations du cœur de l'orage","En le traversant par le plus court chemin, à la vitesse maximale autorisée"],0,"Sous la base règnent rafales descendantes et cisaillement ; de la grêle peut tomber de l'enclume, loin du cœur de l'orage. Turbulence, foudre et givrage complètent les dangers : seul un large contournement est sûr."],["u7s3q09","En VFR, vous entrez par inadvertance dans un nuage. Quelle est la conduite recommandée ?",["Réduire, puis descendre rapidement pour retrouver au plus vite la vue du sol","Passer aux instruments, ailes à plat, puis faire demi-tour à inclinaison modérée","Virer serré, à forte inclinaison, pour ressortir du nuage au plus vite","Poursuivre tout droit en montée jusqu'à sortir au-dessus de la couche"],1,"Sans références extérieures, l'oreille interne trompe rapidement le pilote. On fait confiance aux instruments, on stabilise l'avion puis on vire de 180° au taux standard ou moins pour retrouver les conditions VMC quittées, sans descendre sous l'altitude de sécurité."],["u7s3q10","Pour contourner une averse, vous virez par la gauche du cap 030° au cap 300°, au taux standard (3° par seconde). Combien de temps dure le virage ?",["1 min 30 s","1 min","2 min","30 s"],3,"Par la gauche, de 030° à 300° : 30° jusqu'au 360°, puis 60°, soit 90° au total. Durée = 90° ÷ 3°/s = 30 s ; par la droite, il aurait fallu virer de 270°, soit 1 min 30 s."],["u7s3q11","Le vent souffle perpendiculairement à une crête que vous devez franchir. Quelle technique est recommandée ?",["Aborder la crête à environ 45°, avec une marge de hauteur, pour pouvoir s'en écarter","Aborder la crête perpendiculairement, au ras du sommet, pour la franchir au plus vite","Longer la crête du côté sous le vent, où l'air est plus calme","Franchir la crête en descente pour prendre de la vitesse"],0,"Côté sous le vent, les descendances et les rotors peuvent dépasser les capacités de montée d'un avion léger. Un abord oblique avec de la marge permet de s'écarter vers la vallée sans avoir à virer face au relief."],["u7s3q12","Vous volez à vitesse double. Par combien est multipliée l'énergie d'une éventuelle collision avec un oiseau ?",["Par 2","Par 3","Par 4","Par 8"],2,"L'énergie cinétique vaut ½ m v² : elle est proportionnelle au carré de la vitesse. Doubler la vitesse multiplie l'énergie de l'impact par 2² = 4 ; réduire la vitesse dans une zone à oiseaux limite les dégâts."]]},{"id":"u7s4","title":"Sécurité, survie et sauvetage","icon":"🛟","tips":"Balise de détresse (ELT) : déclenchement automatique au choc, ou manuel.\n• 406 MHz : signal numérique capté par les satellites Cospas-Sarsat ; il contient l'identité de la balise (enregistrée) et souvent sa position GNSS.\n• 121,5 MHz : signal de radioralliement sur lequel se guident les moyens de recherche. Les satellites ne le traitent plus depuis 2009.\n• Part-NCO : ELT et balises personnelles (PLB) émettent simultanément sur 121,5 et 406 MHz ; un avion certifié pour 6 sièges passagers au plus peut se contenter d'une ELT de survie ou d'une PLB portée par un occupant.\n• Déclenchement intempestif : prévenir l'ATC. Après un atterrissage dur, écouter le 121,5 MHz.\n\nRecherche et sauvetage (SAR) : phases INCERFA (incertitude), ALERFA (alerte), DETRESFA (détresse). La phase d'incertitude est déclarée notamment si un aéronef n'arrive pas dans les 30 min suivant sa dernière heure d'arrivée prévue. Avec un plan de vol, faire un compte rendu d'arrivée ; sans organisme ATS sur place, le transmettre au plus vite à l'organisme le plus proche.\n\nSurvie : rester près de l'avion, plus visible qu'une personne isolée. Signaux sol-air : V = besoin d'assistance ; X = besoin d'assistance médicale ; N = non ; Y = oui ; flèche = direction suivie. Au-dessus des zones où le SAR serait difficile, emporter des moyens de signalisation (fusées, miroir) et de survie (eau, couverture).\n\nAmerrissage : portes déverrouillées avant l'impact, ceintures serrées, train escamotable rentré ; toucher à la vitesse la plus faible possible, assiette cabrée, parallèlement à la houle si elle est forte. Le gilet s'enfile avant, mais ne se gonfle qu'une fois sorti de l'avion. Part-NCO : gilet pour chaque occupant d'un monomoteur terrestre survolant l'eau au-delà de la distance de plané de la terre, ou si la trajectoire de décollage ou d'approche rend un amerrissage probable.\n\nCarburant VFR (Part-NCO, NCO.OP.125 et AMC1 NCO.OP.125(b), avions) : de quoi rejoindre la destination en conservant une réserve finale d'au moins 30 min de vol de jour et 45 min de nuit, en vitesse d'attente à 1 500 ft au-dessus de la destination (10 min à la puissance maximale de croisière continue pour un vol local de jour : décollage et atterrissage au même aérodrome, en restant en vue de celui-ci). Cette réserve finale ne doit pas être entamée en exploitation normale. Ex. : 1 h 30 de vol de jour à 24 L/h → (1,5 + 0,5) × 24 = 48 L, plus roulage et carburant inutilisable (calculer la réserve avec la consommation de croisière va dans le sens de la sécurité).\n\nÉvacuation : couper carburant et contact général, évacuer sans délai, emporter si possible l'équipement de survie et s'éloigner en remontant le vent.\n\nExtincteurs, classes de feu :\n• A : solides formant des braises (bois, papier, tissus) ;\n• B : liquides ou solides liquéfiables (essence, huile) ;\n• C : gaz ; D : métaux ; F : huiles de cuisson.\n• Feu électrique : agent non conducteur (halon ou substitut, CO₂). Jamais de jet d'eau sur un feu électrique ni sur un feu d'essence. Viser la base des flammes, puis aérer la cabine.","vocab":[["ELT","Balise de détresse d'aéronef, émettant sur 406 et 121,5 MHz"],["PLB","Balise de détresse personnelle, portée par une personne"],["Cospas-Sarsat","Système satellitaire international de détection des balises"],["Radioralliement","Guidage des secours vers la balise grâce à son signal 121,5 MHz"],["SAR","Search And Rescue : recherche et sauvetage"],["INCERFA / ALERFA / DETRESFA","Phases d'urgence successives : incertitude, alerte, détresse"],["Réserve finale (VFR)","Avion, Part-NCO : 30 min de jour, 45 min de nuit (attente, 1 500 ft)"],["Feu de classe B","Feu de liquides ou solides liquéfiables : essence, huile"]],"questions":[["u7s4q01","Quel est l'intérêt principal de l'émission d'une balise ELT sur 406 MHz ?",["Captée par les satellites Cospas-Sarsat, elle transmet l'identité codée de la balise","Elle permet au pilote de dialoguer en phonie avec les secours depuis l'épave","Elle est relayée sur la fréquence de travail des avions qui survolent la zone","Elle affiche la position de l'épave sur le radar du contrôleur, avec le code 7700"],0,"Le signal numérique sur 406 MHz est relayé par les satellites vers les centres de secours ; il contient l'identité de la balise, enregistrée, et souvent une position GNSS. Le 121,5 MHz sert au radioralliement final."],["u7s4q02","À quoi sert principalement l'émission simultanée de la balise sur 121,5 MHz ?",["À transmettre la position GNSS de l'épave aux satellites","Au radioralliement : les moyens de recherche se guident sur ce signal","À prévenir automatiquement le contrôleur de la fréquence en cours","À afficher automatiquement le code 7700 sur le transpondeur"],1,"Les satellites ne traitent plus le 121,5 MHz depuis 2009 : l'alerte vient du 406 MHz. Sur zone, avions et hélicoptères de recherche se dirigent ensuite sur le signal 121,5 MHz pour localiser précisément l'épave."],["u7s4q03","Un aéronef n'est pas arrivé dans les 30 minutes suivant sa dernière heure d'arrivée prévue, sans autre information. Que déclenchent les services de la circulation aérienne ?",["La phase de détresse (DETRESFA), avec envoi immédiat des secours","La phase d'alerte (ALERFA)","La phase d'incertitude (INCERFA)","Seulement un appel radio, une phase n'étant déclarée qu'après 1 heure de retard"],2,"Les trois phases successives sont INCERFA (incertitude), ALERFA (alerte) et DETRESFA (détresse). L'absence d'arrivée dans les 30 min qui suivent la dernière heure d'arrivée prévue déclenche la phase d'incertitude."],["u7s4q04","Vous avez déposé un plan de vol VFR et vous vous posez sur un aérodrome dépourvu d'organisme des services de la circulation aérienne (ATS). Que devez-vous faire ?",["Rien : le plan de vol se clôture automatiquement à l'heure d'arrivée prévue","Envoyer au plus vite un compte rendu d'arrivée à l'organisme ATS le plus proche","Clôturer le plan de vol plus tard, lors du dépôt de votre prochain plan de vol","Confier à votre aéroclub la clôture du plan de vol, à sa réouverture le lendemain"],1,"Les règles de l'air (SERA) imposent un compte rendu d'arrivée dès que possible après l'atterrissage. Sans organisme sur place, on le transmet par le moyen le plus rapide à l'organisme ATS le plus proche ; attendre le lendemain ou le prochain plan de vol risquerait de déclencher des recherches inutiles."],["u7s4q05","Après un atterrissage forcé, un occupant est blessé. Quel symbole tracer au sol pour demander une assistance médicale ?",["V","N","Y","X"],3,"Code visuel sol-air de l'OACI pour les survivants : V = besoin d'assistance, X = besoin d'assistance médicale, N = non, Y = oui, flèche = direction suivie. Les symboles doivent être grands et bien contrastés."],["u7s4q06","Après un atterrissage forcé en zone isolée, sans blessé grave, quelle est la meilleure décision en attendant les secours ?",["Rester près de l'avion et préparer les moyens de signalisation","Partir aussitôt à pied à la recherche d'une route","Couper la balise de détresse pour préserver sa batterie","Se disperser autour de l'épave pour être aperçus de plus loin"],0,"L'épave est bien plus visible du ciel qu'une personne isolée et la balise y guide les secours. On s'abrite, on prépare fusées, miroir ou signaux au sol, et on ne quitte l'avion que si y rester est dangereux."],["u7s4q07","Lors d'un amerrissage, à quel moment faut-il gonfler son gilet de sauvetage ?",["Avant l'impact, pour amortir le choc","Dès l'arrêt de l'avion, encore assis à son siège","Seulement une fois sorti de l'avion","Pendant la descente, dès que la décision d'amerrir est prise"],2,"Gonflé dans la cabine, le gilet gêne les mouvements et peut plaquer son porteur contre le plafond quand l'eau entre, empêchant l'évacuation. On l'enfile avant l'amerrissage, portes déverrouillées, mais on ne le gonfle qu'à l'extérieur."],["u7s4q08","Après un atterrissage forcé, un début d'incendie apparaît au moteur. Comment évacuer ?",["Rester attaché à son siège, portes fermées, jusqu'à l'arrivée des secours","Couper carburant et contact, évacuer et se regrouper sous le vent, près de l'aile","Couper carburant et contact général, évacuer et s'éloigner en remontant le vent","Tenter de redémarrer le moteur pour souffler les flammes avec l'hélice"],2,"On coupe ce qui alimente le feu (carburant, électricité), on évacue sans délai et on s'éloigne en remontant le vent : sous le vent de l'avion, on serait exposé aux flammes et aux fumées poussées par celui-ci."],["u7s4q09","Selon le Part-NCO, dans quel cas un monomoteur terrestre doit-il emporter un gilet de sauvetage pour chaque personne à bord ?",["Dès qu'il survole un plan d'eau, quelle que soit la distance de la rive","Uniquement lorsqu'il vole à plus de 100 NM des côtes","Uniquement lors d'un vol de nuit au-dessus de la mer","Lorsqu'il survole l'eau au-delà de la distance de plané de la terre"],3,"Le Part-NCO impose un gilet (ou un dispositif de flottaison pour un enfant de moins de 24 mois) par occupant d'un monomoteur terrestre survolant l'eau au-delà de la distance de plané de la terre, ou lorsque la trajectoire de décollage ou d'approche rend un amerrissage probable."],["u7s4q10","Vol VFR de jour de 1 h 20 jusqu'à destination, consommation 30 L/h (retenue aussi pour la réserve). Hors roulage et carburant inutilisable, quelle quantité minimale de carburant faut-il emporter selon le Part-NCO ?",["40 L","62,5 L","45 L","55 L"],3,"De jour, il faut conserver une réserve finale de 30 min (AMC1 NCO.OP.125(b) : en vitesse d'attente à 1 500 ft au-dessus de la destination ; la calculer avec la consommation de croisière va dans le sens de la sécurité) : 1 h 20 + 0 h 30 = 1 h 50, soit 110 min × 0,5 L/min = 55 L. Roulage et carburant inutilisable s'y ajoutent."],["u7s4q11","En avion, pour un vol VFR de nuit, quelle réserve finale minimale de carburant le Part-NCO prévoit-il à l'arrivée à destination ?",["45 minutes de vol en vitesse d'attente à 1 500 ft au-dessus de la destination","30 minutes de vol en vitesse d'attente à 1 500 ft au-dessus de la destination","60 minutes de vol en vitesse d'attente à 1 500 ft au-dessus de la destination","20 minutes de vol en vitesse d'attente à 1 500 ft au-dessus de la destination"],0,"Depuis le 30 octobre 2022 (règlement (UE) 2021/1296), le Part-NCO impose une réserve finale. Pour un avion en VFR, l'AMC1 NCO.OP.125(b) la fixe à 30 min de jour et 45 min de nuit, en vitesse d'attente à 1 500 ft au-dessus de la destination."],["u7s4q12","De l'essence répandue près de l'avion prend feu. À quelle classe de feu appartient ce feu ?",["Classe A","Classe B","Classe C","Classe D"],1,"Classe A : solides formant des braises (bois, papier, tissus) ; classe B : liquides ou solides liquéfiables (essence, huile) ; classe C : gaz ; classe D : métaux. L'eau en jet est à proscrire sur un feu d'hydrocarbure."]]}]},{"id":"u8","title":"Performances et préparation du vol","description":"Masse et centrage, performances au décollage et à l'atterrissage, montée, croisière et autonomie, puis préparation complète d'un vol VFR : météo, NOTAM, carburant, documents et gestion du risque (examen : 12 questions, 18 min).","skills":[{"id":"u8s1","title":"Masse et centrage","icon":"⚖️","tips":"La masse et le centrage conditionnent la sécurité : un avion trop lourd décolle long, monte mal et décroche à une vitesse plus élevée ; un avion mal centré peut devenir incontrôlable. Les limites figurent dans le manuel de vol, la masse à vide et son bras de levier dans la fiche de pesée.\n\nLes masses à connaître :\n• Masse à vide : avion équipé, avec le carburant inutilisable et les fluides prévus par la fiche de pesée (huile notamment).\n• Masse maximale au décollage (MTOM) : limite à ne jamais dépasser.\n• Masse maximale à l'atterrissage (MLM) : souvent égale à la MTOM sur un avion léger, parfois inférieure.\n• Charge utile = masse maximale au décollage − masse à vide : elle se partage entre occupants, bagages et carburant.\n\nCarburant : 1 litre d'AVGAS 100LL pèse environ 0,72 kg. Masse (kg) = volume (L) × 0,72 ; volume (L) = masse (kg) / 0,72. Exemple : 150 L = 108 kg.\n\nBras de levier et moment :\n• Le bras de levier d d'une masse est sa distance à une référence fixe choisie par le constructeur (par exemple la cloison pare-feu ou le bord d'attaque de l'aile).\n• Le moment vaut M = m × d (en kg·m).\n• Le centre de gravité se calcule par CG = ΣM / Σm : on additionne les moments de chaque élément (avion vide, occupants, bagages, carburant) et on divise par la masse totale.\n• Ajout d'une masse : on ajoute sa masse et son moment, puis on redivise.\n• Déplacement d'une masse m sur une distance Δd dans un avion de masse totale M : ΔCG = m × Δd / M.\n\nLes limites de centrage (avant et arrière) sont souvent présentées sous forme d'enveloppe sur un graphique masse/moment ou masse/CG : le point représentatif doit rester à l'intérieur.\n\nCentrage avant : avion plus stable mais lourd à cabrer ; l'empennage doit fournir plus de déportance, donc la vitesse de décrochage et la consommation augmentent légèrement. Au-delà de la limite avant, la profondeur peut manquer d'efficacité pour la rotation ou l'arrondi.\nCentrage arrière : commandes légères, stabilité réduite. Au-delà de la limite arrière, la stabilité en tangage devient insuffisante, voire nulle, et la sortie de décrochage ou de vrille peut devenir impossible : c'est le cas le plus dangereux.\n\nÉvolution en vol : la consommation de carburant diminue la masse et déplace le CG. Si le réservoir est en arrière du CG, le CG avance au fil du vol ; s'il est en avant, le CG recule. On vérifie donc le centrage au décollage ET à l'atterrissage (masse à l'atterrissage = masse au décollage − carburant consommé).","vocab":[["Masse à vide","Avion équipé, carburant inutilisable et fluides prévus compris"],["MTOM","Masse maximale au décollage, à ne jamais dépasser"],["MLM","Masse maximale à l'atterrissage"],["Charge utile","MTOM − masse à vide : occupants, bagages et carburant"],["Bras de levier","Distance d'une masse à la référence choisie par le constructeur"],["Moment","M = m × d, exprimé en kg·m"],["Centre de gravité (CG)","CG = ΣM / Σm, à maintenir entre les limites de centrage"],["Enveloppe de centrage","Zone du graphique masse/moment où l'avion doit se situer"]],"questions":[["u8s1q01","Dans le manuel de vol d'un avion léger, la charge utile désigne :",["la masse maximale au décollage moins la masse à vide, à répartir entre occupants, bagages et carburant","la masse maximale des passagers et des bagages, le carburant étant déjà compté dans la masse à vide","la différence entre la masse maximale au décollage et la masse maximale à l'atterrissage","la masse de l'avion avec le plein de carburant, avant l'embarquement des occupants et des bagages"],0,"Charge utile = masse maximale au décollage − masse à vide. Tout ce qu'on embarque (pilote, passagers, bagages et carburant utilisable) doit tenir dans cette charge utile."],["u8s1q02","Pour le calcul du centrage, le moment d'une masse est égal à :",["la masse divisée par son bras de levier","la masse ajoutée à son bras de levier","la masse multipliée par son bras de levier","le bras de levier divisé par la masse totale de l'avion"],2,"M = m × d, exprimé en kg·m. Le centre de gravité s'obtient ensuite en divisant la somme des moments par la somme des masses : CG = ΣM / Σm."],["u8s1q03","Avion à vide 700 kg (bras 0,90 m), pilote et passager 180 kg (bras 1,00 m), carburant 100 L d'AVGAS (bras 1,25 m), bagages 48 kg (bras 2,50 m). Où se situe le centre de gravité au décollage ?",["0,95 m","1,02 m","1,10 m","1,41 m"],1,"Carburant : 100 × 0,72 = 72 kg. Moments : 630 + 180 + 90 + 120 = 1 020 kg·m ; masse totale : 700 + 180 + 72 + 48 = 1 000 kg. CG = 1 020 / 1 000 = 1,02 m."],["u8s1q04","Masse maximale au décollage : 1 000 kg. Avion à vide, occupants et bagages : 892 kg. Quelle quantité maximale d'AVGAS (0,72 kg/L) peut-on embarquer, la capacité des réservoirs n'étant pas limitante ?",["78 L","108 L","135 L","150 L"],3,"Masse disponible : 1 000 − 892 = 108 kg. Volume : 108 / 0,72 = 150 L. Répondre 108 L revient à confondre litres et kilogrammes."],["u8s1q05","Un avion de 800 kg a son centre de gravité à 0,90 m de la référence. On charge 40 kg de bagages à 2,00 m. Où se trouve le nouveau centre de gravité ?",["Environ 0,85 m","Environ 0,95 m","1,00 m","1,45 m"],1,"Moment initial : 800 × 0,90 = 720 kg·m ; moment des bagages : 40 × 2,00 = 80 kg·m. CG = (720 + 80) / (800 + 40) = 800 / 840 ≈ 0,95 m : une charge placée à l'arrière fait reculer le CG."],["u8s1q06","Un avion de 900 kg a son centre de gravité à 1,00 m. On déplace un sac de 18 kg de la soute à bagages (bras 2,50 m) vers le siège passager avant (bras 1,00 m). Où se trouve le nouveau centre de gravité ?",["1,03 m","0,98 m","0,97 m","0,95 m"],2,"La masse totale ne change pas. ΔCG = m × Δd / M = 18 × (1,00 − 2,50) / 900 = −0,03 m : le CG avance de 3 cm, à 0,97 m."],["u8s1q07","Par rapport à un centrage arrière, un centrage avant (dans les limites) se traduit par :",["une stabilité accrue, des efforts à cabrer plus importants et une vitesse de décrochage un peu plus élevée","une stabilité réduite, des commandes de profondeur plus légères et une vitesse de décrochage plus faible","une stabilité réduite, des efforts à cabrer plus faibles et une vitesse de décrochage un peu plus élevée","une stabilité accrue, des efforts à cabrer plus faibles et une consommation plus faible en croisière"],0,"CG en avant : l'avion est plus stable, mais l'empennage doit fournir davantage de déportance. L'aile doit alors porter plus, d'où une vitesse de décrochage et une traînée légèrement plus élevées, et des efforts à cabrer plus forts."],["u8s1q08","Quel est le principal danger d'un chargement qui place le centre de gravité en arrière de la limite arrière ?",["L'avion ne peut plus cabrer suffisamment pour effectuer la rotation au décollage","La vitesse de décrochage augmente fortement, surtout en virage et en approche","La profondeur manque d'efficacité pour réaliser l'arrondi à l'atterrissage","La stabilité en tangage devient insuffisante et la vrille peut être irrécupérable"],3,"Un CG trop arrière réduit puis supprime la stabilité longitudinale, et la profondeur peut ne plus suffire à faire piquer l'avion pour sortir d'un décrochage ou d'une vrille. Le manque d'autorité à cabrer concerne au contraire un centrage trop avant."],["u8s1q09","Les bras de levier utilisés dans le calcul de centrage sont mesurés à partir :",["du centre de gravité de l'avion à vide","du point d'appui des roues du train principal","d'une référence fixe choisie par le constructeur","du centre de poussée de l'aile en croisière"],2,"Le constructeur choisit une référence (datum), par exemple la cloison pare-feu ou le bord d'attaque de l'aile ; toutes les distances (avion vide, sièges, soute, réservoirs) sont données par rapport à elle dans le manuel de vol."],["u8s1q10","Manuel de vol : masse maximale au décollage 1 400 kg, masse maximale à l'atterrissage 1 340 kg. Vous décollez à 1 400 kg pour un vol qui consommera 45 kg de carburant. Que constatez-vous ?",["La masse à l'atterrissage (1 355 kg) dépasse la limite de 15 kg","La masse à l'atterrissage (1 355 kg) est conforme, car inférieure à la masse maximale au décollage","La masse à l'atterrissage (1 295 kg) est conforme","Seule la masse au décollage est limitée sur un avion léger : l'atterrissage est conforme"],0,"Masse à l'atterrissage = 1 400 − 45 = 1 355 kg, supérieure à la masse maximale à l'atterrissage (1 340 kg). Il faut réduire la masse au départ d'au moins 15 kg."],["u8s1q11","Sur un avion dont le réservoir de carburant est situé en arrière du centre de gravité, comment évolue le centre de gravité au cours du vol ?",["Il recule","Il recule, puis avance","Il ne bouge pas : seule la masse diminue","Il avance"],3,"On retire peu à peu une masse située en arrière du CG : le moment diminue proportionnellement plus que la masse et le CG se déplace vers l'avant. D'où l'intérêt de vérifier aussi le centrage à l'atterrissage."],["u8s1q12","Pourquoi faut-il vérifier le centrage non seulement au décollage, mais aussi pour la masse prévue à l'atterrissage ?",["Parce que les limites de centrage sont différentes en approche, volets sortis","Parce que la consommation de carburant déplace le CG, qui peut sortir de l'enveloppe en fin de vol","Parce que la réglementation impose une marge de centrage plus grande à l'atterrissage qu'au décollage","Parce que le centrage n'a d'importance qu'à basse vitesse, lors de l'arrondi"],1,"Le carburant consommé modifie la masse et le moment : un avion bien centré au décollage peut se retrouver hors limites à l'arrivée, notamment avec des passagers ou des bagages à l'arrière."]]},{"id":"u8s2","title":"Performances au décollage et à l'atterrissage","icon":"🛫","tips":"Les distances de décollage et d'atterrissage se lisent dans le manuel de vol (tableaux ou abaques). Elles ont été établies avec un avion neuf, par un pilote d'essai, sur une piste en dur sèche et horizontale : en exploitation réelle, il faut les corriger et ajouter des marges.\n\nDistances données par le manuel :\n• Décollage : distance de roulement, et distance jusqu'au passage d'une hauteur de 15 m (50 ft).\n• Atterrissage : distance depuis le passage de 15 m jusqu'à l'arrêt complet, et distance de roulement.\n\nDistances déclarées (publiées sur la carte VAC) :\n• TORA : longueur de piste utilisable pour le roulement au décollage.\n• TODA : TORA + prolongement dégagé (clearway).\n• ASDA : TORA + prolongement d'arrêt (stopway).\n• LDA : longueur utilisable pour l'atterrissage ; un seuil décalé la réduit.\nLa distance de roulement se compare à la TORA, la distance de décollage (15 m) à la TODA et la distance d'atterrissage à la LDA.\n\nFacteurs qui allongent les distances :\n• Masse élevée : vitesses de décollage et d'approche plus grandes, accélération plus faible. +10 % de masse ≈ +20 % de distance de décollage.\n• Altitude-densité élevée (terrain en altitude, chaleur, humidité) : air moins dense, moteur et hélice moins performants, vitesse vraie plus grande pour une même vitesse indiquée. Altitude-densité ≈ altitude-pression + 120 ft par °C d'écart à l'ISA (15 °C au niveau de la mer, −2 °C par 1 000 ft). L'air humide est moins dense que l'air sec.\n• Vent : le vent de face réduit la vitesse sol, donc les distances ; le vent arrière les augmente fortement.\n• Pente : une pente montante allonge le décollage et raccourcit l'atterrissage ; une pente descendante fait l'inverse.\n• État de piste : herbe, sol mou ou neige freinent l'accélération ; herbe et piste mouillées dégradent le freinage.\n\nMajorations indicatives, si le manuel ne donne rien :\n• herbe sèche : décollage +20 %, atterrissage +15 % ;\n• herbe mouillée : décollage +30 %, atterrissage +35 % (jusqu'à +60 % sur herbe courte mouillée) ;\n• +10 °C ou +1 000 ft d'altitude : décollage +10 % ;\n• pente de 2 % : +10 % (montante au décollage, descendante à l'atterrissage).\nLes corrections se multiplient entre elles : on n'additionne pas les pourcentages.\n\nCoefficients de sécurité recommandés : distance de décollage × 1,33 et distance d'atterrissage × 1,43 (on n'utilise ainsi que 70 % de la LDA).\n\nLecture d'abaque : on suit les entrées dans l'ordre imposé (souvent température, altitude-pression, masse, vent, obstacle de 15 m), parallèlement aux courbes guides, en interpolant entre les lignes.","vocab":[["TORA","Longueur de piste utilisable pour le roulement au décollage"],["TODA","TORA + prolongement dégagé (clearway)"],["ASDA","TORA + prolongement d'arrêt (stopway)"],["LDA","Longueur de piste utilisable pour l'atterrissage"],["Seuil décalé","Seuil en retrait de l'extrémité de piste : il réduit la LDA"],["Altitude-densité","Altitude ISA ayant la même masse volumique que l'air réel"],["Abaque","Graphique du manuel de vol donnant une performance"],["Coefficient de sécurité","Marge multiplicative : × 1,33 au décollage, × 1,43 à l'atterrissage"]],"questions":[["u8s2q01","Sur une carte VAC, la TODA d'une piste correspond à :",["la TORA augmentée du prolongement d'arrêt (stopway)","la TORA augmentée du prolongement dégagé (clearway)","la longueur de piste utilisable pour l'atterrissage","la TORA diminuée de la longueur du seuil décalé"],1,"TODA (take-off distance available) = TORA + prolongement dégagé. La TORA augmentée du prolongement d'arrêt est l'ASDA, et la longueur utilisable à l'atterrissage est la LDA."],["u8s2q02","Sur une piste, la LDA publiée est nettement inférieure à la TORA. Quelle en est l'explication la plus probable ?",["La présence d'un prolongement dégagé (clearway)","La présence d'un prolongement d'arrêt (stopway)","Une pente montante de la piste","La présence d'un seuil décalé"],3,"Un seuil décalé (souvent pour dégager les obstacles en approche) interdit d'utiliser le début de la piste pour l'atterrissage : la LDA est réduite, alors que cette partie reste en général utilisable au décollage. Clearway et stopway ne modifient que la TODA et l'ASDA."],["u8s2q03","Altitude-pression de l'aérodrome : 2 000 ft ; température extérieure : 21 °C. Avec la règle de 120 ft par °C d'écart à l'ISA, l'altitude-densité vaut environ :",["800 ft","2 720 ft","3 200 ft","4 520 ft"],2,"Température ISA à 2 000 ft : 15 − 2 × 2 = 11 °C, soit ISA + 10 °C. Altitude-densité ≈ 2 000 + 10 × 120 = 3 200 ft : l'avion se comporte comme s'il décollait d'un terrain situé à 3 200 ft."],["u8s2q04","À pression et température identiques, un air très humide est, par rapport à un air sec :",["moins dense, ce qui augmente les distances de décollage","plus dense, ce qui réduit les distances de décollage","plus dense, ce qui augmente la traînée et les distances de décollage","de même densité, l'humidité n'influant que sur le givrage carburateur"],0,"La vapeur d'eau est plus légère que l'air sec qu'elle remplace : l'air humide est moins dense. L'altitude-densité augmente, le moteur et l'hélice perdent en efficacité et les distances s'allongent."],["u8s2q05","Pourquoi applique-t-on un coefficient de sécurité aux distances lues dans le manuel de vol ?",["Parce que les abaques ne tiennent compte ni de la masse de l'avion ni de la température extérieure","Parce qu'elles ont été obtenues avec un avion neuf et un pilote d'essai, sur piste en dur sèche","Parce que les distances du manuel sont exprimées en pieds et doivent être converties en mètres","Parce que la réglementation impose de doubler les distances calculées pour un avion léger"],1,"Les performances du manuel correspondent à un avion neuf, piloté de façon optimale sur une piste en dur sèche. Un avion usagé, un pilote moyen et des conditions réelles font moins bien : on recommande × 1,33 au décollage et × 1,43 à l'atterrissage."],["u8s2q06","Toutes choses égales par ailleurs, une augmentation de 10 % de la masse au décollage allonge la distance de décollage d'environ :",["5 %","10 %","20 %","40 %"],2,"La vitesse de décollage augmente avec la masse et l'accélération diminue : la distance varie à peu près comme le carré de la masse (1,1² ≈ 1,21). On retient : +10 % de masse ≈ +20 % de distance de décollage."],["u8s2q07","Une piste présente une pente montante de 2 % dans le sens d'utilisation. Par rapport à une piste horizontale :",["la distance de décollage augmente et la distance d'atterrissage diminue","la distance de décollage diminue et la distance d'atterrissage augmente","les distances de décollage et d'atterrissage augmentent","les distances sont inchangées tant que le vent est nul"],0,"En montée, une composante du poids freine l'accélération au décollage (environ +10 % pour 2 %) mais aide à ralentir à l'atterrissage. Une pente descendante produit l'effet inverse."],["u8s2q08","Par rapport au vent nul, un décollage avec une composante de vent arrière :",["réduit la distance de décollage, l'avion étant poussé par le vent pendant le roulement","ne modifie que la pente de montée après l'envol, pas la distance de roulement","augmente nettement la distance de décollage, car la vitesse sol à atteindre est plus élevée","n'allonge la distance de décollage que sur une piste en herbe ou mouillée"],2,"L'avion décolle à une vitesse donnée par rapport à l'air. Avec du vent arrière, la vitesse sol correspondante est plus grande : il faut accélérer plus longtemps. Un vent arrière égal à 10 % de la vitesse de décollage allonge la distance d'environ 20 %."],["u8s2q09","Laquelle de ces conditions allonge le plus la distance d'atterrissage d'un avion léger ?",["Une herbe sèche et rase","Une pente montante de 2 %","Un vent de face de 10 kt","Une herbe courte et mouillée"],3,"Sur herbe courte mouillée, le freinage devient très médiocre : la distance d'atterrissage peut augmenter jusqu'à 60 %, contre environ 15 % sur herbe sèche. Le vent de face et la pente montante raccourcissent au contraire l'atterrissage."],["u8s2q10","L'abaque donne une distance de décollage (passage des 15 m) de 500 m sur piste en dur. La piste est en herbe sèche (majoration de 20 %) et vous appliquez le coefficient de sécurité de 1,33. Quelle distance comparez-vous à la TODA ?",["600 m","Environ 665 m","Environ 765 m","Environ 800 m"],3,"Les corrections se multiplient : 500 × 1,20 = 600 m, puis 600 × 1,33 ≈ 798 m, soit environ 800 m. Additionner les pourcentages (500 × 1,53 = 765 m) sous-estime la distance."],["u8s2q11","Le manuel donne une distance d'atterrissage (depuis 15 m) de 450 m. La LDA est de 600 m. En appliquant le coefficient de sécurité recommandé de 1,43, l'atterrissage est-il acceptable ?",["Non : la distance majorée (environ 644 m) dépasse la LDA","Oui : 450 m restent inférieurs aux 600 m disponibles","Oui : la distance majorée (450 × 0,70 ≈ 315 m) reste inférieure à la LDA","Oui : le coefficient de sécurité ne s'applique qu'au décollage"],0,"450 × 1,43 ≈ 644 m, supérieur à 600 m. Autrement dit, la distance brute ne doit pas dépasser 70 % de la LDA (420 m ici) : il faut réduire la masse, attendre de meilleures conditions ou choisir une autre piste."],["u8s2q12","Dans le manuel de vol d'un avion léger, la distance de décollage est généralement donnée jusqu'au passage d'une hauteur de :",["10,7 m (35 ft)","15 m (50 ft)","30 m (100 ft)","150 m (500 ft)"],1,"Pour les avions légers, les distances de décollage et d'atterrissage sont établies avec un obstacle fictif de 15 m (50 ft). La hauteur de 35 ft concerne les avions de transport à réaction."]]},{"id":"u8s3","title":"Montée, croisière et autonomie","icon":"📈","tips":"Montée\n• Vx, vitesse de meilleur angle de montée : plus grand gain de hauteur pour une distance horizontale donnée. Excès de poussée maximal : c'est la vitesse de franchissement d'obstacles.\n• Vy, vitesse de meilleur taux de montée : plus grand gain de hauteur par unité de temps (ft/min). Excès de puissance maximal : c'est la vitesse de montée normale.\n• Vx est inférieure à Vy. En vitesse indiquée, quand l'altitude augmente, Vx augmente légèrement et Vy diminue : elles deviennent égales au plafond absolu.\n• Le vent ne modifie pas le taux de montée (vitesse verticale dans la masse d'air) mais modifie la pente par rapport au sol : vent de face, pente sol plus forte ; vent arrière, pente sol plus faible.\n• Une masse plus élevée réduit le taux et l'angle de montée.\n\nPlafonds\n• Plafond absolu : altitude où le taux de montée maximal devient nul.\n• Plafond pratique : altitude où le taux de montée maximal n'est plus que de 100 ft/min (0,5 m/s).\nIls baissent quand la masse ou la température augmentent.\n\nInfluence de l'altitude : un moteur à pistons atmosphérique perd de la puissance quand la densité de l'air diminue. Le taux de montée diminue et, à vitesse indiquée constante, la vitesse vraie augmente.\n\nCroisière\nLe manuel donne, pour chaque altitude, le régime (tr/min) correspondant à un pourcentage de la puissance maximale (souvent 55 à 75 %), avec la vitesse vraie et la consommation horaire. Plus de puissance donne plus de vitesse, mais la consommation horaire augmente plus vite que la vitesse : la distance parcourue par litre diminue.\n\nAutonomie et distance franchissable\n• Autonomie maximale (temps de vol le plus long) : vitesse de puissance nécessaire minimale, qui donne la consommation horaire minimale.\n• Distance franchissable maximale (vent nul) : vitesse de finesse maximale (traînée minimale) pour un avion à hélice, qui donne la consommation par kilomètre minimale.\n• La vitesse d'autonomie maximale est inférieure à celle de distance franchissable maximale.\n• Autonomie (h) = carburant utilisable (L) / consommation (L/h) ; distance sol = autonomie × vitesse sol.\n\nInfluence du vent\n• Le vent ne change pas l'autonomie en temps, mais change la distance parcourue par rapport au sol : vent de face, distance réduite ; vent arrière, distance augmentée.\n• Par vent de face, voler un peu plus vite améliore la distance sol ; par vent arrière, un peu moins vite.\n• Rayon d'action : distance maximale à laquelle on peut aller puis revenir au point de départ avec le carburant disponible, réserve exclue. Temps aller = autonomie × Vs retour / (Vs aller + Vs retour). Tout vent réduit le rayon d'action par rapport au vent nul.","vocab":[["Vx","Vitesse de meilleur angle de montée (franchissement d'obstacle)"],["Vy","Vitesse de meilleur taux de montée (ft/min maximal)"],["Plafond absolu","Altitude où le taux de montée maximal devient nul"],["Plafond pratique","Altitude où le taux de montée maximal tombe à 100 ft/min"],["Autonomie","Temps de vol possible avec le carburant utilisable"],["Distance franchissable","Distance que l'on peut parcourir avec le carburant utilisable"],["Rayon d'action","Distance max. pour aller puis revenir au départ, réserve exclue"],["Finesse maximale","Rapport portance/traînée maximal : distance max (avion à hélice)"]],"questions":[["u8s3q01","La vitesse Vy est la vitesse qui permet :",["le plus grand gain de hauteur pour une distance horizontale donnée","la plus faible consommation horaire en palier","le plus grand gain de hauteur en un temps donné","la plus grande distance franchissable en croisière"],2,"Vy est la vitesse de meilleur taux de montée (ft/min maximal), obtenue à l'excès de puissance maximal. Le meilleur gain de hauteur par distance parcourue correspond à Vx."],["u8s3q02","Vous décollez d'une piste courte bordée d'une rangée d'arbres en bout de piste. À quelle vitesse montez-vous jusqu'au franchissement de l'obstacle ?",["Vx","Vy","Vy augmentée de 10 kt","La vitesse de finesse maximale"],0,"Vx donne le meilleur angle de montée, donc la plus grande hauteur gagnée sur une distance donnée : c'est la vitesse de franchissement d'obstacle. Une fois l'obstacle passé, on accélère à Vy."],["u8s3q03","En vitesse indiquée, comment évoluent Vx et Vy lorsque l'altitude augmente ?",["Elles restent constantes, comme la vitesse de décrochage","Elles s'écartent : Vx diminue et Vy augmente avec l'altitude","Vx devient supérieure à Vy au-dessus de 5 000 ft environ","Elles se rapprochent jusqu'à devenir égales au plafond absolu"],3,"Vx augmente légèrement et Vy diminue avec l'altitude. Au plafond absolu, une seule vitesse permet encore de tenir le palier : Vx = Vy et le taux de montée est nul."],["u8s3q04","Le plafond pratique d'un avion léger est l'altitude à laquelle le taux de montée maximal n'est plus que de :",["0 ft/min","100 ft/min","300 ft/min","500 ft/min"],1,"Plafond pratique : taux de montée maximal de 100 ft/min (0,5 m/s). Un taux nul définit le plafond absolu, que l'avion n'atteint en pratique jamais."],["u8s3q05","Pour un avion à moteur à pistons atmosphérique (sans turbocompresseur), quand l'altitude augmente :",["la puissance disponible diminue, ce qui réduit le taux de montée","la puissance disponible augmente, car l'air est plus froid","le taux de montée augmente, car la traînée diminue","la puissance disponible reste constante jusqu'au plafond pratique"],0,"La puissance d'un moteur atmosphérique dépend de la masse d'air admise : elle diminue avec la densité. L'excès de puissance se réduit, donc le taux de montée diminue jusqu'à s'annuler au plafond absolu."],["u8s3q06","On compare deux montées à Vy, l'une par vent nul, l'autre avec un vent de face régulier de 20 kt. Avec le vent de face :",["le taux de montée augmente et la pente de montée par rapport au sol est inchangée","le taux de montée diminue et la pente de montée par rapport au sol est plus faible","le taux de montée est inchangé et la pente de montée par rapport au sol est plus forte","le taux de montée et la pente de montée par rapport au sol sont inchangés"],2,"Le taux de montée dépend des performances de l'avion dans la masse d'air, pas du vent. La vitesse sol étant plus faible, la même hauteur est gagnée sur une distance au sol plus courte : la pente par rapport au sol est plus forte."],["u8s3q07","Pour rester en l'air le plus longtemps possible (attente au-dessus d'un point), le pilote doit voler à :",["la vitesse de finesse maximale","la vitesse de croisière rapide (75 % de puissance)","la vitesse de décrochage majorée de 5 kt","la vitesse de puissance nécessaire minimale"],3,"L'autonomie maximale est obtenue quand la consommation horaire est minimale, c'est-à-dire à la vitesse de puissance nécessaire minimale. Plus près du décrochage, la puissance nécessaire augmente à nouveau."],["u8s3q08","Par vent nul, la distance franchissable maximale d'un avion à hélice est obtenue à :",["la vitesse de puissance nécessaire minimale","la vitesse de finesse maximale","la vitesse maximale en palier","la vitesse de manœuvre VA"],1,"Pour un avion à hélice, la consommation par kilomètre est minimale quand la traînée est minimale, donc à la finesse maximale. Cette vitesse est supérieure à celle d'autonomie maximale (puissance minimale)."],["u8s3q09","Dans le tableau de croisière, vous passez de 55 % à 75 % de puissance à la même altitude. Quelle affirmation est exacte ?",["La vitesse vraie augmente, mais la consommation horaire augmente plus vite : la distance par litre diminue","La vitesse vraie augmente et la consommation horaire diminue, car le moteur tourne à un meilleur régime","La vitesse vraie augmente dans la même proportion que la puissance, soit d'environ 36 %","La distance franchissable augmente, car le temps de vol jusqu'à destination est plus court"],0,"La puissance nécessaire croît à peu près comme le cube de la vitesse : un gain de vitesse modeste coûte beaucoup de carburant. Le temps de vol diminue, mais le carburant consommé par distance parcourue augmente."],["u8s3q10","Un vent de face régulier de 25 kt sur toute la durée du vol modifie :",["l'autonomie en temps, mais pas la distance franchissable","l'autonomie en temps et la distance franchissable, qui diminuent toutes deux","la consommation horaire, qui augmente pour compenser le vent","la distance franchissable par rapport au sol, mais pas l'autonomie en temps"],3,"L'autonomie (en heures) ne dépend que du carburant et de la consommation horaire. Le vent change la vitesse sol, donc la distance parcourue par rapport au sol pendant ce temps."],["u8s3q11","Autonomie utilisable (réserve exclue) : 3 h. Vitesse propre : 100 kt. Composante de vent de face de 20 kt à l'aller, donc arrière de 20 kt au retour. Quel est le rayon d'action (aller puis retour au terrain de départ) ?",["120 NM","144 NM","150 NM","180 NM"],1,"Vs aller 80 kt, Vs retour 120 kt. Temps aller = 3 × 120 / (80 + 120) = 1,8 h, soit 1,8 × 80 = 144 NM (retour : 144 / 120 = 1,2 h ; total 3 h). Sans vent, on aurait 150 NM : tout vent réduit le rayon d'action."],["u8s3q12","Carburant utilisable hors réserve : 120 L. Consommation : 30 L/h. Vitesse propre : 110 kt ; vent de face : 20 kt. Quelle est la distance franchissable par rapport au sol ?",["520 NM","440 NM","360 NM","270 NM"],2,"Autonomie : 120 / 30 = 4 h. Vitesse sol : 110 − 20 = 90 kt. Distance sol : 4 × 90 = 360 NM (contre 440 NM par vent nul)."]]},{"id":"u8s4","title":"Préparation d'un vol VFR","icon":"🗂️","tips":"Avant tout vol, le commandant de bord prend connaissance de toutes les informations utiles (SERA.2010). Pour un vol quittant les abords de l'aérodrome, la préparation comprend l'étude des bulletins et prévisions météorologiques à jour, compte tenu du carburant nécessaire et d'une solution de rechange si le vol ne peut pas se dérouler comme prévu.\n\nLes étapes\n• Météo : METAR et TAF des aérodromes, cartes TEMSI (temps significatif) et WINTEM (vents et températures en altitude), SIGMET.\n• Informations aéronautiques : le SIA (Service de l'information aéronautique) publie l'AIP France (parties GEN, ENR et AD), les cartes VAC, les SUP AIP et les NOTAM. NOTAM et SUP AIP signalent les changements temporaires : zones réglementées temporaires (ZRT), travaux, pannes de moyens radio, activation de zones.\n• Cartes VAC : cheminements d'arrivée et de départ, altitude du tour de piste, fréquences, distances déclarées, consignes particulières.\n• Carte aéronautique au 1/500 000 : tracé de la route, espaces aériens et zones P, R et D avec leurs limites verticales, relief et obstacles.\n\nLog de navigation\nPour chaque branche : route, distance, cap et vitesse sol corrigés du vent, temps estimé, carburant, fréquences et repères. Temps (min) = distance (NM) / vitesse sol (kt) × 60.\n\nCarburant\n• Délestage : carburant consommé pendant le vol (durée × consommation horaire).\n• On y ajoute la mise en route et le roulage, la réserve finale réglementaire et, si besoin, un dégagement et une marge pour les imprévus.\n• Réserve finale réglementaire (Part-NCO, avion, NCO.OP.125 et AMC1 NCO.OP.125(b)) : de quoi rejoindre la destination en conservant au moins 30 minutes de vol de jour et 45 minutes de nuit, en vitesse d'attente à 1 500 ft au-dessus de la destination ; pour un vol local de jour (même aérodrome au départ et à l'arrivée, toujours en vue de celui-ci), 10 minutes seulement, à la puissance maximale continue de croisière à 1 500 ft. Cette réserve ne doit pas être consommée en exploitation normale.\n\nPlan de vol\nObligatoire notamment pour un vol devant bénéficier du contrôle, un vol franchissant une frontière (sauf disposition contraire des États) et un vol de nuit quittant les abords de l'aérodrome. À l'arrivée, il faut le clôturer au plus vite, faute de quoi le service d'alerte déclenche les recherches.\n\nDocuments\n• Pilote (FCL.045) : licence, certificat médical en état de validité et pièce d'identité avec photo.\n• Avion (NCO.GEN.135) : manuel de vol, certificat d'immatriculation et certificat de navigabilité (originaux), attestation d'assurance, certificat acoustique et licence de station radio le cas échéant, carnet de route, cartes à jour. Pour un vol local (départ et retour au même aérodrome), les certificats, l'attestation d'assurance et le carnet de route peuvent rester à l'aérodrome.\n\nRisque et minima personnels\nLes minima personnels sont des limites plus restrictives que la réglementation, fixées à l'avance par le pilote selon son expérience et son entraînement récent (vent de travers, visibilité, plafond, longueur de piste). Le jour du vol, on évalue le pilote, l'avion, l'environnement et la pression extérieure : si un minimum personnel n'est pas respecté, on reporte ou on modifie le vol.","vocab":[["SIA","Service de l'information aéronautique : AIP, VAC, NOTAM"],["AIP","Publication d'information aéronautique : parties GEN, ENR, AD"],["NOTAM","Avis aux navigants : information temporaire ou urgente"],["SUP AIP","Supplément à l'AIP : modification temporaire, souvent longue"],["Carte VAC","Carte d'approche et d'atterrissage à vue d'un aérodrome"],["Délestage","Carburant consommé pendant le vol"],["Log de navigation","Tableau de préparation : routes, caps, temps, carburant par branche"],["Minima personnels","Limites que le pilote se fixe, plus strictes que la réglementation"]],"questions":[["u8s4q01","Selon les règles de l'air (SERA), la préparation d'un vol qui ne se limite pas aux abords de l'aérodrome doit comporter :",["le dépôt d'un plan de vol et la réservation d'un créneau auprès des services de la circulation aérienne","l'étude des bulletins et prévisions météo, compte tenu du carburant nécessaire et d'une solution de rechange","un contact téléphonique avec l'aérodrome de destination pour confirmer les conditions météo","la vérification de la navigation par un instructeur ou un pilote plus expérimenté"],1,"SERA.2010 : le commandant de bord prend connaissance de toutes les informations utiles ; pour un vol quittant les abords de l'aérodrome, il étudie les bulletins et prévisions météo à jour, en tenant compte du carburant nécessaire et d'un plan de rechange si le vol ne peut pas se dérouler comme prévu."],["u8s4q02","En France, quel organisme publie l'AIP et les cartes VAC, et diffuse les NOTAM ?",["Météo-France","Le BEA (Bureau d'enquêtes et d'analyses)","L'AESA (Agence de l'Union européenne pour la sécurité aérienne)","Le SIA (Service de l'information aéronautique)"],3,"Le SIA, service de la DGAC, publie l'AIP France (dont l'atlas VAC), les SUP AIP et les NOTAM. Météo-France fournit l'information météorologique et le BEA enquête sur les accidents."],["u8s4q03","Dans l'AIP, les renseignements détaillés sur chaque aérodrome figurent dans la partie :",["GEN","ENR","AD","AIC"],2,"L'AIP comprend trois parties : GEN (généralités), ENR (en route : espaces aériens, zones, routes) et AD (aérodromes). Les AIC sont des circulaires d'information distinctes de l'AIP."],["u8s4q04","Lors de la préparation, la carte VAC de l'aérodrome de destination vous renseigne notamment sur :",["les cheminements d'arrivée, l'altitude du tour de piste et les fréquences","les prévisions météorologiques et le vent attendu à l'heure d'arrivée","les NOTAM et les travaux en cours sur l'aérodrome le jour du vol","les vents et températures en altitude le long de la route"],0,"La VAC est la carte d'approche à vue : plan de l'aérodrome, points d'entrée et cheminements, altitude du tour de piste, fréquences, distances déclarées et consignes. Les informations temporaires (NOTAM) et la météo se consultent séparément."],["u8s4q05","Une zone réglementée temporaire (ZRT), créée pour une manifestation aérienne, n'apparaît pas sur votre carte au 1/500 000. Où trouver son existence et ses horaires lors de la préparation ?",["Sur la carte VAC de l'aérodrome de départ","Dans le TAF de l'aérodrome le plus proche","Sur la carte TEMSI France","Dans les NOTAM et les SUP AIP"],3,"Les modifications temporaires de l'espace aérien (ZRT, activation de zones, restrictions) sont publiées par SUP AIP ou NOTAM : leur consultation fait partie de toute préparation, même pour un trajet déjà connu."],["u8s4q06","Sur votre log de navigation, une branche de 60 NM est prévue avec une vitesse propre de 100 kt et une composante de vent de face de 20 kt. La consommation est de 28 L/h. Temps de vol et carburant pour cette branche ?",["36 min et 16,8 L","45 min et 21 L","45 min et 28 L","1 h 15 min et 35 L"],1,"Vitesse sol : 100 − 20 = 80 kt. Temps : 60 / 80 = 0,75 h = 45 min. Carburant : 0,75 × 28 = 21 L."],["u8s4q07","Vol VFR de jour vers un autre aérodrome : durée prévue 1 h 40 min, consommation 24 L/h (valeur à retenir aussi pour la réserve), mise en route et roulage 4 L. Quelle quantité minimale de carburant faut-il au départ, réserve réglementaire comprise ?",["44 L","52 L","56 L","62 L"],2,"Délestage : 1 h 40 min = 5/3 h, × 24 = 40 L. Réserve finale VFR de jour vers un autre aérodrome : 30 min, comptées ici par prudence à la consommation de croisière : 0,5 × 24 = 12 L. Total : 4 + 40 + 12 = 56 L (62 L correspondrait à la réserve de 45 min exigée de nuit)."],["u8s4q08","Dans lequel de ces cas le dépôt d'un plan de vol est-il obligatoire ?",["Un vol VFR de jour entre deux aérodromes non contrôlés, en espace de classe G","Une séance de tours de piste de jour sur un aérodrome non contrôlé","Un vol VFR de jour en espace non contrôlé d'une durée supérieure à 2 heures","Un vol VFR de nuit quittant les abords de l'aérodrome de départ"],3,"SERA.4001 impose un plan de vol notamment pour tout vol devant bénéficier du contrôle, tout vol franchissant une frontière (sauf disposition contraire des États) et tout vol de nuit quittant les abords d'un aérodrome. Un vol VFR de jour en espace non contrôlé n'en exige pas, quelle que soit sa durée."],["u8s4q09","Vous avez déposé un plan de vol et atterrissez sur un aérodrome dépourvu d'organisme de la circulation aérienne. Que devez-vous faire ?",["Le clôturer au plus vite par un compte rendu d'arrivée, sinon l'alerte est donnée","Rien : le plan de vol est clôturé automatiquement à l'heure d'arrivée prévue","Attendre 30 minutes après l'heure d'arrivée prévue, puis clôturer le plan de vol","Le clôturer lors du dépôt de votre plan de vol suivant, pour le vol de retour"],0,"Le compte rendu d'arrivée doit être transmis dès que possible après l'atterrissage. Sans clôture, le service d'alerte considère l'avion en retard, déclenche les phases d'urgence puis les recherches."],["u8s4q10","Lors d'un vol comme commandant de bord avec une licence PPL(A), quels documents le pilote doit-il avoir sur lui ?",["Sa licence et son carnet de vol, preuve de son expérience récente","Sa licence, le certificat médical pouvant rester consultable à l'aéroclub","Sa licence, son certificat médical valide et une pièce d'identité avec photo","Son certificat médical et l'attestation de réussite à l'examen théorique"],2,"Part-FCL (FCL.045) : le pilote porte toujours sur lui une licence valide et un certificat médical valide lorsqu'il exerce les privilèges de sa licence, ainsi qu'un document d'identité avec photo. Le carnet de vol n'a pas à être emporté : il est présenté sans délai sur demande."],["u8s4q11","Pour un vol de navigation vers un autre aérodrome, quelle liste ne contient que des documents exigés à bord de l'avion ?",["Certificat d'immatriculation, certificat de navigabilité, attestation d'assurance, carnet de route","Certificat d'immatriculation, programme d'entretien, carnet de route, factures de la dernière visite","Certificat de navigabilité, carnets de vol des pilotes du club, attestation d'assurance","Manuel d'entretien de l'avion, certificat de navigabilité, carnet de route"],0,"Part-NCO (NCO.GEN.135) exige notamment à bord le manuel de vol, les originaux des certificats d'immatriculation et de navigabilité, l'attestation d'assurance, la licence de station radio le cas échéant, le carnet de route et des cartes à jour. Programme et manuel d'entretien, factures ou carnets de vol des pilotes n'en font pas partie."],["u8s4q12","Vos minima personnels prévoient un vent de travers maximal de 10 kt. À destination, la prévision annonce un vent de travers de 15 kt, inférieur à la valeur démontrée du manuel de vol (17 kt). Quelle décision est la plus appropriée ?",["Partir, puisque la valeur démontrée du manuel de vol n'est pas atteinte","Reporter le vol ou choisir une destination compatible avec vos minima","Partir et augmenter la vitesse d'approche de 15 kt pour compenser","Partir, car les minima personnels ne s'appliquent qu'aux vols en solo"],1,"Les minima personnels sont fixés à l'avance, à froid, selon son expérience : plus restrictifs que les limites de l'avion ou de la réglementation, ils ne se renégocient pas le jour du vol. Si l'un d'eux n'est pas respecté, on reporte ou on modifie le vol."]]}]},{"id":"u9","title":"Connaissance générale de l'aéronef","description":"Cellule et commandes, moteur à pistons, hélice et carburant, circuits électrique et de dépression, instruments de bord : comment fonctionne l'avion léger et comment réagir à une anomalie (examen : 12 questions, 18 min).","skills":[{"id":"u9s1","title":"Cellule, train et commandes","icon":"🛩️","tips":"La cellule est la structure de l'avion : fuselage, voilure, empennages et train d'atterrissage.\n\nStructure :\n• Fuselage : il porte l'équipage, la charge et le moteur, et relie la voilure aux empennages. Construction en treillis de tubes soudés entoilé, ou semi-monocoque : revêtement travaillant raidi par des cadres et des lisses.\n• Voilure : le longeron, poutre orientée dans le sens de l'envergure, reprend la flexion due à la portance ; les nervures donnent la forme du profil et transmettent au longeron les efforts reçus par le revêtement. Aile haute ou basse, cantilever (sans hauban) ou haubanée.\n• Empennage horizontal : plan fixe et gouverne de profondeur (ou plan monobloc). Empennage vertical : dérive et gouverne de direction.\n\nTrain d'atterrissage :\n• Tricycle : deux roues principales en arrière du centre de gravité et une roulette de nez. Stable au roulage, bonne visibilité vers l'avant.\n• Classique : deux roues principales en avant du centre de gravité et une roulette de queue. Le CG étant derrière les roues principales, tout écart de trajectoire au sol tend à s'amplifier : risque de cheval de bois.\n• Freins : généralement à disque et à commande hydraulique, actionnés par la partie haute des palonniers. Le freinage différentiel (un seul côté) aide à diriger l'avion au sol ; le frein de parc l'immobilise à l'arrêt.\n\nCommandes de vol :\n• Manche à gauche ou à droite : ailerons braqués en sens opposés, roulis. Manche à gauche : aileron gauche levé, aileron droit baissé.\n• Manche avant ou arrière : gouverne de profondeur, tangage. Palonniers : gouverne de direction, lacet.\n• La timonerie (câbles, poulies, guignols, bielles) transmet les ordres. Un câble mal remonté peut inverser une commande : on contrôle le sens de débattement à chaque prévol.\n• Volets de courbure : ils augmentent la portance et la traînée et diminuent la vitesse de décrochage ; ils permettent une approche plus lente et plus pentue.\n• Compensateur (tab) : petite surface au bord de fuite d'une gouverne, braquée en sens inverse de celle-ci. Il annule l'effort au manche : après chaque changement de régime ou d'assiette, on compense jusqu'à ne plus rien tenir (effort à pousser → compenser à piquer).\n\nEntretien et visite prévol :\n• L'avion est entretenu selon son programme d'entretien ; les travaux sont consignés dans ses documents.\n• La prévol suit la check-list du manuel de vol : revêtement (chocs, criques, rivets), gouvernes libres et dans le bon sens, charnières et fixations, pneus et amortisseurs, freins (fuites), hélice (entailles, criques), niveau d'huile, purges carburant, cales, housses et attaches retirées.\n• Dommage douteux (entaille d'hélice, crique de structure) : on ne vole pas sans l'avis d'un mécanicien.","vocab":[["Longeron","Poutre principale de l'aile, reprend la flexion due à la portance"],["Nervure","Élément qui donne sa forme au profil de l'aile"],["Semi-monocoque","Structure à revêtement travaillant raidi par cadres et lisses"],["Train tricycle","Roues principales en arrière du CG et roulette de nez"],["Train classique","Roues principales en avant du CG et roulette de queue"],["Timonerie","Câbles, poulies et bielles transmettant les ordres aux gouvernes"],["Compensateur (tab)","Petite surface de gouverne qui annule l'effort au manche"],["Volets de courbure","Hypersustentateurs : plus de portance et de traînée, VS plus faible"]],"questions":[["u9s1q01","Dans une aile, quel élément reprend l'essentiel des efforts de flexion dus à la portance ?",["Les nervures","Le bord de fuite","Le longeron","Le saumon"],2,"Le longeron est la poutre principale de l'aile, orientée dans le sens de l'envergure : c'est lui qui encaisse la flexion due à la portance. Les nervures, elles, donnent la forme du profil."],["u9s1q02","Quel est le rôle principal des nervures d'une aile ?",["Donner sa forme au profil et transmettre les efforts au longeron","Reprendre l'essentiel de la flexion de l'aile, à la place du longeron","Relier l'aile au fuselage par des ferrures d'attache","Contenir le carburant dans l'épaisseur de l'aile"],0,"Les nervures, disposées dans le sens de la corde, donnent sa forme au profil et transmettent au longeron les efforts aérodynamiques reçus par le revêtement. La flexion est reprise par le longeron."],["u9s1q03","Un train d'atterrissage tricycle comprend :",["deux roues principales en avant du centre de gravité et une roulette de queue","une roue principale sous le fuselage et deux balancines sous les ailes","deux roues principales en avant du centre de gravité et une roulette de nez","deux roues principales en arrière du centre de gravité et une roulette de nez"],3,"Sur un train tricycle, les roues principales sont légèrement en arrière du centre de gravité et une roulette de nez soutient l'avant : l'avion est stable en ligne droite au roulage. Le train classique place les roues principales en avant du CG, avec une roulette de queue."],["u9s1q04","Le risque de « cheval de bois » au roulage et à l'atterrissage concerne surtout :",["les avions à train tricycle, à cause de la roulette de nez orientable","les avions à train classique, au CG situé derrière les roues principales","les avions à train rentrant, en cas d'oubli de sortie du train","les avions à aile haute, plus sensibles au vent de travers"],1,"Sur un train classique, le centre de gravité est derrière les roues principales : un écart de trajectoire au sol tend à s'amplifier jusqu'à la perte de contrôle en lacet (cheval de bois). Le pilote doit corriger tôt aux palonniers."],["u9s1q05","Au roulage, le pilote appuie uniquement sur le frein du palonnier droit. Quel est l'effet ?",["L'avion ralentit en ligne droite","L'avion pivote et tourne à gauche","L'avion pivote et tourne à droite","L'avion s'incline sur l'aile gauche"],2,"Le freinage différentiel ne freine que la roue principale droite : l'avion pivote autour de cette roue et tourne à droite. On l'utilise pour diriger l'avion au sol, en complément de la roulette orientable."],["u9s1q06","En vol, le pilote déplace le manche vers la gauche. Quelle est la position des ailerons ?",["Aileron gauche levé, aileron droit baissé","Aileron gauche baissé, aileron droit levé","Les deux ailerons levés","Les deux ailerons baissés"],0,"Manche à gauche, l'aileron gauche se lève (moins de portance sur l'aile gauche) et l'aileron droit s'abaisse (plus de portance à droite) : l'avion s'incline à gauche. Les ailerons braquent toujours en sens opposés."],["u9s1q07","Le braquage des volets de courbure a pour effet :",["d'augmenter la portance et de diminuer la traînée, pour monter plus vite","d'augmenter la vitesse de décrochage en raison de la traînée supplémentaire","de diminuer la portance et la traînée pour faciliter la descente","d'augmenter la portance et la traînée, et de diminuer la vitesse de décrochage"],3,"Les volets augmentent la courbure du profil : le coefficient de portance maximal augmente, donc la vitesse de décrochage diminue, mais la traînée augmente aussi. Cela permet une approche plus lente et plus pentue."],["u9s1q08","Quel est le rôle du compensateur de profondeur ?",["Empêcher le flottement (flutter) de la gouverne","Annuler l'effort permanent à tenir au manche","Augmenter le débattement maximal de la gouverne","Diminuer la vitesse de décrochage"],1,"Le compensateur (tab) crée une petite force aérodynamique qui maintient la gouverne dans la position voulue : le pilote n'a plus d'effort à tenir au manche. La prévention du flottement relève de l'équilibrage des gouvernes (masses d'équilibrage)."],["u9s1q09","Après une mise en palier, vous devez pousser en permanence sur le manche pour conserver l'assiette. Que faites-vous ?",["Vous compensez à cabrer","Vous sortez un cran de volets","Vous compensez à piquer","Vous réduisez la puissance au ralenti"],2,"Un effort permanent à pousser se supprime en compensant à piquer : le compensateur maintient alors la profondeur dans la position voulue. On compense après chaque changement de régime ou d'assiette."],["u9s1q10","Pourquoi faut-il vérifier le sens de débattement des gouvernes, en particulier après une intervention d'entretien ?",["Parce qu'une butée mal réglée peut inverser le sens de la commande","Parce que le compensateur est déposé à chaque visite","Parce que la peinture fraîche peut bloquer les charnières","Parce qu'un câble de timonerie mal remonté peut inverser une commande"],3,"La timonerie (câbles, poulies, guignols) peut être remontée croisée : la gouverne bouge alors en sens inverse de l'ordre donné, ce qui est catastrophique dès le décollage. Une butée, elle, ne fait que limiter l'amplitude du débattement. On contrôle donc que chaque gouverne est libre et débat dans le bon sens."],["u9s1q11","Au cours de la visite prévol, quel constat doit vous faire renoncer au vol en attendant l'avis d'un mécanicien ?",["Une entaille sur le bord d'attaque d'une pale d'hélice","Quelques insectes collés sur le bord d'attaque de l'aile","Des repères de glissement pneu/jante bien alignés","Un niveau d'huile compris entre le minimum et le maximum"],0,"Une entaille de pale crée une concentration de contraintes pouvant conduire à la rupture de l'hélice, qui tourne à grande vitesse : seul un mécanicien peut décider de la réparation. Les autres constats sont normaux (les insectes se nettoient)."],["u9s1q12","Dans une structure de fuselage semi-monocoque, les efforts sont repris :",["par un treillis de tubes soudés, recouvert d'une toile tendue","par le revêtement travaillant, raidi par des cadres et des lisses","par les cadres, le revêtement n'ayant qu'un rôle aérodynamique","par des haubans extérieurs reliés au train et à la voilure"],1,"En semi-monocoque, le revêtement métallique ou composite participe à la résistance (revêtement travaillant) ; cadres et lisses le raidissent et évitent son flambage. Le treillis entoilé est une autre technique, où la toile ne reprend pas d'effort."]]},{"id":"u9s2","title":"Moteur à pistons","icon":"⚙️","tips":"La plupart des avions légers ont un moteur à pistons à 4 temps, à cylindres opposés à plat (4 ou 6 cylindres), refroidi par air : ailettes sur les cylindres et déflecteurs qui canalisent l'air. La surchauffe guette en montée prolongée à forte puissance et faible vitesse.\n\nCycle à 4 temps (2 tours de vilebrequin) :\n• Admission : le piston descend, la soupape d'admission est ouverte, le mélange entre.\n• Compression : soupapes fermées, le piston remonte.\n• Combustion-détente : l'étincelle enflamme le mélange, les gaz repoussent le piston : seul temps moteur.\n• Échappement : le piston remonte, la soupape d'échappement est ouverte.\n\nAllumage :\n• Deux magnétos indépendantes, deux bougies par cylindre : sécurité et meilleure combustion. La magnéto produit son propre courant : le moteur tourne même sans batterie ni alternateur.\n• Le contacteur sur OFF met les magnétos à la masse. Si un fil de masse est coupé, la magnéto reste « chaude » : tourner l'hélice à la main peut lancer le moteur. Une hélice est toujours à considérer comme dangereuse.\n• Essai magnétos au point fixe : sur L puis sur R, une légère chute de régime est normale (chute maximale et écart admissible au manuel de vol). Une chute excessive ou un moteur irrégulier est anormal ; une absence totale de chute fait suspecter un fil de masse coupé.\n\nMélange :\n• Le dosage théorique (stœchiométrique) est d'environ 1 g d'essence pour 15 g d'air. En montée, l'air est moins dense : sans action du pilote, le mélange s'enrichit. On appauvrit (manette rouge) pour retrouver le bon dosage, réduire la consommation et éviter l'encrassement des bougies.\n• Un mélange trop pauvre à forte puissance provoque surchauffe et détonation.\n\nCarburateur et givrage :\n• Dans le venturi, l'air accélère, se détend et aspire l'essence ; le papillon, commandé par la manette des gaz, dose le mélange admis.\n• La détente de l'air et la vaporisation de l'essence refroidissent fortement : du givre peut se former dans une large plage de températures (couramment de −10 °C à +30 °C), surtout par air humide et à puissance réduite.\n• Symptômes (pas fixe) : baisse lente du régime, moteur irrégulier. Réchauffage plein chaud : le régime baisse encore, puis remonte quand le givre fond. L'air chaud, moins dense, réduit la puissance et enrichit le mélange.\n• Injection : l'essence est injectée sous pression près des soupapes, sans venturi : pas de givrage carburateur, mais redémarrage à chaud plus délicat.\n\nLubrification : l'huile lubrifie, refroidit, nettoie et assure l'étanchéité. Pression d'huile basse et température élevée : défaillance probable, atterrir au plus tôt.\n\nDétonation : combustion explosive du mélange restant après l'allumage (moteur chaud, mélange pauvre, indice d'octane insuffisant). Pré-allumage : inflammation avant l'étincelle par un point chaud (calamine, bougie surchauffée).","vocab":[["Magnéto","Générateur autonome du courant d'allumage, entraîné par le moteur"],["Double allumage","Deux magnétos indépendantes et deux bougies par cylindre"],["
