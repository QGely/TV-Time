ymphe), détectent les accélérations angulaires (début et fin d'une rotation). Une rotation constante n'est plus ressentie après 10 à 20 secondes, et une rotation très lente, sous le seuil de détection, passe inaperçue ;\n• les otolithes (utricule et saccule) détectent les accélérations linéaires et la pesanteur. Ils ne distinguent pas une accélération d'une inclinaison de la tête.\n\nPrincipales illusions :\n• « leans » : après une mise en inclinaison lente non perçue, le retour rapide aux ailes horizontales donne l'impression de s'incliner du côté opposé ; le pilote se penche vers l'inclinaison initiale ;\n• spirale : dans un virage prolongé, la sensation de virage disparaît ; le pilote qui voit l'altitude diminuer tire sur le manche, ce qui resserre la spirale ;\n• illusion somatogravique : une forte accélération (décollage, remise de gaz) de nuit ou en IMC donne une impression de cabré ; le pilote rend la main et risque de percuter le sol. Une décélération donne l'impression inverse ;\n• illusion de Coriolis : un mouvement de tête (ramasser une carte) pendant un virage prolongé stimule plusieurs canaux à la fois et provoque une sensation de culbute, la plus violente des désorientations.\nParade : sans références visuelles, croire les instruments et eux seuls. Un pilote VFR non entraîné qui entre en IMC perd le contrôle en quelques minutes : ne pas y entrer, ou faire demi-tour sans attendre.\n\nBarotraumatismes : l'oreille moyenne communique avec la gorge par la trompe d'Eustache. En montée, l'air s'échappe facilement ; en descente, il faut rééquilibrer activement (déglutir, bâiller, manœuvre de Valsalva). Avec un rhume, la trompe et les orifices des sinus se bouchent : douleurs violentes, voire rupture du tympan en descente. Ne pas voler enrhumé ; si l'oreille se bloque en descente, remonter un peu puis redescendre plus lentement.\n\nPlongée sous-marine : l'azote dissous sous pression peut former des bulles si l'on monte en altitude trop tôt (accident de décompression). Délais recommandés avant de voler : au moins 12 h après une plongée sans palier de décompression, au moins 24 h après une plongée avec paliers.\n\nMal de l'air (cinétose) : conflit entre les informations de la vue et celles de l'oreille interne. Prévention : regarder l'horizon, aérer, limiter les mouvements de tête, piloter en douceur. Les médicaments contre le mal des transports rendent somnolent : à proscrire pour le pilote.","vocab":[["Canaux semi-circulaires","Organes de l'oreille interne qui détectent les rotations"],["Otolithes","Capteurs de l'oreille interne : accélérations linéaires et gravité"],["Trompe d'Eustache","Conduit reliant l'oreille moyenne à l'arrière-gorge"],["Manœuvre de Valsalva","Souffler nez pincé, bouche fermée, pour rééquilibrer l'oreille"],["Illusion somatogravique","Accélération ressentie comme un cabré (et inversement)"],["Illusion de Coriolis","Sensation de culbute en bougeant la tête pendant un virage"],["Barotraumatisme","Lésion due à une différence de pression (oreille, sinus, dents)"],["Cinétose","Mal des transports : conflit entre vue et oreille interne"]],"questions":[["u2s3q01","Que détectent les canaux semi-circulaires de l'oreille interne ?",["Les accélérations linéaires et la pesanteur","Les accélérations angulaires (débuts et fins de rotation)","Les différences de pression entre l'oreille moyenne et l'extérieur","Les rotations à vitesse constante, quelle que soit leur durée"],1,"Les trois canaux semi-circulaires, perpendiculaires entre eux, détectent les accélérations angulaires grâce au mouvement de l'endolymphe. Une rotation constante n'est plus perçue au bout de 10 à 20 secondes ; les accélérations linéaires relèvent des otolithes."],["u2s3q02","Pourquoi les otolithes peuvent-ils tromper le pilote lors d'un décollage de nuit ?",["Ils assimilent une accélération vers l'avant à une tête penchée en arrière","Ils cessent de fonctionner au-delà d'une certaine vitesse de roulage","Ils ne détectent que les rotations autour de l'axe de lacet de l'avion","Ils sont perturbés par la baisse de pression atmosphérique en montée"],0,"Les otolithes réagissent à la résultante de la pesanteur et des accélérations linéaires. Une accélération vers l'avant les sollicite comme une tête basculée vers l'arrière : le pilote ressent un cabré qui n'existe pas (illusion somatogravique)."],["u2s3q03","De nuit, au-dessus d'une zone sans lumière, un pilote remet les gaz et ressent un cabré excessif. Que risque-t-il s'il se fie à cette sensation ?",["Cabrer davantage et décrocher","S'incliner involontairement à gauche","Rendre la main et se rapprocher dangereusement du sol","Rien : l'oreille interne reste fiable sans repères visuels"],2,"C'est l'illusion somatogravique : l'accélération de la remise de gaz est ressentie comme une assiette à cabrer exagérée. Le pilote qui pousse sur le manche pour la corriger met l'avion en descente près du sol ; seule l'assiette lue aux instruments est fiable."],["u2s3q04","En IMC, l'avion s'est incliné très lentement à droite sans que le pilote le perçoive. Le pilote remet brusquement les ailes à plat. Que ressent-il ?",["Une inclinaison à droite, qui l'incite à se pencher à gauche","Une sensation de cabré, due aux otolithes","Aucune sensation particulière, puisque l'avion revient à plat","Une inclinaison à gauche, qui l'incite à se pencher à droite"],3,"C'est l'illusion des « leans » : l'inclinaison lente, sous le seuil de détection, n'a pas été perçue, alors que le retour rapide à plat l'est, comme une mise en virage à gauche. Le pilote se penche alors à droite et risque de réincliner l'avion de ce côté."],["u2s3q05","En virage prolongé en IMC, le pilote baisse brusquement la tête pour ramasser une carte et ressent une violente sensation de culbute. De quelle illusion s'agit-il ?",["L'illusion de Coriolis","L'illusion somatogravique","L'illusion des « leans »","L'illusion du trou noir"],0,"Un mouvement de tête pendant une rotation prolongée stimule simultanément plusieurs canaux semi-circulaires : le cerveau perçoit une rotation dans un plan inattendu. C'est la désorientation la plus violente ; en virage, on évite les mouvements de tête brusques."],["u2s3q06","En IMC, un pilote maintient un virage à taux constant pendant une trentaine de secondes. Que ressent-il alors ?",["Un virage de plus en plus serré","L'impression de ne plus tourner","La même sensation de virage qu'au début","Une sensation de montée continue"],1,"Après 10 à 20 secondes de rotation constante, l'endolymphe tourne à la même vitesse que le canal et les capteurs reviennent au repos : le virage n'est plus ressenti. En revenant ailes à plat, le pilote peut même croire virer en sens inverse."],["u2s3q07","Un pilote VFR entre involontairement dans un nuage. Quelle est la meilleure réaction ?",["Se fier à ses sensations corporelles, qui réagissent plus vite que les instruments","Réduire et piquer franchement pour retrouver au plus vite la vue du sol","Se fier aux instruments, stabiliser l'avion puis faire demi-tour en douceur","Virer immédiatement à forte inclinaison pour ressortir le plus vite possible"],2,"Sans références visuelles, l'oreille interne et les sensations corporelles trompent rapidement le pilote. Il faut piloter aux instruments (assiette, ailes horizontales), puis revenir vers la zone de bonne visibilité par un demi-tour doux et coordonné."],["u2s3q08","Pourquoi les douleurs d'oreille dues à la pression apparaissent-elles surtout en descente ?",["Parce que l'air de l'oreille moyenne se dilate et ne peut plus s'échapper","Parce que la température plus élevée près du sol dilate le tympan","Parce que la trompe d'Eustache se ferme en montée et ne s'ouvre qu'en descente","Parce que la trompe d'Eustache laisse mal entrer l'air dans l'oreille moyenne"],3,"En montée, l'air de l'oreille moyenne, en surpression, s'échappe facilement vers la gorge. En descente, la pression extérieure augmente et la trompe d'Eustache, qui fonctionne comme un clapet, doit être ouverte activement (déglutition, Valsalva)."],["u2s3q09","Le matin d'un vol, un pilote est enrhumé et a le nez bouché. Que doit-il faire ?",["Voler en restant sous 3 000 ft pour limiter les variations de pression","Renoncer au vol : il risque un barotraumatisme de l'oreille ou des sinus","Voler en faisant des descentes rapides pour écourter la gêne","Prendre un décongestionnant sans avis médical et partir comme prévu"],1,"Le rhume bouche la trompe d'Eustache et les orifices des sinus : en descente, les pressions ne peuvent plus s'équilibrer, avec douleurs violentes, voire rupture du tympan. Les décongestionnants ont des effets secondaires et leur effet peut cesser en vol : avis médical indispensable."],["u2s3q10","En descente, un passager ressent une vive douleur à l'oreille que la déglutition ne soulage pas. Quelle est la meilleure action ?",["Remonter un peu, puis redescendre lentement en rééquilibrant (Valsalva)","Accélérer la descente pour abréger au maximum la durée de la douleur","Couper le chauffage et ouvrir les aérations pour rafraîchir la cabine","Lui demander de retenir sa respiration jusqu'à l'atterrissage"],0,"Remonter diminue la pression extérieure et soulage l'oreille ; la descente reprend ensuite à faible taux, en rééquilibrant régulièrement (Valsalva, déglutition, bâillement). Accélérer la descente aggraverait le barotraumatisme."],["u2s3q11","Un pilote a fait ce matin une plongée sous-marine avec paliers de décompression. Quel délai minimal est recommandé avant de voler ?",["2 heures","6 heures","12 heures","24 heures"],3,"L'azote dissous sous pression pendant la plongée peut former des bulles si la pression baisse trop tôt (accident de décompression). On recommande au moins 12 h après une plongée sans palier et au moins 24 h après une plongée avec paliers."],["u2s3q12","Un passager souffre du mal de l'air. Quelle mesure est la plus appropriée ?",["Lui faire lire la carte pour fixer son regard et occuper son esprit","Fermer les aérations et chauffer la cabine pour éviter les frissons","Lui faire regarder l'horizon, aérer et éviter les manœuvres brusques","Enchaîner des virages serrés pour l'habituer au mouvement"],2,"Le mal de l'air naît d'un conflit entre l'oreille interne et la vue. Regarder l'horizon remet ces informations en accord ; l'air frais et un pilotage souple réduisent les symptômes, alors que lire en vol aggrave le conflit."]]},{"id":"u2s4","title":"Santé et aptitude au vol","icon":"🩺","tips":"Un certificat médical valide ne suffit pas : l'aptitude s'évalue avant chaque vol.\n\nMED.A.020 (Part-MED) : le titulaire d'une licence ne doit pas en exercer les privilèges lorsqu'il a conscience d'une diminution de son aptitude médicale, qu'il prend un médicament (prescrit ou non) susceptible de nuire à la sécurité, ou qu'il suit un traitement pouvant compromettre la sécurité du vol. Il doit en outre demander sans délai l'avis d'un médecin aéronautique, avant de voler, après une opération chirurgicale, le début de la prise régulière d'un médicament, une blessure ou une maladie importante, une hospitalisation, une grossesse, ou s'il a besoin pour la première fois de verres correcteurs.\n\nCheck-list personnelle IMSAFE :\n• I – Illness : suis-je malade ?\n• M – Medication : ai-je pris des médicaments ?\n• S – Stress : suis-je préoccupé ?\n• A – Alcohol : ai-je bu ?\n• F – Fatigue : suis-je reposé ?\n• E – Emotion (ou Eating) : suis-je serein, ai-je mangé ?\n\nAlcool : il est éliminé à vitesse à peu près constante, environ 0,10 à 0,15 g/l de sang par heure ; ni le café, ni la douche, ni l'effort ne l'accélèrent. Il provoque une hypoxie histotoxique, dont les effets s'ajoutent à ceux de l'altitude, et perturbe l'oreille interne pendant plusieurs heures. Recommandation minimale : au moins 8 heures entre le dernier verre et le vol, bien davantage après une forte consommation (la « gueule de bois » rend inapte). SERA.2020 interdit d'exercer une fonction critique pour la sécurité aérienne sous l'influence d'une substance psychoactive (alcool, drogues…) qui altère les performances. En pratique : zéro alcool avant le vol.\n\nMédicaments : pas d'automédication. Antihistaminiques, somnifères, antalgiques puissants, médicaments contre le mal des transports ou décongestionnants peuvent provoquer somnolence ou vertiges ; la maladie traitée peut elle-même rendre inapte. Un pictogramme triangulaire sur la boîte signale un risque pour la conduite. En cas de doute, consulter un médecin aéronautique.\n\nFatigue et sommeil : le sommeil s'organise en cycles d'environ 90 minutes (sommeil lent léger, lent profond, paradoxal). La dette de sommeil s'accumule sur plusieurs nuits courtes ; elle favorise les erreurs et les micro-sommeils. Le rythme circadien (horloge interne d'environ 24 h, synchronisée par la lumière) fait chuter la vigilance en fin de nuit, vers 3 h – 5 h, et dans une moindre mesure en début d'après-midi.\n\nDon de sang : le volume sanguin et le transport d'oxygène diminuent ; ne pas voler dans les 24 heures qui suivent.\n\nAutres facteurs : repas sauté (hypoglycémie), déshydratation, fièvre ou troubles digestifs réduisent nettement les performances.","vocab":[["MED.A.020","Règle Part-MED : ne pas voler en cas de baisse d'aptitude"],["AME","Médecin examinateur aéronautique agréé"],["IMSAFE","Auto-évaluation : maladie, médicaments, stress, alcool, fatigue…"],["Alcoolémie","Taux d'alcool dans le sang, exprimé en g/l"],["Hypoxie histotoxique","Cellules incapables d'utiliser l'oxygène (alcool, drogues)"],["Rythme circadien","Horloge biologique d'environ 24 h, réglée par la lumière"],["Dette de sommeil","Manque de sommeil accumulé sur plusieurs nuits"],["Automédication","Prise de médicaments sans avis médical"]],"questions":[["u2s4q01","Le matin d'un vol local, un pilote a de la fièvre et des courbatures. Son certificat médical est valide. Que prévoit MED.A.020 ?",["Il peut voler, puisque son certificat médical est en cours de validité","Il peut voler en local, à condition de ne pas emmener de passager","Il ne doit pas voler tant que son aptitude est diminuée","Il doit d'abord faire renouveler son certificat médical"],2,"MED.A.020 interdit d'exercer les privilèges de la licence dès que le pilote a conscience d'une diminution de son aptitude médicale susceptible de compromettre la sécurité. Le certificat valide ne suffit pas : l'aptitude s'évalue avant chaque vol."],["u2s4q02","Dans lequel de ces cas un pilote doit-il demander l'avis d'un médecin aéronautique avant de voler à nouveau ?",["Il a dormi 7 heures la nuit précédant le vol","Il a besoin pour la première fois de verres correcteurs","Il a eu un rhume, guéri depuis trois semaines","Il a voyagé la veille comme passager d'un avion de ligne"],1,"MED.A.020 impose de demander sans délai l'avis d'un médecin aéronautique notamment en cas de premier besoin de verres correcteurs, d'opération chirurgicale, de début de prise régulière d'un médicament, de maladie ou blessure importante, d'hospitalisation ou de grossesse."],["u2s4q03","À minuit, un pilote a une alcoolémie de 0,90 g/l. En retenant une élimination de 0,15 g/l par heure, à quelle heure son alcoolémie sera-t-elle redevenue nulle ?",["03 h 00","06 h 00","08 h 00","09 h 00"],1,"Durée = 0,90 ÷ 0,15 = 6 h, soit 06 h 00. Avec une élimination plus lente (0,10 g/l par heure), il faudrait 9 h : la vitesse varie d'une personne à l'autre, d'où la nécessité d'une large marge."],["u2s4q04","Concernant l'élimination de l'alcool par l'organisme, quelle affirmation est exacte ?",["Elle se fait à vitesse à peu près constante, sans moyen de l'accélérer","Un café fort ou une douche froide permettent de l'accélérer nettement","Elle est plus rapide en altitude, grâce à la baisse de pression","Un effort physique intense, en faisant transpirer, divise sa durée par deux"],0,"Le foie élimine l'alcool à vitesse à peu près constante, de l'ordre de 0,10 à 0,15 g/l par heure. Café, douche froide ou sport peuvent masquer la somnolence mais ne font pas baisser l'alcoolémie plus vite."],["u2s4q05","Après une soirée bien arrosée, un pilote a laissé passer 8 heures entre son dernier verre et le décollage. Quelle affirmation est exacte ?",["Il est forcément apte, puisque la règle des 8 heures est respectée","Il peut voler s'il boit beaucoup d'eau pour éliminer l'alcool restant","Il peut voler s'il reste sous 3 000 ft pour limiter l'hypoxie","Il n'est pas forcément apte : l'alcool et ses effets peuvent persister"],3,"Les 8 heures sont un minimum, pas une garantie : après une forte consommation, l'alcoolémie peut rester élevée bien plus longtemps, et la « gueule de bois » (fatigue, troubles de l'équilibre) rend inapte même une fois l'alcool éliminé."],["u2s4q06","Un pilote a sauté le petit-déjeuner puis le déjeuner avant un vol prévu en début d'après-midi. Quel risque doit-il anticiper ?",["Une hypoxie histotoxique, comme après la prise d'alcool","Une hyperventilation provoquée par le manque de sucre","Une hypoglycémie : baisse de concentration, fatigue, voire malaise","Aucun risque particulier s'il a bien dormi la nuit précédente"],2,"Sans apport alimentaire, la glycémie baisse : le cerveau, grand consommateur de glucose, fonctionne moins bien (concentration, jugement, irritabilité) et un malaise est possible. Un repas léger avant le vol et une collation à bord évitent ce risque."],["u2s4q07","Avant un vol, un pilote veut prendre un médicament contre le rhume vendu sans ordonnance. Quelle attitude est correcte ?",["Demander l'avis d'un médecin aéronautique avant de le prendre","Le prendre sans crainte, puisqu'il est vendu sans ordonnance","Le prendre une heure avant le vol et partir s'il se sent bien au sol","Le prendre, à condition de voler en local et sans passager"],0,"MED.A.020 vise aussi les médicaments non prescrits : beaucoup provoquent somnolence ou vertiges, parfois seulement en vol. De plus, la maladie traitée peut à elle seule rendre inapte (risque de barotraumatisme avec un rhume)."],["u2s4q08","À quel moment de la journée la vigilance est-elle naturellement la plus basse ?",["Vers 9 h – 11 h","Vers 17 h – 19 h","Vers 21 h – 23 h","Vers 3 h – 5 h"],3,"Le rythme circadien fait chuter la température corporelle et la vigilance en fin de nuit, vers 3 h – 5 h. Une baisse moins marquée existe aussi en début d'après-midi."],["u2s4q09","Concernant la dette de sommeil, quelle affirmation est exacte ?",["Elle ne concerne que les pilotes ayant passé une nuit blanche complète","Elle s'accumule sur plusieurs nuits courtes et favorise les erreurs","Elle est entièrement compensée par la prise régulière de café","Elle affecte la force physique, mais pas le jugement du pilote"],1,"Chaque nuit trop courte alourdit la dette, qui ne se rembourse qu'avec du vrai sommeil, souvent sur plusieurs nuits. Elle dégrade l'attention, la mémoire et la décision, et peut provoquer des endormissements brefs et involontaires."],["u2s4q10","Pourquoi déconseille-t-on de voler dans les 24 heures qui suivent un don de sang ?",["Le point de piqûre risque de saigner sous l'effet de la baisse de pression","Le sang restant se charge en azote, d'où un risque d'accident de décompression","Le volume sanguin et le transport d'oxygène sont réduits, d'où un risque de malaise","Le don de sang provoque une hyperventilation durable, d'où des vertiges"],2,"Après un don, le volume sanguin et le nombre de globules rouges diminuent temporairement : la tolérance à l'altitude et au facteur de charge baisse et un malaise est possible. C'est une forme d'hypoxie hypémique."],["u2s4q11","Dans la check-list personnelle IMSAFE, que représente la lettre A ?",["L'altitude de sécurité","L'aérodrome de dégagement","L'avitaillement en carburant","La consommation d'alcool"],3,"IMSAFE : Illness (maladie), Medication (médicaments), Stress, Alcohol (alcool), Fatigue, Emotion ou Eating (alimentation). C'est une auto-évaluation de l'aptitude du pilote, pas de la préparation du vol."],["u2s4q12","Pourquoi les effets de l'alcool sont-ils plus marqués en altitude ?",["Il gêne l'utilisation de l'oxygène par des cellules déjà moins oxygénées","La baisse de pression fait augmenter le taux d'alcool dans le sang","Le froid de l'altitude ralentit l'élimination de l'alcool par le foie","L'alcool se dilate dans l'estomac selon la loi de Boyle-Mariotte"],0,"L'alcool provoque une hypoxie histotoxique : les cellules utilisent moins bien l'oxygène. En altitude, cette hypoxie s'ajoute au manque d'oxygène de l'air, si bien que les effets d'une même dose sont amplifiés."]]},{"id":"u2s5","title":"Psychologie et prise de décision","icon":"🧠","tips":"Traitement de l'information : les stimuli captés par les sens passent par une mémoire sensorielle très brève, sont filtrés par l'attention et interprétés grâce à l'expérience (perception), puis traités en mémoire de travail avant la décision et l'action. Le retour d'information permet de corriger.\n• Mémoire de travail (à court terme) : capacité d'environ 7 ± 2 éléments, perdus en une vingtaine de secondes sans répétition. Parades : noter les clairances, collationner, regrouper les chiffres.\n• Mémoire à long terme : connaissances (sémantique), souvenirs (épisodique) et savoir-faire automatisés (procédurale).\n• Attention : ressource limitée. On ne traite consciemment qu'une tâche à la fois ; l'attention partagée repose sur les automatismes. La focalisation (« tunnel attentionnel ») fait oublier de piloter.\n\nCharge de travail et stress : selon la loi de Yerkes-Dodson, la performance est maximale pour un niveau d'éveil moyen ; trop faible (ennui, routine) ou trop élevé (surcharge, panique), elle chute. Le stress, physique (bruit, chaleur), physiologique (faim, fatigue) ou psychologique, rétrécit le champ d'attention. Anticiper, respecter les priorités (piloter, naviguer, communiquer) et utiliser les check-lists réduisent la charge.\n\nErreurs et violations :\n• raté : bonne intention, mauvaise exécution (sélectionner le mauvais réservoir) ;\n• oubli : défaillance de mémoire (oublier les volets) ;\n• faute : plan ou décision erronés ;\n• violation : écart volontaire à une règle.\n\nLes cinq attitudes dangereuses et leurs antidotes :\n• anti-autorité (« On ne me dit pas quoi faire ») → suivre les règles, elles sont généralement justifiées ;\n• impulsivité (« Vite, il faut agir ! ») → pas si vite, réfléchir d'abord ;\n• invulnérabilité (« Ça n'arrive qu'aux autres ») → ça peut m'arriver ;\n• machisme (« Je vais leur montrer ») → prendre des risques inutiles est stupide ;\n• résignation (« À quoi bon ? ») → je ne suis pas impuissant, je peux agir.\n\nConscience de la situation : percevoir les éléments, comprendre leur signification, anticiper leur évolution.\n\nTEM (gestion des menaces et des erreurs) : les menaces sont extérieures au pilote (météo, relief, trafic, panne) ; les erreurs viennent du pilote ; mal gérées, elles mènent à un état indésirable de l'avion (trajectoire, vitesse, configuration). On anticipe les menaces au briefing, on détecte et corrige les erreurs.\n\nModèle DECIDE : Détecter le changement, Estimer le besoin de réagir, Choisir l'objectif, Identifier les actions possibles, Do (agir), Évaluer le résultat.\n\nPression d'objectif (« get-there-itis ») : vouloir arriver à tout prix (rendez-vous, passagers, avion à rendre) pousse à continuer malgré la météo ou le carburant. Parades : minima personnels fixés au sol, point de décision prévu sur la route, plan B (demi-tour, déroutement) préparé avant le vol.","vocab":[["Mémoire de travail","Mémoire à court terme : environ 7 éléments, une vingtaine de secondes"],["Loi de Yerkes-Dodson","Performance maximale pour un niveau d'éveil moyen"],["Conscience de la situation","Percevoir, comprendre et anticiper ce qui se passe"],["TEM","Gestion des menaces et des erreurs (Threat and Error Management)"],["Violation","Écart volontaire à une règle ou à une procédure"],["DECIDE","Détecter, Estimer, Choisir, Identifier, agir (Do), Évaluer"],["Get-there-itis","Pression d'objectif : vouloir arriver à destination à tout prix"],["Tunnel attentionnel","Focalisation sur un élément au détriment de tout le reste"]],"questions":[["u2s5q01","Quelle est la capacité moyenne de la mémoire de travail (à court terme) ?",["Environ 7 (± 2) éléments","Environ 2 éléments","Environ 20 éléments","Illimitée, mais pour quelques secondes seulement"],0,"La mémoire de travail retient environ 7 ± 2 éléments pendant une vingtaine de secondes sans répétition. Au-delà, l'information se perd : il faut noter et regrouper les chiffres en blocs."],["u2s5q02","Le contrôleur transmet une longue clairance (cap, altitude, code transpondeur, fréquence). Quelle est la meilleure méthode pour ne pas l'oublier ?",["La répéter mentalement pendant tout le reste du vol","Ne retenir que le code transpondeur, le plus important","Demander au contrôleur de la répéter régulièrement","La noter immédiatement, puis la collationner"],3,"Une clairance complète dépasse vite la capacité de la mémoire de travail. L'écrire dès sa réception libère la mémoire, et le collationnement permet au contrôleur de détecter une erreur de compréhension."],["u2s5q03","Selon la loi de Yerkes-Dodson, quand la performance d'un pilote est-elle la meilleure ?",["Lorsque son niveau d'éveil est très faible, sans aucune tension","Lorsque son niveau d'éveil est maximal, toutes ressources mobilisées","Lorsque son niveau d'éveil est moyen, entre ennui et surcharge","Quel que soit son niveau d'éveil, s'il est expérimenté"],2,"La courbe de Yerkes-Dodson a la forme d'un U inversé : la performance est faible en cas de sous-stimulation (ennui, baisse de vigilance) comme de sur-stimulation (stress, surcharge), et maximale pour un niveau d'éveil intermédiaire."],["u2s5q04","Voulant passer sur le réservoir gauche, un pilote tourne par inadvertance le sélecteur sur le réservoir droit. De quel type d'erreur s'agit-il ?",["Une violation","Un raté (erreur d'exécution)","Une faute de planification","Un oubli (défaillance de mémoire)"],1,"L'intention était correcte mais l'action ne s'est pas déroulée comme prévu : c'est un raté, souvent lié à un défaut d'attention. La faute concerne un plan erroné, l'oubli une action omise, la violation un écart volontaire."],["u2s5q05","Pour gagner du temps, un pilote décide délibérément de ne pas effectuer la check-list avant décollage. De quoi s'agit-il ?",["D'une violation","D'un raté","D'un oubli","D'une faute de connaissance"],0,"Une violation est un écart volontaire à une règle ou à une procédure, contrairement aux erreurs (ratés, oublis, fautes), qui sont involontaires."],["u2s5q06","« Je vais leur montrer que je suis capable de me poser malgré ce vent de travers. » Quelle attitude dangereuse ce pilote exprime-t-il ?",["La résignation","L'anti-autorité","L'impulsivité","Le machisme"],3,"Vouloir prouver ses capacités aux autres en prenant des risques relève du machisme. Antidote : « Prendre des risques inutiles est stupide. »"],["u2s5q07","Quel est l'antidote de l'attitude d'invulnérabilité (« Ça n'arrive qu'aux autres ») ?",["« Pas si vite, réfléchis d'abord. »","« Ça peut m'arriver à moi aussi. »","« Les règles sont généralement justifiées. »","« Je ne suis pas impuissant, je peux agir. »"],1,"Chaque attitude dangereuse a son antidote : invulnérabilité → « ça peut m'arriver » ; impulsivité → « pas si vite » ; anti-autorité → « suivre les règles » ; résignation → « je peux agir »."],["u2s5q08","Quels sont, dans l'ordre, les trois niveaux de la conscience de la situation ?",["Comprendre, percevoir, anticiper","Percevoir, décider, évaluer","Percevoir, comprendre, anticiper","Comprendre, choisir, agir"],2,"On perçoit d'abord les éléments (le vent forcit), on comprend leur signification (la composante traversière approche de la limite), puis on anticipe leur évolution (préparer un déroutement). C'est ce troisième niveau qui permet de décider à temps."],["u2s5q09","Dans le modèle TEM, lequel de ces éléments est une menace ?",["Un orage qui se développe sur la route prévue","Un mauvais calage altimétrique effectué par le pilote","L'oubli de la check-list avant atterrissage","Une vitesse trop élevée en courte finale"],0,"Une menace est un événement extérieur au pilote qui complique le vol (météo, relief, trafic, panne). Le mauvais calage et l'oubli de check-list sont des erreurs ; une vitesse excessive en finale est un état indésirable de l'avion."],["u2s5q10","Dans le modèle de décision DECIDE, quelle est la dernière étape ?",["Détecter qu'un changement est survenu","Choisir l'objectif à atteindre","Identifier les actions possibles","Évaluer le résultat de l'action"],3,"DECIDE : Détecter, Estimer, Choisir, Identifier, Do (agir), Évaluer. La dernière étape boucle le processus : on vérifie que l'action produit le résultat attendu, sinon on reprend la démarche."],["u2s5q11","Un pilote doit rendre l'avion au club le soir même. La météo se dégrade sur la route, mais il continue en volant de plus en plus bas sous les nuages. Quel phénomène illustre cette situation ?",["Un raté (erreur d'exécution involontaire)","La pression d'objectif (« get-there-itis »)","L'attitude de résignation (« À quoi bon ? »)","Une sous-charge de travail (manque d'éveil)"],1,"La volonté d'arriver à tout prix pousse à poursuivre malgré des signaux d'alerte. Parades : minima personnels fixés au sol, point de décision prévu sur la route et plan B (demi-tour, déroutement) préparé avant le départ."],["u2s5q12","En finale, un pilote se concentre entièrement sur un voyant d'alarme et laisse sa vitesse chuter. Quel phénomène illustre cette situation ?",["L'hyperventilation","L'attitude d'anti-autorité","Le tunnel attentionnel","La myopie du champ vide"],2,"L'attention est une ressource limitée : focalisé sur un problème, le pilote cesse de surveiller trajectoire et vitesse (tunnel attentionnel). Priorité absolue : piloter, puis naviguer, puis communiquer."]]}]},{"id":"u3","title":"Météorologie","description":"Atmosphère, humidité et nuages, vent, fronts, phénomènes dangereux et messages météo (METAR, TAF, TEMSI) utiles au pilote VFR (examen : 20 questions, 30 min).","skills":[{"id":"u3s1","title":"Atmosphère, température et pression","icon":"🌡️","tips":"L'atmosphère se divise en couches selon l'évolution de la température.\n• Troposphère : du sol à la tropopause. La température y baisse avec l'altitude et elle contient presque toute la vapeur d'eau : c'est là que se forment les nuages et le « temps ». Épaisseur d'environ 11 km (36 000 ft) aux latitudes moyennes, davantage à l'équateur (≈ 16 km), moins aux pôles (≈ 8 km).\n• Tropopause : limite au-dessus de laquelle la température cesse de décroître.\n• Stratosphère : température constante puis croissante (absorption par l'ozone), air sec et stable.\n\nAtmosphère standard (ISA), référence pour l'étalonnage des altimètres et les performances :\n• au niveau de la mer : 15 °C, 1013,25 hPa, masse volumique 1,225 kg/m³ ;\n• température : −6,5 °C par km, soit environ −2 °C par 1 000 ft, jusqu'à la tropopause à 11 km (36 089 ft), où elle vaut −56,5 °C, puis constante au-dessus ;\n• pression : environ 1 hPa de moins tous les 28 ft près du sol ; 500 hPa vers 18 000 ft.\nÉcart ISA = température réelle − température standard à la même altitude. Ex. : 21 °C à 2 000 ft, standard 11 °C : ISA +10.\n\nCalages altimétriques :\n• QNH : l'altimètre indique l'altitude (au-dessus du niveau moyen de la mer) ; posé, il affiche l'altitude du terrain.\n• QFE : il indique la hauteur au-dessus du terrain ; posé, il affiche 0.\n• 1013 (calage standard) : il indique un niveau de vol (FL 55 = 5 500 ft au-dessus de la surface isobare 1013,25 hPa). En montée, on affiche 1013 en passant l'altitude de transition ; en descente, le QNH en passant le niveau de transition.\n\nErreurs de l'altimètre :\n• Vers une zone de pression plus basse, sans recalage, l'avion est plus bas qu'indiqué : environ 28 ft par hPa d'écart.\n• Dans un air plus froid que l'ISA, même avec le bon QNH, l'avion est aussi plus bas qu'indiqué (ordre de grandeur : 4 % de la hauteur au-dessus de la station par tranche de 10 °C d'écart).\n• Mémo : « du chaud vers le froid, des hautes vers les basses pressions : danger », l'altimètre surestime. Dans le sens inverse, l'avion est plus haut qu'indiqué.\n\nAltitude-pression : altitude lue avec le calage 1013. Altitude-pression ≈ altitude du terrain + (1013 − QNH) × 28 ft.\nAltitude-densité : altitude, en atmosphère standard, où la masse volumique est celle de l'air réel. Elle augmente avec la température, l'altitude et l'humidité. Formule approchée : altitude-densité ≈ altitude-pression + 120 ft × écart ISA. Plus elle est élevée, plus le moteur, l'hélice et l'aile perdent en efficacité : décollage plus long et taux de montée plus faible (« chaud, haut, humide »).","vocab":[["ISA","Atmosphère standard : 15 °C et 1013,25 hPa au niveau de la mer"],["QNH","Calage donnant l'altitude au-dessus du niveau moyen de la mer"],["QFE","Calage donnant la hauteur au-dessus du terrain (0 au sol)"],["Calage standard (1013)","1013,25 hPa affiché : l'altimètre indique un niveau de vol"],["Tropopause","Limite haute de la troposphère, vers 11 km (36 000 ft) en ISA"],["Écart ISA","Température réelle moins température standard à la même altitude"],["Altitude-pression","Altitude lue avec le calage 1013,25 hPa"],["Altitude-densité","Altitude standard de même masse volumique que l'air réel"]],"questions":[["u3s1q01","Dans l'atmosphère standard (ISA), quelles sont la température et la pression au niveau moyen de la mer ?",["15 °C et 1013,25 hPa","0 °C et 1013,25 hPa","15 °C et 1000 hPa","20 °C et 1013,25 hPa"],0,"L'ISA retient au niveau de la mer 15 °C, 1013,25 hPa et une masse volumique de 1,225 kg/m³. Ces valeurs servent de référence à l'étalonnage des altimètres et aux tables de performances."],["u3s1q02","Selon l'atmosphère standard, quelle est la température à 6 000 ft ?",["−3 °C","9 °C","3 °C","−12 °C"],2,"La température ISA baisse d'environ 2 °C par 1 000 ft à partir de 15 °C au niveau de la mer : 15 − (6 × 2) = 3 °C."],["u3s1q03","Sur un aérodrome situé à 3 000 ft d'altitude, le thermomètre indique 17 °C. Quel est l'écart à l'atmosphère standard ?",["ISA +2","ISA +8","ISA +11","ISA −8"],1,"Température standard à 3 000 ft : 15 − (3 × 2) = 9 °C. Écart = 17 − 9 = +8 °C, soit ISA +8. Comparer à 15 °C (ISA +2) revient à oublier la décroissance de la température avec l'altitude."],["u3s1q04","Un avion est posé sur un aérodrome d'altitude 480 ft. Que lit le pilote à l'altimètre, calé successivement au QFE puis au QNH ?",["480 ft au QFE, 0 ft au QNH","0 ft dans les deux cas","480 ft dans les deux cas","0 ft au QFE, 480 ft au QNH"],3,"Calé au QFE, l'altimètre donne la hauteur au-dessus du terrain, donc 0 au sol. Calé au QNH, il donne l'altitude au-dessus du niveau moyen de la mer, donc l'altitude du terrain lorsque l'avion est posé."],["u3s1q05","Un pilote annonce « niveau 55 ». Quel calage a-t-il affiché et que représente cette indication ?",["Le QNH ; 5 500 ft au-dessus du niveau moyen de la mer","1013,25 hPa ; 5 500 ft au-dessus de la surface isobare 1013,25 hPa","Le QFE ; 5 500 ft au-dessus du terrain","1013,25 hPa ; 550 ft au-dessus de la surface isobare 1013,25 hPa"],1,"Un niveau de vol s'exprime en centaines de pieds au-dessus de la surface isobare 1013,25 hPa, altimètre au calage standard : FL 55 = 5 500 ft lus avec 1013. Ce n'est pas une altitude vraie au-dessus de la mer."],["u3s1q06","Vous volez à 3 000 ft indiqués, altimètre calé sur 1018 hPa, vers une région où le QNH est de 1008 hPa, sans modifier le calage. En prenant 1 hPa ≈ 28 ft, quelle est votre altitude réelle à l'arrivée ?",["Environ 2 720 ft","Environ 3 280 ft","3 000 ft","Environ 2 860 ft"],0,"L'altimètre mesure 3 000 ft au-dessus de la surface 1018 hPa, qui se trouve ici 10 × 28 = 280 ft sous le niveau de la mer. Altitude réelle : 3 000 − 280 = 2 720 ft. Vers les basses pressions, l'avion est plus bas qu'indiqué."],["u3s1q07","Altimètre correctement calé au QNH, vous traversez une masse d'air nettement plus froide que l'atmosphère standard. Par rapport à l'altitude indiquée, votre altitude vraie est :",["Plus haute, car l'altimètre sous-estime l'altitude dans l'air froid","Identique, puisque le QNH affiché est correct","Plus haute en montée et plus basse en descente","Plus basse, ce qui réduit la marge au-dessus des obstacles"],3,"Dans l'air froid, la pression diminue plus vite avec l'altitude : l'altimètre, étalonné en ISA, surestime l'altitude. L'avion est plus bas qu'indiqué (« du chaud vers le froid : danger »)."],["u3s1q08","Sans recalage de l'altimètre, quel trajet est le plus dangereux vis-à-vis du relief ?",["D'une zone froide et de basse pression vers une zone chaude et de haute pression","D'une zone froide vers une zone chaude, la pression restant la même","D'une zone chaude et de haute pression vers une zone froide et de basse pression","D'une zone de basse pression vers une zone de haute pression, la température restant la même"],2,"Vers les basses pressions comme vers l'air froid, l'altimètre surestime l'altitude : l'avion est plus bas qu'indiqué, et les deux erreurs s'additionnent ici. Les trois autres trajets placent l'avion plus haut qu'indiqué."],["u3s1q09","Un aérodrome est à 1 200 ft d'altitude et le QNH vaut 1003 hPa. En prenant 1 hPa ≈ 28 ft, quelle est l'altitude-pression du terrain ?",["920 ft","1 480 ft","1 200 ft","1 300 ft"],1,"Altitude-pression = altitude + (1013 − QNH) × 28 = 1 200 + 10 × 28 = 1 480 ft. Un QNH inférieur à 1013 hPa donne une altitude-pression supérieure à l'altitude du terrain."],["u3s1q10","Sur un terrain d'altitude-pression 2 000 ft, la température est de 26 °C. Avec la règle de 120 ft par degré d'écart ISA, quelle est l'altitude-densité approximative ?",["2 000 ft","3 320 ft","5 120 ft","3 800 ft"],3,"Température standard à 2 000 ft : 15 − 4 = 11 °C ; écart ISA = 26 − 11 = +15 °C. Altitude-densité ≈ 2 000 + 15 × 120 = 3 800 ft."],["u3s1q11","Par rapport à une journée standard, quel est l'effet d'une journée chaude et humide sur un terrain élevé ?",["Distance de décollage plus longue et taux de montée plus faible","Distance de décollage plus courte, l'air chaud étant plus porteur","Des performances standard si le QNH vaut 1013 hPa","Puissance moteur accrue mais portance réduite"],0,"Chaleur, altitude et humidité diminuent la masse volumique de l'air : l'altitude-densité augmente. Le moteur, l'hélice et l'aile perdent en efficacité, d'où un roulage plus long et une montée plus faible."],["u3s1q12","Quelle affirmation concernant la troposphère est exacte ?",["La température y augmente avec l'altitude, à cause de l'absorption du rayonnement par l'ozone","Son épaisseur est d'environ 11 km, aussi bien à l'équateur qu'aux pôles","Elle contient presque toute la vapeur d'eau et elle est plus épaisse à l'équateur qu'aux pôles","Sa limite supérieure, la tropopause, marque le début d'une forte baisse de la température"],2,"La troposphère concentre la vapeur d'eau et les nuages ; la température y décroît avec l'altitude. La tropopause, à 11 km en ISA, monte vers 16 km à l'équateur et descend vers 8 km aux pôles ; au-dessus, la température cesse de baisser."]]},{"id":"u3s2","title":"Humidité, nuages et précipitations","icon":"☁️","tips":"L'air contient de la vapeur d'eau, un gaz invisible. Plus l'air est chaud, plus il peut en contenir avant d'être saturé.\n• Saturation : l'air contient le maximum de vapeur possible ; l'excès se condense (nuage, brouillard, rosée). On l'atteint en refroidissant l'air ou en lui ajoutant de la vapeur.\n• Humidité relative (HR) : vapeur contenue / vapeur maximale possible, en %. À contenu en vapeur constant, elle augmente quand l'air se refroidit.\n• Point de rosée (Td) : température à laquelle il faut refroidir l'air, à pression constante, pour le saturer. Il ne dépend que de la quantité de vapeur. T = Td correspond à HR = 100 % ; un faible écart T − Td annonce brouillard ou nuages bas.\n• Chaleur latente : la condensation et la congélation libèrent de la chaleur ; l'évaporation et la fusion en absorbent.\n\nGradients adiabatiques : une particule qui s'élève se détend et se refroidit, sans échange de chaleur avec l'extérieur.\n• Sec (air non saturé) : 1 °C/100 m, soit environ 3 °C/1 000 ft.\n• Saturé : plus faible car la condensation libère de la chaleur, environ 1,5 °C/1 000 ft (moins dans l'air chaud, plus dans l'air froid).\n• Le point de rosée de la particule baisse d'environ 0,5 °C/1 000 ft : l'écart T − Td se réduit donc de 2,5 °C/1 000 ft.\n• Base des cumulus (hauteur au-dessus du sol) ≈ 400 ft × (T − Td) mesurés au sol. Ex. : 24 °C et 14 °C donnent environ 4 000 ft.\n\nStabilité : on compare le gradient réel de l'atmosphère aux gradients adiabatiques.\n• Stable (gradient réel inférieur au saturé, isothermie, inversion) : une particule soulevée redescend. Nuages en couches (St, Sc, As), brume, air calme, visibilité médiocre, bruine ou pluie continue.\n• Instable (gradient réel supérieur au sec) : la particule continue de monter. Nuages cumuliformes (Cu, Cb), averses, turbulence, bonne visibilité hors précipitations.\n• Instabilité conditionnelle : gradient compris entre les deux ; l'air devient instable une fois saturé.\n• Inversion : couche où la température augmente avec l'altitude, très stable ; elle bloque la convection et piège brume et fumées.\n\nLes 10 genres de nuages :\n• Étage supérieur (cristaux de glace) : cirrus (Ci), cirrocumulus (Cc), cirrostratus (Cs, halo).\n• Étage moyen : altocumulus (Ac), altostratus (As).\n• Étage inférieur : stratocumulus (Sc), stratus (St).\n• Grande extension verticale : cumulus (Cu) et cumulonimbus (Cb), à base basse ; nimbostratus (Ns), couche épaisse et sombre étendue sur plusieurs étages.\n\nPrécipitations :\n• Bruine (DZ) : stratus.\n• Pluie ou neige continues (RA, SN) : nimbostratus, altostratus épais.\n• Averses (SHRA, SHSN), grésil (GS), grêle (GR), orages : nuages convectifs (cumulus bourgeonnants, Cb). Elles débutent et cessent brusquement.","vocab":[["Point de rosée (Td)","Température à laquelle l'air refroidi devient saturé"],["Humidité relative","Vapeur contenue / vapeur maximale possible, en %"],["Saturation","État de l'air qui contient le maximum de vapeur d'eau possible"],["Adiabatique sèche","Refroidissement d'un air non saturé qui monte : ≈ 3 °C/1 000 ft"],["Adiabatique saturée","Refroidissement d'un air saturé qui monte : ≈ 1,5 °C/1 000 ft"],["Inversion","Couche où la température augmente avec l'altitude (très stable)"],["Cumulonimbus (Cb)","Nuage d'orage à grand développement vertical, souvent en enclume"],["Nimbostratus (Ns)","Couche nuageuse épaisse et sombre donnant une pluie continue"]],"questions":[["u3s2q01","Qu'est-ce que le point de rosée ?",["La température à laquelle les gouttelettes surfondues d'un nuage se congèlent","La température à laquelle l'air, refroidi à pression constante, atteint 50 % d'humidité relative","La température à laquelle il faut refroidir l'air, à pression constante, pour le saturer","La température la plus basse atteinte en fin de nuit, vers le lever du soleil"],2,"Le point de rosée dépend seulement de la quantité de vapeur contenue dans l'air. Lorsque la température descend jusqu'à lui, l'humidité relative atteint 100 % et la vapeur commence à se condenser."],["u3s2q02","En fin de nuit, la température baisse alors que la quantité de vapeur d'eau dans l'air ne change pas. Que deviennent l'humidité relative et le point de rosée ?",["L'humidité relative augmente, le point de rosée reste le même","L'humidité relative diminue, le point de rosée baisse","L'humidité relative reste la même, le point de rosée augmente","L'humidité relative augmente, le point de rosée baisse autant que la température"],0,"Le point de rosée ne dépend que du contenu en vapeur : il reste constant. L'air froid pouvant contenir moins de vapeur, l'humidité relative augmente, jusqu'à 100 % quand T atteint Td."],["u3s2q03","Au sol, la température est de 25 °C et le point de rosée de 16 °C. À quelle hauteur approximative se situera la base des cumulus ?",["900 ft","1 800 ft","6 400 ft","3 600 ft"],3,"Base des cumulus ≈ 400 ft × (T − Td) = 400 × (25 − 16) = 400 × 9 = 3 600 ft au-dessus du sol."],["u3s2q04","Une particule d'air non saturé s'élève de 2 000 ft. De combien sa température diminue-t-elle ?",["4 °C","6 °C","3 °C","2 °C"],1,"L'air non saturé se refroidit selon l'adiabatique sèche, environ 3 °C par 1 000 ft (1 °C/100 m) : 2 × 3 = 6 °C. Les 2 °C/1 000 ft sont le gradient moyen de l'ISA, pas celui d'une particule qui monte."],["u3s2q05","Pourquoi le gradient adiabatique saturé est-il plus faible que le gradient adiabatique sec ?",["Parce que l'air saturé est plus dense et se détend moins","Parce que les gouttelettes absorbent le rayonnement solaire","Parce que la pression diminue moins vite à l'intérieur d'un nuage","Parce que la condensation de la vapeur libère de la chaleur latente"],3,"En s'élevant, l'air saturé continue de condenser sa vapeur. Cette condensation libère de la chaleur latente qui compense une partie du refroidissement dû à la détente : environ 1,5 °C/1 000 ft au lieu de 3 °C/1 000 ft."],["u3s2q06","Quel temps caractérise généralement une masse d'air stable ?",["Des cumulus bourgeonnants, des averses et de fortes ascendances","Une turbulence thermique marquée et une excellente visibilité","Des nuages en couches, un air calme et une visibilité souvent médiocre","Des orages fréquents l'après-midi, déclenchés par l'échauffement du sol"],2,"Dans l'air stable, les mouvements verticaux sont freinés : nuages stratiformes (St, Sc, As), brume et fumées piégées près du sol, peu de turbulence. Cumulus, averses et orages signent au contraire l'instabilité."],["u3s2q07","Que se passe-t-il dans une couche d'inversion de température ?",["La température augmente avec l'altitude et la couche est très stable","La température diminue de plus de 3 °C/1 000 ft et la couche est instable","La température augmente avec l'altitude et la couche est très instable","La température reste constante avec l'altitude et l'air y est saturé"],0,"Dans une inversion, la température croît avec l'altitude : une particule soulevée devient plus froide que l'air ambiant et redescend. C'est une couche très stable, qui bloque la convection et retient brume et fumées."],["u3s2q08","Le gradient vertical réel de température mesuré dans une couche est de 3,5 °C par 1 000 ft. Comment qualifier cette couche ?",["Absolument stable","Absolument instable","Conditionnellement instable","Neutre"],1,"Le gradient réel (3,5 °C/1 000 ft) dépasse le gradient adiabatique sec (3 °C/1 000 ft) : une particule soulevée, même non saturée, reste plus chaude que l'air ambiant et continue de monter. La couche est absolument instable."],["u3s2q09","Lequel de ces nuages appartient à l'étage supérieur et est constitué de cristaux de glace ?",["L'altostratus","Le stratocumulus","Le cirrostratus","Le nimbostratus"],2,"L'étage supérieur comprend les cirrus, cirrocumulus et cirrostratus, formés de cristaux de glace. Le cirrostratus donne souvent un halo autour du soleil et précède fréquemment un front chaud."],["u3s2q10","Une pluie continue et modérée tombe depuis plusieurs heures sous un plafond bas, gris et uniforme. Quel nuage en est le plus probablement à l'origine ?",["Le cumulonimbus","Le nimbostratus","Le cirrus","Le cumulus de beau temps"],1,"Le nimbostratus est une couche épaisse et sombre, étendue sur plusieurs étages, qui donne des précipitations continues. Le cumulonimbus donne des averses, plus brèves et plus intenses."],["u3s2q11","Des précipitations débutent et cessent brusquement, en alternance avec des éclaircies. De quels nuages proviennent-elles généralement ?",["Des nimbostratus et des altostratus épais","Des stratus bas et des stratocumulus","Des cirrostratus et des cirrocumulus","Des cumulus bourgeonnants et des cumulonimbus"],3,"Ce sont des averses (SH dans les METAR), caractéristiques des nuages cumuliformes de l'air instable. Les nuages stratiformes donnent plutôt des précipitations continues (Ns, As) ou de la bruine (St)."],["u3s2q12","Comment une masse d'air non saturée peut-elle atteindre la saturation ?",["En se refroidissant ou en recevant un apport de vapeur d'eau","En se réchauffant, ce qui augmente son humidité relative","En descendant, car la compression la rapproche de la saturation","En se réchauffant et en perdant une partie de sa vapeur d'eau"],0,"La saturation est atteinte quand la température rejoint le point de rosée : soit l'air se refroidit (soulèvement, rayonnement nocturne, contact d'une surface froide), soit il reçoit de la vapeur (évaporation au-dessus de l'eau ou sous la pluie)."]]},{"id":"u3s3","title":"Le vent","icon":"🌬️","tips":"Le vent est le déplacement horizontal de l'air. On donne la direction d'où il vient, en degrés (un vent du 270 vient de l'ouest), et sa vitesse en nœuds (1 kt ≈ 1,852 km/h). La direction est rapportée au nord vrai dans les METAR et TAF, au nord magnétique quand la tour ou l'ATIS la transmet.\n\nForces en jeu :\n• Force de pression : pousse l'air des hautes vers les basses pressions.\n• Force de Coriolis : due à la rotation de la Terre, elle dévie le mouvement vers la droite dans l'hémisphère nord. Nulle à l'équateur, maximale aux pôles, elle est proportionnelle à la vitesse du vent.\n• Vent géostrophique : équilibre de ces deux forces. Il souffle parallèlement aux isobares, au-dessus de la couche de frottement (environ 2 000 à 3 000 ft), d'autant plus fort que les isobares sont resserrées.\n• Loi de Buys-Ballot (hémisphère nord) : dos au vent, les basses pressions sont à gauche. En vol, un vent venant de la gauche (dérive droite) indique qu'on se dirige vers les basses pressions.\n\nVent au sol : le frottement ralentit l'air, la force de Coriolis diminue et le vent traverse les isobares vers les basses pressions. Sur terre, le vent de surface vaut environ la moitié du vent à 2 000 ft et il est tourné d'environ 30° vers la gauche (environ 10° sur mer). En montant, le vent tourne donc à droite et se renforce. La nuit, le vent de surface faiblit souvent alors qu'il reste fort un peu plus haut.\n\nVents locaux :\n• Brise de mer : le jour, la terre chauffe plus vite que la mer ; en surface, l'air va de la mer vers la terre, surtout l'après-midi. Brise de terre : la nuit, plus faible, de la terre vers la mer.\n• Brise de vallée : le jour, l'air monte le long des pentes ensoleillées. Brise de montagne : la nuit, l'air refroidi descend les pentes vers le fond de la vallée.\n• Rafales : hausses brèves et brutales du vent, notées G dans les METAR.\n\nRelief :\n• Effet de foehn : l'air forcé de monter se refroidit d'abord à 3 °C/1 000 ft, puis à environ 1,5 °C/1 000 ft une fois saturé (nuages et précipitations au vent). Il redescend sous le vent à 3 °C/1 000 ft : il arrive plus chaud et plus sec qu'au départ, sous un ciel dégagé.\n• Ondes orographiques : vent fort à peu près perpendiculaire à une crête, avec une couche stable au-dessus. Indices : nuages lenticulaires immobiles, nuages de rotor déchiquetés sous le vent. Sous le vent, les rotors donnent une turbulence sévère à basse altitude et les descendances peuvent dépasser les capacités de montée d'un avion léger. On aborde une crête en biais (45° environ), avec une bonne marge de hauteur.","vocab":[["Isobare","Ligne reliant les points de même pression"],["Force de Coriolis","Force due à la rotation terrestre, déviant l'air à droite (HN)"],["Vent géostrophique","Vent parallèle aux isobares, équilibre pression/Coriolis"],["Buys-Ballot","Dos au vent, les basses pressions sont à gauche (hémisphère nord)"],["Brise de mer","Vent de jour soufflant de la mer vers la terre"],["Effet de foehn","Air réchauffé et asséché en redescendant sous le vent d'un relief"],["Rotor","Tourbillon très turbulent sous le vent d'un relief, à basse altitude"],["Rafale (G)","Augmentation brève et brutale de la vitesse du vent"]],"questions":[["u3s3q01","Un METAR indique « 09015KT ». Que faut-il comprendre ?",["Le vent souffle vers l'est à 15 kt","Le vent vient de l'est à 15 kt","Le vent vient de l'ouest à 15 kt","Le vent vient de l'est à 15 km/h"],1,"La direction du vent est toujours celle d'où il vient : 090° correspond à l'est. La vitesse est donnée en nœuds (KT)."],["u3s3q02","Quelle affirmation concernant la force de Coriolis est exacte ?",["Elle dévie l'air vers la gauche dans l'hémisphère nord et elle est maximale à l'équateur","Elle pousse l'air des hautes vers les basses pressions","Elle dévie l'air vers la droite dans l'hémisphère nord, avec une intensité indépendante de la vitesse du vent","Elle dévie l'air vers la droite dans l'hémisphère nord et elle est nulle à l'équateur"],3,"Due à la rotation de la Terre, la force de Coriolis dévie les mouvements vers la droite dans l'hémisphère nord. Elle est nulle à l'équateur, maximale aux pôles et proportionnelle à la vitesse du vent. C'est la force de pression qui pousse l'air vers les basses pressions."],["u3s3q03","Quelle affirmation décrit le vent géostrophique ?",["Il souffle parallèlement aux isobares, d'autant plus fort qu'elles sont resserrées","Il souffle perpendiculairement aux isobares, des hautes vers les basses pressions","Il souffle parallèlement aux isobares, d'autant plus fort qu'elles sont espacées","Il ne s'observe qu'au ras du sol, là où le frottement est maximal"],0,"Au-dessus de la couche de frottement, la force de pression est équilibrée par la force de Coriolis : le vent suit les isobares. Plus elles sont serrées, plus le gradient de pression, et donc le vent, est fort."],["u3s3q04","Dans l'hémisphère nord, au-dessus de la couche de frottement, vous volez au cap 360 avec un vent du 270. Vers quelles pressions vous dirigez-vous ?",["Vers des pressions plus hautes","Vous suivez une isobare : la pression ne change pas","Vers des pressions plus basses","Cela dépend de la force du vent, pas de sa direction"],2,"Loi de Buys-Ballot : dos au vent (ici face à l'est), les basses pressions sont à gauche, donc au nord, devant vous. Un vent venant de la gauche (dérive droite) indique qu'on vole vers les basses pressions : l'altimètre surestime l'altitude."],["u3s3q05","Au-dessus de la terre, dans l'hémisphère nord, comment le vent évolue-t-il généralement entre le sol et 2 000 ft ?",["Il tourne à droite et se renforce","Il tourne à gauche et se renforce","Il tourne à droite et faiblit","Il garde la même direction et se renforce"],0,"Près du sol, le frottement ralentit le vent et réduit la force de Coriolis : le vent est plus faible et dévié vers les basses pressions, à gauche du vent en altitude. En montant, il tourne donc à droite (sens horaire) et se renforce."],["u3s3q06","Au-dessus d'une plaine, le vent à 2 000 ft est du 270° pour 30 kt. Quel vent de surface est le plus probable ?",["300° / 15 kt","240° / 15 kt","240° / 40 kt","270° / 30 kt"],1,"Sur terre, le frottement réduit le vent de surface à environ la moitié du vent en altitude et le fait tourner d'environ 30° vers la gauche : 270 − 30 = 240° et 30 / 2 = 15 kt."],["u3s3q07","Par une journée ensoleillée avec un vent général faible, quel vent s'établit l'après-midi sur un aérodrome côtier ?",["Une brise de terre, de la terre vers la mer","Un vent parallèle à la côte, créé par la force de Coriolis","Une brise de mer, de la mer vers la terre","Un calme plat jusqu'au coucher du soleil"],2,"Le jour, la terre s'échauffe plus vite que la mer : l'air chaud s'élève au-dessus des terres et il est remplacé en surface par l'air marin. La brise de terre, plus faible, souffle la nuit en sens inverse."],["u3s3q08","En fin de nuit, par temps clair et calme, quel vent observe-t-on généralement dans une vallée de montagne ?",["Un vent qui remonte les pentes vers les sommets (brise de vallée)","Aucun vent, l'air refroidi restant immobile au contact des pentes","Un vent fort et rafaleux remontant la vallée, dû au rayonnement nocturne","Un vent qui descend les pentes vers le fond de la vallée (brise de montagne)"],3,"La nuit, l'air au contact des pentes se refroidit par rayonnement, devient plus dense et s'écoule vers le bas : c'est la brise de montagne. Le jour, les pentes ensoleillées font au contraire monter l'air (brise de vallée)."],["u3s3q09","Sur le versant au vent d'un relief, l'air est à 15 °C à 1 000 ft. Il devient saturé à 3 000 ft, franchit la crête à 7 000 ft, puis redescend sans nuage sous le vent. Avec 3 °C/1 000 ft (sec) et 1,5 °C/1 000 ft (saturé), quelle est sa température à 1 000 ft sous le vent ?",["21 °C","15 °C","24 °C","12 °C"],0,"Montée sèche de 1 000 à 3 000 ft : 15 − 6 = 9 °C ; montée saturée jusqu'à 7 000 ft : 9 − 4 × 1,5 = 3 °C ; descente sèche de 6 000 ft : 3 + 18 = 21 °C. L'air arrive plus chaud et plus sec : c'est l'effet de foehn."],["u3s3q10","Des nuages lenticulaires immobiles sont visibles au-dessus et sous le vent d'une chaîne de montagnes. Qu'indiquent-ils ?",["Un air très instable en altitude, propice aux orages sur le relief","Un air calme et stable, sans turbulence sous le vent du relief","Un vent faible en altitude, inférieur à 10 kt au niveau des crêtes","Des ondes orographiques, avec risque de rotors et de forte turbulence"],3,"Les lenticulaires se forment aux crêtes des ondes qui s'établissent sous le vent d'un relief par vent fort et air stable en altitude. Sous ces ondes, près du sol, les rotors peuvent provoquer une turbulence sévère."],["u3s3q11","Par vent fort perpendiculaire à une crête, où le risque de turbulence sévère liée aux rotors est-il le plus élevé ?",["Sur le versant au vent, dans l'ascendance de pente près des crêtes","Sous le vent du relief, à basse altitude, sous les crêtes des ondes","Bien au-dessus des nuages lenticulaires, au sommet des ondes","Au-dessus de la plaine située au vent, à quelques kilomètres du relief"],1,"Les rotors sont des tourbillons à axe horizontal qui se forment sous le vent du relief, au-dessous des crêtes des ondes, parfois matérialisés par des nuages déchiquetés. On y rencontre une turbulence sévère à extrême et de fortes descendances."],["u3s3q12","Un METAR indique « 24018G32KT ». Comment le lire ?",["Vent soufflant vers le 240°, 18 kt, rafales à 32 kt","Vent du 240°, 18 kt, avec des rafales atteignant 50 kt","Vent du 240°, vitesse moyenne 18 kt, rafales à 32 kt","Vent du 240°, 18 kt, direction variable sur 32°"],2,"Le groupe donne la direction d'où vient le vent (240°), sa vitesse moyenne (18 kt) puis, après la lettre G, la vitesse maximale des rafales (32 kt). Les rafales ne s'ajoutent pas à la vitesse moyenne."]]},{"id":"u3s4","title":"Masses d'air, fronts et systèmes","icon":"🗺️","tips":"Une masse d'air est un vaste volume d'air aux propriétés (température, humidité) à peu près homogènes, acquises sur sa région d'origine.\n• Selon la latitude : arctique, polaire (froide), tropicale (chaude).\n• Selon la surface d'origine : maritime (humide) ou continentale (sèche).\n• Réchauffée par la base, une masse d'air devient instable ; refroidie par la base, elle devient stable.\n• Polaire maritime arrivant sur un sol plus chaud : instable, cumulus et cumulonimbus, averses, très bonne visibilité hors averses.\n• Tropicale maritime remontant sur une mer ou un sol plus froids : stable, stratus, bruine, brouillard d'advection, visibilité médiocre.\n• Continentale : froide et sèche en hiver, chaude, sèche et souvent brumeuse en été.\n\nCentres d'action (hémisphère nord, près du sol) :\n• Dépression (D ou L) : vent tournant dans le sens inverse des aiguilles d'une montre et convergeant vers le centre ; l'air monte : nuages et précipitations.\n• Anticyclone (A ou H) : vent tournant dans le sens des aiguilles d'une montre et divergent ; l'air descend (subsidence), se réchauffe et s'assèche : temps calme et sec, mais en hiver inversion, brume, stratus et brouillards.\n• Talweg : creux de basses pressions, temps instable ; dorsale : avancée de hautes pressions ; marais barométrique : gradient faible, vents faibles, orages possibles en été.\n\nUn front est la surface de séparation entre deux masses d'air de températures différentes. Les perturbations du front polaire se déplacent en général d'ouest en est.\n• Front chaud (demi-cercles rouges) : l'air chaud glisse lentement au-dessus de l'air froid, selon une pente faible. Nuages annonciateurs plusieurs centaines de kilomètres en avant : Ci, Cs (halo), As, puis Ns. Pluie continue sur une large bande, plafonds de plus en plus bas, visibilité réduite ; en hiver, risque de pluie surfondue en avant du front. Au passage : la pression cesse de baisser, température et point de rosée montent, le vent tourne à droite.\n• Secteur chaud : air tropical maritime doux et humide ; stratus, bruine, visibilité médiocre.\n• Front froid (triangles bleus) : l'air froid, plus dense, s'enfonce sous l'air chaud et le soulève vivement ; pente forte, bande nuageuse étroite. Cu, Cb, averses, orages, rafales, turbulence, cisaillement. Au passage : la pression remonte, température et point de rosée baissent, le vent tourne à droite (par exemple du sud-ouest au nord-ouest).\n• Traîne : air froid instable derrière le front froid ; Cu et Cb épars, averses, parfois de grésil, excellente visibilité entre les averses.\n• Occlusion (triangles et demi-cercles violets, du même côté) : le front froid, plus rapide, rattrape le front chaud et rejette l'air du secteur chaud en altitude. Le temps combine ceux des deux fronts ; des Cb peuvent être noyés dans la masse nuageuse.\n• Front stationnaire : demi-cercles rouges et triangles bleus alternés, de part et d'autre de la ligne.","vocab":[["Masse d'air","Grand volume d'air de température et d'humidité homogènes"],["Dépression","Zone de basse pression ; vent anti-horaire et convergent (HN)"],["Anticyclone","Zone de haute pression ; vent horaire et divergent (HN)"],["Front chaud","L'air chaud remplace l'air froid en glissant au-dessus de lui"],["Front froid","L'air froid remplace l'air chaud en le soulevant vivement"],["Secteur chaud","Air chaud situé entre le front chaud et le front froid"],["Occlusion","Front froid ayant rattrapé le front chaud, air chaud rejeté en haut"],["Traîne","Air froid instable à averses qui suit le passage du front froid"]],"questions":[["u3s4q01","En été, la carte en surface montre un marais barométrique : isobares très espacées et pression à peu près uniforme sur la France. Quel temps faut-il redouter l'après-midi ?",["Un vent fort et régulier de secteur ouest","Une pluie continue sous des nimbostratus","Un brouillard d'advection persistant toute la journée","Des orages isolés, déclenchés par l'échauffement du sol"],3,"Dans un marais barométrique, le gradient de pression est faible, donc le vent aussi. En été, le fort échauffement du sol déclenche la convection : cumulus bourgeonnants puis orages isolés l'après-midi et en soirée."],["u3s4q02","Quelle masse d'air est à la fois la plus chaude et la plus humide ?",["Polaire maritime","Tropicale maritime","Tropicale continentale","Polaire continentale"],1,"« Tropicale » désigne une origine chaude et « maritime » un long parcours sur la mer, donc un air humide. L'air tropical continental est chaud mais sec ; l'air polaire est froid."],["u3s4q03","Sur votre aérodrome, la pression baisse depuis plusieurs heures sous une pluie continue. Puis elle se stabilise, la pluie cesse, la température et le point de rosée montent et le vent tourne du sud au sud-ouest. Que vient-il de se passer ?",["Le front froid est passé : vous êtes dans la traîne","Un front chaud approche, encore à plusieurs centaines de kilomètres","Le front chaud est passé : vous êtes dans le secteur chaud","Un anticyclone s'installe et le temps va rester sec"],2,"Baisse de pression et pluie continue précèdent le front chaud. À son passage, la pression cesse de baisser, l'air plus chaud et plus humide arrive (température et point de rosée en hausse) et le vent tourne à droite. Après un front froid, la température baisserait et la pression remonterait."],["u3s4q04","Dans l'hémisphère nord, près du sol, comment l'air circule-t-il autour d'un anticyclone ?",["Dans le sens des aiguilles d'une montre, en s'écartant du centre","Dans le sens inverse des aiguilles d'une montre, en convergeant vers le centre","Dans le sens des aiguilles d'une montre, en convergeant vers le centre","Dans le sens inverse des aiguilles d'une montre, en s'écartant du centre"],0,"Autour d'un anticyclone, le vent tourne dans le sens horaire (hémisphère nord) et, à cause du frottement, diverge du centre. L'air descend (subsidence), ce qui favorise un temps sec. C'est l'inverse autour d'une dépression."],["u3s4q05","En hiver, un anticyclone persiste sur la France. Quel temps rencontre-t-on souvent en plaine le matin ?",["Des averses orageuses et de la grêle, dues à une forte instabilité","Un vent fort et rafaleux, lié à un gradient de pression marqué","Du brouillard ou des stratus bas piégés sous une inversion","Une pluie continue sous un ciel bas et uniforme de nimbostratus"],2,"Sous l'anticyclone, la subsidence crée une inversion et le vent est faible. Les longues nuits claires refroidissent le sol : brouillards de rayonnement et stratus, parfois persistants toute la journée."],["u3s4q06","À l'approche d'un front chaud, dans quel ordre un observateur au sol voit-il généralement arriver les nuages ?",["Nimbostratus, altostratus, cirrostratus, puis cirrus","Cumulus, cumulonimbus, puis ciel clair","Stratus, stratocumulus, puis cumulus","Cirrus, cirrostratus, altostratus, puis nimbostratus"],3,"L'air chaud monte lentement sur une pente faible : les nuages les plus élevés (Ci, Cs) apparaissent plusieurs centaines de kilomètres en avant, puis la couche s'épaissit et s'abaisse (As, puis Ns avec pluie continue)."],["u3s4q07","Quel temps accompagne typiquement le passage d'un front froid actif ?",["Une pluie continue sur une large bande, puis une hausse de la température et du point de rosée","Des averses, parfois orageuses, et des rafales, puis de l'air plus froid et une pression en hausse","Un voile de cirrus puis d'altostratus qui s'épaissit lentement, sans précipitations notables","Des averses, parfois orageuses, et des rafales, puis de l'air plus chaud et une pression en baisse"],1,"L'air froid soulève brutalement l'air chaud : Cu et Cb sur une bande étroite, averses, orages, rafales et turbulence. Après le passage, la température et le point de rosée baissent et la pression remonte."],["u3s4q08","Au passage d'un front froid dans l'hémisphère nord, comment le vent au sol évolue-t-il ?",["Il tourne à droite, par exemple du sud-ouest au nord-ouest","Il tourne à gauche, par exemple du sud-ouest au sud-est","Il garde sa direction et faiblit","Il devient calme pendant toute la durée de la traîne"],0,"Les fronts sont situés dans des creux de pression (talwegs) : en les franchissant, le vent tourne dans le sens horaire, c'est-à-dire à droite. Avant un front froid, il souffle souvent du sud-ouest ; après, de l'ouest ou du nord-ouest."],["u3s4q09","Quel temps trouve-t-on souvent dans le secteur chaud d'une perturbation, en Europe de l'Ouest ?",["Un temps froid et sec, avec un ciel très bleu","De nombreux cumulonimbus et une excellente visibilité","Des chutes de neige continues","Un temps doux, avec stratus, bruine et visibilité médiocre"],3,"Le secteur chaud est occupé par de l'air tropical maritime, doux et humide, refroidi par la base au contact de la surface : il est stable, d'où stratus bas, bruine et brume."],["u3s4q10","Quel temps caractérise la traîne qui suit un front froid ?",["Des cumulus et cumulonimbus épars, des averses et une très bonne visibilité entre elles","Une couche uniforme de stratus bas, de la bruine et une visibilité médiocre","Un voile de cirrostratus qui s'épaissit progressivement, suivi d'une pluie continue","Un brouillard généralisé et persistant, sous une inversion de subsidence"],0,"Derrière le front froid, l'air froid se réchauffe par la base et devient instable : ciel changeant, averses parfois de grésil ou orageuses, et excellente visibilité entre les averses."],["u3s4q11","Comment se forme une occlusion ?",["Le front chaud, plus rapide, rattrape le front froid et soulève l'air froid","Deux anticyclones se rejoignent et bloquent la perturbation sur place","Le front froid, plus rapide, rattrape le front chaud et soulève l'air chaud","Le front froid ralentit, s'immobilise et devient un front stationnaire"],2,"Le front froid se déplace plus vite que le front chaud. Quand il le rattrape, l'air du secteur chaud est soulevé et ne touche plus le sol : c'est l'occlusion, dont le temps combine ceux des deux fronts."],["u3s4q12","Sur une carte météo, que représente une ligne violette portant, du même côté, des triangles et des demi-cercles alternés ?",["Un front stationnaire","Une occlusion","Un front chaud","Un talweg"],1,"L'occlusion est figurée en violet, triangles et demi-cercles du même côté. Le front froid porte des triangles bleus, le front chaud des demi-cercles rouges ; le front stationnaire alterne demi-cercles rouges et triangles bleus de part et d'autre de la ligne."]]},{"id":"u3s5","title":"Phénomènes dangereux","icon":"⛈️","tips":"Orages. Ils naissent dans les cumulonimbus et exigent trois ingrédients : air instable, humidité abondante et facteur de déclenchement (échauffement du sol l'après-midi, front froid, relief, convergence).\n• Stade cumulus : ascendances dans toute la cellule, le nuage grandit.\n• Stade de maturité : les précipitations atteignent le sol, ascendances et descendances coexistent ; c'est le stade le plus dangereux.\n• Stade de dissipation : les descendances dominent, l'enclume s'étale.\nDangers : turbulence sévère, grêle (y compris sous l'enclume), foudre, givrage fort, cisaillement, rafales descendantes (microrafales) et front de rafales en avant de l'orage. On contourne un Cb largement, sans jamais passer dessous, et on ne décolle ni n'atterrit à l'approche d'un orage.\n\nGivrage. Il se produit quand l'avion, à température négative, rencontre de l'eau surfondue (restée liquide sous 0 °C), dans un nuage ou des précipitations. Il est le plus fréquent aux températures légèrement négatives (de 0 à −15 °C environ) et fort dans les Cu et Cb.\n• Givre blanc : petites gouttelettes qui gèlent instantanément ; dépôt blanc, opaque, rugueux et friable.\n• Givre transparent ou verglas : grosses gouttes qui s'étalent avant de geler ; dépôt lisse, transparent, lourd et très adhérent, le plus dangereux.\n• Pluie surfondue (FZRA) : pluie tombant d'une couche d'air positive dans une couche négative située dessous, typiquement en avant d'un front chaud en hiver ; verglas très rapide, il faut quitter la zone sans attendre.\n• Gelée blanche : cristaux formés directement à partir de la vapeur sur une surface à température négative (avion dehors par nuit claire). Elle dégrade la portance : on l'enlève entièrement avant le vol.\n\nVisibilité, brume et brouillard :\n• Brouillard (FG) : gouttelettes d'eau, visibilité inférieure à 1 000 m.\n• Brume (BR) : gouttelettes, visibilité de 1 000 à 5 000 m ; brume sèche (HZ) : particules sèches.\n• Brouillard de rayonnement : nuit claire, vent faible, air humide ; le sol se refroidit par rayonnement. Fréquent en automne et en hiver, il se dissipe en général dans la matinée.\n• Brouillard d'advection : air doux et humide déplacé sur une surface plus froide (mer, sol froid ou enneigé) ; possible de jour comme de nuit et avec du vent, étendu et durable.\n• Brouillard d'évaporation : air froid au-dessus d'une eau plus chaude, ou pluie tiède tombant dans de l'air froid (brouillard frontal).\n\nTurbulence et cisaillement :\n• Mécanique : vent fort sur le relief et les obstacles (bâtiments, hangars, rotors).\n• Thermique : convection en air instable, sous les cumulus.\n• En air clair (CAT) : en altitude, sans nuage, près des courants-jets.\n• Cisaillement de vent : variation brusque de la direction ou de la force du vent sur une courte distance (orages, fronts, inversion nocturne). Près du sol, une perte de vent de face fait chuter la vitesse indiquée : remise de gaz à pleine puissance.","vocab":[["Eau surfondue","Eau restée liquide à une température inférieure à 0 °C"],["Givre blanc","Glace opaque et friable formée par de petites gouttelettes"],["Givre transparent (verglas)","Glace lisse, lourde et adhérente formée par de grosses gouttes"],["Gelée blanche","Cristaux déposés par la vapeur sur une surface négative"],["Microrafale","Rafale descendante violente et localisée sous un orage"],["Brouillard (FG)","Gouttelettes réduisant la visibilité sous 1 000 m"],["Brume (BR)","Gouttelettes réduisant la visibilité entre 1 000 et 5 000 m"],["Cisaillement de vent","Variation brusque du vent sur une courte distance"]],"questions":[["u3s5q01","Quel événement marque le début du stade de maturité d'une cellule orageuse ?",["L'arrivée des précipitations au sol, ascendances et descendances coexistant","L'apparition des premiers cumulus, portés par de fortes ascendances","La disparition des ascendances, remplacées par des descendances généralisées","La fin des précipitations et l'étalement de l'enclume en altitude"],0,"Au stade de maturité, les précipitations entraînent l'air vers le bas : de violentes descendances côtoient les ascendances. C'est le stade le plus dangereux (grêle, foudre, rafales, turbulence sévère)."],["u3s5q02","Quelles conditions sont nécessaires à la formation d'un orage ?",["Un air stable, une humidité abondante et un soulèvement par le relief","Une inversion de température au sol, un air humide et un ciel clair","Un air sec, une subsidence anticyclonique et un fort ensoleillement","Un air instable, une humidité abondante et un facteur de déclenchement"],3,"Un cumulonimbus exige un air instable sur une grande épaisseur, beaucoup de vapeur d'eau (dont la condensation libère de l'énergie) et un soulèvement initial : échauffement du sol, front froid, relief ou convergence."],["u3s5q03","Un pilote envisage de passer sous un cumulonimbus isolé dont la base paraît haute. Quel danger majeur risque-t-il de rencontrer ?",["Des ascendances régulières, sans descendance ni rafale","La turbulence en air clair liée aux courants-jets d'altitude","Des rafales descendantes et un fort cisaillement de vent","Un dépôt de gelée blanche sur la cellule de l'avion"],2,"Sous un Cb, les descendances violentes (microrafales) peuvent plaquer un avion léger vers le sol et provoquer un cisaillement brutal. On contourne toujours un cumulonimbus largement, sans jamais passer dessous."],["u3s5q04","En courte finale, vous traversez une microrafale sous un orage. Quelle séquence est typique ?",["Un vent arrière (vitesse en chute), puis une forte ascendance, puis un vent de face accru (vitesse en hausse)","Un vent de face (vitesse en hausse), puis une forte descendance, puis un vent arrière (vitesse en chute)","Une forte descendance, puis un vent de face accru (vitesse en hausse) qui rétablit la trajectoire","Un vent de travers qui forcit progressivement, sans effet notable sur la vitesse indiquée"],1,"L'air qui s'écrase au sol s'étale dans toutes les directions : on rencontre d'abord un vent de face (vitesse et trajectoire en hausse), puis la descendance, puis un vent arrière qui fait chuter la vitesse près du sol. Il faut remettre les gaz dès les premiers signes."],["u3s5q05","Dans quelles conditions le givrage de l'avion en vol est-il le plus probable ?",["En ciel clair et sec, par −30 °C, le froid suffisant à givrer la cellule","Dans un nuage ou une précipitation d'eau surfondue, par température négative","Dans les cristaux de glace d'un cirrus, par température très négative","Dans une chute de neige sèche, par −15 °C, sous la base des nuages"],1,"Le givrage se produit quand des gouttes restées liquides sous 0 °C (eau surfondue) heurtent l'avion et gèlent. Sans eau liquide surfondue, en ciel clair ou dans des nuages de glace, le risque est faible."],["u3s5q06","En vol, de grosses gouttes d'eau surfondue heurtent l'avion et s'étalent avant de geler. Quel dépôt se forme ?",["Du givre blanc, opaque, rugueux et friable","De la gelée blanche, faite de fins cristaux","Du givre transparent (verglas), lisse, lourd et très adhérent","Du grésil, fait de petits grains de glace qui rebondissent"],2,"Les grosses gouttes (pluie surfondue, cumulus) ne gèlent pas instantanément : elles s'étalent et forment une glace claire, compacte et difficile à éliminer, qui déforme le profil. Le givre blanc, opaque et friable, provient de petites gouttelettes qui gèlent instantanément."],["u3s5q07","Dans quelle situation rencontre-t-on typiquement de la pluie surfondue (FZRA) en hiver ?",["Dans la traîne d'un front froid, quand les averses de neige fondent près du sol","Au centre d'un anticyclone, sous une inversion, par ciel clair et vent faible","Sous un cumulonimbus, quand la grêle fond dans l'air doux près du sol","En avant d'un front chaud, quand la pluie tombe dans de l'air sous 0 °C près du sol"],3,"La pluie se forme dans l'air chaud au-dessus de la surface frontale, puis tombe dans l'air froid sous-jacent où elle reste liquide en surfusion. Elle gèle instantanément au contact de l'avion : il faut quitter la zone au plus vite."],["u3s5q08","Après une nuit claire et froide, l'avion stationné dehors est recouvert d'une fine couche de gelée blanche. Que faites-vous ?",["Vous l'enlevez entièrement, sur toutes les surfaces, avant le vol","Vous décollez : elle disparaîtra pendant la course au décollage","Vous dégagez le pare-brise et le bord d'attaque des ailes","Vous décollez en augmentant de 5 kt la vitesse de rotation"],0,"Même une fine couche de gelée blanche rend l'extrados rugueux : la portance diminue, la traînée et la vitesse de décrochage augmentent. Les surfaces doivent être entièrement dégagées avant le décollage."],["u3s5q09","Quelles conditions favorisent la formation d'un brouillard de rayonnement ?",["Un ciel couvert, un vent fort et un air sec","Un après-midi ensoleillé et un air instable","Une nuit claire, un vent faible et un air humide","Un air chaud et humide circulant sur une mer froide"],2,"Par nuit claire, le sol perd sa chaleur par rayonnement et refroidit l'air à son contact ; si l'air est humide (faible écart T − Td) et le vent faible, il atteint la saturation. Un air chaud sur une mer froide donne un brouillard d'advection."],["u3s5q10","Un air doux et humide circule par vent de sud-ouest modéré sur une mer froide, puis sur la côte. Quel phénomène est à craindre, de jour comme de nuit ?",["Un brouillard d'advection","Un brouillard de rayonnement","Un brouillard d'évaporation","De la brume sèche"],0,"Le brouillard d'advection naît d'un air chaud et humide refroidi par la base en se déplaçant sur une surface plus froide. Contrairement au brouillard de rayonnement, il se forme avec du vent et quelle que soit l'heure."],["u3s5q11","Qu'est-ce qui distingue le brouillard (FG) de la brume (BR) ?",["Brouillard : visibilité inférieure à 5 000 m ; brume : inférieure à 1 000 m","Brouillard : visibilité inférieure à 1 000 m ; brume : entre 1 000 et 5 000 m","Le brouillard est fait de gouttelettes d'eau, la brume de particules sèches","Le brouillard se forme la nuit, la brume le jour, sous l'effet du soleil"],1,"Brouillard et brume sont tous deux faits de fines gouttelettes d'eau ; c'est la visibilité qui les distingue : moins de 1 000 m pour le brouillard, de 1 000 à 5 000 m pour la brume. La brume sèche (HZ) est due à des particules sèches."],["u3s5q12","Où rencontre-t-on surtout la turbulence en air clair (CAT) ?",["À basse hauteur, sous le vent des hangars, des haies et des bâtiments","Dans les cumulus de beau temps, sous l'effet des ascendances thermiques","Dans les brouillards de rayonnement, sous l'inversion nocturne","En altitude, près des courants-jets, en dehors des nuages"],3,"La CAT est due à un fort cisaillement de vent en altitude, près des courants-jets et de la tropopause. Invisible, elle n'est annoncée par aucun nuage. Près du sol, sous le vent des obstacles, il s'agit de turbulence mécanique."]]},{"id":"u3s6","
