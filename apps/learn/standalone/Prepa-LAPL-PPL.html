<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><script id="lapl-data" type="application/json">{"title":"LAPL(A) / PPL(A)","disclaimer":"Questions d'entraînement originales, rédigées pour cette application. Ce ne sont pas les questions officielles de la DGAC : vérifiez toujours la réglementation dans les textes en vigueur (SERA, Part-FCL, Part-NCO).","exam":{"pass_percent":75,"since":"2023-12-04","subjects":[{"unit":"u1","title":"Droit aérien","questions":20,"minutes":30},{"unit":"u2","title":"Performance humaine","questions":12,"minutes":18},{"unit":"u3","title":"Météorologie","questions":20,"minutes":30},{"unit":"u4","title":"Communications","questions":8,"minutes":12},{"unit":"u5","title":"Navigation","questions":20,"minutes":50},{"unit":"u6","title":"Principes du vol","questions":12,"minutes":18},{"unit":"u7","title":"Procédures opérationnelles","questions":12,"minutes":18},{"unit":"u8","title":"Performances et préparation du vol","questions":12,"minutes":18},{"unit":"u9","title":"Connaissance générale de l'aéronef","questions":12,"minutes":18}]},"units":[{"id":"u1","title":"Droit aérien","description":"La réglementation du vol privé : organisations et textes, licences, règles de l'air, espaces aériens, services ATS et aérodromes (examen : 20 questions, 30 min).","skills":[{"id":"u1s1","title":"Organisations et textes","icon":"📜","tips":"L'OACI (Organisation de l'aviation civile internationale), créée par la Convention de Chicago du 7 décembre 1944, siège à Montréal. Ses 19 annexes contiennent des normes et pratiques recommandées (SARPs) : chaque État s'engage à les appliquer ou notifie ses différences.\n• Annexe 1 : licences du personnel\n• Annexe 2 : règles de l'air\n• Annexe 6 : exploitation technique des aéronefs\n• Annexe 7 : marques de nationalité et d'immatriculation\n• Annexe 8 : navigabilité\n• Annexe 11 : services de la circulation aérienne\n• Annexe 12 : recherche et sauvetage\n• Annexe 13 : enquêtes sur les accidents et incidents\n• Annexe 14 : aérodromes\n• Annexe 15 : services d'information aéronautique\n\nEn Europe, l'EASA (Agence de l'Union européenne pour la sécurité aérienne, Cologne) prépare les règles adoptées par la Commission. Un règlement européen s'applique directement dans chaque État membre, sans transposition ; les textes nationaux (arrêtés) le complètent.\n• Basic Regulation : règlement (UE) 2018/1139, le texte de base\n• Aircrew : règlement (UE) n° 1178/2011, avec la Part-FCL (licences) et la Part-MED (aptitude médicale)\n• SERA : règlement d'exécution (UE) n° 923/2012, les règles de l'air\n• Air Ops : règlement (UE) n° 965/2012 ; sa Part-NCO régit l'exploitation non commerciale des aéronefs motorisés non complexes, donc le vol privé en aéroclub\n\nEn France, la DGAC (Direction générale de l'aviation civile) applique et complète ces textes. La DSAC (Direction de la sécurité de l'aviation civile) est l'autorité de surveillance : elle délivre notamment les licences. La DSNA rend les services de navigation aérienne ; son SIA publie l'information aéronautique.\n\nUn avion immatriculé en France porte la marque F, un tiret et quatre lettres (ex. F-GABC).\n\nDocuments de l'avion (NCO.GEN.135), notamment : manuel de vol, certificat d'immatriculation et certificat de navigabilité (CDN) en original, licence de station d'aéronef (équipements radio), attestation d'assurance, carnet de route, cartes aéronautiques à jour. Le pilote porte sur lui sa licence, son certificat médical et une pièce d'identité avec photo (FCL.045). Ses heures figurent dans son carnet de vol, distinct du carnet de route de l'avion.\n\nInformation aéronautique :\n• AIP (eAIP en ligne) : parties GEN, ENR et AD (aérodromes et cartes VAC) ; amendements selon le cycle AIRAC de 28 jours\n• NOTAM : avis diffusé par télécommunication, information temporaire de courte durée ou urgente\n• SUP AIP : modification temporaire de longue durée (3 mois ou plus) ou riche en texte et en cartes\n• AIC : circulaire d'information aéronautique (explications, sujets administratifs)","vocab":[["OACI","Organisation de l'aviation civile internationale (Montréal)"],["EASA","Agence de l'UE pour la sécurité aérienne (Cologne)"],["DSAC","Direction de la sécurité de l'aviation civile (autorité)"],["SARPs","Normes et pratiques recommandées des annexes OACI"],["Part-NCO","Règles d'exploitation non commerciale (vol privé)"],["CDN","Certificat de navigabilité de l'aéronef"],["NOTAM","Avis aux navigants : information temporaire ou urgente"],["SUP AIP","Supplément AIP : modification temporaire longue ou illustrée"]],"questions":[["u1s1q01","Où se trouve le siège de l'OACI ?",["Genève","Cologne","Montréal","Chicago"],2,"L'OACI, créée par la Convention de Chicago de 1944, siège à Montréal. Cologne accueille le siège de l'EASA."],["u1s1q02","Que contiennent les annexes à la Convention de Chicago ?",["Des normes et pratiques recommandées, à appliquer sauf différences notifiées","Des règlements directement applicables aux pilotes, sans intervention des États","Les consignes d'exploitation propres à chaque aérodrome international du monde","La liste des aéronefs immatriculés dans chaque État signataire de la Convention"],0,"Les 19 annexes rassemblent les SARPs (normes et pratiques recommandées). Elles engagent les États, qui les reprennent dans leur réglementation ou notifient leurs différences à l'OACI."],["u1s1q03","Quelle annexe à la Convention de Chicago traite des règles de l'air ?",["Annexe 1","Annexe 2","Annexe 6","Annexe 11"],1,"L'annexe 2 fixe les règles de l'air, reprises en Europe par SERA. L'annexe 1 traite des licences, l'annexe 6 de l'exploitation et l'annexe 11 des services de la circulation aérienne."],["u1s1q04","Dans quel règlement européen figurent les exigences relatives aux licences de pilote (Part-FCL) ?",["Le règlement Air Ops (UE) n° 965/2012","Le règlement SERA (UE) n° 923/2012","Le règlement de base (UE) 2018/1139","Le règlement Aircrew (UE) n° 1178/2011"],3,"Le règlement Aircrew (UE) n° 1178/2011 contient la Part-FCL (licences) et la Part-MED (aptitude médicale). Air Ops regroupe les règles d'exploitation et SERA les règles de l'air."],["u1s1q05","Un pilote privé loue le DR400 de son aéroclub pour une balade avec des amis. Quelle partie du règlement Air Ops s'applique à ce vol ?",["Part-NCO","Part-CAT","Part-SPO","Part-ORO"],0,"La Part-NCO couvre l'exploitation non commerciale d'aéronefs motorisés non complexes, c'est-à-dire le vol privé. La Part-CAT concerne le transport aérien commercial, la Part-SPO les exploitations spécialisées."],["u1s1q06","Quelle est la portée en France d'un règlement européen comme SERA ?",["Il doit être transposé par une loi française avant de s'appliquer","Il ne s'applique qu'aux vols internationaux, les vols intérieurs restant régis par le droit français","Il s'applique directement, les textes nationaux ne faisant que le compléter","Il n'a qu'une valeur de recommandation tant que la DGAC ne l'a pas repris"],2,"Un règlement de l'Union européenne est obligatoire dans tous ses éléments et directement applicable dans chaque État membre. Les textes français précisent seulement les points laissés aux États."],["u1s1q07","En France, quel organisme est l'autorité qui délivre les licences de pilote et surveille la sécurité de l'aviation civile ?",["La DSNA","La DSAC","Le BEA","L'EASA"],1,"La DSAC, service de la DGAC, est l'autorité de surveillance (licences, aéronefs, organismes de formation). La DSNA fournit les services de navigation aérienne et le BEA enquête sur les accidents."],["u1s1q08","Comment se compose la marque de nationalité et d'immatriculation d'un avion immatriculé en France ?",["Les lettres FR suivies de quatre chiffres","La lettre F suivie de trois chiffres","La lettre F suivie du numéro de série du constructeur","La lettre F, un tiret et quatre lettres"],3,"La marque de nationalité française est F ; elle est suivie d'un tiret et d'une marque d'immatriculation de quatre lettres, par exemple F-GABC (annexe 7 de l'OACI)."],["u1s1q09","Lorsqu'il exerce les privilèges de sa licence, que doit porter le pilote sur lui ?",["Sa licence, son certificat médical et une pièce d'identité avec photo","Sa licence et son carnet de vol, mais pas son certificat médical","Son certificat médical et son attestation de réussite au théorique","Sa licence, sur laquelle le certificat médical est déjà inscrit"],0,"Selon FCL.045, une licence et un certificat médical en état de validité doivent toujours être portés par le pilote qui exerce ses privilèges, ainsi qu'un document d'identité avec photo. Le certificat médical est un document distinct de la licence."],["u1s1q10","À quoi sert le carnet de route d'un avion ?",["À enregistrer les heures de vol personnelles du pilote, pour sa licence","À décrire l'itinéraire prévu et les points de report, comme un plan de vol","À consigner les vols effectués par l'avion (date, équipage, temps de vol...)","À regrouper les procédures normales et d'urgence ainsi que les performances de l'avion"],2,"Le carnet de route appartient à l'avion et retrace ses vols. Les heures du pilote figurent dans son carnet de vol personnel, les procédures dans le manuel de vol."],["u1s1q11","Une modification temporaire valable plusieurs mois, accompagnée de cartes et d'un texte détaillé, est publiée par :",["un NOTAM","un SUP AIP","une AIC","une carte VAC"],1,"Le supplément à l'AIP (SUP AIP) publie les modifications temporaires de longue durée (3 mois ou plus) ou riches en texte et en graphiques. Le NOTAM sert aux informations temporaires de courte durée ou urgentes."],["u1s1q12","Dans quelle partie de l'AIP France trouve-t-on les cartes VAC et les renseignements sur les aérodromes ?",["GEN","ENR","SUP","AD"],3,"L'AIP comprend trois parties : GEN (généralités), ENR (en route : espaces, zones, routes) et AD (aérodromes, avec les cartes d'approche et d'atterrissage à vue VAC)."]]},{"id":"u1s2","title":"Licences et qualifications","icon":"🪪","tips":"Deux licences permettent le vol privé sur avion :\n• LAPL(A) : commandant de bord sur avion monomoteur à pistons ou motoplaneur (TMG) de masse maximale au décollage (MTOM) ≤ 2 000 kg, avec au plus 3 passagers (jamais plus de 4 personnes à bord). Le titulaire d'un LAPL(A) ne peut emmener de passagers qu'après avoir effectué, depuis la délivrance de sa licence, 10 h de vol comme commandant de bord sur avion ou TMG (FCL.105.A ; exemption s'il a déjà détenu un PPL, CPL, MPL ou ATPL avion). Licence européenne non conforme OACI : elle s'exerce dans les États de l'EASA ; ailleurs, l'accord de l'État concerné est nécessaire. Pas de qualification de classe à proroger, mais une exigence de maintien de compétence.\n• PPL(A) : licence conforme à l'annexe 1 de l'OACI, reconnue internationalement, sans limite de masse ni de passagers propre à la licence ; les avions pilotables dépendent des qualifications de classe ou de type détenues (SEP pour les monomoteurs à pistons). Vols non commerciaux, sans rémunération (sauf, sous conditions, pour l'instruction et les examens).\n\nÂges minimaux :\n• premier vol solo : 16 ans, avec l'autorisation de l'instructeur et un certificat médical\n• délivrance du LAPL(A) ou du PPL(A) : 17 ans\n\nCertificats médicaux (Part-MED) : classe 2 au minimum pour le PPL ; certificat LAPL (ou classe 2) pour le LAPL. La validité dépend de l'âge à la date de l'examen :\n• classe 2 : 60 mois avant 40 ans (un certificat délivré avant 40 ans cesse d'être valable à 42 ans), 24 mois de 40 à 50 ans (un certificat délivré avant 50 ans cesse d'être valable à 51 ans), 12 mois après 50 ans\n• LAPL : 60 mois avant 40 ans (fin de validité à 42 ans au plus tard), 24 mois ensuite\n\nQualification SEP : valable 24 mois. Prorogation par un contrôle de compétences avec un examinateur dans les 3 mois précédant l'échéance, ou par expérience dans les 12 mois précédant l'échéance : 12 h de vol dont 6 h de commandant de bord (CdB), 12 décollages, 12 atterrissages et un vol d'entraînement d'au moins 1 h avec un instructeur.\n\nMaintien de compétence LAPL(A) (FCL.140.A) : sur les 24 derniers mois, 12 h de vol comme CdB dont 12 décollages et atterrissages, et 1 h d'entraînement avec un instructeur. À défaut : contrôle de compétences, ou vols complémentaires en double ou en solo supervisé.\n\nExpérience récente (FCL.060) : pour emporter des passagers, 3 décollages, approches et atterrissages dans les 90 jours précédents sur un avion de même type ou classe.\n\nCarnet de vol (FCL.050) : le pilote y consigne tous ses vols.\n\nCompétence linguistique (FCL.055) : mention obligatoire pour utiliser la radiotéléphonie ; niveau 4 (fonctionnel) au minimum, puis 5 (avancé) et 6 (expert, sans limite de validité).\n\nExamen théorique (FCL.025) : 75 % exigés par épreuve, 4 tentatives au plus par épreuve. Toutes les épreuves doivent être réussies dans les 18 mois suivant la fin du mois calendaire de la première tentative. La réussite reste valable 24 mois pour la délivrance de la licence.","vocab":[["LAPL(A)","Licence de pilote d'aéronef léger : ≤ 2 000 kg, ≤ 3 pax après 10 h CdB"],["PPL(A)","Licence de pilote privé avion, conforme à l'OACI"],["SEP","Classe monomoteur à pistons ; qualification valable 24 mois"],["TMG","Motoplaneur (Touring Motor Glider)"],["MTOM","Masse maximale certifiée au décollage"],["Classe 2","Certificat médical minimal exigé pour le PPL"],["Carnet de vol","Registre personnel où le pilote consigne tous ses vols"],["FCL.055","Compétence linguistique : niveaux 4 à 6 portés sur la licence"]],"questions":[["u1s2q01","Lequel de ces vols sort des privilèges d'un titulaire du LAPL(A) qui a effectué 50 h de vol comme commandant de bord depuis la délivrance de sa licence et qui est à jour de ses obligations ?",["Emmener 3 passagers à bord d'un DR400 de 1 100 kg de masse maximale au décollage","Piloter un monomoteur à pistons de 2 200 kg de masse maximale au décollage","Effectuer une navigation de jour vers un aérodrome situé en Allemagne","Faire un vol local de jour, seul à bord"],1,"Le LAPL(A) est limité aux monomoteurs à pistons (ou TMG) de MTOM ≤ 2 000 kg, avec au plus 3 passagers, après 10 h de vol comme CdB effectuées depuis la délivrance de la licence. Ses privilèges s'exercent dans tous les États de l'EASA, dont l'Allemagne."],["u1s2q02","Quelle différence entre le LAPL(A) et le PPL(A) concerne les vols à l'étranger ?",["Le LAPL(A) ne permet pas de quitter le territoire français, même vers un État de l'EASA","Le PPL(A) n'est valable que dans les États de l'EASA, contrairement au LAPL(A)","Aucune : les deux licences sont conformes à l'OACI et reconnues dans le monde entier","Le PPL(A) est conforme à l'OACI, alors que le LAPL(A) est une licence européenne non OACI"],3,"Le PPL(A) respecte l'annexe 1 de l'OACI et il est reconnu internationalement. Le LAPL(A), licence propre à l'EASA, s'exerce dans les États de l'EASA ; ailleurs, il faut l'accord de l'État concerné."],["u1s2q03","Léa, 16 ans et demi, s'entraîne en aéroclub. Que lui permet la réglementation ?",["Voler en solo, autorisée par son instructeur, mais pas encore obtenir sa licence","Obtenir son PPL(A) dès la réussite de son test en vol, sans attendre ses 17 ans","Voler en double commande, le premier solo n'étant permis qu'à partir de 17 ans","Voler en solo sans autorisation particulière, puisqu'elle a plus de 16 ans"],0,"Un élève pilote avion peut voler en solo dès 16 ans, autorisé et supervisé par son instructeur et titulaire d'un certificat médical. Le LAPL(A) et le PPL(A) ne sont délivrés qu'à partir de 17 ans."],["u1s2q04","Un pilote de 45 ans passe sa visite médicale de classe 2. Quelle est la durée de validité de son certificat ?",["12 mois","36 mois","24 mois","60 mois"],2,"Classe 2 : 60 mois avant 40 ans, 24 mois entre 40 et 50 ans, 12 mois au-delà de 50 ans. À 45 ans, le certificat est donc valable 24 mois."],["u1s2q05","Un pilote de 54 ans, titulaire du LAPL(A), renouvelle son certificat médical LAPL. Quelle sera sa durée de validité ?",["12 mois","24 mois","60 mois","6 mois"],1,"Le certificat médical LAPL est valable 60 mois avant 40 ans, puis 24 mois, sans réduction à 50 ans, contrairement à la classe 2 (12 mois après 50 ans)."],["u1s2q06","Quel certificat médical faut-il détenir au minimum pour exercer les privilèges du PPL(A) ?",["Un certificat de classe 2","Un certificat médical LAPL","Un certificat de classe 1","Un certificat de classe 3"],0,"Le PPL exige au minimum un certificat de classe 2 (une classe 1 convient aussi). Le certificat LAPL ne suffit que pour le LAPL et la classe 3 concerne les contrôleurs aériens."],["u1s2q07","Votre qualification SEP expire le 30 juin 2026. Pour la proroger sans contrôle de compétences, que devez-vous avoir réalisé entre le 1er juillet 2025 et le 30 juin 2026 ?",["6 h de vol dont 3 h comme commandant de bord, 6 décollages et 6 atterrissages, et 1 h de vol avec un instructeur","12 h de vol dont 6 h comme commandant de bord, 12 décollages et 12 atterrissages, sans vol avec un instructeur","10 h de vol comme commandant de bord, 10 décollages et 10 atterrissages, et 1 h de vol avec un examinateur","12 h de vol dont 6 h comme commandant de bord, 12 décollages et 12 atterrissages, et 1 h de vol avec un instructeur"],3,"La prorogation par expérience (FCL.740.A) se fait dans les 12 mois précédant l'échéance : 12 h sur la classe dont 6 h CdB, 12 décollages, 12 atterrissages et un vol d'entraînement d'au moins 1 h avec un instructeur. L'autre option est un contrôle de compétences dans les 3 derniers mois."],["u1s2q08","Un titulaire du PPL(A) a effectué 2 décollages et 2 atterrissages sur DR400 au cours des 90 derniers jours. Il veut emmener un ami aujourd'hui. Que doit-il faire ?",["Rien : 2 atterrissages en 90 jours suffisent pour emporter un passager","Rien : il suffit d'avoir volé au moins une fois comme commandant de bord dans les 90 jours","Faire d'abord un décollage, une approche et un atterrissage de plus sur un avion de même classe","Passer un contrôle de compétences avec un examinateur avant tout vol avec passager"],2,"FCL.060 exige, pour emporter des passagers, 3 décollages, approches et atterrissages dans les 90 jours précédents sur un aéronef de même type ou classe. Il lui en manque un, à réaliser seul ou avec un instructeur."],["u1s2q09","Pour exercer les privilèges de son LAPL(A) sans passer de contrôle de compétences, qu'a dû effectuer le pilote ?",["Sur les 12 derniers mois : 12 h de vol comme commandant de bord dont 12 décollages et atterrissages, et 1 h avec un instructeur","Sur les 24 derniers mois : 12 h de vol comme commandant de bord dont 12 décollages et atterrissages, et 1 h avec un instructeur","Sur les 24 derniers mois : 6 h de vol comme commandant de bord dont 6 décollages et atterrissages, et 1 h avec un instructeur","Sur les 90 derniers jours : 3 décollages et atterrissages, et 1 h avec un instructeur"],1,"FCL.140.A : sur les 24 derniers mois, 12 h de vol comme CdB dont 12 décollages et atterrissages, plus 1 h d'entraînement avec un instructeur. À défaut, contrôle de compétences ou vols complémentaires sous supervision."],["u1s2q10","Quel niveau minimal de compétence linguistique faut-il atteindre pour qu'une mention linguistique soit portée sur la licence (FCL.055) ?",["Niveau 4 (fonctionnel)","Niveau 3 (préfonctionnel)","Niveau 5 (avancé)","Niveau 6 (expert)"],0,"La radiotéléphonie exige une mention de compétence linguistique d'au moins niveau 4 (fonctionnel) sur l'échelle OACI. Les niveaux 5 (avancé) et 6 (expert) existent aussi ; le niveau 6 n'a pas de limite de validité."],["u1s2q11","Un candidat présente sa première épreuve théorique le 10 février 2026. Jusqu'à quelle date a-t-il pour réussir l'ensemble des épreuves ?",["10 août 2027","10 février 2028","28 février 2028","31 août 2027"],3,"Le délai de 18 mois court à partir de la fin du mois calendaire de la première tentative : fin février 2026 + 18 mois = 31 août 2027. Les autres dates oublient la fin de mois ou confondent avec la validité de 24 mois."],["u1s2q12","Une fois toutes les épreuves théoriques réussies, pendant combien de temps cette réussite reste-t-elle valable pour la délivrance du PPL(A) ?",["12 mois","18 mois","24 mois","36 mois"],2,"La réussite à l'examen théorique est valable 24 mois pour la délivrance du LAPL ou du PPL (FCL.025). Les 18 mois correspondent au délai accordé pour réussir toutes les épreuves."]]},{"id":"u1s3","title":"Règles de l'air","icon":"↔️","tips":"Le règlement SERA reprend l'annexe 2 de l'OACI. Le commandant de bord reste responsable d'éviter les abordages : voir et éviter.\n\nDroit de passage (SERA.3210) :\n• Rapprochement de face : chacun oblique vers la droite.\n• Routes convergentes à peu près à la même altitude : celui qui voit l'autre à sa droite cède le passage. Mais les aérodynes motopropulsés (avions, hélicoptères) cèdent le passage aux dirigeables, planeurs et ballons ; les dirigeables aux planeurs et ballons ; les planeurs aux ballons ; un aéronef motopropulsé cède aussi le passage à un aéronef qui en remorque un autre.\n• Dépassement : l'aéronef dépassé est prioritaire ; celui qui dépasse s'écarte en obliquant vers la droite.\n• Atterrissage : priorité aux aéronefs qui atterrissent ou sont en phase finale d'approche ; entre deux avions en approche, le plus haut cède le passage au plus bas, qui ne doit pas en profiter pour lui couper la route. Tout aéronef cède le passage à celui qui est contraint d'atterrir.\n\nFeux (SERA.3215) : de nuit, tout aéronef en vol allume ses feux anticollision et ses feux de navigation : rouge à gauche, vert à droite, blanc à l'arrière. Vert à votre gauche et rouge à votre droite : l'avion vient de face. Feu rouge sur votre droite à relèvement constant : il converge depuis votre droite, vous lui cédez le passage.\n\nHauteurs minimales VFR (SERA.5005(f)), hors décollage et atterrissage :\n• au-dessus des agglomérations ou rassemblements de personnes en plein air : 1 000 ft (300 m) au-dessus de l'obstacle le plus élevé dans un rayon de 600 m\n• ailleurs : 500 ft (150 m) au-dessus du sol ou de l'eau, ou de l'obstacle le plus élevé dans un rayon de 150 m\nEn France, l'arrêté du 10 octobre 1957 impose en outre des hauteurs plus élevées au-dessus des agglomérations, selon leur largeur.\n\nNiveaux de croisière VFR : au-dessus de 3 000 ft par rapport au sol ou à l'eau (ou d'une référence plus élevée fixée par l'autorité), selon la route magnétique :\n• de 000° à 179° : milliers impairs + 500 ft (FL 35, 55, 75...)\n• de 180° à 359° : milliers pairs + 500 ft (FL 45, 65, 85...)\nRoute magnétique = route vraie − déclinaison Est (ou + déclinaison Ouest).\n\nCalages altimétriques :\n• QNH : l'altimètre indique l'altitude (au sol, l'altitude du terrain)\n• QFE : l'altimètre indique la hauteur au-dessus de l'aérodrome (0 au sol)\n• 1013,25 hPa : calage standard, l'altimètre indique un niveau de vol (FL, en centaines de pieds)\nAltitude de transition (TA) : au-dessous, on vole au QNH. Niveau de transition (TL) : premier niveau de vol utilisable au-dessus. En montée, on affiche 1013 en franchissant la TA ; en descente, le QNH en franchissant le TL.\nOrdre de grandeur près du sol : 1 hPa ≈ 28 ft. Calage qui augmente, indication qui augmente.","vocab":[["SERA","Règles de l'air européennes (règlement UE n° 923/2012)"],["QNH","Calage donnant l'altitude par rapport au niveau de la mer"],["QFE","Calage donnant la hauteur au-dessus de l'aérodrome"],["1013,25 hPa","Calage standard, qui donne les niveaux de vol"],["FL","Niveau de vol, en centaines de pieds au calage standard"],["TA","Altitude de transition : au-dessous, on vole au QNH"],["TL","Niveau de transition : premier FL utilisable au-dessus de la TA"],["Feu anticollision","Feu à éclats rouge ou blanc qui signale l'aéronef"]],"questions":[["u1s3q01","Selon SERA, quels feux un avion en vol doit-il allumer de nuit ?",["Ses phares d'atterrissage et ses feux de navigation","Ses feux de navigation et son phare de roulage","Ses feux de navigation, le feu anticollision restant facultatif","Ses feux anticollision et ses feux de navigation"],3,"SERA.3215 : de nuit, tout aéronef en vol allume ses feux anticollision, qui attirent l'attention, et ses feux de navigation, qui indiquent sa trajectoire relative à un observateur."],["u1s3q02","Vous pilotez un DR400. Un planeur converge vers vous à la même altitude en venant de votre gauche. Qui doit céder le passage ?",["Vous, car un avion cède le passage aux planeurs","Le planeur, car il vous voit sur sa droite","Le planeur, car il est plus maniable et moins rapide","Personne : chacun oblique vers la droite"],0,"La règle de la priorité à droite s'efface devant les catégories d'aéronefs : un aérodyne motopropulsé (avion, hélicoptère) cède le passage aux dirigeables, planeurs et ballons, d'où qu'ils viennent."],["u1s3q03","De nuit, vous apercevez sur votre droite, à votre altitude, un feu rouge fixe dont le relèvement reste constant. Que faites-vous ?",["Vous maintenez votre cap : il voit votre feu vert et doit vous céder le passage","Vous maintenez votre cap : l'autre avion s'éloigne de vous","Vous lui cédez le passage : il converge vers vous en venant de votre droite","Vous virez à gauche pour passer devant lui au plus vite"],2,"Un relèvement constant signale une route de collision. Voir son feu rouge (aile gauche) sur votre droite indique qu'il vient de votre droite : c'est à vous de céder le passage, sans passer devant lui."],["u1s3q04","Vous rattrapez par l'arrière un avion plus lent, à la même altitude. Comment le dépasser ?",["En modifiant votre cap vers la gauche, l'avion dépassé devant s'écarter vers la droite","En modifiant votre cap vers la droite, l'avion dépassé conservant la priorité","En passant juste au-dessus de lui, sans modifier votre cap","En lui demandant à la radio de s'écarter, puisque vous êtes plus rapide"],1,"L'aéronef dépassé est prioritaire. Celui qui dépasse, en montée, en descente ou en palier, s'écarte en modifiant son cap vers la droite et ne revient qu'une fois complètement dégagé."],["u1s3q05","En tour de piste sur un aérodrome non contrôlé, vous êtes en étape de base à 800 ft ; un autre avion est en finale à 500 ft. Qui a la priorité ?",["Vous, car vous êtes plus près du seuil de piste","Vous, car vous arrivez sur sa droite en étape de base","Celui qui s'est annoncé le premier à la radio sur la fréquence","L'avion en finale, plus bas et en phase finale d'approche"],3,"Les aéronefs en phase finale d'approche sont prioritaires et, entre deux avions en approche, le plus haut cède le passage au plus bas. Vous devez vous intégrer derrière lui."],["u1s3q06","De nuit, vous apercevez droit devant vous, à votre altitude, un feu vert à gauche et un feu rouge à droite. Que faites-vous ?",["Vous obliquez vers la droite : l'avion vient de face","Vous obliquez vers la gauche : l'avion vient de face","Vous maintenez votre cap : l'avion s'éloigne de vous","Vous maintenez votre cap : l'avion croise de droite à gauche devant vous"],0,"Vu de face, un avion montre son feu vert (aile droite) à votre gauche et son feu rouge (aile gauche) à votre droite. En rapprochement de face, chacun oblique vers la droite."],["u1s3q07","Vous survolez une ville dont le sol est à 400 ft d'altitude. L'obstacle le plus élevé dans un rayon de 600 m est une antenne de 150 ft de haut. Quelle altitude minimale impose la règle générale SERA ?",["1 050 ft","1 400 ft","1 550 ft","1 150 ft"],2,"Sommet de l'antenne : 400 + 150 = 550 ft. Au-dessus d'une agglomération, il faut 1 000 ft au-dessus de l'obstacle le plus élevé dans un rayon de 600 m : 550 + 1 000 = 1 550 ft. En France, l'arrêté du 10 octobre 1957 peut imposer davantage selon la largeur de la ville."],["u1s3q08","Hors agglomération et rassemblement de personnes, quelle hauteur minimale SERA impose-t-il à un vol VFR, hors décollage et atterrissage ?",["300 ft au-dessus du sol ou de l'eau, ou de l'obstacle le plus élevé à moins de 150 m","500 ft au-dessus du sol ou de l'eau, ou de l'obstacle le plus élevé dans un rayon de 150 m","1 000 ft au-dessus de l'obstacle le plus élevé dans un rayon de 600 m autour de l'avion","500 ft au-dessus du sol ou de l'eau, sans tenir compte des obstacles alentour"],1,"SERA.5005(f) : hors agglomération, le VFR vole au moins à 500 ft (150 m) au-dessus du sol ou de l'eau, ou de l'obstacle le plus élevé situé dans un rayon de 150 m. Les 1 000 ft dans un rayon de 600 m concernent les agglomérations."],["u1s3q09","Un vol VFR en croisière, soumis à la règle semi-circulaire, suit une route magnétique de 250°. Quels niveaux de vol sont appropriés ?",["FL 45, FL 65, FL 85","FL 35, FL 55, FL 75","FL 40, FL 60, FL 80","FL 50, FL 70, FL 90"],0,"Pour une route magnétique de 180° à 359°, le VFR utilise les milliers pairs + 500 ft (FL 45, 65, 85...). De 000° à 179°, ce sont les milliers impairs + 500 ft. Les niveaux ronds sont ceux des IFR."],["u1s3q10","Votre route vraie est 182° et la déclinaison magnétique vaut 4° Est. Parmi ces niveaux, lequel choisissez-vous pour une croisière VFR soumise à la règle semi-circulaire ?",["FL 65","FL 55","FL 60","FL 50"],1,"Route magnétique = route vraie − déclinaison Est = 182 − 4 = 178°. De 000° à 179°, le VFR vole aux milliers impairs + 500 ft : FL 55. Se fier à la route vraie (182°) conduirait à tort au FL 65."],["u1s3q11","En montée, à quel moment le pilote affiche-t-il le calage standard 1013,25 hPa ?",["Dès le décollage","En franchissant le niveau de transition","En atteignant son niveau de croisière","En franchissant l'altitude de transition"],3,"En montée, on passe du QNH au calage standard en franchissant l'altitude de transition. En descente, on revient au QNH en franchissant le niveau de transition."],["u1s3q12","Un aérodrome a une altitude de 560 ft et le QNH est de 1015 hPa. Quel est approximativement le QFE ? (On prendra 1 hPa = 28 ft.)",["1035 hPa","1015 hPa","995 hPa","1005 hPa"],2,"560 ft correspondent à 560 / 28 = 20 hPa. La pression diminue quand on s'élève : QFE = QNH − 20 = 1015 − 20 = 995 hPa."]]},{"id":"u1s4","title":"Espaces aériens et conditions VMC","icon":"☁️","tips":"Classes d'espace (SERA) et services rendus au VFR :\n• A : VFR interdit.\n• B : clairance ; tous les vols sont séparés entre eux.\n• C : clairance ; le VFR est séparé des IFR et reçoit l'information de trafic sur les autres VFR.\n• D : clairance ; le VFR n'est pas séparé mais reçoit l'information de trafic sur tous les autres vols.\n• E : contrôlé pour les IFR ; le VFR n'a pas besoin de clairance et reçoit l'information de trafic dans la mesure du possible.\n• G : non contrôlé ; information de vol sur demande.\nEn France, on rencontre surtout les classes A, C, D, E et G.\n\nEspaces contrôlés : la CTR (zone de contrôle) part de la surface autour d'un ou plusieurs aérodromes ; la TMA (région de contrôle terminale) et la CTA (région de contrôle) commencent à une limite inférieure au-dessus du sol.\n\nMinimums VMC (SERA.5001) :\n• à 10 000 ft AMSL (FL 100) et au-dessus : visibilité 8 km ; 1 500 m horizontalement et 1 000 ft verticalement des nuages\n• au-dessous, mais au-dessus de 3 000 ft AMSL ou de 1 000 ft au-dessus du relief (la plus haute des deux valeurs) : 5 km ; 1 500 m et 1 000 ft\n• à ou sous cette limite : en classes B à E, 5 km, 1 500 m et 1 000 ft ; en classe G, 5 km, hors des nuages et en vue de la surface (en France, de jour, la visibilité en vol peut être réduite à 1 500 m pour les avions volant à 140 kt IAS ou moins ; cet allègement ne s'applique pas de nuit)\n\nAérodrome situé en CTR (SERA.5005(b)) : pour décoller, atterrir ou entrer dans le circuit, il faut un plafond d'au moins 1 500 ft et une visibilité au sol d'au moins 5 km, sinon une clairance VFR spécial.\n\nVFR spécial (SERA.5010), en CTR, sur clairance et en principe de jour : hors des nuages et en vue de la surface, visibilité en vol d'au moins 1 500 m, vitesse de 140 kt au plus. Le contrôle exige une visibilité au sol d'au moins 1 500 m et un plafond d'au moins 600 ft.\n\nZones :\n• P (interdite) : vol interdit\n• R (réglementée) : pénétration soumise aux conditions publiées\n• D (dangereuse) : activités dangereuses possibles ; pénétration non interdite, sous la responsabilité du pilote\n• TMZ : transpondeur obligatoire ; RMZ : radio obligatoire (annonce et veille sur la fréquence, sans clairance)\nLe SIV (secteur d'information de vol) rend l'information de vol et l'alerte aux vols qui le contactent.\n\nVFR de nuit (SERA.5005(c)), principes : qualification de vol de nuit ; plan de vol si l'on quitte les abords de l'aérodrome ; contact radio maintenu quand c'est possible ; plafond d'au moins 1 500 ft ; aucune réduction de visibilité ; vue continue de la surface sous 3 000 ft AMSL ou 1 000 ft sol.","vocab":[["CTR","Zone de contrôle, qui s'étend à partir de la surface"],["TMA","Région de contrôle terminale, au-dessus d'une limite inférieure"],["VMC","Conditions météo de vol à vue (visibilité, distance aux nuages)"],["VFR spécial","Vol VFR autorisé en CTR sous les minimums VMC, sur clairance"],["RMZ","Zone où la radio est obligatoire (annonce et veille)"],["TMZ","Zone où le transpondeur en fonctionnement est obligatoire"],["SIV","Secteur d'information de vol : information et alerte"],["Zone R","Zone réglementée : pénétration soumise à conditions"]],"questions":[["u1s4q01","Comment appelle-t-on l'espace contrôlé qui s'étend à partir de la surface autour d'un aérodrome ?",["Une TMA","Une CTR","Une CTA","Un SIV"],1,"La CTR (zone de contrôle) part de la surface. La TMA et la CTA sont des régions de contrôle dont la limite inférieure se situe au-dessus du sol ; le SIV n'est pas un espace contrôlé."],["u1s4q02","En espace de classe D, quel service reçoit un vol VFR ?",["Aucun : la classe D est réservée aux vols IFR, le VFR y est interdit","Il est séparé de tous les autres vols, IFR comme VFR, par le contrôleur","Il est soumis à clairance et reçoit l'information de trafic sur les autres vols","Il n'a pas besoin de clairance mais reçoit l'information de trafic si possible"],2,"En classe D, tous les vols sont soumis à clairance. Le VFR n'est pas séparé des autres vols mais reçoit l'information de trafic sur les IFR et les autres VFR. L'absence de clairance correspond à la classe E."],["u1s4q03","Dans laquelle de ces classes d'espace un vol VFR est-il séparé des vols IFR ?",["Classe C","Classe D","Classe E","Classe G"],0,"En classe C, le contrôle sépare les VFR des IFR et donne aux VFR l'information de trafic sur les autres VFR. En classes D, E et G, le VFR n'est pas séparé."],["u1s4q04","Vous volez en VFR à 6 500 ft AMSL, en classe E, au-dessus d'une plaine à 500 ft. Quels minimums VMC s'appliquent ?",["8 km de visibilité, 1 500 m horizontalement et 1 000 ft verticalement des nuages","1 500 m de visibilité, hors des nuages et en vue de la surface","5 km de visibilité, 1 000 m horizontalement et 500 ft verticalement des nuages","5 km de visibilité, 1 500 m horizontalement et 1 000 ft verticalement des nuages"],3,"Au-dessus de 3 000 ft AMSL (ou 1 000 ft sol) et sous 10 000 ft AMSL, toutes classes : 5 km de visibilité, 1 500 m horizontalement et 1 000 ft verticalement des nuages. Les 8 km ne s'appliquent qu'à partir de 10 000 ft (FL 100)."],["u1s4q05","Quelle visibilité minimale en vol faut-il pour un vol VFR au FL 115 ?",["1 500 m","5 km","8 km","10 km"],2,"À 10 000 ft AMSL (FL 100) et au-dessus, SERA impose 8 km de visibilité en vol, avec 1 500 m horizontalement et 1 000 ft verticalement des nuages."],["u1s4q06","En classe G, vous survolez un plateau culminant à 3 000 ft, à l'altitude de 3 500 ft QNH. Quelle distance aux nuages devez-vous respecter ?",["1 500 m horizontalement et 1 000 ft verticalement, car vous êtes au-dessus de 3 000 ft AMSL","Rester hors des nuages et en vue de la surface, car vous êtes à moins de 1 000 ft du relief","1 000 m horizontalement et 500 ft verticalement, minimums propres à la classe G","Aucune distance particulière : en classe G, seule la visibilité compte"],1,"La limite est la plus haute de deux valeurs : 3 000 ft AMSL ou 1 000 ft au-dessus du relief, ici 3 000 + 1 000 = 4 000 ft. À 3 500 ft, vous êtes en dessous : en classe G, il faut rester hors des nuages et en vue de la surface."],["u1s4q07","Le METAR d'un aérodrome situé en CTR indique : visibilité 8 km, BKN 1200 ft. Pouvez-vous décoller en VFR ?",["Non, sauf clairance VFR spécial, car le plafond est inférieur à 1 500 ft","Oui, car la visibilité dépasse 5 km, seul critère exigé au départ","Oui, car le plafond minimal pour décoller en VFR d'un aérodrome en CTR est de 1 000 ft","Non, car une visibilité d'au moins 10 km est exigée pour décoller en CTR"],0,"Sauf clairance VFR spécial, on ne peut décoller, atterrir ou entrer dans le circuit d'un aérodrome en CTR si le plafond est inférieur à 1 500 ft ou la visibilité au sol inférieure à 5 km. Une couche BKN à 1 200 ft forme un plafond insuffisant."],["u1s4q08","De jour, pour accorder un VFR spécial à un avion dans une CTR, quelles valeurs minimales de visibilité au sol et de plafond le contrôle exige-t-il ?",["5 km et 1 500 ft","800 m et 500 ft","3 km et 1 000 ft","1 500 m et 600 ft"],3,"SERA.5010 : visibilité au sol d'au moins 1 500 m et plafond d'au moins 600 ft. Le pilote reste hors des nuages et en vue de la surface, avec 1 500 m de visibilité en vol et 140 kt au plus (800 m concerne les hélicoptères)."],["u1s4q09","Une zone dangereuse (D) est active sur votre trajet. Que prévoit la réglementation ?",["Sa traversée est interdite pendant ses horaires d'activité publiés","Sa traversée exige une clairance de l'organisme de contrôle chargé de la zone","Sa traversée n'est pas interdite mais se fait sous la responsabilité du pilote","Elle est réservée aux aéronefs militaires pendant ses horaires d'activité publiés"],2,"Une zone D signale des activités dangereuses (tirs, largages...) : sa traversée n'est pas interdite mais se fait sous la responsabilité du pilote, qui a intérêt à l'éviter. Une zone P est interdite, une zone R soumise à conditions."],["u1s4q10","Avant d'entrer dans une RMZ, que doit faire un pilote VFR ?",["Obtenir une clairance de l'organisme de contrôle avant d'y pénétrer","Établir le contact radio sur la fréquence publiée et garder l'écoute","Afficher le code transpondeur demandé, sans obligation de contact radio","Déposer un plan de vol au moins une heure avant d'y pénétrer"],1,"Dans une RMZ (zone à radio obligatoire), le pilote annonce son entrée (indicatif, position, altitude, intentions) et garde l'écoute de la fréquence. Aucune clairance n'est requise si l'espace n'est pas contrôlé ; le transpondeur concerne la TMZ."],["u1s4q11","Quels services un SIV (secteur d'information de vol) rend-il aux vols VFR qui le contactent ?",["L'information de vol et le service d'alerte","Le contrôle et la séparation avec les IFR","La délivrance de clairances de traversée","La météo en route, sans service d'alerte"],0,"Le SIV fournit l'information de vol (trafic connu, activité des zones, météo) et le service d'alerte. Ce n'est pas un organisme de contrôle : il ne délivre pas de clairance et n'assure pas de séparation."],["u1s4q12","De nuit, en VFR, vous volez en classe G à 2 000 ft AMSL au-dessus d'une plaine dont l'altitude est de 200 ft. Laquelle de ces exigences SERA vous impose-t-il ?",["Une visibilité en vol de 1 500 m suffit si vous volez à 140 kt IAS ou moins","Un plafond de 1 000 ft suffit, puisque vous volez à moins de 3 000 ft","Aucune exigence propre à la nuit : les minimums VMC de jour s'appliquent tels quels","Garder la vue continue de la surface, puisque vous êtes sous 3 000 ft AMSL"],3,"SERA.5005(c) : de nuit, à ou sous 3 000 ft AMSL ou 1 000 ft au-dessus du relief (la plus haute des deux valeurs), le pilote garde la vue continue de la surface. Le plafond doit être d'au moins 1 500 ft et la réduction de visibilité admise de jour ne s'applique pas."]]},{"id":"u1s5","title":"Services ATS, transpondeur et interception","icon":"📡","tips":"Les services de la circulation aérienne (ATS) rendus au pilote VFR sont de trois types :\n• le contrôle (ATC) : clairances et séparation selon la classe d'espace (tour, approche, contrôle régional) ;\n• l'information de vol (FIS) : renseignements utiles à la sécurité (trafic, météo, état des installations) ;\n• l'alerte : prévenir les organismes de recherche et de sauvetage quand un aéronef a besoin d'aide, et les seconder. Phases : incertitude (INCERFA), alerte (ALERFA), détresse (DETRESFA).\n\nATIS : diffusion automatique et continue des informations d'un aérodrome (piste, vent, visibilité, nuages, QNH...), identifiée par une lettre. Au premier contact, le pilote annonce la lettre reçue.\n\nClairance : autorisation d'évoluer dans les conditions fixées par le contrôle. On collationne notamment piste, calage, code transpondeur, altitude et cap. Si elle ne permet pas de rester en VMC, le pilote le signale et demande une autre clairance : il reste responsable.\n\nPlan de vol (SERA.4001), notamment : vol bénéficiant du contrôle (un appel radio pour une clairance tient lieu de plan de vol abrégé), franchissement d'une frontière (sauf dispositions contraires), vol de nuit quittant les abords d'un aérodrome. À l'arrivée, on le clôture dès que possible ; sans organisme ATS sur l'aérodrome, auprès de l'organisme le plus proche. Sinon, le service d'alerte se déclenche.\n\nTranspondeur :\n• mode A : code à 4 chiffres\n• mode C : ajoute l'altitude-pression (référence 1013,25 hPa)\n• mode S : interrogation sélective, adresse propre à l'avion, identification\nCodes : 7000 VFR, 7500 intervention illicite, 7600 panne radio, 7700 détresse ou urgence.\n\nSignaux lumineux de la tour (en vol / au sol) :\n• vert fixe : autorisé à atterrir / autorisé à décoller\n• rouge fixe : cédez le passage et continuez à tourner / arrêtez\n• éclats verts : revenez pour atterrir / autorisé à rouler\n• éclats rouges : aérodrome dangereux, n'atterrissez pas / dégagez l'aire d'atterrissage\n• éclats blancs : atterrissez ici et gagnez l'aire de trafic / retournez au point de départ\n• artifice rouge : n'atterrissez pas pour le moment\nAccusé de réception en vol : de jour, balancer les ailes (sauf en base et en finale) ; de nuit, faire clignoter deux fois phares ou feux de navigation.\n\nInterception : suivre les instructions de l'intercepteur, appeler sur 121,5 MHz, prévenir l'ATS si possible, afficher 7700 sauf instruction contraire de l'ATS.\n• balancement des ailes puis virage lent en palier, normalement à gauche : « vous avez été intercepté, suivez-moi »\n• dégagement brusque en montée de 90° ou plus : « vous pouvez continuer »\n• train sorti, phares allumés, passage au-dessus de la piste : « atterrissez sur cet aérodrome »\nPour répondre « compris », l'intercepté balance les ailes et suit.","vocab":[["ATC","Service du contrôle de la circulation aérienne"],["FIS","Service d'information de vol"],["ATIS","Diffusion automatique des informations d'aérodrome"],["Clairance","Autorisation d'évoluer dans des conditions fixées par l'ATC"],["Collationnement","Répétition d'un message par le pilote pour le confirmer"],["Mode C","Transmission de l'altitude-pression par le transpondeur"],["7600","Code transpondeur de panne radio"],["DETRESFA","Phase de détresse du service d'alerte"]],"questions":[["u1s5q01","Quel est l'objet du service d'alerte ?",["Prévenir les pilotes en vol des phénomènes météorologiques dangereux sur leur route","Séparer les aéronefs entre eux et leur délivrer des clairances en espace contrôlé","Alerter les organismes de recherche et de sauvetage quand un aéronef a besoin d'aide","Diffuser en continu les informations de l'aérodrome sur une fréquence dédiée"],2,"Le service d'alerte prévient les organismes de recherche et de sauvetage quand un aéronef a besoin d'aide et les assiste. Il est rendu aux vols contrôlés et, autant que possible, aux vols connus des services ATS."],["u1s5q02","Vous avez écouté l'ATIS avant d'appeler la tour. Que devez-vous indiquer lors du premier contact ?",["La lettre d'identification de l'information ATIS reçue","Le texte intégral de l'ATIS, pour collationnement","Rien de particulier : l'ATIS ne concerne que les vols IFR","La météo que vous observez à bord"],0,"Chaque message ATIS porte une lettre (Alpha, Bravo...). En l'annonçant au premier contact, le pilote montre qu'il dispose des informations à jour, ce qui évite de les répéter."],["u1s5q03","En VFR, le contrôleur vous donne une clairance qui vous ferait entrer dans les nuages. Que faites-vous ?",["Vous l'exécutez : une clairance dégage le pilote de sa responsabilité","Vous l'exécutez en passant en IFR, sans le signaler au contrôleur","Vous l'exécutez, puis rédigez un compte rendu d'événement après le vol","Vous signalez ne pas pouvoir rester en VMC et demandez une autre clairance"],3,"Le commandant de bord reste responsable du respect des règles de l'air, dont les conditions VMC. Si une clairance ne lui convient pas, il le signale et peut demander une clairance modifiée."],["u1s5q04","Dans lequel de ces cas SERA rend-il le dépôt d'un plan de vol obligatoire ?",["Un vol local de jour en classe G, sans passager","Un vol VFR de nuit qui quitte les abords de l'aérodrome","Des tours de piste de jour sur un terrain non contrôlé","Un vol de jour en classe G en contact avec le SIV"],1,"SERA.4001 impose notamment un plan de vol pour tout vol de nuit quittant les abords d'un aérodrome, pour le franchissement d'une frontière et pour les vols bénéficiant du contrôle. Un vol de jour en classe G n'en exige pas."],["u1s5q05","Vous atterrissez, au terme d'un vol couvert par un plan de vol, sur un aérodrome dépourvu d'organisme ATS. Que devez-vous faire ?",["Rien : le plan de vol se clôture automatiquement à l'heure d'arrivée prévue","Le clôturer seulement si vous atterrissez après l'heure d'arrivée prévue","Le clôturer au plus vite auprès de l'organisme ATS le plus proche","Prévenir le BEA de votre arrivée, qui transmettra l'information aux services ATS"],2,"Un plan de vol se clôture par un compte rendu d'arrivée. Sans organisme ATS sur place, on le transmet au plus vite à l'organisme le plus proche ; à défaut, le service d'alerte déclenche des recherches."],["u1s5q06","En vol VFR, votre radio tombe complètement en panne. Quel code transpondeur affichez-vous ?",["7600","7000","7500","7700"],0,"7600 signale une panne de radiocommunication. 7000 est le code VFR courant, 7500 l'intervention illicite et 7700 la détresse ou l'urgence."],["u1s5q07","Quelle information d'altitude le mode C du transpondeur transmet-il ?",["L'altitude lue sur l'altimètre, au calage affiché par le pilote (QNH ou QFE)","L'altitude-pression, référencée à 1013,25 hPa, quel que soit le calage affiché","La hauteur au-dessus du sol, mesurée par une radiosonde","L'altitude calculée par le GPS de bord, plus précise que l'altimètre"],1,"Le mode C transmet l'altitude-pression (référence 1013,25 hPa), indépendamment du calage affiché par le pilote. Le système du contrôleur la convertit en altitude avec le QNH local si nécessaire."],["u1s5q08","En vol, près d'un aérodrome contrôlé, vous recevez de la tour une série d'éclats rouges. Que signifie ce signal ?",["Cédez le passage et continuez à tourner","Revenez pour atterrir","Dégagez l'aire d'atterrissage","Aérodrome dangereux, n'atterrissez pas"],3,"En vol, des éclats rouges signifient que l'aérodrome est dangereux : n'y atterrissez pas. Le feu rouge fixe demande de céder le passage et de continuer à tourner ; les éclats verts, de revenir pour atterrir."],["u1s5q09","Au point d'attente, prêt à décoller, vous recevez de la tour un feu vert fixe. Que signifie-t-il ?",["Autorisé à rouler","Arrêtez-vous","Autorisé à décoller","Retournez à votre point de départ"],2,"Au sol, le feu vert fixe autorise le décollage. Les éclats verts autorisent le roulage, le feu rouge fixe ordonne l'arrêt et les éclats blancs le retour au point de départ."],["u1s5q10","De jour, en vent arrière, comment accusez-vous réception d'un signal lumineux de la tour ?",["En balançant les ailes","En allumant et éteignant deux fois vos phares","En braquant la gouverne de direction","En effectuant un virage de 360°"],0,"En vol de jour, on accuse réception en balançant les ailes, sauf en étape de base et en finale. De nuit, on fait clignoter deux fois les phares ou les feux de navigation ; au sol, de jour, on bouge les ailerons ou la direction."],["u1s5q11","Vous êtes intercepté par un avion militaire. Que devez-vous faire ?",["Afficher 7500, prévenir l'ATS et poursuivre votre route en attendant ses instructions","Suivre ses instructions, appeler sur 121,5 MHz et afficher 7700 (sauf instruction ATS)","Dégager par un virage serré pour éviter tout risque d'abordage avec l'intercepteur","Couper le transpondeur et la radio pour ne pas brouiller les liaisons de l'intercepteur"],1,"L'aéronef intercepté suit les instructions de l'intercepteur, appelle sur 121,5 MHz en donnant son identité et la nature de son vol, prévient l'ATS si possible et affiche 7700, sauf instruction contraire de l'ATS."],["u1s5q12","L'avion intercepteur, placé légèrement au-dessus, devant et à votre gauche, balance les ailes puis effectue un virage lent en palier vers la gauche. Que signifie cette manœuvre ?",["Vous pouvez continuer","Atterrissez sur cet aérodrome","Montez immédiatement et dégagez la zone","Vous avez été intercepté, suivez-moi"],3,"Balancement des ailes puis virage lent en palier signifie « vous avez été intercepté, suivez-moi » ; on répond en balançant les ailes et en suivant. Un dégagement brusque en montée signifierait « vous pouvez continuer »."]]},{"id":"u1s6","title":"Aérodromes, incidents et sécurité","icon":"🛬","tips":"Marques au sol (annexe 14) :\n• Les marques de piste sont blanches ; celles des voies de circulation sont jaunes.\n• Le numéro de piste est l'orientation magnétique de l'axe, vue du côté de l'approche, divisée par 10 et arrondie : axe au 263° → piste 26 ; l'autre extrémité porte 08. Pistes parallèles : L, C, R.\n• Point d'attente avant piste : deux lignes jaunes continues et deux discontinues ; on s'arrête avant les lignes continues, situées côté voie de circulation.\n• Une croix sur une piste ou une voie de circulation : zone inutilisable.\n\nSignaux au sol (aire à signaux) :\n• carré rouge à deux diagonales jaunes : atterrissage interdit\n• carré rouge à une diagonale jaune : précautions spéciales à l'approche et à l'atterrissage\n• haltère blanche : décollages, atterrissages et roulage sur les pistes et voies de circulation uniquement\n• T d'atterrissage blanc ou orange : atterrir parallèlement à la barre du T, vers la barre transversale\n• double croix blanche : vols de planeurs en cours\n• flèche coudée vers la droite, de couleur voyante : virages à droite (tour de piste main droite)\n• lettre C noire sur fond jaune : bureau de piste\n\nManche à air : elle s'étire dans le sens où va le vent ; on décolle et on atterrit face au vent.\n\nTour de piste : sauf indication contraire, tous les virages se font à gauche (main gauche). Altitude du circuit, sens, points d'entrée et consignes figurent sur la carte VAC (carte d'approche et d'atterrissage à vue), publiée dans la partie AD de l'AIP.\n\nAccidents et incidents :\n• Accident : personne tuée ou grièvement blessée, dommage important à l'aéronef, ou aéronef disparu.\n• Incident grave : incident dont les circonstances indiquent une forte probabilité d'accident.\n• Le BEA enquête sur les accidents et incidents graves dans le seul but de prévenir de futurs accidents, sans rechercher les responsabilités. Tout accident ou incident grave lui est notifié sans délai.\n• Règlement (UE) n° 376/2014 : les événements soumis à notification obligatoire sont notifiés dans les 72 heures ; la « culture juste » protège celui qui notifie de bonne foi.\n\nRecherche et sauvetage (SAR) : déclenchée par le service d'alerte et coordonnée en France par l'ARCC. Balise de détresse (ELT) : 406 MHz, avec 121,5 MHz pour le radioralliement. Code visuel sol-air des survivants : V = besoin d'assistance, X = besoin d'assistance médicale, N = non, Y = oui, flèche = nous partons dans cette direction.\n\nSurvol de l'eau (Part-NCO) : sur monomoteur terrestre, un gilet de sauvetage par occupant est exigé au-delà de la distance de vol plané de la terre, ou au décollage et à l'atterrissage si la trajectoire expose à un amerrissage forcé. Plus loin des côtes, le commandant de bord évalue l'emport de canots et de moyens de signalisation.","vocab":[["VAC","Carte d'approche et d'atterrissage à vue d'un aérodrome"],["QFU","Orientation magnétique de l'axe de piste"],["Aire à signaux","Emplacement de l'aérodrome où sont exposés les signaux au sol"],["Manche à air","Indicateur de la direction et de la force du vent"],["BEA","Organisme français d'enquête de sécurité sur les accidents"],["Incident grave","Incident ayant présenté une forte probabilité d'accident"],["SAR","Recherche et sauvetage (Search and Rescue)"],["ELT","Balise de détresse émettant sur 406 MHz"]],"questions":[["u1s6q01","Quel numéro est peint au seuil d'une piste dont l'axe, vu du côté de l'approche, est orienté au 263° magnétique ?",["26","27","08","09"],0,"Le numéro de piste est l'orientation magnétique divisée par 10 et arrondie à l'entier le plus proche : 263° → 26,3 → 26. L'extrémité opposée (083°) porte le numéro 08."],["u1s6q02","Au point d'attente avant piste, le marquage comporte deux lignes jaunes continues et deux lignes discontinues. Où vous arrêtez-vous en attendant l'autorisation ?",["Après les lignes discontinues, côté piste","Entre les lignes continues et les lignes discontinues","Avant les lignes continues, situées du côté de la voie de circulation","Avant les lignes discontinues, situées du côté de la voie de circulation"],2,"Les lignes continues font face à l'avion qui arrive par la voie de circulation : on s'arrête avant elles. Les lignes discontinues, côté piste, se franchissent pour dégager la piste après l'atterrissage."],["u1s6q03","Dans l'aire à signaux, vous apercevez un panneau carré rouge horizontal barré de deux diagonales jaunes. Que signifie-t-il ?",["Précautions spéciales à prendre à l'approche et à l'atterrissage","Atterrissage interdit","Vols de planeurs en cours","Tour de piste à droite"],1,"Le carré rouge à deux diagonales jaunes interdit l'atterrissage, pour une durée susceptible de se prolonger. Avec une seule diagonale, il impose des précautions spéciales à l'approche et à l'atterrissage."],["u1s6q04","Que signale une double croix blanche disposée horizontalement dans l'aire à signaux ?",["Une piste fermée","Un atterrissage interdit","L'emplacement du bureau de piste","Des vols de planeurs en cours"],3,"La double croix blanche signale une activité de vol à voile : planeurs et remorqueurs évoluent sur l'aérodrome. Une croix simple sur une piste ou une voie indique une zone inutilisable."],["u1s6q05","Sur un aérodrome non contrôlé doté d'une piste 09/27, l'extrémité libre de la manche à air pointe vers l'ouest. Quelle piste utilisez-vous ?",["La piste 09, car le vent vient de l'est","La piste 27, car le vent vient de l'ouest","La piste 27, car la manche indique le sens d'atterrissage","L'une ou l'autre, la manche n'indiquant que la force du vent"],0,"La manche s'étire dans le sens où va le vent : extrémité libre vers l'ouest, donc vent d'est. On atterrit face au vent, au cap 090°, c'est-à-dire sur la piste 09."],["u1s6q06","Dans l'aire à signaux d'un aérodrome non contrôlé, vous voyez une flèche coudée vers la droite, de couleur voyante. Comment effectuez-vous le tour de piste ?",["Main gauche, la flèche indiquant la direction d'où vient le vent","Main gauche, la flèche indiquant le côté de dégagement de la piste","Main droite : virages à droite avant l'atterrissage et après le décollage","Main droite pour planeurs et remorqueurs, main gauche pour les avions"],2,"Sauf indication contraire, le tour de piste se fait main gauche. La flèche coudée vers la droite indique que les virages se font à droite avant l'atterrissage et après le décollage."],["u1s6q07","Où trouvez-vous l'altitude du tour de piste, les points d'entrée et les consignes particulières d'un aérodrome ?",["Dans la partie GEN de l'AIP","Sur la carte VAC de l'aérodrome","Dans le manuel de vol de l'avion","Sur la carte aéronautique au 1/500 000"],1,"La carte VAC (carte d'approche et d'atterrissage à vue), publiée dans la partie AD de l'AIP, donne les fréquences, le tour de piste, les points d'entrée et de sortie et les consignes locales."],["u1s6q08","Quelle est la mission du BEA ?",["Sanctionner les pilotes et organismes responsables d'accidents ou d'incidents","Délivrer, suspendre et retirer les licences de pilote après un accident","Coordonner les opérations de recherche et de sauvetage des aéronefs en détresse","Enquêter sur les accidents et incidents graves pour en prévenir d'autres"],3,"Le BEA mène les enquêtes de sécurité sur les accidents et incidents graves. Son but est la prévention, non la recherche des fautes ou des responsabilités, qui relève d'autres procédures."],["u1s6q09","Selon le règlement (UE) n° 376/2014, dans quel délai un pilote doit-il notifier un événement soumis à notification obligatoire ?",["24 heures","48 heures","72 heures","7 jours"],2,"Le règlement (UE) n° 376/2014 impose de notifier les événements obligatoires dans les 72 heures suivant leur prise de connaissance, sauf circonstances exceptionnelles. Un accident ou incident grave se notifie en outre sans délai au BEA."],["u1s6q10","Qu'est-ce qu'un incident grave ?",["Un incident dont les circonstances indiquent une forte probabilité d'accident","Un incident ayant entraîné un retard ou un déroutement de plus d'une heure","Un accident n'ayant fait aucun blessé parmi les occupants de l'aéronef","Un incident survenu en espace contrôlé et signalé par le contrôleur"],0,"Un incident grave est un incident dont les circonstances indiquent une forte probabilité d'accident (quasi-abordage, perte de contrôle rattrapée de justesse...). Comme un accident, il doit être notifié sans délai au BEA."],["u1s6q11","Après un atterrissage forcé, vous voulez signaler aux sauveteurs que vous avez besoin d'une assistance médicale. Quel symbole tracez-vous au sol ?",["V","X","N","Y"],1,"Dans le code visuel sol-air des survivants, X signifie « besoin d'assistance médicale » et V « besoin d'assistance ». N veut dire non et Y oui."],["u1s6q12","Sur un monomoteur terrestre exploité selon la Part-NCO, dans quel cas un gilet de sauvetage est-il exigé pour chaque occupant ?",["Dès que l'avion survole un lac, même à distance de plané de la rive","Au-delà de 50 NM de la côte ; en deçà, le gilet reste facultatif","Lors des vols de nuit au-dessus de l'eau, dès la côte franchie","Lors du survol de l'eau au-delà de la distance de vol plané de la terre"],3,"La Part-NCO (NCO.IDE.A.175) exige un gilet par occupant sur monomoteur terrestre survolant l'eau au-delà de la distance de vol plané, ou lorsque le décollage ou l'approche se fait au-dessus de l'eau avec un risque d'amerrissage forcé. Le critère « 30 min de vol ou 50 NM » vise les autres avions, comme les multimoteurs : un monomoteur terrestre est concerné bien avant, dès qu'il sort de la distance de plané."]]}]},{"id":"u2","title":"Performance humaine","description":"Physiologie et psychologie du pilote : hypoxie, vision, oreille interne, aptitude au vol et prise de décision (examen : 12 questions, 18 min).","skills":[{"id":"u2s1","title":"Atmosphère, respiration et hypoxie","icon":"🫁","tips":"L'air sec contient environ 78 % d'azote, 21 % d'oxygène et 1 % d'autres gaz (argon, CO2…). Ces proportions restent les mêmes en altitude : c'est la pression qui diminue.\n• Loi de Dalton : pression partielle d'un gaz = sa proportion × pression totale, soit PO2 ≈ 0,21 × P. Au niveau de la mer (1013 hPa), PO2 ≈ 213 hPa ; vers 18 000 ft (≈ 500 hPa), elle est divisée par deux.\n• Loi de Boyle-Mariotte : à température constante, P × V = constante. Les gaz piégés (oreille moyenne, sinus, intestins, dents abîmées) se dilatent en montée.\n• Loi de Henry : la quantité de gaz dissous dans un liquide est proportionnelle à sa pression partielle. Une baisse de pression trop rapide libère des bulles d'azote (accident de décompression, surtout après une plongée).\n\nL'hypoxie est un manque d'oxygène dans les tissus. Quatre types :\n• hypoxique : PO2 trop faible (altitude) ;\n• hypémique ou anémique : le sang transporte mal l'O2 (monoxyde de carbone, anémie, don de sang) ;\n• stagnante : circulation insuffisante (facteur de charge, froid) ;\n• histotoxique : les cellules utilisent mal l'O2 (alcool, drogues).\nSymptômes : euphorie, excès de confiance, jugement altéré, maux de tête, fourmillements, cyanose (lèvres, ongles), vision réduite, somnolence. L'hypoxie est insidieuse : le pilote se croit performant. La vision de nuit se dégrade dès 5 000 ft environ.\nLe temps de conscience utile (TCU) diminue avec l'altitude : environ 20 à 30 min à 18 000 ft, 3 à 5 min à 25 000 ft, 1 à 2 min à 30 000 ft.\n\nOxygène en NCO (NCO.OP.190) : le commandant de bord évalue le besoin d'oxygène. S'il ne peut pas déterminer l'effet du manque d'oxygène sur les occupants, les membres d'équipage l'utilisent pour toute période de plus de 30 minutes entre 10 000 et 13 000 ft d'altitude-pression cabine, et tous les occupants l'utilisent au-dessus de 13 000 ft, quelle que soit la durée.\n\nHyperventilation : respiration trop rapide ou trop profonde (stress, peur) qui fait chuter le CO2 du sang. Signes : vertiges, fourmillements des doigts et autour de la bouche, crampes, voire perte de connaissance. Remède : ralentir volontairement la respiration, parler à voix haute. En altitude, si l'on hésite avec l'hypoxie, traiter d'abord l'hypoxie.\n\nMonoxyde de carbone (CO) : gaz incolore et inodore des gaz d'échappement, qui peut entrer par le réchauffage cabine (échangeur fissuré). Il se fixe sur l'hémoglobine plus de 200 fois plus facilement que l'O2. Signes : maux de tête, nausées, somnolence. Action : chauffage coupé, aérations ouvertes, oxygène si disponible, atterrissage au plus tôt. Les fumeurs ont déjà une partie de leur hémoglobine bloquée par le CO et tolèrent moins l'altitude.","vocab":[["Hypoxie","Manque d'oxygène au niveau des tissus"],["Pression partielle","Part de la pression totale due à un gaz (PO2 ≈ 0,21 × P)"],["TCU (temps de conscience utile)","Durée pendant laquelle on agit encore efficacement sans oxygène"],["Hyperventilation","Respiration excessive qui fait chuter le CO2 du sang"],["Cyanose","Coloration bleutée des lèvres et des ongles par manque d'O2"],["Monoxyde de carbone (CO)","Gaz inodore des gaz d'échappement qui bloque l'hémoglobine"],["Hémoglobine","Protéine des globules rouges qui transporte l'oxygène"],["Loi de Boyle-Mariotte","P × V = constante : un gaz piégé se dilate en montée"]],"questions":[["u2s1q01","Quel est approximativement le pourcentage d'oxygène dans l'air ambiant à 10 000 ft ?",["Environ 14 %","Environ 18 %","Environ 21 %","Environ 10 %"],2,"Dans la basse atmosphère, la composition de l'air reste constante (≈ 21 % d'O2). C'est la pression totale, donc la pression partielle d'oxygène, qui diminue avec l'altitude."],["u2s1q02","À une altitude où la pression atmosphérique vaut 500 hPa (environ 18 000 ft), quelle est la pression partielle d'oxygène de l'air ?",["Environ 105 hPa","Environ 50 hPa","Environ 213 hPa","Environ 395 hPa"],0,"Loi de Dalton : PO2 = 0,21 × P = 0,21 × 500 = 105 hPa, soit environ la moitié de la valeur au niveau de la mer (0,21 × 1013 ≈ 213 hPa)."],["u2s1q03","Quel type d'hypoxie une intoxication au monoxyde de carbone provoque-t-elle ?",["Une hypoxie hypoxique","Une hypoxie stagnante","Une hypoxie histotoxique","Une hypoxie hypémique"],3,"Le CO se fixe sur l'hémoglobine à la place de l'oxygène : le sang transporte moins d'O2 alors que la pression partielle d'oxygène est normale. C'est une hypoxie hypémique, comme en cas d'anémie ou après un don de sang."],["u2s1q04","Un avion non pressurisé exploité en NCO va voler 45 minutes en croisière au FL 115. Le commandant de bord ne peut pas évaluer l'effet du manque d'oxygène sur les occupants. Que prévoit NCO.OP.190 ?",["Rien : pour l'équipage, l'oxygène n'est exigé qu'au-dessus de 13 000 ft","L'oxygène pour l'équipage, car on dépasse 30 minutes au-dessus de 10 000 ft","Rien : pour l'équipage, l'oxygène n'est exigé qu'au-dessus de 12 500 ft","L'oxygène pour tous les occupants, dès le passage de 10 000 ft"],1,"NCO.OP.190 : à défaut d'évaluation par le commandant de bord, les membres d'équipage utilisent l'oxygène pour toute période de plus de 30 minutes entre 10 000 et 13 000 ft d'altitude-pression cabine ; tous les occupants l'utilisent au-dessus de 13 000 ft. 45 minutes à 11 500 ft dépassent le seuil des 30 minutes."],["u2s1q05","En NCO, lorsque le commandant de bord ne peut pas évaluer l'effet du manque d'oxygène, qui doit utiliser l'oxygène au-dessus de 13 000 ft d'altitude-pression cabine ?",["Le pilote seulement, et uniquement au-delà de 30 minutes","Les passagers seulement, le pilote étant entraîné","Tous les occupants, quelle que soit la durée","Personne : l'oxygène y est seulement recommandé"],2,"NCO.OP.190 : au-dessus de 13 000 ft d'altitude-pression cabine, tous les occupants utilisent l'oxygène, quelle que soit la durée ; entre 10 000 et 13 000 ft, seuls les membres d'équipage y sont tenus, au-delà de 30 minutes."],["u2s1q06","Pourquoi l'hypoxie d'altitude est-elle particulièrement dangereuse pour un pilote seul à bord ?",["Elle provoque d'emblée une sensation d'étouffement qui fait paniquer","Elle n'apparaît qu'au-dessus de 25 000 ft, où le pilote n'est pas entraîné","Elle s'accompagne d'une douleur thoracique qui le distrait du pilotage","Elle altère le jugement, souvent sans que le pilote s'en aperçoive"],3,"L'hypoxie est insidieuse : euphorie, excès de confiance et ralentissement intellectuel apparaissent sans douleur ni essoufflement (l'envie de respirer est surtout déclenchée par le CO2, pas par le manque d'O2). Le pilote se croit performant."],["u2s1q07","Que désigne le temps de conscience utile (TCU) ?",["Le temps dont dispose un pilote privé d'oxygène pour agir efficacement","Le délai entre la privation d'oxygène et la perte de connaissance complète","La durée maximale autorisée au-dessus de 10 000 ft sans utiliser d'oxygène","Le temps nécessaire pour récupérer toutes ses capacités après une hypoxie"],0,"Le TCU prend fin quand le pilote ne peut plus accomplir de gestes utiles (mettre un masque, descendre), bien avant la perte de connaissance. Il diminue fortement avec l'altitude : environ 20 à 30 min à 18 000 ft, 3 à 5 min à 25 000 ft."],["u2s1q08","À 2 500 ft, chauffage coupé, un élève stressé respire vite et ressent des fourmillements autour de la bouche et dans les doigts. Quelle est la cause la plus probable ?",["Une hypoxie d'altitude, qui réduit l'O2 du sang","Une hyperventilation, qui fait baisser le CO2 du sang","Une intoxication au CO, qui bloque l'hémoglobine","Une hausse excessive du CO2 du sang (hypercapnie)"],1,"Une respiration trop rapide liée au stress élimine trop de CO2 : vertiges, fourmillements des extrémités et autour de la bouche. À 2 500 ft, l'hypoxie d'altitude est exclue, et chauffage coupé, le CO est peu probable."],["u2s1q09","Quelle est la conduite à tenir face à une hyperventilation à basse altitude ?",["Respirer plus vite et plus profondément pour mieux s'oxygéner","Monter de quelques milliers de pieds pour respirer un air plus pur","Fermer les aérations et augmenter le chauffage pour réchauffer la cabine","Ralentir volontairement sa respiration, par exemple en parlant à voix haute"],3,"Il faut rétablir le taux de CO2 en ralentissant le rythme respiratoire : parler, compter, respirer calmement. En altitude, si l'on hésite entre hypoxie et hyperventilation, on traite d'abord l'hypoxie (oxygène, descente)."],["u2s1q10","En hiver, chauffage cabine en marche, le pilote ressent maux de tête, nausées et somnolence. Quelles sont les premières actions ?",["Couper le chauffage, ouvrir les aérations et envisager un atterrissage rapide","Augmenter le chauffage, car ces symptômes sont dus au froid","Fermer toutes les aérations pour empêcher l'entrée des gaz d'échappement","Monter pour trouver un air plus pur et poursuivre le vol comme prévu"],0,"Ces symptômes évoquent une intoxication au CO par l'échangeur du chauffage (échappement fissuré). On coupe le chauffage, on ventile avec de l'air frais, on utilise l'oxygène s'il y en a et on se pose au plus tôt ; monter aggraverait l'hypoxie."],["u2s1q11","Au niveau de la mer (1 000 hPa), 300 ml de gaz sont piégés dans l'intestin d'un pilote. À température constante, quel sera ce volume à une altitude où la pression vaut 750 hPa ?",["225 ml","400 ml","300 ml","600 ml"],1,"Loi de Boyle-Mariotte : P1 × V1 = P2 × V2, donc V2 = 300 × 1 000 ÷ 750 = 400 ml. Les gaz piégés se dilatent en montée, d'où des douleurs abdominales, dentaires ou sinusiennes."],["u2s1q12","Quelle fonction est l'une des premières dégradées par une légère hypoxie, dès 5 000 ft environ ?",["L'audition des sons graves","L'équilibre assuré par l'oreille interne","La sensibilité de la vision nocturne","La force musculaire des jambes"],2,"La rétine, et en particulier les bâtonnets, consomme beaucoup d'oxygène : la vision nocturne diminue dès 4 000 à 5 000 ft. De nuit, l'hypoxie se fait donc sentir à des altitudes modérées."]]},{"id":"u2s2","title":"Vision et ouïe","icon":"👁️","tips":"L'œil : la cornée et le cristallin concentrent la lumière sur la rétine ; l'iris règle l'ouverture de la pupille ; le cristallin se déforme pour faire la mise au point (accommodation), capacité qui diminue avec l'âge (presbytie).\n• Cônes : concentrés dans la fovéa, au centre de la rétine. Ils donnent l'acuité et les couleurs mais exigent beaucoup de lumière (vision de jour).\n• Bâtonnets : en périphérie, très sensibles à la faible lumière et au mouvement, ils ne distinguent pas les couleurs (vision de nuit).\n• Point aveugle : zone sans photorécepteurs, là où le nerf optique quitte l'œil. La vision des deux yeux le compense, sauf si un montant de verrière masque un œil : bouger la tête.\n\nDe nuit, la fovéa devient une tache aveugle centrale : pour voir un objet peu éclairé, regarder légèrement à côté (vision décalée). L'adaptation complète à l'obscurité demande environ 30 minutes ; une lumière vive l'annule en quelques secondes. Garder un éclairage cabine faible. L'hypoxie et le tabac dégradent la vision nocturne.\n\nAnticollision :\n• l'œil détecte mal pendant un mouvement continu : balayer le ciel par secteurs d'environ 10 à 15°, en marquant un arrêt d'au moins une seconde sur chacun ;\n• dans un ciel vide (bleu uniforme, brume), l'œil se règle à quelques mètres (myopie du champ vide) : fixer régulièrement un objet lointain ;\n• un avion en route de collision reste immobile dans le pare-brise et ne fait que grossir, lentement puis brutalement ;\n• face à face, les vitesses s'additionnent : 120 kt + 120 kt = 240 kt, soit 4 NM par minute.\n\nIllusions en approche (le pilote corrige dans le mauvais sens) :\n• piste montante ou plus étroite que d'habitude : impression d'être trop haut → approche trop basse ;\n• piste descendante ou plus large : impression d'être trop bas → approche trop haute, arrondi haut, atterrissage long ;\n• trou noir (de nuit, au-dessus de la mer ou d'une zone sans lumière) : impression d'être trop haut → risque d'atterrir court ;\n• pluie sur le pare-brise, brume : impression d'être plus haut ou plus loin → approche trop basse.\nParade : suivre le PAPI et un plan de descente calculé (environ 300 ft par NM pour 3°).\n\nOuïe : le bruit se mesure en décibels, sur une échelle logarithmique (+3 dB = énergie doublée, +10 dB = énergie multipliée par 10). Une exposition prolongée au-delà d'environ 85 dB(A) détruit les cellules de la cochlée : la surdité de perception qui en résulte est définitive et touche d'abord les aigus (vers 4 000 Hz). La presbyacousie (liée à l'âge) est aussi une surdité de perception ; la surdité de transmission (conduit, tympan, oreille moyenne) est souvent soignable. Porter un casque antibruit.","vocab":[["Cônes","Cellules de la fovéa : acuité et couleurs, besoin de lumière"],["Bâtonnets","Cellules périphériques : vision de nuit et mouvement, sans couleurs"],["Fovéa","Centre de la rétine, zone de vision la plus nette"],["Point aveugle","Zone de la rétine sans photorécepteurs (sortie du nerf optique)"],["Myopie du champ vide","Mise au point de l'œil à courte distance faute de repère"],["Illusion du trou noir","De nuit, sans repère au sol, on se croit trop haut"],["PAPI","Indicateur lumineux du plan d'approche (feux rouges et blancs)"],["Décibel (dB)","Unité de niveau sonore ; +3 dB = énergie doublée"]],"questions":[["u2s2q01","Quelles cellules de la rétine assurent la vision des couleurs et la meilleure acuité visuelle ?",["Les cônes, concentrés dans la fovéa","Les bâtonnets, concentrés dans la fovéa","Les bâtonnets, répartis en périphérie de la rétine","Les cônes, répartis surtout en périphérie de la rétine"],0,"Les cônes, concentrés au centre de la rétine (fovéa), donnent l'acuité et les couleurs mais ont besoin de lumière. Les bâtonnets, en périphérie, sont sensibles à la faible lumière et au mouvement, sans voir les couleurs."],["u2s2q02","De nuit, comment repérer au mieux un avion faiblement éclairé ?",["En le fixant directement, car la fovéa est riche en bâtonnets","En éclairant fortement le tableau de bord pour stimuler les cônes","En regardant légèrement à côté, pour utiliser les bâtonnets","En fermant un œil pour supprimer l'effet du point aveugle"],2,"La fovéa ne contient que des cônes, inefficaces en faible lumière : de nuit, elle forme une tache aveugle centrale. On utilise les bâtonnets périphériques en regardant légèrement à côté de l'objet (vision décalée)."],["u2s2q03","Combien de temps faut-il environ pour que l'œil soit complètement adapté à l'obscurité ?",["Environ 30 secondes","Environ 30 minutes","Environ 2 minutes","Environ 3 heures"],1,"Les cônes s'adaptent en quelques minutes, mais les bâtonnets ont besoin d'environ 30 minutes pour atteindre leur sensibilité maximale. Une lumière vive annule cette adaptation en quelques secondes."],["u2s2q04","À quoi correspond le point aveugle de l'œil ?",["À la fovéa, où se concentrent les cônes et où l'acuité est maximale","À la partie de la rétine masquée en permanence par l'iris","Au cristallin lorsqu'il ne parvient plus à accommoder","À la sortie du nerf optique, zone sans photorécepteurs"],3,"Là où le nerf optique quitte l'œil, la rétine n'a ni cônes ni bâtonnets. Avec les deux yeux, le cerveau compense ; mais si un montant de verrière masque l'autre œil, un avion peut disparaître dans cette zone : il faut bouger la tête."],["u2s2q05","Comment se présente, dans le pare-brise, un avion en route de collision avec le vôtre ?",["Il se déplace rapidement d'un côté à l'autre du pare-brise","Il reste immobile, en grossissant d'abord lentement puis très vite","Il monte progressivement vers le haut du pare-brise en grossissant","Il apparaît déjà gros dès qu'il devient visible, puis grossit lentement"],1,"Deux avions en route de collision gardent un relèvement constant : l'autre avion ne bouge pas dans le pare-brise, ce qui le rend difficile à détecter. Sa taille apparente reste petite longtemps puis augmente brutalement dans les dernières secondes."],["u2s2q06","Deux avions volent l'un vers l'autre, à 100 kt et à 140 kt. Ils se repèrent à 2 NM de distance. De combien de temps disposent-ils avant l'impact s'ils ne manœuvrent pas ?",["30 secondes","1 minute","50 secondes","3 minutes"],0,"Face à face, les vitesses s'additionnent : 100 + 140 = 240 kt, soit 240 ÷ 60 = 4 NM par minute. Temps = 2 ÷ 4 = 0,5 min = 30 s, dont il faut encore retrancher le temps de réaction et de manœuvre."],["u2s2q07","Par ciel bleu uniforme, sans aucun repère visuel, que fait naturellement l'œil ?",["Il accommode à l'infini, ce qui facilite la détection des avions lointains","Il devient plus sensible aux couleurs, car les bâtonnets prennent le relais","Il accommode de près, ce qui retarde la détection des avions lointains","Il élargit son champ de vision net à plus de 30° de chaque côté"],2,"C'est la myopie du champ vide : sans objet sur lequel faire la mise au point, l'œil se règle à quelques mètres. Il faut fixer régulièrement un objet lointain (relief, nuage, bout d'aile) pour réaccommoder au loin."],["u2s2q08","En approche vers une piste montante (qui monte dans le sens de l'atterrissage), sans PAPI, quel est le risque si le pilote ne tient pas compte de cette pente ?",["Se croire trop bas et faire une approche trop haute","Se croire trop rapide et laisser chuter la vitesse","Voir la piste plus large qu'elle n'est et arrondir trop tôt","Se croire trop haut et faire une approche trop basse"],3,"Une piste montante paraît plus « relevée », comme si l'avion était au-dessus du plan : le pilote réduit et descend, puis se retrouve trop bas, avec un risque d'atterrir court. Une piste descendante produit l'effet inverse."],["u2s2q09","De nuit, en finale au-dessus de la mer vers une piste éclairée, aucune lumière n'est visible entre l'avion et le seuil. Quelle illusion menace le pilote ?",["Se croire plus haut qu'en réalité, avec un risque d'atterrir court","Se croire plus bas qu'en réalité, avec un risque d'atterrissage long","Une sensation de rotation due aux canaux semi-circulaires","Voir la piste plus étroite et faire une approche trop haute"],0,"C'est l'illusion du trou noir : privé de repères au sol, le pilote a l'impression d'être trop haut et descend sous le plan normal. Il faut suivre le PAPI ou un plan de descente calculé (environ 300 ft par NM pour 3°)."],["u2s2q10","Un pilote habitué à une piste de 20 m de large se pose pour la première fois sur une piste de 45 m de large. Quelle erreur doit-il anticiper ?",["Se croire trop haut, d'où une approche trop basse et un atterrissage court","Se croire trop bas, d'où une approche et un arrondi trop hauts","Se croire trop lent et augmenter inutilement la vitesse en finale","Se croire aligné sur l'axe alors qu'il en est nettement décalé"],1,"Une piste plus large que d'habitude donne l'impression d'être plus bas qu'en réalité : approche trop haute et arrondi trop haut, avec un atterrissage long ou dur. Une piste plus étroite produit l'illusion inverse."],["u2s2q11","Quel effet a une exposition répétée au bruit du moteur sans protection auditive ?",["Une surdité de transmission, qui guérit après quelques jours de repos","Une perte d'audition touchant d'abord les sons graves","Une gêne passagère, sans conséquence au-dessous de 120 dB","Une surdité de perception irréversible, touchant d'abord les sons aigus"],3,"Le bruit détruit les cellules ciliées de la cochlée (oreille interne) : c'est une surdité de perception définitive, qui commence vers les fréquences aiguës (environ 4 000 Hz). Le risque existe dès une exposition prolongée à environ 85 dB(A)."],["u2s2q12","Le niveau sonore dans un poste de pilotage passe de 85 dB à 88 dB. Comment évolue l'énergie sonore reçue par le pilote ?",["Elle augmente d'environ 3,5 %","Elle triple","Elle double environ","Elle est multipliée par 10"],2,"L'échelle des décibels est logarithmique : +3 dB correspond à une énergie multipliée par 10^0,3 ≈ 2, et +10 dB à une énergie multipliée par 10."]]},{"id":"u2s3","title":"Désorientation et oreille interne","icon":"🌀","tips":"En vol, l'orientation repose sur la vue (environ 80 % de l'information), l'oreille interne (système vestibulaire) et les capteurs de pression de la peau, des muscles et des articulations. Sans repères visuels, ces deux derniers trompent le pilote.\n\nSystème vestibulaire :\n• trois canaux semi-circulaires, perpendiculaires entre eux et remplis d'un liquide (endol
