Mélange","Dosage air/essence, réglé par la manette rouge"],["Appauvrir","Réduire la part d'essence du mélange, surtout en altitude"],["Givrage carburateur","Givre dans le venturi dû à la détente et à l'évaporation"],["Injection","Essence injectée sous pression près des soupapes, sans venturi"],["Détonation","Combustion explosive du mélange après l'étincelle"],["Pré-allumage","Inflammation du mélange par un point chaud, avant l'étincelle"]],"questions":[["u9s2q01","Dans un moteur à 4 temps, au cours de quel temps les deux soupapes sont-elles fermées pendant que le piston remonte ?",["L'admission","La compression","La combustion-détente","L'échappement"],1,"Pendant la compression, soupapes fermées, le piston remonte et comprime le mélange. Pendant la combustion-détente, les soupapes sont aussi fermées, mais le piston descend."],["u9s2q02","En vol, la batterie et l'alternateur tombent en panne. Pourquoi le moteur continue-t-il de tourner ?",["Parce que la batterie de secours alimente les bougies","Parce que le démarreur fonctionne alors en génératrice","Parce que l'allumage se fait par compression, comme sur un diesel","Parce que les magnétos produisent leur propre courant d'allumage"],3,"Chaque magnéto est un générateur autonome entraîné par le moteur : l'allumage ne dépend ni de la batterie ni de l'alternateur. Le moteur tourne donc normalement après une panne électrique totale."],["u9s2q03","Lors de l'essai magnétos au point fixe, le régime ne varie absolument pas quand vous sélectionnez une seule magnéto. Que faut-il suspecter ?",["Un fil de masse coupé, qui laisse une magnéto active","Un fonctionnement parfait des deux magnétos","Une bougie encrassée sur l'un des cylindres","Un mélange trop riche pour le régime du point fixe"],0,"Sur une seule magnéto, une légère chute de régime est normale, car une seule bougie par cylindre fonctionne. Une absence totale de chute indique que l'autre magnéto n'a pas été coupée, donc un défaut de mise à la masse : l'hélice reste dangereuse même contacteur sur OFF."],["u9s2q04","Au point fixe, vous tirez le réchauffage carburateur alors qu'il n'y a pas de givre. Quel est l'effet sur le mélange et sur la puissance ?",["Le mélange s'appauvrit et la puissance augmente","Le mélange s'enrichit et la puissance augmente","Le mélange s'enrichit et la puissance diminue","Le mélange s'appauvrit et la puissance diminue"],2,"L'air réchauffé est moins dense : pour le même débit d'essence, la masse d'air admise diminue, donc le mélange s'enrichit et la puissance baisse. Avec une hélice à pas fixe, cela se traduit par une légère chute de régime, que l'on vérifie au point fixe."],["u9s2q05","En montée, si le pilote ne touche pas à la commande de mélange, le mélange :",["s'enrichit, car la masse volumique de l'air diminue","s'appauvrit, car la masse volumique de l'air diminue","reste constant, le carburateur compensant automatiquement","s'appauvrit, car la pression d'essence diminue"],0,"Avec l'altitude, l'air est moins dense : pour un même débit d'essence, la masse d'air admise diminue et le mélange devient trop riche. Le pilote appauvrit pour retrouver le bon dosage."],["u9s2q06","Quel est le principal risque d'un mélange trop pauvre à forte puissance ?",["L'encrassement des bougies par la calamine","Le givrage du carburateur à forte puissance","Une baisse de la température des cylindres","La surchauffe des cylindres et la détonation"],3,"Un mélange trop pauvre fait monter la température des cylindres et favorise la détonation, qui peut endommager pistons et cylindres. L'encrassement des bougies est au contraire lié à un mélange trop riche."],["u9s2q07","Dans laquelle de ces situations le risque de givrage carburateur est-il le plus élevé ?",["−25 °C, air sec, pleine puissance en montée","35 °C, air sec, pleine puissance en montée initiale","15 °C, air très humide, descente moteur réduit","5 °C, air sec, pleine puissance au décollage"],2,"Le givrage carburateur est favorisé par une forte humidité, une température modérée et une puissance réduite, le papillon presque fermé accentuant le refroidissement. Par grand froid, l'air contient très peu d'eau."],["u9s2q08","En croisière, sur un avion à hélice à pas fixe et carburateur, le régime baisse lentement sans action de votre part. Vous tirez le réchauffage carburateur : le régime baisse encore, puis remonte au-dessus de la valeur précédente. Conclusion ?",["Le réchauffage est défectueux et doit être repoussé","Du givre s'était formé dans le carburateur et a fondu","Le mélange était trop riche ; l'air chaud l'a appauvri","Une magnéto défaillante s'est remise à fonctionner"],1,"L'air chaud, moins dense, fait d'abord baisser le régime, et l'eau de fonte peut rendre le moteur irrégulier ; puis le givre disparaît et le régime remonte. Cette séquence confirme un givrage carburateur."],["u9s2q09","Sur un moteur refroidi par air, dans quelle phase le risque de surchauffe des cylindres est-il le plus élevé ?",["En descente prolongée, moteur réduit et volets sortis","En croisière rapide à puissance moyenne et mélange réglé","Au point fixe par temps froid, après la mise en route","En montée prolongée à forte puissance et à faible vitesse"],3,"Le refroidissement dépend du débit d'air autour des cylindres : en montée lente à forte puissance, la chaleur produite est maximale alors que le flux d'air est faible. On surveille la température d'huile et on prend si besoin une vitesse de montée plus élevée."],["u9s2q10","Quel avantage présente un moteur à injection par rapport à un moteur à carburateur ?",["Il ne connaît pas le givrage carburateur","Il n'a plus besoin de réglage du mélange","Il redémarre plus facilement moteur chaud","Il n'a plus besoin de double allumage"],0,"L'injection envoie l'essence sous pression près des soupapes d'admission, sans venturi : le givrage carburateur disparaît. Le mélange reste à régler, et le redémarrage à chaud est au contraire plus délicat."],["u9s2q11","Le pré-allumage se définit comme :",["la combustion explosive du mélange restant après l'étincelle","l'allumage simultané du mélange par les deux bougies","l'inflammation du mélange par un point chaud avant l'étincelle","un retour de flamme dans le carburateur au démarrage"],2,"Le pré-allumage est une inflammation prématurée du mélange par un point chaud (calamine, bougie ou soupape surchauffée), avant l'étincelle. La combustion explosive après l'étincelle est la détonation."],["u9s2q12","En croisière, la pression d'huile diminue nettement tandis que la température d'huile augmente. Quelle est l'interprétation la plus prudente ?",["Un mélange trop riche : appauvrir progressivement","Une défaillance de lubrification : atterrir au plus tôt","Un givrage carburateur : tirer le réchauffage à fond","Une erreur d'indication : poursuivre le vol en surveillant"],1,"Deux indications cohérentes (pression basse et température haute) traduisent une vraie défaillance de lubrification, souvent une perte d'huile : la panne moteur peut suivre. On se dirige vers un terrain en se préparant à un atterrissage forcé."]]},{"id":"u9s3","title":"Hélice et carburant","icon":"⛽","tips":"Hélice :\n• Chaque pale est une aile tournante qui produit la traction. Le calage est l'angle entre la corde du profil et le plan de rotation ; l'incidence est l'angle entre la corde et le vent relatif résultant (vitesse de l'avion + rotation).\n• La vitesse due à la rotation augmente vers l'extrémité : le calage diminue du moyeu vers le bout de pale (vrillage) pour garder une incidence à peu près constante.\n• Pas fixe : un seul calage, compromis entre montée (petit pas) et croisière (grand pas). Une seule manette, les gaz ; le compte-tours sert d'indicateur de puissance. En descente sans réduire, le régime augmente.\n• Pas variable à vitesse constante : la manette de pas (bleue) affiche un régime, le régulateur ajuste le calage pour le maintenir ; la manette des gaz règle la pression d'admission. Décollage : petit pas, régime maximal. Si la vitesse augmente (descente), le régulateur augmente le calage et le régime reste constant.\n• Rendement = puissance utile (traction × vitesse) / puissance fournie par le moteur, toujours inférieur à 1 (environ 0,8 au mieux). L'hélice à pas variable garde un bon rendement sur une large plage de vitesses.\n\nCarburants :\n• AVGAS 100LL (Low Lead) : colorée en bleu, carburant le plus courant des moteurs à pistons.\n• Carburant automobile (SP95, SP98) : uniquement si l'avion et le moteur sont approuvés pour ce carburant (manuel de vol ou modification approuvée). Plus volatil (risque de bouchon de vapeur), il peut contenir de l'éthanol.\n• Jet A1 (kérosène) : incolore à jaune paille, pour turbines et moteurs diesel aéronautiques. Dans un moteur à essence, il provoque détonation et panne : vérifier le carburant à chaque avitaillement.\n• Densité : AVGAS ≈ 0,72 ; Jet A1 ≈ 0,80. Masse (kg) = volume (L) × densité. Exemple : 100 L d'AVGAS = 72 kg.\n\nEau et purges :\n• L'eau, plus dense que l'essence, se dépose aux points bas. On purge avant le premier vol de la journée et après chaque avitaillement, à chaque point de purge, dans un récipient transparent : l'eau apparaît en bulles ou en couche au fond. On purge jusqu'à n'obtenir que du carburant propre.\n• Réservoirs pleins pour la nuit : moins d'air, donc moins de condensation.\n\nCapacité et réservoirs :\n• Capacité totale = carburant utilisable + carburant inutilisable. Seul le carburant utilisable entre dans le calcul de l'autonomie.\n• Sélection : suivre le manuel de vol (G, D, G+D, OFF). Décoller sur un réservoir contrôlé au roulage et au point fixe ; changer de réservoir en croisière, loin du sol, en surveillant la pression d'essence. Arrêt moteur juste après un changement : revenir aussitôt sur le réservoir précédent.\n• Les évents de réservoir doivent être dégagés, sinon la dépression créée empêche l'alimentation.","vocab":[["Calage","Angle entre la corde de la pale et le plan de rotation"],["Vrillage","Calage décroissant du moyeu vers l'extrémité de la pale"],["Pas variable","Hélice dont le calage change en vol"],["Régulateur","Ajuste le calage pour garder le régime affiché"],["Rendement d'hélice","Puissance utile / puissance moteur, toujours inférieur à 1"],["AVGAS 100LL","Essence aviation à faible teneur en plomb, colorée en bleu"],["Purge","Prélèvement au point bas pour détecter eau et impuretés"],["Carburant inutilisable","Carburant qui ne peut pas alimenter le moteur en vol"]],"questions":[["u9s3q01","Le calage d'une pale d'hélice est l'angle formé par :",["la corde du profil et le plan de rotation","la corde du profil et le vent relatif","l'axe de rotation et la corde du profil","la corde du profil et l'axe du fuselage"],0,"Le calage est l'angle entre la corde de la pale et le plan de rotation de l'hélice. L'angle entre la corde et le vent relatif résultant est l'incidence de la pale."],["u9s3q02","Pourquoi le calage d'une pale diminue-t-il du moyeu vers l'extrémité ?",["Pour alléger l'extrémité de la pale et réduire la force centrifuge","Pour garder une incidence à peu près constante sur toute la pale","Pour que l'extrémité décroche la première et prévienne le pilote","Pour réduire le bruit en diminuant la vitesse en bout de pale"],1,"Plus on s'éloigne du moyeu, plus la vitesse de rotation de la section est grande et plus le vent relatif se rapproche du plan de rotation. Le vrillage réduit le calage vers l'extrémité pour garder une incidence voisine sur toute la pale."],["u9s3q03","Sur un avion équipé d'une hélice à vitesse constante, quelle position de la manette de pas utilise-t-on au décollage ?",["Grand pas, régime minimal, pour une traction maximale","Indifférente : le régulateur adapte seul le pas","Position intermédiaire, pour ménager le moteur","Petit pas, régime maximal, pour la pleine puissance"],3,"Au décollage, la vitesse est faible : un petit calage (petit pas) donne une bonne incidence de pale et permet au moteur d'atteindre son régime maximal, donc sa pleine puissance. Le régulateur ne fait que maintenir le régime affiché : la manette de pas doit donc être en avant, plein petit pas."],["u9s3q04","En croisière avec une hélice à vitesse constante, vous passez en descente sans toucher aux manettes. Le régime :",["augmente nettement, comme avec une hélice à pas fixe","diminue, le régulateur réduisant le calage","reste à peu près constant, le régulateur augmentant le calage","devient instable, le régulateur étant inopérant en descente"],2,"La vitesse augmente et tend à entraîner l'hélice plus vite ; le régulateur augmente alors le calage (plus grand pas) pour maintenir le régime affiché. Avec une hélice à pas fixe, au contraire, le régime augmenterait."],["u9s3q05","Le rendement d'une hélice est le rapport entre :",["la puissance utile (traction × vitesse) et la puissance fournie par le moteur","la puissance fournie par le moteur et la puissance utile (traction × vitesse)","la traction de l'hélice et la traînée totale de l'avion","la puissance fournie par le moteur et sa puissance maximale"],0,"Rendement = puissance utile / puissance absorbée, la puissance utile étant le produit traction × vitesse. Il est toujours inférieur à 1 (environ 0,8 au mieux) ; le rapport inverse serait supérieur à 1."],["u9s3q06","Quelle est la couleur de l'AVGAS 100LL ?",["Rouge","Verte","Bleue","Incolore"],2,"L'AVGAS 100LL est colorée en bleu, ce qui aide à l'identifier lors de la purge. Le kérosène Jet A1, incolore à jaune paille, ne doit jamais être utilisé dans un moteur à essence."],["u9s3q07","Vous embarquez 120 L d'AVGAS, de densité 0,72. Quelle masse de carburant cela représente-t-il ?",["96 kg","166,7 kg","72 kg","86,4 kg"],3,"Masse = volume × densité = 120 × 0,72 = 86,4 kg. Diviser par la densité (166,7) ou prendre la densité du Jet A1 (120 × 0,80 = 96 kg) sont des erreurs classiques."],["u9s3q08","Un avion a une capacité totale de 110 L, dont 6 L de carburant inutilisable, et consomme 26 L/h. Quelle est son autonomie théorique, réservoirs pleins, jusqu'à épuisement du carburant utilisable ?",["4 h 14 min","4 h","3 h 46 min","4 h 30 min"],1,"Seul le carburant utilisable compte : 110 − 6 = 104 L, et 104 / 26 = 4 h. En prenant à tort les 110 L, on obtiendrait environ 4 h 14 min ; la réserve se déduit ensuite de cette autonomie."],["u9s3q09","Lors de la purge d'un réservoir, comment se présente l'eau éventuellement présente dans le carburant ?",["En surface de l'essence, en fine pellicule irisée","Dissoute dans l'essence, qu'elle colore en vert","Au fond du récipient, en bulles ou en couche distincte","Elle est invisible : seule l'odeur permet de la détecter"],2,"L'eau, plus dense que l'essence et non miscible, tombe au fond du récipient transparent sous forme de bulles ou d'une couche nette. On purge à chaque point de purge jusqu'à ne plus en voir."],["u9s3q10","Pourquoi conseille-t-on de laisser les réservoirs pleins lorsque l'avion passe la nuit au parking ?",["Pour limiter la condensation dans les réservoirs","Pour améliorer le centrage au vol suivant","Pour éviter la déformation des réservoirs au soleil","Pour empêcher le gel de l'essence par temps froid"],0,"Un réservoir plein contient peu d'air, donc peu de vapeur d'eau susceptible de se condenser sur les parois froides pendant la nuit. Cela limite l'eau dans le carburant, mais la purge avant le vol reste indispensable."],["u9s3q11","À quelle condition peut-on utiliser du carburant automobile (SP95, SP98) dans un avion léger à moteur à pistons ?",["Si son indice d'octane est au moins égal à 95","En le mélangeant à parts égales avec de l'AVGAS","Si l'usage est noté sur le carnet de route de l'avion","Si l'avion et le moteur sont approuvés pour l'utiliser"],3,"Le carburant automobile n'est utilisable que si le manuel de vol ou une modification approuvée l'autorise pour l'avion et son moteur : un indice d'octane élevé ne suffit pas, pas plus qu'une simple mention au carnet de route. Il est plus volatil (bouchon de vapeur) et peut contenir de l'éthanol, incompatible avec certains circuits."],["u9s3q12","En croisière, le moteur s'arrête quelques secondes après que vous avez changé de réservoir, sans autre signe d'anomalie. Quelle est la cause la plus probable et la réaction appropriée ?",["Un givrage carburateur : garder ce réservoir, tirer le réchauffage","Un défaut d'alimentation : revenir sur le réservoir précédent","Une panne de magnéto : sélectionner l'autre magnéto","Une surchauffe moteur : réduire les gaz et enrichir"],1,"La coïncidence avec le changement de réservoir désigne l'alimentation : réservoir vide, sélecteur mal positionné ou évent bouché. On revient aussitôt sur le réservoir qui alimentait le moteur (pompe électrique en marche si l'avion en est équipé), tout en tenant la vitesse de plané."]]},{"id":"u9s4","title":"Circuit électrique et systèmes","icon":"🔋","tips":"Circuit électrique (courant continu, 14 V ou 28 V) :\n• Batterie : fournit le courant au démarrage et sert de réserve. Elle est mise en circuit par le contacteur général (BAT ou MASTER).\n• Alternateur : entraîné par le moteur, il alimente les équipements et recharge la batterie ; un régulateur maintient la tension (environ 14 V avec une batterie de 12 V).\n• Ampèremètre de charge (zéro au centre) : positif, la batterie se recharge (forte charge normale juste après le démarrage, puis décroissante) ; négatif, la batterie se décharge. Certains avions ont plutôt un indicateur de débit de l'alternateur (zéro à gauche).\n• Voltmètre : une tension retombée à celle de la batterie seule, moteur tournant, signale que l'alternateur ne charge plus.\n• Barre omnibus (bus) : elle distribue le courant aux équipements.\n• Protections : le fusible fond et doit être remplacé ; le disjoncteur s'ouvre et peut être réarmé. Après un déclenchement, on attend quelques instants et on le réarme une seule fois ; s'il saute à nouveau, on le laisse ouvert (risque d'échauffement et d'incendie).\n\nPanne d'alternateur (voyant ALT, ampèremètre négatif, tension en baisse) :\n• Vérifier le disjoncteur et appliquer la check-list (réenclenchement de l'alternateur).\n• Sinon, délester : couper les équipements non indispensables (phares, réchauffage pitot hors givrage, radios en surnombre) pour préserver la batterie, et écourter le vol.\n• Le moteur continue de tourner grâce aux magnétos ; les instruments à dépression restent disponibles. Batterie vide : plus de radio, de transpondeur, de volets électriques ni de jauges électriques.\n\nCircuit de dépression :\n• Il entraîne par un jet d'air les gyroscopes de l'horizon artificiel et du conservateur de cap. L'indicateur de virage est souvent électrique, ce qui assure une redondance.\n• Source : venturi extérieur (efficace seulement en vol à vitesse suffisante, sensible au givre) ou pompe à vide entraînée par le moteur.\n• Panne : indicateur de dépression hors de l'arc vert, dérive lente des gyroscopes, difficile à déceler sans contrôle croisé des instruments.\n\nChauffage cabine et monoxyde de carbone :\n• L'air de chauffage est souvent réchauffé dans un échangeur autour de l'échappement. Une fissure laisse entrer du CO, gaz incolore et inodore qui se fixe sur l'hémoglobine à la place de l'oxygène.\n• Symptômes : maux de tête, somnolence, nausées, troubles visuels, jugement altéré.\n• Conduite : couper le chauffage, ouvrir les aérateurs, oxygène si disponible, atterrir dès que possible. Un détecteur de CO est vivement recommandé.\n\nRéchauffage pitot : une résistance électrique chauffe le tube pitot pour éviter son obstruction par le givre. Gros consommateur, il se coupe lors d'un délestage hors conditions givrantes ; au sol, on ne le teste que brièvement.","vocab":[["Alternateur","Générateur entraîné par le moteur, qui recharge la batterie"],["Ampèremètre","Mesure le courant : charge ou décharge de la batterie"],["Voltmètre","Mesure la tension du circuit électrique"],["Disjoncteur","Coupe le circuit en cas de surintensité ; réarmable"],["Délestage","Coupure des équipements électriques non indispensables"],["Pompe à vide","Pompe entraînée par le moteur qui alimente les gyroscopes"],["CO","Monoxyde de carbone : gaz toxique, incolore et inodore"],["Réchauffage pitot","Résistance électrique qui empêche le givrage du tube pitot"]],"questions":[["u9s4q01","Juste après la mise en route, l'ampèremètre de charge (zéro au centre) indique une forte valeur positive qui diminue en quelques minutes. Qu'en concluez-vous ?",["C'est normal : la batterie se recharge après le démarrage","Anormal : la batterie se décharge rapidement","Anormal : le régulateur de tension est défaillant","Anormal : le démarreur est resté engagé après la mise en route"],0,"Le démarrage a puisé dans la batterie : l'alternateur la recharge d'abord fortement, puis le courant de charge décroît à mesure qu'elle se remplit. Une indication positive signifie que la batterie se charge."],["u9s4q02","En croisière, l'ampèremètre de charge (zéro au centre) indique une valeur négative persistante. Cela signifie :",["que la batterie est surchargée par un régulateur défaillant","que le circuit fonctionne normalement, la batterie étant pleine","que la batterie se décharge, l'alternateur débitant trop peu","qu'une magnéto est en panne et ne recharge plus la batterie"],2,"Une valeur négative indique que la batterie fournit du courant au lieu d'en recevoir : l'alternateur ne débite plus, ou pas assez. On applique la procédure de panne d'alternateur et on déleste."],["u9s4q03","En vol, le disjoncteur de la radio saute. Quelle est la conduite à tenir ?",["Le réarmer immédiatement et le maintenir enfoncé pour qu'il tienne","Attendre, le réarmer une fois, le laisser ouvert s'il ressaute","Couper aussitôt le contacteur général et les magnétos","Le réarmer autant de fois que nécessaire jusqu'à ce qu'il tienne"],1,"Un disjoncteur s'ouvre sur surintensité, signe possible d'un court-circuit. On le laisse refroidir puis on le réarme une fois ; s'il déclenche de nouveau, le défaut est réel et insister risquerait un incendie."],["u9s4q04","Quelle est la différence entre un fusible et un disjoncteur ?",["Le fusible protège contre les surtensions, le disjoncteur contre les surintensités","Le fusible fond et doit être remplacé, le disjoncteur s'ouvre et peut être réarmé","Le fusible se réarme, le disjoncteur doit être remplacé","Le fusible protège la batterie, le disjoncteur seulement l'alternateur"],1,"Tous deux coupent un circuit en cas de surintensité. Le fusible est détruit (son élément fond) et doit être remplacé ; le disjoncteur s'ouvre mécaniquement et se réarme."],["u9s4q05","Le voyant ALT s'allume en vol et l'alternateur ne peut pas être remis en service. Quelle conduite est appropriée ?",["Couper les magnétos pour économiser la batterie","Poursuivre : la batterie se recharge tant que le moteur tourne","Couper le contacteur général et poursuivre le vol sans radio","Délester les équipements non indispensables et écourter le vol"],3,"Sans alternateur, seule la batterie alimente le circuit, pour une durée limitée. On coupe les équipements non indispensables pour préserver radio et transpondeur, et on se pose dès que possible ; le moteur, lui, continue de tourner grâce aux magnétos."],["u9s4q06","Après une panne d'alternateur, la batterie finit par être vide. Quel équipement continue de fonctionner normalement ?",["La radio VHF de communication","Le transpondeur et son mode C","Les volets de courbure électriques","L'horizon artificiel à dépression"],3,"Un horizon artificiel pneumatique est entraîné par le circuit de dépression (venturi ou pompe à vide entraînée par le moteur), indépendant du circuit électrique. La radio, le transpondeur et les volets électriques sont perdus."],["u9s4q07","Quel est l'inconvénient d'un circuit de dépression alimenté par un venturi extérieur ?",["Il consomme beaucoup de courant électrique","Il ne fonctionne bien qu'en vol et peut givrer","Il prélève de la puissance au moteur au décollage","Il ne peut alimenter que le compas magnétique"],1,"Le venturi crée la dépression grâce à l'écoulement de l'air : il est inefficace au sol et à faible vitesse, et le givre peut l'obstruer. La pompe à vide entraînée par le moteur n'a pas ces défauts."],["u9s4q08","Quel est le symptôme typique d'une panne du circuit de dépression ?",["Une chute immédiate du régime moteur et de la pression d'huile","Une indication bloquée à zéro de l'anémomètre et du variomètre","Une dérive lente de l'horizon et du conservateur de cap","Le blocage du compas magnétique sur le dernier cap"],2,"Privés de jet d'air, les gyroscopes ralentissent progressivement : les indications dérivent lentement, ce qui rend la panne difficile à déceler. L'indicateur de dépression et le contrôle croisé des instruments permettent de la détecter."],["u9s4q09","Sur un avion léger classique, quels instruments sont généralement entraînés par le circuit de dépression ?",["L'horizon artificiel et le conservateur de cap","L'anémomètre et l'altimètre","Le variomètre et le compas","Le compte-tours et le manomètre de pression d'huile"],0,"L'horizon artificiel et le conservateur de cap utilisent des gyroscopes entraînés par un jet d'air. L'anémomètre, l'altimètre et le variomètre sont reliés au système pitot-statique ; l'indicateur de virage est souvent électrique."],["u9s4q10","D'où provient le plus souvent le monoxyde de carbone dans la cabine d'un avion léger ?",["D'une fuite de carburant sous le tableau de bord","Des gaz dégagés par la batterie en surcharge","D'une fissure de l'échangeur de chauffage sur l'échappement","De la pompe à vide, qui aspire l'air du compartiment moteur"],2,"Le chauffage cabine utilise de l'air réchauffé au contact de l'échappement. Une fissure du collecteur ou de l'échangeur laisse passer des gaz d'échappement, riches en CO, dans l'air envoyé en cabine."],["u9s4q11","En vol, chauffage cabine en marche, vous ressentez maux de tête et somnolence. Que faites-vous ?",["Vous augmentez le chauffage pour combattre le froid et la fatigue","Vous fermez les aérateurs pour éviter les courants d'air froid","Vous montez pour trouver un air plus pur et plus frais","Vous coupez le chauffage, aérez la cabine et atterrissez au plus tôt"],3,"Ces symptômes, chauffage en marche, font suspecter une intoxication au CO. On coupe la source (chauffage), on ventile la cabine, on utilise l'oxygène s'il est disponible et on se pose rapidement ; monter aggraverait le manque d'oxygène."],["u9s4q12","En panne d'alternateur, par air sec et sans aucun risque de givrage, que faire du réchauffage pitot ?",["Le couper : c'est un gros consommateur électrique","Le laisser en marche : il ne consomme presque rien","Le mettre en marche pour dégivrer les prises statiques","Le laisser en marche : sans lui, l'anémomètre sera faux"],0,"Le réchauffage pitot est une résistance électrique qui consomme beaucoup. Hors conditions givrantes, il est inutile : on le coupe lors du délestage pour préserver la batterie."]]},{"id":"u9s5","title":"Instruments de bord","icon":"🕹️","tips":"Système pitot-statique :\n• Tube pitot, face au vent : pression totale (statique + dynamique).\n• Prises statiques, sur les flancs du fuselage : pression statique ambiante.\n• Anémomètre : relié au pitot et aux prises statiques ; il mesure la pression dynamique (totale − statique) et affiche la vitesse indiquée (Vi).\n• Altimètre : relié à la statique seule ; une capsule anéroïde mesure la pression et affiche l'altitude selon le calage (QNH : altitude ; QFE : hauteur ; 1013 hPa : niveau de vol).\n• Variomètre : relié à la statique seule ; il mesure la variation de pression grâce à une fuite calibrée, avec un léger retard.\n\nArcs de l'anémomètre :\n• Arc blanc : utilisation des volets, de VS0 (décrochage en configuration d'atterrissage) à VFE (vitesse maximale volets sortis).\n• Arc vert : utilisation normale, de VS1 (décrochage en lisse) à VNO (vitesse maximale en croisière normale).\n• Arc jaune : de VNO à VNE, uniquement en air calme et avec prudence.\n• Trait rouge : VNE, vitesse à ne jamais dépasser.\n\nObstructions :\n• Pitot et son orifice de purge bouchés : l'anémomètre se comporte comme un altimètre ; la vitesse indiquée augmente en montée et diminue en descente.\n• Prise statique bouchée : altimètre figé, variomètre à zéro ; l'anémomètre indique trop peu en montée et trop en descente (risque de voler trop lentement). La prise statique de secours, en cabine, fait lire l'altimètre et l'anémomètre un peu trop haut.\n\nGyroscopes (rigidité dans l'espace, précession) :\n• Horizon artificiel : assiette et inclinaison.\n• Conservateur de cap : sans référence magnétique, il dérive ; on le recale sur le compas toutes les 10 à 15 min environ, en vol rectiligne stabilisé.\n• Indicateur de virage : taux de virage ; taux 1 = 3°/s, soit 360° en 2 min. La bille, simple inclinomètre, indique la symétrie du vol : « le pied chasse la bille » (bille à droite, pied à droite).\n\nCompas magnétique : fiable seulement en vol rectiligne stabilisé. Dans l'hémisphère nord, aux caps est et ouest, une accélération fait tourner l'indication vers le nord et une décélération vers le sud (ANDS). La déviation propre à l'avion figure sur la carte de déviation.\n\nCompte-tours : régime moteur en tr/min, avec arc vert et trait rouge de régime maximal ; c'est l'indicateur de puissance d'un avion à hélice à pas fixe.","vocab":[["Pression dynamique","Pression totale − pression statique, mesurée par l'anémomètre"],["Prise statique","Orifice qui capte la pression atmosphérique ambiante"],["VS0","Vitesse de décrochage en configuration d'atterrissage"],["VFE","Vitesse maximale volets sortis, fin de l'arc blanc"],["VNO","Vitesse maximale en croisière normale, fin de l'arc vert"],["VNE","Vitesse à ne jamais dépasser, trait rouge"],["Taux 1","Virage à 3°/s, soit 360° en 2 minutes"],["ANDS","Compas, hémisphère nord : accélération nord, décélération sud"]],"questions":[["u9s5q01","L'horizon artificiel fournit au pilote :",["le taux de virage et la symétrie du vol","le cap et l'inclinaison en roulis","la vitesse verticale et l'assiette","l'assiette en tangage et l'inclinaison"],3,"L'horizon artificiel, gyroscope à axe vertical, représente la position de l'avion par rapport à l'horizon : assiette (tangage) et inclinaison (roulis). Le taux de virage et la symétrie sont donnés par l'indicateur de virage et la bille."],["u9s5q02","Quel instrument, relié uniquement à la prise statique, mesure la variation de pression grâce à une fuite calibrée ?",["L'altimètre","L'anémomètre","Le variomètre","Le conservateur de cap"],2,"Le variomètre compare la pression statique actuelle à celle d'une capacité qui se met en équilibre à travers une fuite calibrée : il indique la vitesse verticale. L'altimètre est aussi relié à la statique, mais il mesure la pression elle-même."],["u9s5q03","Sur l'anémomètre, la limite inférieure de l'arc blanc correspond à :",["VS0, vitesse de décrochage en configuration d'atterrissage","VS1, vitesse de décrochage en configuration lisse","VFE, vitesse maximale autorisée avec les volets sortis","VNO, vitesse maximale de croisière en utilisation normale"],0,"L'arc blanc, plage d'utilisation des volets, va de VS0 (décrochage en configuration d'atterrissage, à la masse maximale) à VFE. VS1 marque le début de l'arc vert."],["u9s5q04","L'aiguille de l'anémomètre se trouve dans l'arc jaune. Dans quelles conditions est-ce acceptable ?",["En turbulence modérée, pour traverser plus vite la zone","Uniquement en air calme, en évitant les grands braquages","Volets sortis, en approche, pour freiner l'avion","Jamais : c'est une plage interdite d'utilisation"],1,"L'arc jaune, de VNO à VNE, est une plage de prudence : on ne l'utilise qu'en air calme et en évitant les grands braquages des gouvernes, car une rafale ou une manœuvre brutale pourrait faire dépasser les limites de la structure. En turbulence, on reste dans l'arc vert."],["u9s5q05","Un anémomètre porte un arc blanc de 45 à 85 kt, un arc vert de 50 à 120 kt, un arc jaune de 120 à 155 kt et un trait rouge à 155 kt. Quelles sont respectivement la VFE et la VNO ?",["85 kt et 155 kt","50 kt et 120 kt","85 kt et 120 kt","120 kt et 155 kt"],2,"La VFE est la fin de l'arc blanc (85 kt) et la VNO la fin de l'arc vert, début de l'arc jaune (120 kt). Le trait rouge (155 kt) est la VNE."],["u9s5q06","En montée, le tube pitot et son orifice de purge sont obstrués par le givre, la prise statique restant libre. Comment évolue l'indication de l'anémomètre ?",["Elle reste figée à sa valeur d'avant l'obstruction","Elle diminue progressivement avec l'altitude","Elle tombe à zéro en quelques secondes","Elle augmente avec l'altitude, comme un altimètre"],3,"La pression totale est piégée alors que la pression statique diminue avec l'altitude : leur différence augmente et la vitesse indiquée croît en montée. Le pilote risque de cabrer pour la réduire, jusqu'au décrochage. Si la purge était restée libre, la pression totale se serait évacuée et l'indication serait tombée à zéro."],["u9s5q07","La prise statique est obstruée et aucune prise de secours n'est utilisée. Quelles indications obtient-on ?",["Altimètre figé et variomètre bloqué à zéro","Anémomètre à zéro et altimètre normal","Altimètre normal et variomètre bloqué à zéro","Horizon et conservateur de cap inopérants"],0,"Altimètre et variomètre ne dépendent que de la pression statique : piégée, elle ne varie plus, donc l'altimètre reste figé et le variomètre indique zéro. L'anémomètre devient lui aussi faux ; les gyroscopes ne sont pas concernés."],["u9s5q08","La prise statique est obstruée et l'avion descend. Que fait l'anémomètre ?",["Il indique trop peu : risque de survitesse","Il indique trop : risque de voler trop lentement","Il indique correctement, le tube pitot étant libre","Il indique zéro, faute de pression statique"],1,"En descente, la pression totale augmente alors que la pression statique piégée reste celle de l'altitude de départ, plus faible : la différence mesurée est exagérée et la vitesse indiquée trop élevée. La vitesse réelle est plus faible qu'affichée, avec un risque de décrochage."],["u9s5q09","Au taux standard (taux 1), combien de temps faut-il pour changer de cap de 90° ?",["30 s","45 s","1 min","15 s"],0,"Le taux 1 correspond à 3° par seconde : 90 / 3 = 30 s. Un tour complet de 360° demande donc 120 s, soit 2 minutes."],["u9s5q10","En virage à gauche, la bille est décalée vers la droite. Quelle correction appliquez-vous ?",["Appuyer davantage sur le palonnier gauche, côté virage","Réduire l'inclinaison sans toucher aux palonniers","Appuyer sur le palonnier droit, du côté de la bille","Tirer sur le manche pour resserrer le virage"],2,"« Le pied chasse la bille » : bille à droite, on agit sur le palonnier droit (ou l'on relâche le gauche). Ici l'avion dérape vers l'extérieur du virage par excès de pied à gauche."],["u9s5q11","Pourquoi faut-il recaler régulièrement le conservateur de cap sur le compas magnétique ?",["Parce qu'il subit les mêmes erreurs d'accélération que le compas","Parce qu'il n'a aucune référence magnétique et dérive avec le temps","Parce qu'il indique le cap vrai et non le cap magnétique","Parce qu'il ne fonctionne correctement qu'en virage"],1,"Le conservateur de cap est un gyroscope sans référence magnétique : la précession due aux frottements et la rotation de la Terre le font dériver. On le recale sur le compas toutes les 10 à 15 minutes environ, en vol rectiligne stabilisé."],["u9s5q12","Au cap 090, dans l'hémisphère nord, l'avion accélère en palier. Que montre momentanément le compas magnétique ?",["Un virage apparent vers le sud, qui cesse en vol stabilisé","Aucune variation : l'erreur n'existe qu'en virage","Une oscillation autour du cap, sans direction privilégiée","Un virage apparent vers le nord, qui cesse en vol stabilisé"],3,"Erreur d'accélération (ANDS : accélération nord, décélération sud) : aux caps est et ouest, dans l'hémisphère nord, une accélération fait indiquer un virage vers le nord, une décélération un virage vers le sud. On ne lit le compas qu'en vol stabilisé."]]}]}],"library":{"title":"Bibliothèque de révision LAPL(A) / PPL(A)","subtitle":"Ressources françaises et anglaises pour préparer le théorique, autant que possible gratuitement. Recherche vérifiée le 17 novembre 2026.","intro":"Réunit des banques de QCM, examens blancs, fiches de révision, cours complets, PDF et documentation aéronautique.\nCoche ce que tu as consulté ou fait : ta progression est enregistrée sur ton compte.","method":"Pour chaque matière : lis d'abord un cours français, rédige une fiche d'une page (définitions, formules), puis enchaîne les QCM jusqu'à obtenir régulièrement 85 à 90 % de bonnes réponses. Travaille ensuite la même matière en anglais pour le vocabulaire.","checklist":[{"id":"chk-memo","label":"Télécharger le mémo VFR FFA 2025-2026","url":"https://www.ffa-aero.fr/FR/frm_guidedupilote_securite.awp"},{"id":"chk-ffplum","label":"Récupérer les 53 fiches FFPLUM","url":"https://ffplum.fr/encadrer-general/instructeurs/fiches-pedagogiques-techniques"},{"id":"chk-acat","label":"Étudier les cours PDF de l'ACAT Toulouse","url":"http://www.acat-toulouse.org/documents/formation-th%C3%A9orique-pratique"},{"id":"chk-meteo","label":"Lire le Guide Aviation de Météo-France","url":"https://aviation.meteo.fr/documentation/guide_aviation.pdf"},{"id":"chk-qcm","label":"Faire les 9 QCM gratuits (128 questions)","url":"https://travail-industrie.com/nos-formations-en-ligne/quizz/qcm-ppl-droit-aerien"},{"id":"chk-en","label":"Compléter avec des QCM anglais PPL/LAPL"},{"id":"chk-phak","label":"Télécharger le manuel FAA de connaissances aéronautiques","url":"https://www.faa.gov/regulations_policies/handbooks_manuals/aviation/phak"},{"id":"chk-app-exam","label":"Réussir un examen blanc complet dans l'application (75 % dans chaque matière)","to":"/exam"}],"sections":[{"id":"programme","title":"1. Le programme officiel à préparer","intro":"Le LAPL(A) et le PPL(A) partagent le même examen théorique en France. Depuis le 4 const LS_KEY = 'prepa-lapl-ppl-v1';

function save(now = false) {

}

const use = (n) => (window.claude && typeof window.claude.use === 'function' ? window.claude.use(n) : Promise.resolve(null));

async function connect() {
  try {
    const [user, db] = await Promise.all([use('user'), use('db')]);
    const uid = user ? await user.id() : null;
    if (!db || !uid) { setSync('local'); return; }
    sync.doc = db.doc(`data/users/${uid}/progress`);

}
async function pull(first) {
  if (!sync.doc) return;
  try {
    const snap = await withTimeout(sync.doc.get(), 10000);
    const remote = snap.exists ? snap.data() : null;
    if (remote && (remote.updatedAt || 0) > (P.updatedAt || 0)) {
      if (busy()) { setSync('ok'); return; }
      P = Object.assign(blank(), JSON.parse(JSON.stringify(remote)));
      writeLocal(); setSync('ok'); render();
    } else if (!remote || (P.updatedAt || 0) > (remote.updatedAt || 0)) {
      if (first && !remote && !P.updatedAt) { setSync('ok'); return; }

}

}

function tipsHtml(text) {

  const flush = () => { if (list.length) { out.push(`<ul>${list.map((l) => `<li>${esc(l)}</li>`).join('')}</ul>`); list = []; } };

function startLesson(skillId, practice) {
  const s = SK.get(skillId); if (!s) return;
  const cur = level(s);
  const lv = practice ? 3 : Math.min(3, cur + 1);
  const bank = s.qs; const third = Math.ceil(bank.length / 3);
  let pool;
  if (practice || lv >= 3) pool = shuffle(bank);
  else pool = [...shuffle(bank.slice((lv - 1) * third, lv * third)), ...shuffle(bank.slice(0, (lv - 1) * third)), ...shuffle(bank.slice(lv * third))];
  const weak = shuffle(bank.filter((q) => P.mistakes.includes(q.id)));
  const picked = []; for (const q of [...weak, ...pool]) { if (picked.length >= 10) break; if (!picked.includes(q)) picked.push(q); }
  openLesson({ title: s.title, cls: s.unit.cls, skillId, level: lv, practice: !!practice, items: picked.map(qItem) });
}

  return `<div class="full ${L.cls}" role="dialog" aria-modal="true" aria-label="Leçon">
    <div class="full-top"><button class="x" data-act="quit-lesson" aria-label="Quitter la leçon">${ic('x')}</button><div class="prog" aria-hidden="true"><i style="width:${(L.i / L.items.length) * 100}%"></i></div><span class="small muted num">${L.i + 1}/${L.items.length}</span></div>

        return `<button class="opt ${cls}" data-act="pick" data-pos="${pos}" aria-pressed="${it.sel === pos}" ${it.checked ? 'disabled' : ''}><span class="k">${LETTERS[pos]}</span><span>${esc(q.choices[ci])}</span></button>`;
      }).join('')}</div>
    </div></div>
    ${foot}
  </div>`;
}

  return `<div class="full ${L.cls}" role="dialog" aria-modal="true" aria-label="Fin de leçon"><div class="full-body"><div class="endcard">

const remaining = (a) => a.limit - (Date.now() - a.startedAt) / 1000;
function startExam(unitId) {
  const subs = unitId ? D.exam.subjects.filter((s) => s.unit === unitId) : D.exam.subjects;
  const items = []; const sections = [];
  for (const s of subs) {
    const u = D.units.find((x) => x.id === s.unit);
    const pool = shuffle(u.qs).slice(0, s.questions);
    sections.push({ unit: u.id, from: items.length, n: pool.length });
    pool.forEach((q) => items.push({ id: q.id, order: shuffle([0, 1, 2, 3]) }));
  }
  P.active = { id: 'e' + Date.now().toString(36), mode: unitId ? 'unit' : 'full', unit: unitId || null, startedAt: Date.now(), limit: subs.reduce((t, s) => t + s.minutes, 0) * 60, items, sections, answers: items.map(() => null), flags: [] };
  save(true);
  openExam();
}
function openExam() { view.exam = { i: 0 }; view.showGrid = false; view.confirmEnd = false; render(); startTick(); }
let tick = null;
function startTick() {
  clearInterval(tick);

    if (!view.exam || !P.active) { clearInterval(tick); return; }
    const r = remaining(P.active);
    const t = $('#timer'); if (t) { t.lastChild.textContent = mmss(r); t.classList.toggle('low', r < 300); }
    if (r <= 0) { clearInterval(tick); finishExam(); }
  }, 1000);
}
function sectionOf(a, i) { return a.sections.find((s) => i >= s.from && i < s.from + s.n); }
function examHtml() {

function finishExam() {
  const a = P.active; if (!a) return;
  const subjects = a.sections.map((s) => {
    let c = 0;
    for (let k = s.from; k < s.from + s.n; k++) { const it = a.items[k]; const q = Q.get(it.id); const ok = a.answers[k] !== null && it.order[a.answers[k]] === q.answer; if (ok) c++; record(it.id, ok); }
    const pct = Math.round((c / s.n) * 100);
    return { unit: s.unit, correct: c, total: s.n, pct, passed: c / s.n >= PASS / 100 };
  });
  const correct = subjects.reduce((t, s) => t + s.correct, 0);
  const result = { correct, total: a.items.length, passed: subjects.every((s) => s.passed), subjects, duration: Math.min(a.limit, Math.round((Date.now() - a.startedAt) / 1000)) };
  const fin = Object.assign({}, a, { finishedAt: new Date().toISOString(), result });
  delete fin.flags;
  P.exams.push(fin); while (P.exams.length > 15) P.exams.shift();
  P.active = null;
  addXp(Math.min(60, Math.round(correct / 2)) + (result.passed ? 10 : 0));
  save(true);
  clearInterval(tick); view.exam = null; view.confirmEnd = false; view.corrAll = false;
  location.hash = 'resultat-' + fin.id;
  render();
}

    <div class="row" style="margin-top:8px"><div class="bar grow"><i style="width:${(ok / u.qs.length) * 100}%"></i></div><span class="small num muted">${ok}/${u.qs.length}</span></div></div>`; }).join('')}</div>
  <h2 class="section-title">Sauvegarde</h2>
  <div class="card pad"><p style="margin-top:0">${sync.state === 'ok' ? 'Ta progression est enregistrée sur ton compte claude.ai : tu la retrouves sur ordinateur et sur téléphone.' : sync.state === 'off' ? 'Connexion au compte impossible pour le moment : ta progression est gardée sur cet appareil et sera synchronisée au retour du réseau.' : sync.state === 'wait' ? 'Connexion à ton compte…' : 'Ta progression est enregistrée dans ce navigateur, sur cet appareil.'}</p>
    ${view.confirmReset ? `<div class="confirm"><div class="grow"><b>Tout effacer ?</b><div class="small">Niveaux, XP, erreurs et historique d'examens seront supprimés.</div></div><button class="btn bad sm" data-act="reset-yes">Effacer</button><button class="btn alt sm" data-act="reset-no">Annuler</button></div>` : `<button class="btn alt sm" data-act="reset">Réinitialiser ma progression</button>`}
  </div>`;
}

// ───────────── Overlays ─────────────
function renderOverlay() {
  const o = $('#overlay');
  if (view.lesson) o.innerHTML = lessonHtml();
  else if (view.exam && P.active) o.innerHTML = examHtml();
  else if (view.sheet) { const s = SK.get(view.sheet); o.innerHTML = s ? sheetHtml(s) : ''; }
  else o.innerHTML = '';
  document.body.style.overflow = view.lesson || view.exam || view.sheet ? 'hidden' : '';
}

// ───────────── Actions ─────────────
document.addEventListener('click', (ev) => {
  const t = ev.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act;
  if (act === 'close-sheet' && ev.target.closest('[data-stop]') && !ev.target.closest('.x')) return;
  const sk = t.dataset.skill; const unit = t.dataset.unit;
  switch (act) {
    case 'jump': ev.preventDefault(); document.getElementById('unit-' + unit)?.scrollIntoView({ behavior: 'smooth', block: 'start' }); break;
    case 'sheet': view.sheet = sk; renderOverlay(); break;
    case 'close-sheet': view.sheet = null; renderOverlay(); break;
    case 'lesson': startLesson(sk, false); break;
    case 'practice': startLesson(sk, true); break;
    case 'pick': { const it = view.lesson.items[view.lesson.i]; if (it.checked) break; it.sel = Number(t.dataset.pos); renderOverlay(); break; }
    case 'check': lessonCheck(); break;
    case 'next': lessonNext(); break;
    case 'quit-lesson': view.lesson = null; save(); render(); break;
    case 'end-lesson': view.lesson = null; render(); break;
    case 'fiche-after': view.lesson = null; location.hash = 'fiche-' + sk; render(); break;
    case 'review-mistakes': startPractice(P.mistakes.map((id) => Q.get(id)).filter(Boolean), 'Mes erreurs'); break;
    case 'review-unit': { const u = D.units.find((x) => x.id === unit); const fresh = shuffle(u.qs.filter((q) => !mastered(q))); startPractice([...fresh, ...shuffle(u.qs.filter(mastered))], u.title, u.cls); break; }
    case 'review-unit-mistakes': { const u = D.units.find((x) => x.id === unit); startPractice(P.mistakes.map((id) => Q.get(id)).filter((q) => q && q.unit === u), `${u.title} · mes erreurs`, u.cls); break; }
    case 'review-mixed': { const all = [...Q.values()]; startPractice([...shuffle(all.filter((q) => !mastered(q))), ...shuffle(all)], 'Entraînement mixte'); break; }
    case 'exam-start': if (!P.active) startExam(unit || null); break;
    case 'exam-resume': if (P.active) { if (remaining(P.active) <= 0) finishExam(); else openExam(); } break;
    case 'exam-abandon': P.active = null; save(true); render(); toast('Examen abandonné'); break;
    case 'exam-pause': clearInterval(tick); view.exam = null; save(true); render(); toast('Examen en pause : le chrono continue, reprends-le depuis « Examen ».'); break;
    case 'exam-pick': { const pos = Number(t.dataset.pos); P.active.answers[view.exam.i] = P.active.answers[view.exam.i] === pos ? null : pos; save(); renderOverlay(); break; }
    case 'exam-flag': { const i = view.exam.i; const f = P.active.flags; const k = f.indexOf(i); if (k >= 0) f.splice(k, 1); else f.push(i); save(); renderOverlay(); break; }
    case 'exam-grid': view.showGrid = !view.showGrid; renderOverlay(); break;
    case 'exam-go': view.exam.i = Number(t.dataset.i); renderOverlay(); $('.full-body')?.scrollTo(0, 0); break;
    case 'exam-prev': if (view.exam.i > 0) { view.exam.i--; renderOverlay(); } break;
    case 'exam-next': if (view.exam.i < P.active.items.length - 1) { view.exam.i++; renderOverlay(); $('.full-body')?.scrollTo(0, 0); } break;
    case 'exam-end': view.confirmEnd = true; renderOverlay(); break;
    case 'exam-cancel-end': view.confirmEnd = false; renderOverlay(); break;
    case 'exam-finish': finishExam(); break;
    case 'corr': view.corrAll = t.dataset.all === '1'; render(); break;
    case 'lib-lang': view.libLang = t.dataset.lang; render(); break;
    case 'lib-toggle': { if (t.tagName === 'INPUT') break; const id = t.dataset.id; if (P.lib[id]) delete P.lib[id]; else P.lib[id] = today(); save(); render(); break; }
    case 'reset': view.confirmReset = true; render(); break;
    case 'reset-no': view.confirmReset = false; render(); break;
    case 'reset-yes': { P = blank(); P.updatedAt = Date.now(); view.confirmReset = false; save(true); render(); toast('Progression réinitialisée'); break; }
  }
});
document.addEventListener('change', (ev) => {
  const t = ev.target;
  if (t.dataset && t.dataset.act === 'lib-toggle' && t.tagName === 'INPUT') { const id = t.dataset.id; if (t.checked) P.lib[id] = today(); else delete P.lib[id]; save(); render(); }
});
document.addEventListener('input', (ev) => {
  const t = ev.target;
  if (t.id === 'lib-q') { view.libQ = t.value; const pos = t.selectionStart; render(); const n = $('#lib-q'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }
  if (t.id === 'gloss-q') { view.glossQ = t.value; const g = t.value.trim().toLowerCase(); const hits = g.length >= 2 ? D.units.flatMap((u) => u.skills.flatMap((sk) => sk.vocab.filter(([a, b]) => a.toLowerCase().includes(g) || b.toLowerCase().includes(g)).map(([a, b]) => ({ t: a, d: b, sk, u })))).slice(0, 30) : []; $('#gloss-hits').innerHTML = glossHits(hits, g); }
});
document.addEventListener('keydown', (ev) => {
  if (ev.target.tagName === 'INPUT' || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if (view.lesson && !view.lesson.done) {
    const it = view.lesson.items[view.lesson.i];
    const pk = { 1: 0, 2: 1, 3: 2, 4: 3, a: 0, b: 1, c: 2, d: 3 }[ev.key.toLowerCase()];
    if (pk !== undefined && !it.checked) { it.sel = pk; renderOverlay(); ev.preventDefault(); }
    else if (ev.key === 'Enter') { ev.preventDefault(); if (it.checked) lessonNext(); else lessonCheck(); }
    else if (ev.key === 'Escape') { view.lesson = null; save(); render(); }
  } else if (view.exam && P.active) {
    const k = ev.key.toLowerCase(); const map = { 1: 0, 2: 1, 3: 2, 4: 3, a: 0, b: 1, c: 2, d: 3 };
    if (k in map) { P.active.answers[view.exam.i] = map[k]; save(); renderOverlay(); ev.preventDefault(); }
    else if (ev.key === 'ArrowRight' && view.exam.i < P.active.items.length - 1) { view.exam.i++; renderOverlay(); }
    else if (ev.key === 'ArrowLeft' && view.exam.i > 0) { view.exam.i--; renderOverlay(); }
    else if (k === 'f') { const f = P.active.flags; const j = f.indexOf(view.exam.i); if (j >= 0) f.splice(j, 1); else f.push(view.exam.i); save(); renderOverlay(); }
  } else if (view.sheet && ev.key === 'Escape') { view.sheet = null; renderOverlay(); }
});

// ───────────── Démarrage ─────────────
function start(hot) {
  const local = readLocal(); if (local) P = local;
  if (hot && hot.view) { view = Object.assign(view, hot.view); }
  render();
  loadData().then((raw) => { indexData(raw); render(); if (view.exam && P.active) startTick(); connect(); })
    .catch(() => { $('#main').innerHTML = '<div class="wrap"><div class="card empty">Impossible de charger les questions. Recharge la page.</div></div>'; });
}
window.claude?.hot?.snapshot?.(() => ({ view: { lesson: view.lesson, exam: view.exam, sheet: view.sheet } }));
if (window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});
})();
</script>
</body></html>
